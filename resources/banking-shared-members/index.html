function showSources(){$('#modalBody').innerHTML=`<h3>Sources</h3><input id="sq" placeholder="Search by author, title or year"><ul class="srcl" id="sl"></ul>`;const all=Object.values(SRC).sort((a,b)=>a.number-b.number);const draw=()=>{const q=$('#sq').value.toLowerCase();$('#sl').innerHTML=all.filter(s=>[s.title,s.authors,s.year].join(' ').toLowerCase().includes(q)).map(srcItem).join('');};$('#sq').oninput=draw;draw();$('#modal').classList.add('on');$('#scrim').classList.add('on');}
function showSource(id){const s=SRC[id];if(!s)return;if($('#modal').classList.contains('wide')){toast(`[${s.number}] ${(s.authors||'').slice(0,60)} (${s.year||''})`);return;}$('#modalBody').innerHTML=`<h3>Source [${s.number}]</h3><ul class="srcl">${srcItem(s)}</ul>${s.note?`<p class="hint" style="margin-top:12px">${esc(s.note)}</p>`:''}<button class="btn" style="margin-top:18px" data-allsrc="1">All sources</button>`;$('#modal').classList.add('on');$('#scrim').classList.add('on');}
function showReading(id,chapter){const r=(DECK.readings||[]).find(x=>x.id===id);if(!r)return;const ch=r.chapters.find(c=>c.id===chapter)||r.chapters[0];$('#modalBody').innerHTML=`<div class="rd"><nav class="rd-nav"><div class="kick">${esc(r.label)}</div>${r.chapters.map(c=>`<button data-reading="${esc(r.id)}" data-chapter="${esc(c.id)}" ${c===ch?'aria-current="page"':''}>${esc(c.title)}</button>`).join('')}</nav><article class="rd-art" id="rdArt">${ch.html}</article></div>`;$('#modal').classList.add('on','wide');$('#scrim').classList.add('on');}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1800);}

/* ---------- hover previews and tooltips ---------- */
const tip=$('#tip');
function showTip(e,html){tip.innerHTML=html;tip.style.opacity=1;const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.max(8,Math.min(innerWidth-w-12,e.clientX+16))+'px';tip.style.top=Math.max(72,Math.min(innerHeight-h-12,e.clientY+16))+'px';}
function hideTip(){tip.style.opacity=0;}
const peekCur={};
document.addEventListener('mousemove',e=>{const pk=e.target.closest('[data-peek]');$$('.peek').forEach(p=>{const H=byId[p.dataset.peekfor];const k=pk&&pk.dataset.peek.startsWith(H.id+'|')?pk.dataset.peek:'';if(peekCur[H.id]!==k){peekCur[H.id]=k;if(k){const [,rk,ck]=k.split('|');p.innerHTML=peekCell(H,H.rows.find(r=>r.key===rk),H.cols.find(c=>c.key===ck));}else p.innerHTML=peekDefault(H);}});
 const lc=e.target.closest('[data-tipx]');if(lc){showTip(e,`<b>${esc(lc.dataset.tipx)}</b>${esc(lc.dataset.tipt)}`);return;}hideTip();});

/* ---------- movement with meaning ---------- */
const played={};
function onEnter(id){const s=byId[id];if(!s)return;
 if(s.type==='compare'&&!played[id]){played[id]=1;setTimeout(()=>{const box=$(`[data-morph="${id}"]`);const H=byId[s.base];box.querySelectorAll('.hc').forEach((b,i)=>{b.style.transitionDelay=(i*22)+'ms';b.style.background=b.dataset.cb;b.classList.toggle('changed',s.mark_changes!==false&&b.dataset.a!==b.dataset.b);});},900);}
 if(s.type==='figures')$$(`#${CSS.escape(id)} .fig`).forEach(el=>{const m=(el.dataset.fig||'').match(/^(\D*)(\d+)(.*)$/);if(!m||el.dataset.done||reduced)return;el.dataset.done=1;const t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/1200);el.textContent=m[1]+Math.round(+m[2]*(1-Math.pow(1-p,3)))+m[3];if(p<1)requestAnimationFrame(f);};requestAnimationFrame(f);});}

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-src],[data-allsrc],[data-reading],[data-go],[data-goid],[data-group],[data-copy],[data-det]');if(!b)return;const d=b.dataset;
 if(d.src){e.stopPropagation();return showSource(d.src);}
 if(d.allsrc)return showSources();
 if(d.reading!==undefined)return showReading(d.reading,d.chapter);
 if(d.go!==undefined)return go(+d.go);
 if(d.goid){closeAll();return go(secs.findIndex(s=>s.id===d.goid));}
 if(d.group!==undefined){const box=b.closest('[data-hm]'),H=byId[box.dataset.hm];box.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const g=$(`#hmg-${CSS.escape(H.id)}`);g.querySelector('.hm-main').innerHTML=d.group?hmGroup(H,d.group):hmOverview(H);g.querySelector('.peek').style.display=d.group?'none':'';g.style.gridTemplateColumns=d.group?'1fr':'';return;}
 if(d.copy){const t=$('#drawerBody').innerText.replace(/Copy this guidance/,'').trim()+`\n\nFrom “${M.title||''}”, ${M.author||''}.`;navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Copy not available'));return;}
 if(d.det!==undefined)return openDrawer(renderDetails(DET[+d.det]));
});
$('#srcBtn')&&($('#srcBtn').onclick=showSources);

/* ---------- opening constellation of sources ---------- */
(function(){const cv=$('#stars');if(!cv)return;const ctx=cv.getContext('2d');const hero=scenes.find(s=>s.type==='hero')||{};const CO=hero.constellation||{};const G=CO.groups||[];
 const groups=G.length?G:[...new Set(Object.values(SRC).map(s=>s.group||'Sources'))].map((k,i)=>({key:k,label:k}));
 const PAL=['#9e1630','#17365d','#2c6e7d','#b07d23','#7b8590','#5b4b8a'];const POS=[[.75,.58,.1],[.64,.31,.065],[.92,.75,.06],[.62,.82,.06],[.87,.27,.065],[.9,.47,.05]];
 const C={},COL={},NAME={};groups.forEach((g,i)=>{C[g.key]=g.pos||POS[i%POS.length];COL[g.key]=g.color||PAL[i%PAL.length];NAME[g.key]=g.label||g.key;});
 const list=Object.values(SRC).map(s=>({s,c:C[s.group]?s.group:groups[0].key}));const n={};groups.forEach(g=>n[g.key]=0);list.forEach(x=>n[x.c]++);
 let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 /* Layout "timeline" (constellation.layout): one lane per group, each source placed by its year on a shared axis (constellation.area, knots, ticks; see docs/SCENES.md). The default layout is moving clusters. */
 const TL=CO.layout==='timeline',AR=CO.area||[.6,.2,.97,.82],yr=s=>parseFloat(String(s.year||'').slice(0,4));
 const YS=list.map(x=>yr(x.s)).filter(v=>!isNaN(v)),Y0=(CO.years||[])[0]||Math.min(...YS),Y1=(CO.years||[])[1]||Math.max(...YS);
 const KN=CO.knots&&CO.knots.length>1?CO.knots:[[Y0,0],[Y1,1]];
 const xOf=y=>{if(y<=KN[0][0])return KN[0][1];for(let i=1;i<KN.length;i++)if(y<=KN[i][0]){const [a,fa]=KN[i-1],[b,fb]=KN[i];return fa+(fb-fa)*(y-a)/(b-a);}return KN[KN.length-1][1];};
 const LH=(AR[3]-AR[1])/groups.length,laneTop=k=>AR[1]+groups.findIndex(g=>g.key===k)*LH;
 let P;
 if(TL){P=list.map(x=>({x,yv:yr(x.s)}));
  /* Within a lane, sources close in time take alternating rows, so that their dots do not overlap. */
  groups.forEach(g=>{const used=[];P.filter(p=>p.x.c===g.key).sort((a,b)=>(a.yv||0)-(b.yv||0)).forEach(p=>{const fx=AR[0]+(AR[2]-AR[0])*xOf(isNaN(p.yv)?Y1:p.yv);
   const lv=[0,-1,1,-2,2,-3,3].find(l=>!used.some(u=>u.l===l&&Math.abs(u.fx-fx)<.011));const l=lv===undefined?0:lv;used.push({l,fx});p.bx=fx;p.by=laneTop(g.key)+LH*(.6+l*.12);});});
  P.forEach(p=>{p.ph=rnd()*6.28;p.sp=.25+rnd()*.5;p.rad=2+rnd()*2.2;});}
 else P=list.map(x=>{const a=rnd()*6.283,r=Math.sqrt(rnd())*C[x.c][2];return {x,bx:C[x.c][0]+Math.cos(a)*r*.85,by:C[x.c][1]+Math.sin(a)*r*1.45,ph:rnd()*6.28,sp:.25+rnd()*.5,rad:2+rnd()*2.2};});
 /* Lines are citations only: source A is joined to source B when A's reference list includes B (sources[].cites, see docs/SCENES.md). Never draw lines by proximity. */
 const at={};P.forEach((p,i)=>at[p.x.s.id]=i);const E=[];P.forEach((p,i)=>(p.x.s.cites||[]).forEach(id=>{if(at[id]!==undefined&&at[id]!==i)E.push([i,at[id]]);}));
 /* A small arrow points from the citing to the cited source, and a dot grows with the number of sources in the deck that cite it. */
 const IN=P.map(()=>0);E.forEach(([,j])=>IN[j]++);if(E.length)P.forEach((p,i)=>p.rad=2+1.25*Math.sqrt(IN[i]));
 const nums=ids=>ids.map(k=>'['+P[k].x.s.number+']').join(' ');
 $('#legend').innerHTML=`<span style="color:var(--ink);font-weight:600;width:100%">${list.length} sources cited in this presentation</span>`+groups.map(g=>`<span><i style="background:${COL[g.key]}"></i>${esc(NAME[g.key])} · ${n[g.key]}</span>`).join('');
 let W=0,H=0,mouse=null,hov=null;const size=()=>{const dpr=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);};size();addEventListener('resize',size);
 const host=cv.closest('.scene');host.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse={x:e.clientX-r.left,y:e.clientY-r.top,cx:e.clientX,cy:e.clientY};});host.addEventListener('mouseleave',()=>{mouse=null;hideTip();});
 host.addEventListener('click',e=>{if(hov&&!e.target.closest('button,a'))showSource(hov.x.s.id);});
 const hex=(h,a)=>{const v=parseInt(h.slice(1),16);return `rgba(${v>>16},${(v>>8)&255},${v&255},${a})`;};
 const t0=performance.now();function frame(t){const tt=(t-t0)/1000;ctx.clearRect(0,0,W,H);
  if(TL){ctx.textAlign='left';groups.forEach(g=>{const top=laneTop(g.key)*H,lab=NAME[g.key].toUpperCase();ctx.font='700 11.5px "Open Sans", sans-serif';ctx.fillStyle=COL[g.key];ctx.fillText(lab,AR[0]*W,top+LH*H*.2);
    const w=ctx.measureText(lab).width;ctx.font='600 11.5px "Open Sans", sans-serif';ctx.fillStyle=hex(COL[g.key],.7);ctx.fillText(n[g.key]+(n[g.key]===1?' source':' sources'),AR[0]*W+w+10,top+LH*H*.2);
    ctx.strokeStyle=hex(COL[g.key],.12);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(AR[0]*W,top+LH*H*.6);ctx.lineTo(AR[2]*W,top+LH*H*.6);ctx.stroke();});
   const ay=AR[3]*H+14;ctx.strokeStyle='rgba(31,42,51,.28)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(AR[0]*W,ay);ctx.lineTo(AR[2]*W,ay);ctx.stroke();ctx.font='12px "Open Sans", sans-serif';ctx.fillStyle='#66727c';ctx.textAlign='center';
   (CO.ticks||[Y0,Y1]).forEach(y=>{const x=(AR[0]+(AR[2]-AR[0])*xOf(y))*W;ctx.beginPath();ctx.moveTo(x,ay-4);ctx.lineTo(x,ay+4);ctx.stroke();ctx.fillText(String(y),x,ay+19);});}
  else groups.forEach(g=>{const [cx,cy,r]=C[g.key],R=r*Math.max(W,H)*.95,gr=ctx.createRadialGradient(cx*W,cy*H,0,cx*W,cy*H,R);gr.addColorStop(0,hex(COL[g.key],.07));gr.addColorStop(1,hex(COL[g.key],0));ctx.fillStyle=gr;ctx.beginPath();ctx.arc(cx*W,cy*H,R,0,6.283);ctx.fill();});
  const DX=TL?.0012:.005,DY=TL?.0025:.008,Q=P.map(p=>({p,x:(p.bx+Math.sin(tt*p.sp+p.ph)*DX)*W,y:(p.by+Math.cos(tt*p.sp*.8+p.ph)*DY)*H}));
  hov=null;let best=16;if(mouse)Q.forEach(q=>{const d=Math.hypot(q.x-mouse.x,q.y-mouse.y);if(d<best){best=d;hov=q.p;}});
  const near=new Set();E.forEach(([i,j])=>{const a=Q[i],b=Q[j],on=!!hov&&(hov===a.p||hov===b.p);if(on){near.add(a.p);near.add(b.p);}
 /* On the timeline, lines bend upward so that citations within a lane stay visible; the arrow follows the curve. */
   const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;let nx=-dy/len,ny=dx/len;if(ny>0){nx=-nx;ny=-ny;}const bend=TL?Math.min(70,len*.22):0,cx=(a.x+b.x)/2+nx*bend,cy=(a.y+b.y)/2+ny*bend;
   const vx=b.x-cx,vy=b.y-cy,vl=Math.hypot(vx,vy)||1,ux=vx/vl,uy=vy/vl,al=on?5.5:4.2,hw=on?2.8:2.1,tx=b.x-ux*(b.p.rad+1.6),ty=b.y-uy*(b.p.rad+1.6),bx=tx-ux*al,by=ty-uy*al;
   const g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);g.addColorStop(0,hex(COL[a.p.x.c],on?.8:hov?.08:.22));g.addColorStop(1,hex(COL[b.p.x.c],on?.8:hov?.08:.22));ctx.strokeStyle=g;ctx.lineWidth=on?1.5:.9;ctx.beginPath();ctx.moveTo(a.x,a.y);if(TL)ctx.quadraticCurveTo(cx,cy,bx,by);else ctx.lineTo(bx,by);ctx.stroke();
   ctx.fillStyle=hex(COL[b.p.x.c],on?.9:hov?.1:.42);ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(bx-uy*hw,by+ux*hw);ctx.lineTo(bx+uy*hw,by-ux*hw);ctx.closePath();ctx.fill();});
  Q.forEach(q=>{const h=hov===q.p;ctx.beginPath();ctx.fillStyle=COL[q.p.x.c];ctx.globalAlpha=h||near.has(q.p)?1:hov?.45:.85;ctx.arc(q.x,q.y,q.p.rad*(h?2.3:near.has(q.p)?1.4:1),0,6.283);ctx.fill();});ctx.globalAlpha=1;
  ctx.font='700 11.5px "Open Sans", sans-serif';ctx.textAlign='center';if(!TL)groups.forEach(g=>{const [cx,cy,r]=C[g.key];ctx.fillStyle=COL[g.key];const words=NAME[g.key].toUpperCase(),ly=(cy-r*1.45)*H-16,hw=ctx.measureText(words).width/2+10,lx=Math.max(hw,Math.min(W-hw,cx*W));ctx.fillText(words,lx,ly);ctx.fillStyle=hex(COL[g.key],.7);ctx.fillText(n[g.key]+(n[g.key]===1?' source':' sources'),lx,ly+15);});
  if(hov&&mouse){const s=hov.x.s,k=at[s.id],out=E.filter(e=>e[0]===k).map(e=>e[1]),inn=E.filter(e=>e[1]===k).map(e=>e[0]);showTip({clientX:mouse.cx,clientY:mouse.cy},`<b>[${s.number}] ${esc(s.authors||'').slice(0,70)} · ${esc(s.year||'')}</b>${esc(s.title||'')}${out.length||inn.length?`<span style="display:block;margin-top:5px;color:var(--muted)">${out.length?'Cites '+nums(out):''}${out.length&&inn.length?' · ':''}${inn.length?'Cited by '+nums(inn):''}</span>`:''}`);cv.style.cursor='pointer';}else{if(mouse&&!document.querySelector('[data-tipx]:hover'))hideTip();cv.style.cursor='default';}
  if(!reduced)requestAnimationFrame(frame);}
 requestAnimationFrame(frame);})();
</script>
