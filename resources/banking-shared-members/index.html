d}.bk-crow:hover>div.bank,.bk-crow:hover>div.org{box-shadow:inset 0 0 0 1.5px #9e1630}.bk-proc{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,30px);margin-top:6px}.bk-pcol{padding:16px 18px 18px;border:1px solid var(--line);border-top:4px solid #9e1630;border-radius:6px 6px 14px 14px;background:#fff;cursor:pointer;box-shadow:0 6px 22px rgba(31,42,51,.05)}.bk-pcol:hover,.bk-pcol:focus-visible{border-color:#9e1630}.bk-pcol .kick{margin-bottom:4px}.bk-pcol h3{font-size:19px;margin:0 0 8px;color:var(--ink)}.bk-pcol p{font-size:15px;line-height:1.5;color:var(--body);margin-top:8px}.bk-pcol .more{margin-top:8px;font-size:13.5px}@media(max-width:900px){.bk-cmp{grid-template-columns:1fr}.bk-cmp .bk-h{display:none}.bk-proc{grid-template-columns:1fr}}<\/style><div class=\"bk\"><svg class=\"\" viewBox=\"0 0 1200 270\" role=\"img\" aria-label=\"Three product teams share one engineer, who can review the test plan of one team a week\"><g class=\"bk-s\" style=\"transition-delay:0.30s\"><g class=\"bk-hot\" data-detail=\"mtm\" aria-label=\"Three teams that share one engineer\"><circle cx=\"190\" cy=\"108\" r=\"72\" fill=\"none\" stroke=\"#7b8590\" stroke-width=\"1.8\"/><circle cx=\"290\" cy=\"108\" r=\"72\" fill=\"none\" stroke=\"#7b8590\" stroke-width=\"1.8\"/><circle cx=\"240\" cy=\"188\" r=\"72\" fill=\"none\" stroke=\"#7b8590\" stroke-width=\"1.8\"/><g fill=\"#c3cad1\"><circle cx=\"150\" cy=\"81.5\" r=\"6.2\"/><rect x=\"141.4\" y=\"90.1\" width=\"17.1\" height=\"18.1\" rx=\"5.7\"/><\/g><g fill=\"#c3cad1\"><circle cx=\"330\" cy=\"81.5\" r=\"6.2\"/><rect x=\"321.4\" y=\"90.1\" width=\"17.1\" height=\"18.1\" rx=\"5.7\"/><\/g><g fill=\"#c3cad1\"><circle cx=\"240\" cy=\"221.6\" r=\"6.2\"/><rect x=\"231.4\" y=\"230.1\" width=\"17.1\" height=\"18.1\" rx=\"5.7\"/><\/g><g fill=\"#1f2a33\"><circle cx=\"240\" cy=\"123.5\" r=\"9.8\"/><rect x=\"226.5\" y=\"137\" width=\"27\" height=\"28.5\" rx=\"9\"/><\/g><text x=\"96\" y=\"48\" font-size=\"13.5\" fill=\"#66727c\" font-weight=\"700\" text-anchor=\"middle\">Team A<\/text><text x=\"384\" y=\"48\" font-size=\"13.5\" fill=\"#66727c\" font-weight=\"700\" text-anchor=\"middle\">Team B<\/text><text x=\"338\" y=\"252\" font-size=\"13.5\" fill=\"#66727c\" font-weight=\"700\" text-anchor=\"middle\">Team C<\/text><\/g><\/g><g class=\"bk-s\" style=\"transition-delay:1.00s\"><g class=\"bk-hot\" data-detail=\"hcr\" aria-label=\"Week by week, one team at a time\"><text x=\"520\" y=\"30\" font-size=\"16\" fill=\"#1f2a33\" font-weight=\"700\" text-anchor=\"start\">Week by week<\/text><text x=\"520\" y=\"50\" font-size=\"13\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"start\">the engineer can review one test plan a week<\/text><text x=\"586\" y=\"92\" font-size=\"13\" fill=\"#36424c\" font-weight=\"700\" text-anchor=\"middle\">Week 1<\/text><circle cx=\"542\" cy=\"132\" r=\"19\" fill=\"#43679a\" stroke=\"#43679a\" stroke-width=\"2\"/><g fill=\"#1f2a33\"><circle cx=\"542\" cy=\"129.2\" r=\"4\"/><rect x=\"536.4\" y=\"134.8\" width=\"11.2\" height=\"11.8\" rx=\"3.7\"/><\/g><circle cx=\"586\" cy=\"132\" r=\"19\" fill=\"#fff\" stroke=\"#c3cad1\" stroke-width=\"1.5\"/><text x=\"586\" y=\"137\" font-size=\"13\" fill=\"#98a2aa\" font-weight=\"700\" text-anchor=\"middle\">B<\/text><circle cx=\"630\" cy=\"132\" r=\"19\" fill=\"#fff\" stroke=\"#c3cad1\" stroke-width=\"1.5\"/><text x=\"630\" y=\"137\" font-size=\"13\" fill=\"#98a2aa\" font-weight=\"700\" text-anchor=\"middle\">C<\/text><text x=\"586\" y=\"180\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">team A has the engineer<\/text><text x=\"756\" y=\"92\" font-size=\"13\" fill=\"#36424c\" font-weight=\"700\" text-anchor=\"middle\">Week 2<\/text><circle cx=\"712\" cy=\"132\" r=\"19\" fill=\"#fff\" stroke=\"#c3cad1\" stroke-width=\"1.5\"/><text x=\"712\" y=\"137\" font-size=\"13\" fill=\"#98a2aa\" font-weight=\"700\" text-anchor=\"middle\">A<\/text><circle cx=\"756\" cy=\"132\" r=\"19\" fill=\"#88a3c6\" stroke=\"#88a3c6\" stroke-width=\"2\"/><g fill=\"#1f2a33\"><circle cx=\"756\" cy=\"129.2\" r=\"4\"/><rect x=\"750.4\" y=\"134.8\" width=\"11.2\" height=\"11.8\" rx=\"3.7\"/><\/g><circle cx=\"800\" cy=\"132\" r=\"19\" fill=\"#fff\" stroke=\"#c3cad1\" stroke-width=\"1.5\"/><text x=\"800\" y=\"137\" font-size=\"13\" fill=\"#98a2aa\" font-weight=\"700\" text-anchor=\"middle\">C<\/text><text x=\"756\" y=\"180\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">team B has the engineer<\/text><text x=\"926\" y=\"92\" font-size=\"13\" fill=\"#36424c\" font-weight=\"700\" text-anchor=\"middle\">Week 3<\/text><circle cx=\"882\" cy=\"132\" r=\"19\" fill=\"#fff\" stroke=\"#c3cad1\" stroke-width=\"1.5\"/><text x=\"882\" y=\"137\" font-size=\"13\" fill=\"#98a2aa\" font-weight=\"700\" text-anchor=\"middle\">A<\/text><circle cx=\"926\" cy=\"132\" r=\"19\" fill=\"#fff\" stroke=\"#c3cad1\" stroke-width=\"1.5\"/><text x=\"926\" y=\"137\" font-size=\"13\" fill=\"#98a2aa\" font-weight=\"700\" text-anchor=\"middle\">B<\/text><circle cx=\"970\" cy=\"132\" r=\"19\" fill=\"#c8d5e5\" stroke=\"#c8d5e5\" stroke-width=\"2\"/><g fill=\"#1f2a33\"><circle cx=\"970\" cy=\"129.2\" r=\"4\"/><rect x=\"964.4\" y=\"134.8\" width=\"11.2\" height=\"11.8\" rx=\"3.7\"/><\/g><text x=\"926\" y=\"180\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">team C has the engineer<\/text><text x=\"1096\" y=\"92\" font-size=\"13\" fill=\"#36424c\" font-weight=\"700\" text-anchor=\"middle\">Week 4<\/text><circle cx=\"1052\" cy=\"132\" r=\"19\" fill=\"#fff\" stroke=\"#c3cad1\" stroke-width=\"1.5\"/><text x=\"1052\" y=\"137\" font-size=\"13\" fill=\"#98a2aa\" font-weight=\"700\" text-anchor=\"middle\">A<\/text><circle cx=\"1096\" cy=\"132\" r=\"19\" fill=\"#fff\" stroke=\"#c3cad1\" stroke-width=\"1.5\"/><text x=\"1096\" y=\"137\" font-size=\"13\" fill=\"#98a2aa\" font-weight=\"700\" text-anchor=\"middle\">B<\/text><circle cx=\"1140\" cy=\"132\" r=\"19\" fill=\"#fff\" stroke=\"#c3cad1\" stroke-width=\"1.5\"/><text x=\"1140\" y=\"137\" font-size=\"13\" fill=\"#98a2aa\" font-weight=\"700\" text-anchor=\"middle\">C<\/text><text x=\"1096\" y=\"180\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">no review due<\/text><line x1=\"520\" y1=\"206\" x2=\"1180\" y2=\"206\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"/><text x=\"520\" y=\"232\" font-size=\"14\" fill=\"#1f2a33\" font-weight=\"600\" text-anchor=\"start\">A team can count on the engineer only in the weeks in which the other teams do not need the engineer.<\/text><\/g><\/g><\/svg><\/div><p class=\"bk-under bk-s\" style=\"transition-delay:1.8s\">Research on human capital resources (HCR) counts KSAOs as a team’s resource only when the team can access them {{ployhart14}}. <em>Overlapping memberships therefore raise the question of where HCR and their synergies reside when unit membership is not stable.<\/em><\/p><div class=\"bk-pills\"><span class=\"bk-lab\">Background<\/span><span class=\"bk-pill\" data-detail=\"mtm\">Multiple team membership<\/span><span class=\"bk-pill\" data-detail=\"hcr\">Human capital resources<\/span><span class=\"bk-pill\" data-detail=\"emergence\">HCR emergence theory<\/span><\/div>", "details": {"mtm": {"kicker": "Background", "title": "Multiple team membership", "blocks": [{"heading": "The phenomenon", "text": "Many organizations assign their specialists to several teams at the same time, because few teams need such an expert full time. In such multiple team membership (MTM), a multiteamer (i.e., an employee who works in several teams at once) divides his or her working time among the teams {{oleary11}} {{mortensen18}}."}, {"heading": "How common it is", "text": "O’Leary et al. report survey estimates according to which 65 to 95 percent of knowledge workers in the United States and Europe work on more than one project team at a time {{oleary11}}."}, {"heading": "Why organizations use it", "text": "Sharing a specialist allows organizations to match one team’s busy periods with another team’s quiet periods, so that a team obtains part of an expert’s time without bearing this person’s full cost {{mortensen18}} {{oleary11}}. In a study of German small and medium-sized firms, firms with more university-educated employees and firms that were understaffed made more use of MTM {{berger22}}."}, {"heading": "What research has found", "text": "Working in more temporary teams has been related to identity strain and, through it, to turnover intentions in one of two studies {{mistry23}}, and frequent switching between teams to exhaustion and, through it, turnover {{brake24}}. Experienced and successful employees tend to work in more teams than their colleagues {{cummings12}} {{brake18}}. A review of this research reports optimal numbers of memberships that range from 2.4 to 9 teams {{rishani24}}, found for firm productivity, project timeliness, and team performance {{berger22}} {{colicev23}} {{bertolotti15}}, whereas the performance of primary care units declined without a peak {{crawford19}}. The same memberships can also raise a team’s performance through more varied outside networks while they lower its adaptability through less varied outside roles {{lang26}}."}, {"heading": "What is less known", "text": "Most of this research describes multiteamers by the number of their teams or by the share of their time that each team receives {{cummings12}} {{margolis20}}. Less is known about how the teams that share a multiteamer depend on one another for access to this person, and about how this dependence develops over time."}]}, "hcr": {"kicker": "Background", "title": "Human capital resources", "blocks": [{"heading": "Access is part of the definition", "text": "Human capital resources (HCR) are capacities of individuals or units that rest on individuals’ KSAOs and that a unit can access for its purposes {{ployhart14}}, a definition that later research has kept {{ray23r}}. Human capital thus resides in individuals, whereas one and the same skill can be an HCR for one unit and not for another {{ployhart14}}."}, {"heading": "Emergence", "text": "Unit-level HCR emerge from the KSAOs of a unit’s members, depending on how complex the unit’s tasks are and on how its members behave, think, and feel together {{ployhart11}}. The same KSAOs can therefore form different HCR when members work with different colleagues {{ployhart14}}."}, {"heading": "Under multiple team membership", "text": "The KSAOs of one multiteamer become part of the HCR of several teams at once. Counting them toward the HCR of every team would suggest more human capital than the organization can use, whereas assigning them to one team would overlook the synergies that they create in the others."}, {"heading": "What it is", "text": "HCR complementarity theory holds that teammates’ competencies can raise a member’s performance when the member’s and the team’s competencies both fit the demands of a performance episode {{wolfson18}}. In a study of the riders of the 2013 Tour de France, riders performed better on stages that called for their competence, particularly when their teammates had matching competencies {{wolfson18}}."}, {"heading": "Synergies depend on colleagues", "text": "In a study of star analysts who changed employers, the stars ranked lower for years after the move, unless they moved together with colleagues or to a firm with stronger capabilities {{groysberg08}}."}]}, "emergence": {"kicker": "Background", "title": "HCR emergence theory", "blocks": [{"heading": "What it explains", "text": "HCR emergence theory explains how the social capital of a unit (i.e., the density of its members’ ties, their relationships, and their shared understanding) shapes whether members’ human capital is available to the unit, accessible across it, and coordinated, so that the unit’s HCR can exceed the sum of its members’ human capital {{ray23e}}."}, {"heading": "Its simplifying assumptions", "text": "For simplicity, the theory assumes a constant task environment and a single unit of constant size in which all members can interact, and it leaves ties to people outside the unit to future research {{ray23e}}. A review of the first decade of HCR research likewise calls for research on time, on members who join and leave units, and on relationships between units {{ray23r}}."}, {"heading": "Where our theory starts", "text": "Research on internal mobility shows that a transfer can strengthen the HCR of the receiving unit while it disrupts the HCR of the unit left behind {{ray24}} {{ray26}}. Under MTM, the same multiteamer serves several units in the same period, and our theory adds timing to the accessibility that HCR emergence theory describes."}]}}}, {"type": "figure", "id": "liquidity", "nav": "Same reviews, different times", "kicker": "The problem", "title": "The Same Reviews at Different Times", "lead": "Each review takes five hours, and the engineer has eight hours a week for reviews. The teams need the same fifteen hours in all three panels.", "html": "<div class=\"bk\"><svg class=\"\" viewBox=\"0 0 1200 330\" role=\"img\" aria-label=\"The same three reviews in different weeks, in the same week, and in the same week with a colleague who takes over one review\"><defs><pattern id=\"bkHatch\" width=\"7\" height=\"7\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><rect width=\"7\" height=\"7\" fill=\"#f6ddd7\"/><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"7\" stroke=\"#e4a294\" stroke-width=\"2.4\"/><\/pattern><pattern id=\"bkIdle\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><rect width=\"6\" height=\"6\" fill=\"#ffffff\"/><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"6\" stroke=\"#b9c4d2\" stroke-width=\"1.6\"/><\/pattern><\/defs><g class=\"bk-s\" style=\"transition-delay:0.35s\"><text x=\"0\" y=\"18\" font-size=\"16.5\" fill=\"#1f2a33\" font-weight=\"700\" text-anchor=\"start\">Different weeks<\/text><line x1=\"0\" y1=\"262\" x2=\"372\" y2=\"262\" stroke=\"#1f2a33\" stroke-width=\"1.4\"/><line x1=\"0\" y1=\"158\" x2=\"372\" y2=\"158\" stroke=\"#1f2a33\" stroke-width=\"1.2\" stroke-dasharray=\"6 5\"/><text x=\"0\" y=\"151\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"start\">the engineer’s 8 hours<\/text><text x=\"47\" y=\"282\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">Week 1<\/text><g class=\"bk-hot\" data-detail=\"claim\" aria-label=\"Team A\"><rect x=\"14\" y=\"197\" width=\"66\" height=\"65\" rx=\"2\" fill=\"#43679a\" stroke=\"#ffffff\" stroke-width=\"1\"/><text x=\"47\" y=\"234.5\" font-size=\"14\" fill=\"#ffffff\" font-weight=\"700\" text-anchor=\"middle\">A<\/text><\/g><text x=\"139\" y=\"282\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">Week 2<\/text><g class=\"bk-hot\" data-detail=\"claim\" aria-label=\"Team B\"><rect x=\"106\" y=\"197\" width=\"66\" height=\"65\" rx=\"2\" fill=\"#88a3c6\" stroke=\"#ffffff\" stroke-width=\"1\"/><text x=\"139\" y=\"234.5\" font-size=\"14\" fill=\"#0f2440\" font-weight=\"700\" text-anchor=\"middle\">B<\/text><\/g><text x=\"231\" y=\"282\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">Week 3<\/text><g class=\"bk-hot\" data-detail=\"claim\" aria-label=\"Team C\"><rect x=\"198\" y=\"197\" width=\"66\" height=\"65\" rx=\"2\" fill=\"#c8d5e5\" stroke=\"#ffffff\" stroke-width=\"1\"/><text x=\"231\" y=\"234.5\" font-size=\"14\" fill=\"#0f2440\" font-weight=\"700\" text-anchor=\"middle\">C<\/text><\/g><text x=\"323\" y=\"282\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">Week 4<\/text><circle cx=\"8\" cy=\"324\" r=\"7.5\" fill=\"#17365d\" stroke=\"#17365d\" stroke-width=\"1.8\"/><circle cx=\"30\" cy=\"324\" r=\"7.5\" fill=\"#17365d\" stroke=\"#17365d\" stroke-width=\"1.8\"/><circle cx=\"52\" cy=\"324\" r=\"7.5\" fill=\"#17365d\" stroke=\"#17365d\" stroke-width=\"1.8\"/><g class=\"bk-hot\" data-detail=\"liq_def\" aria-label=\"Liquidity\"><text x=\"76\" y=\"329\" font-size=\"14.5\" fill=\"#1f2a33\" font-weight=\"700\" text-anchor=\"start\" class=\"bk-ttl\">3 of 3 reviews on time<\/text><\/g><\/g><g class=\"bk-s\" style=\"transition-delay:1.10s\"><text x=\"410\" y=\"18\" font-size=\"16.5\" fill=\"#1f2a33\" font-weight=\"700\" text-anchor=\"start\">The same week<\/text><line x1=\"410\" y1=\"262\" x2=\"782\" y2=\"262\" stroke=\"#1f2a33\" stroke-width=\"1.4\"/><line x1=\"410\" y1=\"158\" x2=\"782\" y2=\"158\" stroke=\"#1f2a33\" stroke-width=\"1.2\" stroke-dasharray=\"6 5\"/><text x=\"410\" y=\"151\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"start\">the engineer’s 8 hours<\/text><text x=\"457\" y=\"282\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">Week 1<\/text><text x=\"549\" y=\"282\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">Week 2<\/text><text x=\"641\" y=\"282\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">Week 3<\/text><g class=\"bk-hot\" data-detail=\"claim\" aria-label=\"Team A\"><rect x=\"608\" y=\"197\" width=\"66\" height=\"65\" rx=\"2\" fill=\"#43679a\" stroke=\"#ffffff\" stroke-width=\"1\"/><text x=\"641\" y=\"234.5\" font-size=\"14\" fill=\"#ffffff\" font-weight=\"700\" text-anchor=\"middle\">A<\/text><\/g><g class=\"bk-hot\" data-detail=\"claim\" aria-label=\"Team B\"><rect x=\"608\" y=\"132\" width=\"66\" height=\"65\" rx=\"2\" fill=\"#88a3c6\" stroke=\"#ffffff\" stroke-width=\"1\"/><text x=\"641\" y=\"169.5\" font-size=\"14\" fill=\"#0f2440\" font-weight=\"700\" text-anchor=\"middle\">B<\/text><\/g><g class=\"bk-hot\" data-detail=\"claim\" aria-label=\"Team C\"><rect x=\"608\" y=\"67\" width=\"66\" height=\"65\" rx=\"2\" fill=\"#c8d5e5\" stroke=\"#ffffff\" stroke-width=\"1\"/><text x=\"641\" y=\"104.5\" font-size=\"14\" fill=\"#0f2440\" font-weight=\"700\" text-anchor=\"middle\">C<\/text><\/g><rect x=\"608\" y=\"67\" width=\"66\" height=\"91\" rx=\"2\" fill=\"url(#bkHatch)\" stroke=\"#e4a294\" stroke-width=\"1\" opacity=\".85\"/><text x=\"682\" y=\"81\" font-size=\"12.5\" fill=\"#8a2b1d\" font-weight=\"700\" text-anchor=\"start\">waits<\/text><text x=\"733\" y=\"282\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">Week 4<\/text><circle cx=\"418\" cy=\"324\" r=\"7.5\" fill=\"#17365d\" stroke=\"#17365d\" stroke-width=\"1.8\"/><circle cx=\"440\" cy=\"324\" r=\"7.5\" fill=\"#fff\" stroke=\"#17365d\" stroke-width=\"1.8\"/><circle cx=\"462\" cy=\"324\" r=\"7.5\" fill=\"#fff\" stroke=\"#17365d\" stroke-width=\"1.8\"/><g class=\"bk-hot\" data-detail=\"liq_def\" aria-label=\"Liquidity\"><text x=\"486\" y=\"329\" font-size=\"14.5\" fill=\"#1f2a33\" font-weight=\"700\" text-anchor=\"start\" class=\"bk-ttl\">1 of 3 reviews on time<\/text><\/g><\/g><g class=\"bk-s\" style=\"transition-delay:1.85s\"><text x=\"820\" y=\"18\" font-size=\"16.5\" fill=\"#1f2a33\" font-weight=\"700\" text-anchor=\"start\">The same week, and a colleague helps<\/text><line x1=\"820\" y1=\"262\" x2=\"1192\" y2=\"262\" stroke=\"#1f2a33\" stroke-width=\"1.4\"/><line x1=\"820\" y1=\"158\" x2=\"1192\" y2=\"158\" stroke=\"#1f2a33\" stroke-width=\"1.2\" stroke-dasharray=\"6 5\"/><text x=\"820\" y=\"151\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"start\">the engineer’s 8 hours<\/text><text x=\"867\" y=\"282\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">Week 1<\/text><text x=\"959\" y=\"282\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">Week 2<\/text><text x=\"1051\" y=\"282\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">Week 3<\/text><g class=\"bk-hot\" data-detail=\"claim\" aria-label=\"Team A\"><rect x=\"1018\" y=\"197\" width=\"30\" height=\"65\" rx=\"2\" fill=\"#43679a\" stroke=\"#ffffff\" stroke-width=\"1\"/><text x=\"1033\" y=\"234.5\" font-size=\"14\" fill=\"#ffffff\" font-weight=\"700\" text-anchor=\"middle\">A<\/text><\/g><g class=\"bk-hot\" data-detail=\"claim\" aria-label=\"Team C\"><rect x=\"1018\" y=\"132\" width=\"30\" height=\"65\" rx=\"2\" fill=\"#c8d5e5\" stroke=\"#ffffff\" stroke-width=\"1\"/><text x=\"1033\" y=\"169.5\" font-size=\"14\" fill=\"#0f2440\" font-weight=\"700\" text-anchor=\"middle\">C<\/text><\/g><rect x=\"1018\" y=\"132\" width=\"30\" height=\"26\" rx=\"2\" fill=\"url(#bkHatch)\" stroke=\"#e4a294\" stroke-width=\"1\" opacity=\".85\"/><text x=\"1092\" y=\"146\" font-size=\"12.5\" fill=\"#8a2b1d\" font-weight=\"700\" text-anchor=\"start\">waits<\/text><g class=\"bk-hot\" data-detail=\"backing\" aria-label=\"Team B, reviewed by a colleague\"><rect x=\"1054\" y=\"197\" width=\"30\" height=\"65\" rx=\"2\" fill=\"#88a3c6\" stroke=\"#6b7480\" stroke-width=\"2\" stroke-dasharray=\"4 2\"/><text x=\"1069\" y=\"234.5\" font-size=\"14\" fill=\"#0f2440\" font-weight=\"700\" text-anchor=\"middle\">B<\/text><\/g><text x=\"1069\" y=\"298\" font-size=\"11.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">colleague<\/text><text x=\"1143\" y=\"282\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">Week 4<\/text><circle cx=\"828\" cy=\"324\" r=\"7.5\" fill=\"#17365d\" stroke=\"#17365d\" stroke-width=\"1.8\"/><circle cx=\"850\" cy=\"324\" r=\"7.5\" fill=\"#17365d\" stroke=\"#17365d\" stroke-width=\"1.8\"/><circle cx=\"872\" cy=\"324\" r=\"7.5\" fill=\"#fff\" stroke=\"#17365d\" stroke-width=\"1.8\"/><g class=\"bk-hot\" data-detail=\"liq_def\" aria-label=\"Liquidity\"><text x=\"896\" y=\"329\" font-size=\"14.5\" fill=\"#1f2a33\" font-weight=\"700\" text-anchor=\"start\" class=\"bk-ttl\">2 of 3 reviews on time<\/text><\/g><\/g><\/svg><\/div><p class=\"bk-under bk-s\" style=\"transition-delay:2.4s\">We call the share of the teams’ essential work that is done in time the <em>liquidity<\/em> of the organization’s human capital. It can fall although the amount of work stays the same.<\/p><div class=\"bk-prop bk-s\" style=\"transition-delay:2.8s\" data-detail=\"p1\"><b>Proposition 1<\/b>The liquidity of an organization’s human capital is higher when the teams that share a multiteamer need this person in different weeks and when colleagues can take over more of this person’s essential work.<\/div><p class=\"bk-hint\">Click the bars, the results, or the proposition for the explanation and sources.<\/p>", "details": {"claim": {"kicker": "Construct", "title": "Claims and essential work", "blocks": [{"heading": "Definition", "text": "A claim is a team’s standing expectation that a named member will perform specified essential work to a required standard within a required period."}, {"heading": "Essential work", "text": "Work is essential when the team cannot continue without it, such as the review that a product team needs before it can start its tests. In a study of Major League Baseball teams, the experience and skill of the players in core roles were more strongly related to team performance than those of other players {{humphrey09}}, and in a qualitative study of agile teams, colleagues had to wait with no one else to turn to when a multiteamer with critical expertise was unavailable {{tenzer26}}."}, {"heading": "Where claims arise", "text": "Each team holds its own claim on the multiteamer, and the multiteamer honors it, so that claims arise at the level of the team."}]}, "liq_def": {"kicker": "Construct", "title": "Liquidity of human capital", "blocks": [{"heading": "Definition", "text": "The liquidity of human capital is the share of all teams’ essential claims that are honored in the period in which they are due, each claim counting once, whether the multiteamer or a colleague performs the work."}, {"heading": "In the example", "text": "The teams claim the same fifteen hours of reviews in the three panels. Liquidity is three of three claims when the reviews fall in different weeks, one of three when they fall in the same week, and two of three when a colleague can take over one review."}, {"heading": "Why it counts claims", "text": "Because liquidity counts the claims that are honored in time, an organization can lose liquidity while the amount of work stays the same."}]}, "backing": {"kicker": "Construct", "title": "Backing", "blocks": [{"heading": "Definition", "text": "A claim has backing when a colleague can perform its essential work and is available when it is due."}, {"heading": "Why it takes time", "text": "Colleagues need time and practice before they can take over the essential work of a multiteamer. Firm-specific skills accumulate through steady learning over time, and spending twice as much in half the time yields less {{dierickx89}}. Assignments to such work are also one way in which units develop their HCR, and repeated assignments of the same person deepen this person’s specialization {{gallagher23}}."}, {"heading": "Evidence on slack", "text": "In a study of Mexican manufacturing plants, excess managers, a proxy for tacit and firm-specific knowledge, went with higher profits, whereas excess workers with general knowledge went with lower profits {{lecuona14}}. In a study of U.S. commercial banks, excess employees went with higher firm value during strategic change and with lower value otherwise {{bentley20}}."}, {"heading": "In banking", "text": "Backing corresponds to a bank’s reserves, which make promises safer at the cost of some of the liquidity that the bank creates {{dr01}}."}]}, "p1": {"kicker": "Proposition 1", "title": "Liquidity depends on timing and backing", "blocks": [{"heading": "Proposition", "text": "The liquidity of an organization’s human capital is higher when the teams that share a multiteamer need this person in different weeks and when colleagues can take over more of this person’s essential work."}, {"heading": "Argument", "text": "A team needs the engineer in its action phase, whereas managers and team leaders decide in transition phases who works for which team and when each team tests {{marks01}}. The engineer can therefore honor every claim as long as the teams test in different weeks or a colleague can step in when the engineer is busy (i.e., backing)."}, {"heading": "The distinction", "text": "Teams alternate between action phases, in which they carry out the work that directly serves their goals, and transition phases, in which they evaluate their progress and plan what comes next, and a team can plan one task while it carries out another {{marks01}}. In a field study of eight project groups, each group changed its approach halfway to its deadline, so that the deadline paced its work {{gersick88}}."}, {"heading": "Why timing", "text": "As members join more teams, the blocks of time in which they are available line up less well, so that more work is set aside and teams wait longer for it {{oleary11}}."}]}}}, {"type": "figure", "id": "bank", "nav": "What banking adds", "kicker": "The analogy", "title": "What Banking Adds", "lead": "Banks face a similar problem. They promise every depositor access to money that they cannot hand out to all depositors at once.", "html": "<div class=\"bk-cmp bk-s\" style=\"transition-delay:.4s\"><div><\/div><div class=\"bk-h\">A bank<\/div><div class=\"bk-h org\">An organization that shares the engineer<\/div><div class=\"bk-crow\" data-detail=\"promise\"><div class=\"bk-rl\">The promise<\/div><div class=\"bank\">Depositors can withdraw their money at any time, although the bank has lent most of it out.<\/div><div class=\"org\">Three teams can call on the engineer, who has time for one review a week.<\/div><\/div><div class=\"bk-crow\" data-detail=\"holds\"><div class=\"bk-rl\">When it holds<\/div><div class=\"bank\">As long as depositors need their money at different times, or the bank has enough reserves.<\/div><div class=\"org\">As long as the teams need the engineer in different weeks, or a colleague can step in.<\/div><\/div><div class=\"bk-crow\" data-detail=\"breaks\"><div class=\"bk-rl\">Why it breaks<\/div><div class=\"bank\">A shock hits all customers at once, or depositors rush to withdraw before the others do (a run).<\/div><div class=\"org\">The teams need the engineer in the same week, or team leaders rush to reserve the engineer before the others do.<\/div><\/div><\/div><p class=\"bk-under bk-s\" style=\"transition-delay:1.2s\">From banking we take only this logic of promises that hold as long as they are not all called on at once {{dd83}}. Research on HCR explains why the engineer’s work is essential to a team and why colleagues need time to learn it.<\/p><div class=\"bk-pills\"><span class=\"bk-lab\">Click a row for the banking concepts<\/span><span class=\"bk-pill\" data-detail=\"limits\">Where the analogy stops<\/span><\/div>", "details": {"promise": {"kicker": "The analogy", "title": "The promise", "blocks": [{"heading": "In banking", "text": "Leverage is what a financial firm owes relative to its own capital. When prospects are good, firms with little capital can enter and borrow heavily, so that in the authors’ examples crises become rarer but more severe when they occur {{av11}}."}, {"heading": "Under multiple team membership", "text": "Leverage is the essential work that teams expect from a multiteamer relative to what this person can deliver in a period. In the example, three teams expect fifteen hours of reviews from an engineer who can do eight hours of reviews a week (Proposition 2)."}, {"heading": "Role in our theory", "text": "Leverage explains how commitments to a multiteamer can grow while all work is still done in time, as managers keep assigning proven people to further teams, much as colleagues increasingly seek out visible stars {{oldroyd12}}. We take from banking the observation that leverage tends to rise in good times, and we extend the use of leverage in research on professional service firms, where it refers to how many associates work under each partner {{hitt01}} {{kor05}}."}, {"heading": "Why some leverage is the point", "text": "A deposit that promised no more than the bank’s assets would fetch if every depositor came at once would be safe from runs and would give depositors no liquidity {{dd83}}. Likewise, an organization that promised its teams only what the multiteamer could deliver to all of them at once would give up the benefit of sharing this person."}]}, "holds": {"kicker": "The analogy", "title": "When the promise holds", "blocks": [{"heading": "In banking", "text": "Liquidity is a bank’s ability to pay depositors when they ask for their money. Banks fund long-term investments, which lose value when they are turned into cash early, with deposits that can be withdrawn at any time, so that a bank with enough assets in the long run can still run out of cash when many depositors come at once {{dd83}}."}, {"heading": "Why the loans are illiquid", "text": "Diamond and Rajan trace the illiquidity of bank loans to the specific skills of the banker who made them, which nobody else can use to collect them in full {{dr01}}. A multiteamer’s human capital is illiquid in a similar way, because colleagues cannot simply take over this person’s essential work."}, {"heading": "Under multiple team membership", "text": "The liquidity of human capital is the share of the teams’ essential claims that the organization honors in the period in which they are due (Propositions 1 and 4)."}, {"heading": "Role in our theory", "text": "Liquidity explains why an organization can employ every specialist that its teams need and still fail to deliver their work in time, or deliver it only at a cost, for example through overtime or external help."}, {"heading": "In banking", "text": "Reserves are the cash and other liquid assets that a bank keeps to pay withdrawals. Reserves make a bank safer, and Diamond and Rajan argue that a bank that kept all deposits in such assets (i.e., a narrow bank) would create no liquidity {{dr01}}."}, {"heading": "Under multiple team membership", "text": "Backing corresponds to reserves. A claim has backing when a colleague can perform its essential work and is available when it is due (Propositions 1, 2, and 4)."}]}, "breaks": {"kicker": "The analogy", "title": "Why the promise breaks", "blocks": [{"heading": "Needs coincide", "text": "Banks can pool the liquidity needs of firms as long as these needs are independent. When a shock hits all firms at once, they need liquidity at the same time, and pooling cannot cover their needs {{ht98}}. The engineer faces the same problem when the three product teams need their reviews in the same week. Propositions 1 to 3 explain how sharing a multiteamer can make such coinciding needs more likely."}, {"heading": "A run", "text": "Depositors who expect others to withdraw their money have good reason to withdraw first, so that their withdrawals create the shortage that they feared, unless a credible guarantee, such as deposit insurance, takes this reason away {{dd83}}. Any widely observed event can start such a run, even when nothing is wrong with the bank {{dd83}}. Team leaders who expect the engineer to become scarce may likewise reserve this person early. Proposition 4 concerns this kind of failure."}, {"heading": "Correlated withdrawals", "text": "Withdrawals are correlated when they come at the same time. Banks can spread the liquidity needs of firms across credit lines as long as these needs are independent, whereas a shock that hits all firms at once leaves nothing to pool {{ht98}}. Market liquidity also dries up in many securities at once when the same speculators trade them {{bp09}}, and in a run, depositors withdraw early because they expect others to do so {{dd83}}."}, {"heading": "Under multiple team membership", "text": "Call correlation is the extent to which the teams that share a multiteamer need this person at the same time, including the early reservations that team leaders make after a shortfall (i.e., precautionary claiming; Propositions 3 and 4)."}, {"heading": "Role in our theory", "text": "Call correlation explains how a shortfall can arise and spread although the amount of work stays the same, and why protected time windows, much like deposit insurance, keep sharing dependable. Research on talent hoarding explains why managers keep talented employees in their own unit {{haegele26}}, and our theory adds how teams that share an employee can bring about the shortage that they fear."}]}, "limits": {"kicker": "The banking analogy", "title": "Where the analogy stops", "blocks": [{"heading": "A group of small banks", "text": "A bank can pay any depositor with the same money, whereas a team that needs the engineer cannot be helped by a free afternoon of the organization’s data analyst. Each multiteamer therefore carries his or her own set of claims, so that an organization is better compared with a group of small banks, linked through teams that depend on more than one multiteamer, than with a single bank."}, {"heading": "Unmet claims cost more", "text": "An unmet claim is also likely to cost a team more than a late withdrawal costs a depositor, because colleagues whose work depends on the multiteamer’s input may have to wait as well {{tenzer26}}."}, {"heading": "How we use the two literatures", "text": "From banking, we take the logic of promises that can be kept only as long as they are not all called on at once, whereas research on HCR explains why some contributions are essential to a team and why colleagues need time to learn them {{gallagher23}} {{wolfson18}}."}]}}}, {"type": "figure", "id": "fragile", "nav": "How sharing becomes fragile", "kicker": "Propositions 2 to 4", "title": "How Sharing Becomes Fragile", "lead": "Three processes can turn an arrangement that works well into a fragile one, while every manager and team leader acts sensibly.", "html": "<div class=\"bk-proc\"><div class=\"bk-pcol bk-s\" style=\"transition-delay:0.30s\" data-detail=\"p2\"><div class=\"kick\">Proposition 2<\/div><h3>Success attracts more teams<\/h3><div class=\"bk\"><svg class=\"\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Earlier the engineer works for two teams and two colleagues can step in; later for five teams and nobody can\"><defs><marker id=\"bkP2\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" markerUnits=\"userSpaceOnUse\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a33\"/><\/marker><\/defs><g class=\"bk-s\" style=\"transition-delay:0.40s\"><circle cx=\"118\" cy=\"84\" r=\"13\" fill=\"#fff\" stroke=\"#7b8590\" stroke-width=\"1.4\"/><text x=\"118\" y=\"88.5\" font-size=\"11.5\" fill=\"#36424c\" font-weight=\"700\" text-anchor=\"middle\">A<\/text><circle cx=\"26\" cy=\"84\" r=\"13\" fill=\"#fff\" stroke=\"#7b8590\" stroke-width=\"1.4\"/><text x=\"26\" y=\"88.5\" font-size=\"11.5\" fill=\"#36424c\" font-weight=\"700\" text-anchor=\"middle\">B<\/text><g fill=\"#1f2a33\"><circle cx=\"72\" cy=\"77.5\" r=\"6.2\"/><rect x=\"63.5\" y=\"86.1\" width=\"17.1\" height=\"18.1\" rx=\"5.7\"/><\/g><g fill=\"#6b7480\"><circle cx=\"57\" cy=\"154.1\" r=\"5.9\"/><rect x=\"48.9\" y=\"162.2\" width=\"16.2\" height=\"17.1\" rx=\"5.4\"/><\/g><g fill=\"#6b7480\"><circle cx=\"87\" cy=\"154.1\" r=\"5.9\"/><rect x=\"78.9\" y=\"162.2\" width=\"16.2\" height=\"17.1\" rx=\"5.4\"/><\/g><text x=\"72\" y=\"196\" font-size=\"12\" fill=\"#66727c\" font-weight=\"600\" text-anchor=\"middle\">earlier<\/text><\/g><g class=\"bk-s\" style=\"transition-delay:0.90s\"><line x1=\"136\" y1=\"88\" x2=\"196\" y2=\"88\" stroke=\"#1f2a33\" stroke-width=\"1.6\" marker-end=\"url(#bkP2)\"/><text x=\"166\" y=\"148\" font-size=\"10.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">colleagues who<\/text><text x=\"166\" y=\"161\" font-size=\"10.5\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">can step in<\/text><\/g><g class=\"bk-s\" style=\"transition-delay:1.30s\"><circle cx=\"266\" cy=\"48\" r=\"13\" fill=\"#fff\" stroke=\"#7b8590\" stroke-width=\"1.4\"/><text x=\"266\" y=\"52.5\" font-size=\"11.5\" fill=\"#36424c\" font-weight=\"700\" text-anchor=\"middle\">A<\/text><circle cx=\"309.7\" cy=\"72.9\" r=\"13\" fill=\"#fff\" stroke=\"#7b8590\" stroke-width=\"1.4\"/><text x=\"309.7\" y=\"77.4\" font-size=\"11.5\" fill=\"#36424c\" font-weight=\"700\" text-anchor=\"middle\">B<\/text><circle cx=\"293\" cy=\"113.1\" r=\"13\" fill=\"#fff\" stroke=\"#7b8590\" stroke-width=\"1.4\"/><text x=\"293\" y=\"117.6\" font-size=\"11.5\" fill=\"#36424c\" font-weight=\"700\" text-anchor=\"middle\">C<\/text><circle cx=\"239\" cy=\"113.1\" r=\"13\" fill=\"#fff\" stroke=\"#7b8590\" stroke-width=\"1.4\"/><text x=\"239\" y=\"117.6\" font-size=\"11.5\" fill=\"#36424c\" font-weight=\"700\" text-anchor=\"middle\">D<\/text><circle cx=\"222.3\" cy=\"72.9\" r=\"13\" fill=\"#fff\" stroke=\"#7b8590\" stroke-width=\"1.4\"/><text x=\"222.3\" y=\"77.4\" font-size=\"11.5\" fill=\"#36424c\" font-weight=\"700\" text-anchor=\"middle\">E<\/text><g fill=\"#1f2a33\"><circle cx=\"266\" cy=\"77.5\" r=\"6.2\"/><rect x=\"257.4\" y=\"86.1\" width=\"17.1\" height=\"18.1\" rx=\"5.7\"/><\/g><g fill=\"none\" stroke=\"#98a2aa\" stroke-width=\"1.4\" stroke-dasharray=\"3 2.5\"><circle cx=\"251\" cy=\"154.1\" r=\"5.9\"/><rect x=\"242.9\" y=\"162.2\" width=\"16.2\" height=\"17.1\" rx=\"5.4\"/><\/g><g fill=\"none\" stroke=\"#98a2aa\" stroke-width=\"1.4\" stroke-dasharray=\"3 2.5\"><circle cx=\"281\" cy=\"154.1\" r=\"5.9\"/><rect x=\"272.9\" y=\"162.2\" width=\"16.2\" height=\"17.1\" rx=\"5.4\"/><\/g><text x=\"266\" y=\"196\" font-size=\"12\" fill=\"#66727c\" font-weight=\"600\" text-anchor=\"middle\">later<\/text><\/g><\/svg><\/div><p>Managers see the engineer’s good work and assign the engineer to further teams, and fewer colleagues learn the reviews.<\/p><span class=\"more\">Proposition, argument, and sources<\/span><\/div><div class=\"bk-pcol bk-s\" style=\"transition-delay:0.80s\" data-detail=\"p3\"><div class=\"kick\">Proposition 3<\/div><h3>Teams fall into step<\/h3><div class=\"bk\"><svg class=\"\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Three team leaders move their reviews into the one week in which the engineer seems free\"><text x=\"0\" y=\"25\" font-size=\"11.5\" fill=\"#66727c\" font-weight=\"700\" text-anchor=\"start\">free?<\/text><rect x=\"42\" y=\"8\" width=\"32\" height=\"24\" rx=\"4\" fill=\"#e9edf1\" stroke=\"none\" stroke-width=\"1\"/><text x=\"58\" y=\"164\" font-size=\"11\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">1<\/text><rect x=\"78\" y=\"8\" width=\"32\" height=\"24\" rx=\"4\" fill=\"#e9edf1\" stroke=\"none\" stroke-width=\"1\"/><text x=\"94\" y=\"164\" font-size=\"11\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">2<\/text><rect x=\"114\" y=\"8\" width=\"32\" height=\"24\" rx=\"4\" fill=\"#e9edf1\" stroke=\"none\" stroke-width=\"1\"/><text x=\"130\" y=\"164\" font-size=\"11\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">3<\/text><rect x=\"150\" y=\"8\" width=\"32\" height=\"24\" rx=\"4\" fill=\"#e9edf1\" stroke=\"none\" stroke-width=\"1\"/><text x=\"166\" y=\"164\" font-size=\"11\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">4<\/text><rect x=\"186\" y=\"8\" width=\"32\" height=\"24\" rx=\"4\" fill=\"#ffffff\" stroke=\"#c3cad1\" stroke-width=\"1\"/><text x=\"202\" y=\"25\" font-size=\"11\" fill=\"#9e1630\" font-weight=\"700\" text-anchor=\"middle\">yes<\/text><text x=\"202\" y=\"164\" font-size=\"11\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">5<\/text><rect x=\"222\" y=\"8\" width=\"32\" height=\"24\" rx=\"4\" fill=\"#e9edf1\" stroke=\"none\" stroke-width=\"1\"/><text x=\"238\" y=\"164\" font-size=\"11\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">6<\/text><rect x=\"258\" y=\"8\" width=\"32\" height=\"24\" rx=\"4\" fill=\"#e9edf1\" stroke=\"none\" stroke-width=\"1\"/><text x=\"274\" y=\"164\" font-size=\"11\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">7<\/text><rect x=\"294\" y=\"8\" width=\"32\" height=\"24\" rx=\"4\" fill=\"#e9edf1\" stroke=\"none\" stroke-width=\"1\"/><text x=\"310\" y=\"164\" font-size=\"11\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">8<\/text><text x=\"0\" y=\"164\" font-size=\"11\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"start\">week<\/text><text x=\"0\" y=\"62\" font-size=\"12.5\" fill=\"#36424c\" font-weight=\"700\" text-anchor=\"start\">A<\/text><rect x=\"42\" y=\"44\" width=\"284\" height=\"28\" rx=\"5\" fill=\"#f6f7f8\" stroke=\"none\" stroke-width=\"1\"/><rect x=\"116\" y=\"47\" width=\"28\" height=\"22\" rx=\"4\" fill=\"none\" stroke=\"#43679a\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/><g class=\"bk-move\" style=\"transform:translateX(-72px)\"><rect x=\"188\" y=\"47\" width=\"28\" height=\"22\" rx=\"4\" fill=\"#43679a\" stroke=\"none\" stroke-width=\"1\"/><text x=\"202\" y=\"63\" font-size=\"12\" fill=\"#ffffff\" font-weight=\"700\" text-anchor=\"middle\">A<\/text><\/g><text x=\"0\" y=\"98\" font-size=\"12.5\" fill=\"#36424c\" font-weight=\"700\" text-anchor=\"start\">B<\/text><rect x=\"42\" y=\"80\" width=\"284\" height=\"28\" rx=\"5\" fill=\"#f6f7f8\" stroke=\"none\" stroke-width=\"1\"/><rect x=\"260\" y=\"83\" width=\"28\" height=\"22\" rx=\"4\" fill=\"none\" stroke=\"#88a3c6\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/><g class=\"bk-move\" style=\"transform:translateX(72px)\"><rect x=\"188\" y=\"83\" width=\"28\" height=\"22\" rx=\"4\" fill=\"#88a3c6\" stroke=\"none\" stroke-width=\"1\"/><text x=\"202\" y=\"99\" font-size=\"12\" fill=\"#0f2440\" font-weight=\"700\" text-anchor=\"middle\">B<\/text><\/g><text x=\"0\" y=\"134\" font-size=\"12.5\" fill=\"#36424c\" font-weight=\"700\" text-anchor=\"start\">C<\/text><rect x=\"42\" y=\"116\" width=\"284\" height=\"28\" rx=\"5\" fill=\"#f6f7f8\" stroke=\"none\" stroke-width=\"1\"/><g class=\"bk-move\" style=\"transform:translateX(0px)\"><rect x=\"188\" y=\"119\" width=\"28\" height=\"22\" rx=\"4\" fill=\"#c8d5e5\" stroke=\"none\" stroke-width=\"1\"/><text x=\"202\" y=\"135\" font-size=\"12\" fill=\"#0f2440\" font-weight=\"700\" text-anchor=\"middle\">C<\/text><\/g><text x=\"202\" y=\"188\" font-size=\"12\" fill=\"#9e1630\" font-weight=\"700\" text-anchor=\"middle\">3 reviews due in week 5<\/text><\/svg><\/div><p>Team leaders each plan their tests for the week in which the engineer seems free, so that the teams need the engineer at the same time.<\/p><span class=\"more\">Proposition, argument, and sources<\/span><\/div><div class=\"bk-pcol bk-s\" style=\"transition-delay:1.30s\" data-detail=\"p4\"><div class=\"kick\">Proposition 4<\/div><h3>Leaders reserve the engineer<\/h3><div class=\"bk\"><svg class=\"\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"The engineer’s calendar after team leaders have reserved whole weeks\"><g class=\"bk-s\" style=\"transition-delay:0.40s\"><defs><pattern id=\"bkHatch\" width=\"7\" height=\"7\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><rect width=\"7\" height=\"7\" fill=\"#f6ddd7\"/><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"7\" stroke=\"#e4a294\" stroke-width=\"2.4\"/><\/pattern><pattern id=\"bkIdle\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><rect width=\"6\" height=\"6\" fill=\"#ffffff\"/><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"6\" stroke=\"#b9c4d2\" stroke-width=\"1.6\"/><\/pattern><\/defs><rect x=\"23\" y=\"38\" width=\"54\" height=\"112\" rx=\"3\" fill=\"#f6f7f8\" stroke=\"none\" stroke-width=\"1\"/><rect x=\"23\" y=\"80\" width=\"54\" height=\"70\" rx=\"2\" fill=\"#43679a\" stroke=\"#ffffff\" stroke-width=\"1\"/><text x=\"50\" y=\"119.5\" font-size=\"12.5\" fill=\"#ffffff\" font-weight=\"700\" text-anchor=\"middle\">A<\/text><rect x=\"23\" y=\"38\" width=\"54\" height=\"42\" rx=\"2\" fill=\"#88a3c6\" stroke=\"#ffffff\" stroke-width=\"1\"/><text x=\"50\" y=\"63.5\" font-size=\"12.5\" fill=\"#0f2440\" font-weight=\"700\" text-anchor=\"middle\">B<\/text><text x=\"50\" y=\"167\" font-size=\"11\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">1<\/text><rect x=\"87\" y=\"38\" width=\"54\" height=\"112\" rx=\"3\" fill=\"#f6f7f8\" stroke=\"none\" stroke-width=\"1\"/><rect x=\"87\" y=\"122\" width=\"54\" height=\"28\" rx=\"2\" fill=\"#88a3c6\" stroke=\"#ffffff\" stroke-width=\"1\"/><text x=\"114\" y=\"140.5\" font-size=\"12.5\" fill=\"#0f2440\" font-weight=\"700\" text-anchor=\"middle\">B<\/text><rect x=\"87\" y=\"38\" width=\"54\" height=\"84\" rx=\"2\" fill=\"url(#bkIdle)\" stroke=\"#88a3c6\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/><text x=\"114\" y=\"84.5\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"700\" text-anchor=\"middle\">B<\/text><text x=\"114\" y=\"167\" font-size=\"11\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">2<\/text><rect x=\"151\" y=\"38\" width=\"54\" height=\"112\" rx=\"3\" fill=\"#f6f7f8\" stroke=\"none\" stroke-width=\"1\"/><rect x=\"151\" y=\"80\" width=\"54\" height=\"70\" rx=\"2\" fill=\"#c8d5e5\" stroke=\"#ffffff\" stroke-width=\"1\"/><text x=\"178\" y=\"119.5\" font-size=\"12.5\" fill=\"#0f2440\" font-weight=\"700\" text-anchor=\"middle\">C<\/text><rect x=\"151\" y=\"38\" width=\"54\" height=\"42\" rx=\"2\" fill=\"url(#bkIdle)\" stroke=\"#9fb1c9\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/><text x=\"178\" y=\"63.5\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"700\" text-anchor=\"middle\">C<\/text><text x=\"178\" y=\"167\" font-size=\"11\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">3<\/text><rect x=\"215\" y=\"38\" width=\"54\" height=\"112\" rx=\"3\" fill=\"#f6f7f8\" stroke=\"none\" stroke-width=\"1\"/><rect x=\"215\" y=\"38\" width=\"54\" height=\"112\" rx=\"2\" fill=\"url(#bkIdle)\" stroke=\"#43679a\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/><text x=\"242\" y=\"98.5\" font-size=\"12.5\" fill=\"#66727c\" font-weight=\"700\" text-anchor=\"middle\">A<\/text><text x=\"242\" y=\"167\" font-size=\"11\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">4<\/text><text x=\"143\" y=\"184\" font-size=\"11\" fill=\"#66727c\" font-weight=\"400\" text-anchor=\"middle\">week<\/text><text x=\"286\" y=\"40\" font-size=\"11.5\" fill=\"#66727c\" font-weight=\"600\" text-anchor=\"start\">reserved<\/text><text x=\"286\" y=\"54\" font-size=\"11.5\" fill=\"#66727c\" font-weight=\"600\" text-anchor=\"start\">but not<\/text><text x=\"286\" y=\"68\" font-size=\"11.5\" fill=\"#66727c\" font-weight=\"600\" text-anchor=\"start\">needed<\/text><line x1=\"282\" y1=\"52\" x2=\"256\" y2=\"60\" stroke=\"#98a2aa\" stroke-width=\"1.2\"/><\/g><\/svg><\/div><p>After a delay, one leader reserves the engineer for a whole week, and the others have good reason to do the same, as in a bank run. Team C’s review now waits a week.<\/p><span class=\"more\">Proposition, argument, and sources<\/span><\/div><\/div>", "details": {"p2": {"kicker": "Proposition 2", "title": "Success attracts more teams", "blocks": [{"heading": "Proposition", "text": "The more visibly a multiteamer has helped several teams, the more teams are likely to depend on this person while fewer colleagues are prepared to take over, particularly when managers cannot see how much work other teams already expect from the multiteamer."}, {"heading": "Argument", "text": "When the engineer’s reviews help teams avoid costly mistakes, managers see that the arrangement works, whereas they rarely see how much work other teams already expect from the engineer. The work that teams expect from the engineer relative to what this person can deliver (i.e., leverage) may thus rise, while fewer colleagues are prepared to take over."}, {"heading": "Known records", "text": "Managers who need an expert for a new team are likely to choose the engineer, whose record they know. When managers fill internal positions without open competition, they typically choose someone they already know {{keller18}}."}, {"heading": "Evidence from MTM research", "text": "In a longitudinal study of 1,875 knowledge workers, an increase in an employee’s job performance was followed by an increase in the number of teams in which he or she worked in the next year {{brake18}}, and a review of MTM research concludes that individual success makes employees targets for further memberships {{margolis20}}. In a qualitative study of agile teams, technical experts with high performance held the most memberships, because product owners asked for people with whom they had worked successfully before {{tenzer26}}."}, {"heading": "Newcomers pay a price", "text": "In a study of research employees, more memberships went with lower rated performance and more absence among newer employees, and with better performance only among the longest-tenured {{brake20}}, which gives managers a reason to keep relying on experienced multiteamers."}, {"heading": "Research on professional service firms", "text": "Research on law firms argues that associates develop their human capital by working with partners, and that too many associates per partner may leave too little contact for this learning {{hitt01}}. How firms combine leverage with the development or hiring of associates also affects their profits {{kor05}}."}, {"heading": "No overview", "text": "No single team leader sees all claims on a multiteamer. In a study of German small and medium-sized firms, the authors asked employees to report their team memberships, because most firms kept no record of them {{berger22}}. In one of the divisions studied by Engwall and Jerbrant, engineering hours were not recorded, so that no manager had an overview of what the engineers were doing in their projects {{engwall03}}."}, {"heading": "Costs that grow unnoticed", "text": "Mortensen and Gardner observe that organizations track the efficiency gains of sharing people more closely than its costs, so that the costs can grow unnoticed {{mortensen17}}. In a case study of a financial institution, a capacity system showed that workers were planned at well over 100 percent of their time, but managers did not look at it {{delisle20}}."}, {"heading": "When workload is visible", "text": "In a study of M&A advice by UK law firms, firms steered new deals away from busy partners, although partners with much firm-specific human capital took on more deals unless profits were shared by seniority {{chatain17}}."}]}, "p3": {"kicker": "Proposition 3", "title": "Teams fall into step", "blocks": [{"heading": "Proposition", "text": "Teams that share a multiteamer are more likely to need this person in the same weeks when their leaders plan their work independently than when each team has its own time window."}, {"heading": "Argument", "text": "Activities in organizations tend to adjust their timing to dominant rhythms {{ancona99}}, and for the teams that share the engineer, the weeks in which the engineer is free become such a rhythm. When team leaders each plan their tests for these weeks, the teams increasingly need the engineer at the same time (i.e., higher call correlation)."}, {"heading": "Huygens’ clocks", "text": "Ancona and Chong recall how Huygens noticed that two pendulum clocks swung in step, which he suspected came from small vibrations in their common support, and that the clocks fell out of step when he moved them apart {{ancona99}}. Teams that share a multiteamer are joined through this person in a similar way."}, {"heading": "Catching up", "text": "Work that has to wait returns in weeks that other teams had planned to use, so that, as one department manager put it, “everything slips away and ends up on top of each other” {{engwall03}}."}, {"heading": "Shifts that spread", "text": "In a qualitative study of agile teams, informants described teams that compete for the same person’s time without buffers in their schedules, so that a small shift in one team spreads to the person’s other teams {{tenzer26}}."}, {"heading": "Evidence from multi-project work", "text": "In the multi-project divisions studied by Engwall and Jerbrant, trouble in one project spread to others, because projects depended on the same few people {{engwall03}}, and Zika-Viktorsson et al. describe how disturbances travel between parallel projects that share one pool of people {{zika06}}. In a study of U.S. federal projects that share contractors, a disruption at one site raised the chance of delays in connected projects, although the shared resources were mainly machinery {{dhingra25}}."}, {"heading": "Evidence and boundaries", "text": "In a study of 415 projects, the more other projects a project’s core members held, the later the project’s surge of activity came, which the authors explain by core members who rely on deadlines and other outside signals to time their work {{zhang26}}. People entrain more readily when a rhythm fits their own sense of time, and with competing rhythms they may follow one and resist the others {{shipp21}}."}, {"heading": "The counterforce", "text": "A fixed schedule, or a firm promise that each team has its own week, can keep the teams apart, which fits the observation that sharing works best when teams’ workloads peak at different times {{mortensen17}}."}]}, "p4": {"kicker": "Proposition 4", "title": "Leaders reserve the engineer", "blocks": [{"heading": "Proposition", "text": "The longer teams have relied on a multiteamer without preparing colleagues to take over, the more teams are likely to wait at the same time when their needs coincide, particularly when team leaders can reserve the multiteamer for more time than they need."}, {"heading": "Argument", "text": "As long as the engineer manages to review every plan on time, the growth of claims and the decline of backing are hard to notice, until a small disturbance, such as a test that fails earlier than expected, brings several reviews into the same week. The resulting shortfall is likely to be larger the longer teams have relied on the engineer without preparing colleagues."}, {"heading": "What happens", "text": "A team whose review comes too late may reserve the engineer for an entire week (i.e., precautionary claiming), and if this reservation keeps another team from using the engineer’s remaining hours, that team’s leader has good reason to do the same {{engwall03}}."}, {"heading": "Why it resembles a run", "text": "As in a bank run, each team leader acts sensibly for his or her own team, while the reservations together create the shortage that they were meant to prevent {{dd83}}."}, {"heading": "In multi-project firms", "text": "In the multi-project divisions studied by Engwall and Jerbrant, project managers sought priority from top management to obtain the best experts and kept the people they had acquired busy, because people who were released to other projects might not come back {{engwall03}}."}, {"heading": "Talent hoarding", "text": "In a study of a large European manufacturer, workers’ internal applications rose by 78 percent when their manager was about to rotate out, which indicates that managers hold back talented workers {{haegele26}}. Managers may also withhold information about their subordinates to keep them in the unit {{ray24}}."}, {"heading": "Crises that feed themselves", "text": "In an ethnographic study of a software group, a crisis mentality and the rewards for individual heroics kept up the interruptions that created the next crisis {{perlow99}}. In a case study of a financial institution, what counted as an emergency depended largely on who made the request {{delisle20}}."}, {"heading": "Like deposit insurance", "text": "Managers can prevent reservations by giving each team a protected window for its reviews, much as deposit insurance prevents runs {{dd83}}, and separating the teams’ windows can restore liquidity quickly. A credible guarantee need not even be used, because the run never starts {{dd83}}."}, {"heading": "Fast and slow repairs", "text": "Separating the teams’ windows can restore liquidity quickly. Colleagues, by contrast, need time and practice before they can take over the work {{dierickx89}} {{gallagher23}}."}, {"heading": "Losing the multiteamer", "text": "An engineer who leaves under this pressure takes along the KSAOs behind all of these claims (cf. {{brake24}}). Turnover depletes a unit’s HCR, and it does most damage where work is highly interdependent, because replacements need time to learn one another’s routines {{nyberg13}}."}]}}, "script": "const go=()=>section.querySelectorAll('.bk-move').forEach((g,i)=>{setTimeout(()=>{g.style.transform='translateX(0px)';},1600+i*350);});if(matchMedia('(prefers-reduced-motion: reduce)').matches){section.querySelectorAll('.bk-move').forEach(g=>g.style.transform='none');}else{const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.5){go();io.disconnect();}}),{threshold:[.5,.6]});io.observe(section);}"}, {"type": "figure", "id": "levels", "nav": "Where HCR reside", "kicker": "Our answer", "title": "Where Human Capital Resources Reside", "lead": "The answer differs by level of analysis, and the organization is the level at which the synergies are realized.", "html": "<div class=\"bk\"><svg class=\"\" viewBox=\"0 0 1200 300\" role=\"img\" aria-label=\"The engineer inside three teams inside the organization, with the level at which KSAOs, synergies, and liquidity are located\"><g class=\"bk-s\" style=\"transition-delay:0.30s\"><rect x=\"380\" y=\"14\" width=\"440\" height=\"270\" rx=\"22\" fill=\"#fbfcfd\" stroke=\"#1f2a33\" stroke-width=\"2.2\"/><circle cx=\"550\" cy=\"118\" r=\"64\" fill=\"none\" stroke=\"#7b8590\" stroke-width=\"1.8\"/><circle cx=\"650\" cy=\"118\" r=\"64\" fill=\"none\" stroke=\"#7b8590\" stroke-width=\"1.8\"/><circle cx=\"600\" cy=\"196\" r=\"64\" fill=\"none\" stroke=\"#7b8590\" stroke-width=\"1.8\"/><g fill=\"#c3cad1\"><circle cx=\"508\" cy=\"90.1\" r=\"5.9\"/><rect x=\"499.9\" y=\"98.2\" width=\"16.2\" height=\"17.1\" rx=\"5.4\"/><\/g><g fill=\"#c3cad1\"><circle cx=\"692\" cy=\"90.1\" r=\"5.9\"/><rect x=\"683.9\" y=\"98.2\" width=\"16.2\" height=\"17.1\" rx=\"5.4\"/><\/g><g fill=\"#c3cad1\"><circle cx=\"600\" cy=\"230.1\" r=\"5.9\"/><rect x=\"591.9\" y=\"238.2\" width=\"16.2\" height=\"17.1\" rx=\"5.4\"/><\/g><g fill=\"#1f2a33\"><circle cx=\"600\" cy=\"133.2\" r=\"8.8\"/><rect x=\"587.9\" y=\"145.3\" width=\"24.3\" height=\"25.7\" rx=\"8.1\"/><\/g><text x=\"497\" y=\"74\" font-size=\"13\" fill=\"#66727c\" font-weight=\"700\" text-anchor=\"middle\">A<\/text><text x=\"703\" y=\"74\" font-size=\"13\" fill=\"#66727c\" font-weight=\"700\" text-anchor=\"middle\">B<\/text><text x=\"676\" y=\"262\" font-size=\"13\" fill=\"#66727c\" font-weight=\"700\" text-anchor=\"middle\">C<\/text><\/g><g class=\"bk-s\" style=\"transition-delay:1.00s\"><g class=\"bk-hot\" data-detail=\"individual\" aria-label=\"INDIVIDUAL LEVEL\"><text x=\"0\" y=\"60\" font-size=\"13\" fill=\"#17365d\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1.2\" class=\"bk-ttl\">INDIVIDUAL LEVEL<\/text><text x=\"0\" y=\"84\" font-size=\"15.5\" fill=\"#1f2a33\" font-weight=\"400\" text-anchor=\"start\">The KSAOs reside in the engineer,<\/text><text x=\"0\" y=\"105.7\" font-size=\"15.5\" fill=\"#1f2a33\" font-weight=\"400\" text-anchor=\"start\">who can do only a limited amount<\/text><text x=\"0\" y=\"127.4\" font-size=\"15.5\" fill=\"#1f2a33\" font-weight=\"400\" text-anchor=\"start\">of essential work in a week.<\/text><line x1=\"300\" y1=\"112\" x2=\"582\" y2=\"132\" stroke=\"#9e1630\" stroke-width=\"1.4\"/><circle cx=\"582\" cy=\"132\" r=\"4\" fill=\"#9e1630\"/><\/g><\/g><g class=\"bk-s\" style=\"transition-delay:1.60s\"><g class=\"bk-hot\" data-detail=\"team\" aria-label=\"TEAM LEVEL\"><text x=\"1200\" y=\"60\" font-size=\"13\" fill=\"#17365d\" font-weight=\"700\" text-anchor=\"end\" letter-spacing=\"1.2\" class=\"bk-ttl\">TEAM LEVEL<\/text><text x=\"1200\" y=\"84\" font-size=\"15.5\" fill=\"#1f2a33\" font-weight=\"400\" text-anchor=\"end\">Synergies arise in each team,<\/text><text x=\"1200\" y=\"105.7\" font-size=\"15.5\" fill=\"#1f2a33\" font-weight=\"400\" text-anchor=\"end\">whenever the team can use<\/text><text x=\"1200\" y=\"127.4\" font-size=\"15.5\" fill=\"#1f2a33\" font-weight=\"400\" text-anchor=\"end\">the engineer’s KSAOs.<\/text><line x1=\"900\" y1=\"92\" x2=\"706\" y2=\"108\" stroke=\"#9e1630\" stroke-width=\"1.4\"/><circle cx=\"706\" cy=\"108\" r=\"4\" fill=\"#9e1630\"/><\/g><\/g><g class=\"bk-s\" style=\"transition-delay:2.20s\"><g class=\"bk-hot\" data-detail=\"organization\" aria-label=\"ORGANIZATION LEVEL\"><text x=\"0\" y=\"210\" font-size=\"13\" fill=\"#17365d\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1.2\" class=\"bk-ttl\">ORGANIZATION LEVEL<\/text><text x=\"0\" y=\"234\" font-size=\"15.5\" fill=\"#1f2a33\" font-weight=\"400\" text-anchor=\"start\">The organization realizes them only<\/text><text x=\"0\" y=\"255.7\" font-size=\"15.5\" fill=\"#1f2a33\" font-weight=\"400\" text-anchor=\"start\">as far as it can serve all teams<\/text><text x=\"0\" y=\"277.4\" font-size=\"15.5\" fill=\"#1f2a33\" font-weight=\"400\" text-anchor=\"start\">in time (liquidity).<\/text><line x1=\"310\" y1=\"240\" x2=\"380\" y2=\"240\" stroke=\"#9e1630\" stroke-width=\"1.4\"/><circle cx=\"380\" cy=\"240\" r=\"4\" fill=\"#9e1630\"/><\/g><\/g><\/svg><\/div><p class=\"bk-under bk-s\" style=\"transition-delay:2.6s\">Counting the engineer’s KSAOs toward the HCR of every team would suggest more human capital than the organization can use, and assigning them to one team would overlook the synergies in the others.<\/p><p class=\"bk-hint\">Click a level for its constructs and sources.<\/p>", "details": {"individual": {"kicker": "Levels of analysis", "title": "Individual level", "blocks": [{"heading": "Where the KSAOs reside", "text": "The KSAOs reside in the multiteamer, who belongs to several teams at the same time and can perform only a limited amount of essential work in a given week. Tacit knowledge has to be brought to a problem by the person who holds it, and nobody can be at two problems at once {{lecuona14}}."}, {"heading": "Constructs", "text": "Leverage is the essential work that teams claim from a multiteamer relative to what this person can deliver in a period. Call correlation is the extent to which the teams that claim a multiteamer need this person at the same time."}]}, "team": {"kicker": "Levels of analysis", "title": "Team level", "blocks": [{"heading": "Where the synergies arise", "text": "HCR and their synergies arise in each team, where the multiteamer’s KSAOs combine with those of colleagues whenever the team can access them {{wolfson18}} {{ray23e}}. Research on dynamic team composition notes that members of several teams widen the resources that a team can draw on, although they split their effort across the teams {{wolfson22}}. Some colleagues may be able to take over the multiteamer’s essential work."}, {"heading": "Constructs", "text": "A claim is a team’s standing expectation that a named member will perform specified essential work to a required standard within a required period. A claim has backing when a colleague can perform its essential work and is available when it is due."}]}, "organization": {"kicker": "Levels of analysis", "title": "Organization level", "blocks": [{"heading": "Where the synergies are realized", "text": "The organization’s human capital is spread across concurrent team arrangements. Managers decide which teams a multiteamer joins and which team is served first, and the claims of all teams together determine which synergies the organization can actually realize."}, {"heading": "Construct", "text": "The liquidity of human capital is the share of all teams’ essential claims that are honored in the period in which they are due, each claim counting once, whether the multiteamer or a colleague performs the work."}, {"heading": "Our answer to the question", "text": "HCR research distinguishes human capital, which resides in individuals, from HCR, which are capacities accessible for a unit’s purposes {{ployhart14}} and emerge across levels {{ployhart11}}. Under MTM, the KSAOs stay with the multiteamer and the synergies arise in the teams, and the organization is the level at which they are realized."}, {"heading": "No one sees all claims", "text": "We develop this theory at the level of the organization, because no single team leader sees all claims on a multiteamer, and the decisions that change these claims are made by different managers and team leaders at different moments."}, {"heading": "Periods connected through people", "text": "Following the logic of Coleman’s boat {{cowen22}}, these decisions together determine how much of the organization’s human capital is available when teams need it, and their outcomes shape the claims of the next period {{ilgen05}}."}]}}}, {"type": "figure", "id": "next", "nav": "Contributions and questions", "kicker": "For our discussion", "title": "Contributions and Questions", "lead": "The theory contributes to research on MTM and on HCR, and it brings our three lines of work together.", "html": "<div class=\"bk-close\"><div class=\"bk-cards\"><div class=\"bk-card bk-s\" style=\"transition-delay:0.30s\" data-detail=\"c_mtm\"><div class=\"kick\">Multiple team membership<\/div><p>The theory explains why sharing a multiteamer can work well for a long time and then fail suddenly, and it explains organizational costs of MTM without assuming that multiteamers become exhausted {{berger22}}.<\/p><\/div><div class=\"bk-card bk-s\" style=\"transition-delay:0.70s\" data-detail=\"c_hcr\"><div class=\"kick\">Human capital resources<\/div><p>The theory proposes where HCR and their synergies reside when unit membership is not stable, by adding timing to the accessibility of human capital {{ployhart14}} {{ray23e}}.<\/p><\/div><div class=\"bk-card bk-s run\" style=\"transition-delay:1.10s\" data-detail=\"c_us\"><div class=\"kick\">Our three lines of work<\/div><p>The paper brings together research on HCR emergence and internal mobility {{ray23e}} {{ray26}}, on permanent and project teams {{mistry23}}, and on how MTM develops over time and affects firms {{brake18}} {{berger26}}.<\/p><\/div><\/div><div class=\"bk-ask bk-s\" style=\"transition-delay:1.6s\"><div class=\"kick\">What I would like to discuss<\/div><ol><li>Does our answer to the question of where HCR reside hold up against HCR emergence theory?<\/li><li>When are the teams’ needs likely to converge, and what keeps them apart?<\/li><li>Do the four propositions capture the core of the theory?<\/li><li>Does the working title “Banking on Shared Members: A Liquidity Theory of Multiple Team Membership” work for you?<\/li><\/ol><div class=\"btns\" style=\"margin-top:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap\"><a class=\"btn primary\" href=\"mailto:h.j.van.de.brake@rug.nl?subject=Banking%20on%20shared%20members%2C%20AMR%20proposal&body=Where%20HCR%20reside%20%28the%20three%20levels%29%3A%0A%0A%0AThe%20banking%20analogy%20and%20its%20limits%3A%0A%0A%0AThe%20four%20propositions%3A%0A%0A%0AWhen%20the%20teams%E2%80%99%20needs%20are%20likely%20to%20converge%3A%0A%0A%0ATitle%3A%0A%0A\">Send your thoughts by email<\/a><span class=\"bk-mail\">h.j.van.de.brake@rug.nl<\/span><\/div><\/div><\/div>", "details": {"c_mtm": {"kicker": "Theoretical contributions", "title": "Contribution to research on multiple team membership", "blocks": [{"heading": "Sudden failure after long success", "text": "We expect the theory to explain why sharing a multiteamer can work well for a long time and then fail suddenly. Successful employees tend to work in more teams {{margolis20}} {{brake18}}, and the theory explains what this concentration means for the other teams that rely on them."}, {"heading": "Costs without exhaustion", "text": "Because the theory locates shortfalls in the timing of the teams’ needs, it can also explain organizational costs of MTM without assuming that multiteamers become exhausted. This fits the finding that firm productivity was unrelated to employees’ average emotional exhaustion {{berger22}}, and it complements the explanation of firm-level effects of MTM through organizational social capital {{berger26}}."}]}, "c_hcr": {"kicker": "Theoretical contributions", "title": "Contribution to research on human capital resources", "blocks": [{"heading": "Where HCR reside", "text": "The theory proposes where HCR and their synergies reside when unit membership is not stable. The KSAOs reside in the multiteamer, the synergies arise in the teams that hold claims on this person, and the organization realizes them only as far as it can honor all claims together."}, {"heading": "Timing and access", "text": "By adding timing to the accessibility of human capital {{ployhart14}}, the theory extends HCR emergence theory beyond a single unit {{ray23e}}, as a multiteamer’s KSAOs count toward a team’s HCR only in the weeks in which the team can actually access them."}]}, "c_us": {"kicker": "Next steps", "title": "Our three lines of work", "blocks": [{"heading": "Who brings what", "text": "Caitlin developed HCR emergence theory and studied how internal mobility moves HCR between units {{ray23e}} {{ray26}}, and Saleem studies how employees combine a permanent team with project teams and when they leave the organization {{mistry23}}. My own work examines how MTM develops over time and what it means for firms as a whole {{brake18}} {{brake24}} {{berger22}} {{berger26}}."}]}}}]}</script>
<script>
/* ---------- data and helpers ---------- */
const DECK=JSON.parse(document.getElementById('deck').textContent),M=DECK.meta||{};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SRC={};(DECK.sources||[]).forEach((s,i)=>SRC[s.id]=Object.assign({number:i+1},s));
const cite=t=>esc(t).replace(/\{\{([^}]+)\}\}/g,(_,id)=>SRC[id]?`<button class="cite" data-src="${esc(id)}">[${SRC[id].number}]</button>`:'');
const plain=t=>String(t||'').replace(/\{\{[^}]+\}\}/g,'').replace(/\s+([.,])/g,'$1').trim();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LEVELS=(M.scale_labels)||['Small','Moderate','Large','Very large'];
const DEFCAT={opportunity:{label:'Opportunity',color:'#9fcfb0',light:'#cfe6d6',ink:'#1d5a3d'},mixed:{label:'Mixed',color:'#ecd27c',light:'#f6e5ad',ink:'#6a4d0c'},risk:{label:'Risk',color:'#e4a294',light:'#f2cdc5',ink:'#8a2b1d'}};
const DET=[];const det=o=>{if(!o)return '';DET.push(o);return ` data-det="${DET.length-1}"`;};
const byId={};(DECK.scenes||[]).forEach((s,i)=>{s.id=s.id||'s'+i;byId[s.id]=s;});
if(M.logo)$('#logo').src=M.logo;$('#logo').alt=M.logo_alt||'';document.title=M.title||'Presentation';
$('#tools').innerHTML=`<span class="ttl">${esc(M.title||'')}</span>${(DECK.readings||[]).map(r=>`<button data-reading="${esc(r.id)}">${esc(r.label)}</button>`).join('')}${(DECK.sources||[]).length?'<button id="srcBtn">Sources</button>':''}<button id="fsBtn">Present</button>`;

/* ---------- scene renderers ---------- */
const R={};
const head=(s,big)=>`${s.kicker?`<div class="kick reveal">${esc(s.kicker)}</div>`:''}<h2 class="reveal d1">${esc(s.title)}</h2>${s.lead?`<p class="${big?'statement':'lead'} reveal d2">${cite(s.lead)}</p>`:''}`;
const more=l=>l?`<button class="more reveal d5" data-reading="${esc(l.reading)}" data-chapter="${esc(l.chapter||'')}">${esc(l.label)}</button>`:'';
const xlegend=t=>`<div class="xlegend reveal d4"><b style="color:var(--ink);font-weight:600">${esc(t)}</b>${[1,2,3,4].map(l=>`<span><i class="x${l}"></i>${esc(LEVELS[l-1])}</span>`).join('')}<span class="hint" style="margin-left:auto">Click any part for the explanation and sources.</span></div>`;
R.hero=s=>{const t=esc(s.title||M.title||'');const br=s.break_before?t.replace(' '+esc(s.break_before),'<br>'+esc(s.break_before)):t;const brk=s.emphasis?br.replace(esc(s.emphasis),`<em>${esc(s.emphasis)}</em>`):br;
 const f=s.footnote;const [fa,fb]=f?f.text.split('[[link]]'):['',''];
 return `${s.constellation!==false&&(DECK.sources||[]).length?'<canvas id="stars" aria-hidden="true"></canvas>':''}<div class="hero-text">${s.kicker?`<div class="kick reveal">${esc(s.kicker)}</div>`:''}<h1 class="reveal d1">${brk}</h1>${s.subtitle?`<p class="hero-sub reveal d2">${esc(s.subtitle)}</p>`:''}${s.meta?`<p class="hero-meta reveal d2">${esc(s.meta)}</p>`:''}<button class="start reveal d3" data-go="1">${esc(s.button||'Begin')} <span aria-hidden="true">↓</span></button><div class="legendline reveal d4" id="legend"></div></div>${f?`<p class="foot">${esc(fa)}${f.link?`<a href="${esc(f.link.url)}" target="_blank" rel="noopener">${esc(f.link.text)}</a>`:''}${esc(fb||'')}</p>`:''}`;};
R.story=s=>`${s.kicker?`<div class="kick reveal">${esc(s.kicker)}</div>`:''}<h2 class="reveal d1">${esc(s.title)}</h2><div class="two"><div>${s.lead?`<p class="lead reveal d2">${cite(s.lead)}</p>`:''}${s.card?`<div class="card reveal d3" style="margin-top:28px"><div class="kick">${esc(s.card.label)}</div><p>${cite(s.card.text)}</p></div>`:''}</div><div>${s.steps_label?`<div class="kick reveal d2" style="color:var(--navy);margin-top:6px">${esc(s.steps_label)}</div>`:''}<div class="journey">${(s.steps||[]).map((it,k)=>`<button class="step reveal d${Math.min(k+2,5)}" data-n="${k+1}" ${it.goto?`data-goid="${esc(it.goto)}"`:''}><span>${cite(it.text)}</span></button>`).join('')}</div></div></div>`;
R.cards=s=>`${head(s,true)}${s.label?`<div class="kick reveal d2" style="color:var(--navy);margin-top:4px">${esc(s.label)}</div>`:''}<div class="ncards" style="grid-template-columns:repeat(${(s.cards||[]).length},1fr)">${(s.cards||[]).map((c,k)=>`<div class="ncard reveal d${Math.min(k+2,5)}"${c.details?det(c.details)+' role="button" tabindex="0" style="cursor:pointer"':''}>${s.numbered===false?'':`<div class="n">${k+1}</div>`}<h3>${esc(c.title)}</h3><p>${cite(c.text)}</p></div>`).join('')}</div>`;
R.figures=s=>{const items=s.items||[];if(s.layout==='columns')return `${head(s)}<div class="figs" style="grid-template-columns:repeat(${items.length},1fr)">${items.map((g,k)=>`<div class="figi reveal d${Math.min(k+2,5)}"><div class="fig" data-fig="${esc(g.figure)}">${esc(g.figure)}</div><h3>${esc(g.label)}</h3><p>${cite(g.text)}</p>${g.note?`<div class="note"><b>${esc(s.note_label||'')}</b><p>${cite(g.note)}</p></div>`:''}</div>`).join('')}</div>`;
 return `${head(s)}<div class="figrows">${items.map((g,k)=>`<div class="rowi reveal d${Math.min(k+2,5)}"><div><div class="fig" data-fig="${esc(g.figure)}">${esc(g.figure)}</div><h3>${esc(g.label)}</h3></div><p>${cite(g.text)}</p>${g.note?`<div class="note"><b>${esc(s.note_label||'')}</b><p>${cite(g.note)}</p></div>`:'<div></div>'}</div>`).join('')}</div>`;};
R.overview=s=>{const it=s.items||[],r=s.result;let glyph='';if(r&&r.glyph){const H=byId[r.glyph.scene];if(H){const rows=H.rows.filter(x=>!r.glyph.group||x.group===r.glyph.group);glyph=`<span class="glyph" style="--cols:${H.cols.length}">${rows.map((row,ri)=>H.cols.map((c,ci)=>{const cell=H.cells[row.key+'|'+c.key]||{};const cat=catOf(H,cell.category);return `<i style="background:${cellColor(H,cell)};transition-delay:${1.5+(ri*H.cols.length+ci)*.06}s"></i>`;}).join('')).join('')}</span>`;}}
 const cols=[];it.forEach((x,k)=>{if(k)cols.push('40px');cols.push('1fr');});if(r){cols.push('56px','1.1fr');}
 return `${head(s)}<div class="ovw" style="grid-template-columns:${cols.join(' ')}">${it.map((d,k)=>`${k?'<div class="op">+</div>':''}<button class="part" ${d.goto?`data-goid="${esc(d.goto)}"`:''} style="--k:${k}"><span class="pn">${k+1}</span><b>${esc(d.title)}</b><span>${cite(d.text)}</span></button>`).join('')}${r?`<div class="op">→</div><button class="part result" ${r.goto?`data-goid="${esc(r.goto)}"`:''} style="--k:${it.length}">${glyph}<b>${esc(r.title)}</b><span>${cite(r.text||'')}</span></button>`:''}</div>`;};
R.path=s=>{const it=s.steps||[],n=it.length,W=1200,H=232,Y=146,xs=it.map((x,i)=>(i+.5)*W/n),rs=it.map(x=>24+x.level*9);
 const LIGHT={1:'#ffffff',2:'#e6edf6',3:'#b7c9e0',4:'#7393c0'},BASE={1:'#edf1f6',2:'#c8d5e5',3:'#88a3c6',4:'#43679a'};
 const grads=[1,2,3,4].map(l=>`<radialGradient id="sg${l}${s.id}" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="${LIGHT[l]}"/><stop offset="1" stop-color="${BASE[l]}"/></radialGradient>`).join('');
