riteria"}, "role_source_ids": ["S09-015", "S09-016"], "limits": "The assessment concerns preparation of an integrative-review corpus, not the validity of its synthesis. Pure theory has no empirical data-acquisition task.", "supported_rating": "opportunity", "supported_reason": "With help from FEB, the review team could sample excluded studies and compare the main extractions with the original papers. With those checks, the team can improve the corpus on which the synthesis rests, although the checks cannot show that the later interpretation is right. {{S07-20}}", "supported_headline": "Excluded studies sampled for omissions", "task_scope": "For integrative reviews, AI assembles, deduplicates and extracts information from a source corpus; the researcher checks omissions, inclusion decisions and extraction. Pure theory has no empirical data-acquisition task."}, {"id": "senior-theory_review-analysis", "cohort": "senior", "research_type": "theory_review", "stage": "analysis", "rating": "risk", "headline": "Persuasive mechanisms with untested steps", "summary": "When AI develops derivations, mechanisms, or syntheses of studies, the authors test each proposed inference against the premises and the original sources. {{S13-306}}{{S13-305}}", "paragraphs": ["When a professor accepts a proposed mechanism, collaborators may use it in several manuscripts. {{S09-015}}{{S09-016}} The professor’s check should therefore concentrate on the step that links the premises or studies to the new claim, and less on how clearly the generated prose reads."], "opportunity": "The professor may use the rival mechanisms and connections between studies that AI suggests to find the places where the argument still needs work.", "risk": "An explanation that reads convincingly may depend on an invalid derivation or combine studies that do not support the proposed conclusion.", "support": "Before the team develops the argument further, a specialist could examine whether each step follows from the model’s assumptions or from the cited studies.", "rating_reason": "Once AI has turned the central inference into a complete narrative, the professor may find that inference hard to inspect. Cornelissen cautions against explanations that are fitted after the pattern is known. {{S13-301}} A formal derivation needs to be checked against its premises, and a review synthesis against the studies it combines. {{S13-306}}{{S13-305}}", "conditions": ["The decisive premises and source passages can be inspected.", "The literature comparison can be traced to the original passages."], "applicability": "Applicable to conceptual reasoning and non-statistical literature synthesis.", "evidence_strength": "methodological", "source_ids": ["S13-301", "S13-306", "S13-305", "S09-015", "S09-016"], "source_locators": {"S13-301": "Cornelissen local accepted manuscript PDF pp. 6–8 (manuscript pp. 5–7)", "S13-306": "Makadok original PDF pp. 193–198, formal assumptions and derivations", "S13-305": "Elsbach and van Knippenberg original PDF pp. 1277–1279, 1287–1288", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}, "role_source_ids": ["S09-015", "S09-016"], "limits": "The cited conceptual and methodological sources identify failure modes but do not measure AI theory-analysis quality or FEB senior outcomes.", "supported_rating": "mixed", "supported_reason": "Another specialist, arranged through FEB, could test each decisive step against the assumptions or the original passages and so expose weak links in the argument. The authors, however, have to defend the theoretical claim themselves, and a well-organised map of sources cannot do that for them. {{S13-306}}", "supported_headline": "Decisive steps checked against premises and sources", "task_scope": "AI develops candidate derivations, mechanisms or a synthesis of studies; the researcher tests their validity, counterexamples and contribution against premises and sources."}, {"id": "senior-theory_review-writing", "cohort": "senior", "research_type": "theory_review", "stage": "writing", "rating": "mixed", "headline": "Polished theory drafts that need close reading", "summary": "The authors check the argument behind the wording of sections and reviewer replies that AI drafts from the team’s premises and sources. {{S13-301}}{{S06-020}}", "paragraphs": ["In an audit at one journal, manuscripts with high AI-detector scores did worse on writing measures, although the audit did not isolate a causal effect of AI use. {{S06-020}} Beyond their own papers, professors may also mentor collaborators through the theoretical choices made in a draft. {{S09-015}}{{S09-016}}"], "opportunity": "AI can draft a sustained explanation and organise a response to reviewers, and the professor can compare that text with the argument the authors intend to make.", "risk": "A polished section can still contain a weak construct or an unsupported citation, and collaborators may repeat that error in later drafts.", "support": "An independent colleague could read the manuscript with a template that links each claim to its sources and so test the paper’s main theoretical move before the professor submits it.", "rating_reason": "Guidance on formal theory asks authors to state their assumptions and reasoning clearly. {{S13-306}} When AI produces a full section, the professor therefore has to check whether each theoretical move follows from the stated premises and the cited studies, and any gain from AI drafting depends on that review.", "conditions": ["The authors can state and defend the premises and intended contribution independently.", "The cited original studies are available for checking passages."], "applicability": "Applicable to conceptual papers, non-statistical literature reviews, and their peer-review exchanges.", "evidence_strength": "adjacent", "source_ids": ["S13-306", "S13-301", "S06-020", "S09-015", "S09-016"], "source_locators": {"S13-306": "Makadok original PDF pp. 193–198, argument accessibility", "S13-301": "Cornelissen local accepted manuscript PDF pp. 5–8 (manuscript pp. 4–7)", "S06-020": "Organization Science original PDF pp. 5–10, 13–14 and p. 19 endnote 8", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}, "role_source_ids": ["S09-015", "S09-016"], "limits": "The journal observation and citation audit do not quantify causal AI effects on FEB senior writing.", "supported_rating": "opportunity", "supported_reason": "FEB could give authors a record that links each claim to its sources and arrange for a colleague to read the central inference. With that support, AI drafting may become more useful to the professor, who remains responsible with the co-authors for the paper’s contribution and the replies to reviewers. {{S13-306}}", "supported_headline": "Claim-to-source record for theory drafts", "task_scope": "AI drafts substantial manuscript sections or reviewer responses from the researchers' premises, sources and outline; the researchers assess whether the resulting argument and contribution are defensible."}], "sources": {"S01-001": {"source_id": "S01-001", "subproject": "01", "title": "Strategic Plan Faculty of Economics and Business 2026–2031", "authors_or_body": "Faculty of Economics and Business, University of Groningen", "publication_date": "2026-09", "version": "September 2026", "source_type": "institutional_strategy", "doi": "", "url": "https://www.rug.nl/feb/organization/governance/strategic-plan-feb-2026-2031.pdf", "checked_date": "2026-10-04", "verification_level": "passage_checked", "policy_status": "Officially published on FEB site; separate faculty-board approval record not located", "scope_or_access_limits": "Research, AI, careers, funding and organization chapters re results.", "provenance_note": "Nature primary record corrects nonbibliographic local filename title.", "number": 79, "locator": "Nature 653, 675–676. Comment, not a direct test of doctoral learning."}, "S13-305": {"source_id": "S13-305", "subproject": "13", "title": "Creating High-Impact Literature Reviews: An Argument for 'Integrative Reviews'", "authors_or_body": "Kimberly D. Elsbach; Daan van Knippenberg", "publication_date": "2020-05-11", "version": "Version of record; Journal of Management Studies 57(6):1277-1289; issue 2020-09", "source_type": "academic_point_counterpoint_methodology", "doi": "10.1111/joms.12581", "url": "https://onlinelibrary.wiley.com/doi/10.1111/joms.12581", "checked_date": "2026-10-04", "verification_level": "full_text_reviewed", "policy_status": "", "scope_or_access_limits": "Original article pp. 1277-1288 inspected. Argument about integrative-review practice; illustrative high-citation selection is not a universal journal rule.", "provenance_note": "Wiley primary record confirms date, DOI, article type and issue pages; original local PDF checked.", "number": 67, "locator": "Journal of Management Studies 57(6), 1277–1289. Integrative-review methodology and argument."}, "S13-306": {"source_id": "S13-306", "subproject": "13", "title": "Guidance for AMR Authors about Making Formal Theory Accessible", "authors_or_body": "Richard Makadok", "publication_date": "2022-02-16", "version": "Academy of Management Review 47(2):193-205; April 2022 issue", "source_type": "journal_editorial_formal_theory_guidance", "doi": "10.5465/amr.2022.0060", "url": "https://journals.aom.org/doi/10.5465/amr.2022.0060", "checked_date": "2026-10-04", "verification_level": "full_text_reviewed", "policy_status": "", "scope_or_access_limits": "Original pp. 193-204 inspected. AMR editor guidance on formal models; do not impose as rule for economics or all FEB outlets.", "provenance_note": "AOM primary record confirms identity and original PDF checked.", "number": 65, "locator": "Academy of Management Review 47(2), 193–205. Editorial guidance on formal theory."}, "S13-307": {"source_id": "S13-307", "subproject": "13", "title": "Artificial Intelligence-Powered (Finance) Scholarship", "authors_or_body": "Robert Novy-Marx; Mihail Velikov", "publication_date": "2026-03", "version": "Journal of Economic Literature 64(1):5-37", "source_type": "peer_reviewed_finance_demonstration", "doi": "10.1257/jel.20251821", "url": "https://www.aeaweb.org/articles?id=10.1257/jel.20251821", "checked_date": "2026-10-04", "verification_level": "passage_checked", "policy_status": "", "scope_or_access_limits": "AEA publisher abstract and citation only; full text requires access. Hundreds of generated papers and alternative justifications are author-reported demonstration, not evidence of actual journal submission or acceptance.", "provenance_note": "AEA primary article record/abstract checked; local full text unavailable.", "number": 108, "locator": ""}, "S13-401": {"source_id": "S13-401", "subproject": "13", "title": "American Economic Review Editorial Policy", "authors_or_body": "American Economic Association", "publication_date": "", "version": "page checked 2026-10-04", "source_type": "journal_editorial_policy", "doi": "", "url": "https://www.aeaweb.org/journals/aer/editorial-policy", "checked_date": "2026-10-04", "verification_level": "passage_checked", "policy_status": "journal_policy", "scope_or_access_limits": "AER-specific; AEA-wide data/code and RCT provisions apply where relevant; not a general economics quality rubric", "provenance_note": "Official AEA page; peer review, breadth/audience, data/code, AI and RCT passages checked", "number": 5, "locator": ""}, "S13-402": {"source_id": "S13-402", "subproject": "13", "title": "Econometrica Aims and Scope", "authors_or_body": "Econometric Society; Wiley", "publication_date": "", "version": "page checked 2026-10-04", "source_type": "journal_scope", "doi": "", "url": "https://onlinelibrary.wiley.com/page/journal/14680262/homepage/aims.htm", "checked_date": "2026-10-04", "verification_level": "passage_checked", "policy_status": "journal_scope", "scope_or_access_limits": "Publisher description; not an empirical study of acceptance or paper forms", "provenance_note": "Official publisher page: theoretical/empirical, abstract/applied, rigorous quantitative scope checked", "number": 6, "locator": ""}, "S13-403": {"source_id": "S13-403", "subproject": "13", "title": "Journal of Economic Literature Editorial Policy", "authors_or_body": "American Economic Association", "publication_date": "", "version": "page checked 2026-10-04", "source_type": "journal_editorial_policy", "doi": "", "url": "https://www.aeaweb.org/journals/jel/editorial-policy", "checked_date": "2026-10-04", "verification_level": "passage_checked", "policy_status": "journal_policy", "scope_or_access_limits": "JEL analytic-guide and review-essay scope; many guides commissioned; not all economics reviews", "provenance_note": "Official AEA page: philosophy/style, synthesis and audience passages checked", "number": 7, "locator": ""}}, "report_html": "<h1 id=\"sec-ai-and-the-future-of-research-at-feb\">AI and the future of research at FEB<\/h1>\n<p><em>Working report for the Faculty of Economics and Business, University of Groningen, 4 October 2026<\/em><\/p>\n<h2 id=\"sec-summary\">Summary<\/h2>\n<p>FEB’s research aims provide a clear starting point for its plan for AI in research. The faculty wants to sustain high-quality research and strengthen its societal impact while protecting the time available for research.<button class=\"citation\" data-source=\"S01-001\" aria-label=\"Source 1\">[1]<\/button> AI could help researchers pursue questions that were previously too demanding, examine competing explanations more thoroughly, or spend less time preparing data and other material. Whether such help improves research depends on how researchers use AI and how they assess its output.<\/p>\n<p>This report examines how the use and assessment of AI can differ along three dimensions. The research cycle distinguishes activities such as developing a question, obtaining evidence, analysing results, and writing a paper. Research form distinguishes Quantitative, Qualitative, and Theory/Review work, whose methods require different checks. Researcher position, from doctoral candidate to full professor, identifies differences in learning, independent research, and supervision. These dimensions are connected, because reviewing an AI-generated analysis, for example, has a different purpose for a doctoral candidate learning the method than for a professor supervising several projects.<\/p>\n<p>Studies of AI-assisted work give reason to expect substantial benefits in some research tasks, but also to distinguish the quality of what researchers produce with AI from their understanding of it. AI-generated code may reproduce a table without revealing a flaw in the study design, and a literature summary may read well and still overlook studies that challenge its conclusion. When doctoral candidates delegate such work, they may have fewer opportunities to develop research judgement. Experienced researchers, by contrast, may gain time for difficult decisions but have more work to check. These differences between career groups are conditional implications for FEB and have not been measured among its researchers.<\/p>\n<p>FEB should therefore begin by supporting AI use in a limited set of research projects across methods and career positions. The participating teams should evaluate the quality of the completed work, the total effort including checking and supervision, and what researchers can explain independently afterwards. FEB’s working group on AI in research can then use those evaluations to recommend shared tools and support, identify where doctoral training needs a different approach, and judge whether faster work leaves time for better research.<\/p>\n<h2 id=\"sec-introduction\">Introduction<\/h2>\n<p>Researchers at FEB can increasingly ask AI systems to search papers, write analysis code, comment on a manuscript, or prepare a grant proposal. The faculty’s September 2026 strategic plan calls for a research AI plan in 2026–2027 and recognises that training and tools will cost time and money before any efficiency gains are realised.<button class=\"citation\" data-source=\"S01-001\" aria-label=\"Source 1\">[1]<\/button> The practical question is which uses of AI the faculty should support, because the same assistance may improve one part of a project but make another harder to assess.<\/p>\n<p>To answer that question, the report begins with FEB’s research aims and the evidence on how research practice is changing. Its main chapters then examine the three dimensions, namely the research cycle, research form, and researcher position, and explain which work AI may change and why the consequences could differ. The final chapters bring the dimensions together in scenarios for FEB and recommendations for the working group. Throughout, the report asks how AI could improve research and where researchers need support so that AI use does not weaken the evidence for their claims, their understanding of their work, or doctoral training.<\/p>\n<h2 id=\"sec-1-research-at-feb-and-the-development-of-ai\">1. Research at FEB and the development of AI<\/h2>\n<h3 id=\"sec-research-quality-and-impact\">Research quality and impact<\/h3>\n<p>The strategic plan describes what FEB means by strong research and how the faculty intends to measure it. FEB wants to remain a leading international research institution in economics and business in Europe and to obtain an excellent result in the 2027 national research evaluation. Its indicators of high-quality research are the average research output per FTE, the average number of publications per FTE in top economics and business journals, and the research evaluation itself, and funding from prestigious grants should rise each year to 20% above the 2023–2025 average by 2031. Even if staff numbers fall, the plan seeks to keep research and impact time per research-active employee broadly stable and to maintain the average quantity and quality of output per researcher.<button class=\"citation\" data-source=\"S01-001\" aria-label=\"Source 1\">[1]<\/button> These aims and indicators raise the question of how researchers will use any time that AI saves. A researcher might examine a more demanding explanation or develop a distinctive dataset, but could also be expected to produce more papers before FEB knows what it costs to check AI-assisted work.<\/p>\n<p>The plan also recognises contributions whose value is not captured by publication volume. Societal impact, for example, concerns changes in business and management, public policy, and society, and preparing a competitive grant can reduce near-term publication output but support later research.<button class=\"citation\" data-source=\"S01-001\" aria-label=\"Source 1\">[1]<\/button> FEB should therefore assess an AI programme by the research it helps a team undertake and the use others can make of that research. A grant application or report that AI has polished offers little benefit if the proposed study is unconvincing or if the report’s findings do not address the intended problem.<\/p>\n<p>In practice, FEB recognises publications in top journals by the standing of the journal. The plan does not define its top-journal indicator in terms of a metric, but FEB’s career and research-time rules use the Article Influence Score Percentile (AIP), which locates a journal’s Article Influence Score within the combined SSCI and SCIE journal distribution as a moving five-year average.<button class=\"citation\" data-source=\"S01-004\" aria-label=\"Source 2\">[2]<\/button> For new hires on the Research Profile, the Career Tracks document treats publications in journals with an AIP of at least 95 as indicative of high-quality work in specified assistant-to-associate promotion routes, alongside originality, rigour, grants, and other contributions.<button class=\"citation\" data-source=\"S01-002\" aria-label=\"Source 3\">[3]<\/button> FEBRI also uses <code>(AIP/100)²<\/code> as the journal-score component of the publication credits that help determine research time, so that these credits rise steeply with the standing of the journal.<button class=\"citation\" data-source=\"S01-004\" aria-label=\"Source 2\">[2]<\/button> AIP describes the journal, however, and cannot establish whether an individual paper uses a valid measure, identifies the effect it claims, or develops an original explanation. Citation performance also varies considerably between articles in the same journal.<button class=\"citation\" data-source=\"S02-009\" aria-label=\"Source 4\">[4]<\/button><\/p>\n<p>The journals themselves ask authors to make different kinds of contribution. The <em>American Economic Review<\/em> seeks work of broad interest to economists,<button class=\"citation\" data-source=\"S13-401\" aria-label=\"Source 5\">[5]<\/button> and <em>Econometrica<\/em> includes theoretical and empirical research with rigorous quantitative reasoning,<button class=\"citation\" data-source=\"S13-402\" aria-label=\"Source 6\">[6]<\/button> whereas the <em>Journal of Economic Literature<\/em> guides readers through selected bodies of economic scholarship.<button class=\"citation\" data-source=\"S13-403\" aria-label=\"Source 7\">[7]<\/button> In management, the <em>Academy of Management Journal<\/em> publishes empirical work across methods,<button class=\"citation\" data-source=\"S07-03\" aria-label=\"Source 8\">[8]<\/button> the <em>Academy of Management Review<\/em> centres on conceptual theory,<button class=\"citation\" data-source=\"S07-22\" aria-label=\"Source 9\">[9]<\/button> and the <em>Academy of Management Annals<\/em> publishes integrative reviews.<button class=\"citation\" data-source=\"S07-23\" aria-label=\"Source 10\">[10]<\/button> These differences between journals help explain why researchers cannot judge AI’s contribution to a paper from the quality of its prose or the success of its computations alone.<\/p>\n<table>\n<thead>\n<tr>\n<th>Research quality<\/th>\n<th>Possible AI assistance<\/th>\n<th>What researchers need to establish<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Question and argument<\/td>\n<td>Compare questions and alternative explanations.<\/td>\n<td>The study adds to what readers understand.<\/td>\n<\/tr>\n<tr>\n<td>Evidence and design<\/td>\n<td>Find sources, draft measures, and compare designs.<\/td>\n<td>The evidence and design support the intended claim.<\/td>\n<\/tr>\n<tr>\n<td>Analysis<\/td>\n<td>Generate code, simulations, and additional checks.<\/td>\n<td>The measures, assumptions, and calculations are sound.<\/td>\n<\/tr>\n<tr>\n<td>Interpretation and reuse<\/td>\n<td>Clarify explanations and document decisions.<\/td>\n<td>Conclusions follow from the evidence, and others can inspect the work.<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><em>Table 1. Research standards for assessing AI assistance. The middle column lists possible uses for FEB projects to evaluate.<\/em><button class=\"citation\" data-source=\"S06-004\" aria-label=\"Source 11\">[11]<\/button><button class=\"citation\" data-source=\"S08-009\" aria-label=\"Source 12\">[12]<\/button><button class=\"citation\" data-source=\"S06-010\" aria-label=\"Source 13\">[13]<\/button><\/p>\n<h3 id=\"sec-ai-in-feb-s-strategic-plan\">AI in FEB’s strategic plan<\/h3>\n<p>The strategic plan treats AI as a disruptive technology that affects what FEB studies as well as how its researchers work. For research, the plan expects AI to make the Digital and AI theme more prevalent and to change what is studied in disciplinary fields, and FEB aims to be at the forefront of these developments, partly by benefiting from investments in the AI Factory in Groningen. The plan also asks the research organisation to consider carefully how AI can support the execution of research, and it gives the research directors the task of developing a plan, together with internal experts and front-runners, on how FEB should use AI effectively, with a completed plan as its indicator for 2026–2027.<button class=\"citation\" data-source=\"S01-001\" aria-label=\"Source 1\">[1]<\/button><\/p>\n<p>The plan connects these ambitions to investment and responsibility. FEB intends to invest in the AI competencies of its staff together with UG, and it expects the costs of training and tools to precede any long-term efficiency gains. The plan also names responsible and ethical use, digital sovereignty, energy consumption, and the risk that AI increases existing inequalities as questions that the faculty needs to address. Its expectations of lower workload and cost savings concern mainly education and support, for example AI-assisted grading and pilots in student support and admissions.<button class=\"citation\" data-source=\"S01-001\" aria-label=\"Source 1\">[1]<\/button> For research, the more pressing question is therefore how AI can contribute to the quality and impact that the plan values.<\/p>\n<p>Researchers could use AI to contribute to each of these criteria in a different way. For publications in top journals, AI may help a team test alternative explanations, run robustness checks that it could not otherwise afford, and search a literature that spans economics and several business fields, provided that the researchers check the generated code and the completeness of the sources.<button class=\"citation\" data-source=\"S06-002\" aria-label=\"Source 14\">[14]<\/button><button class=\"citation\" data-source=\"S08-009\" aria-label=\"Source 12\">[12]<\/button><button class=\"citation\" data-source=\"S08-017\" aria-label=\"Source 15\">[15]<\/button> For grant applications, AI can help researchers compare a draft with a funder’s call and develop alternative designs, although a proposal becomes stronger only when its design and plan improve. For societal impact, AI may help researchers translate findings for partners and analyse partner documents within the data agreement, but impact still depends on whether the findings address the partner’s problem. The chapters that follow examine where such contributions are likely and where researchers need support to realise them.<\/p>\n<h3 id=\"sec-scope-across-departments\">Scope across departments<\/h3>\n<p>AI is relevant across FEB’s seven departments, although its effects need not be equally large.<button class=\"citation\" data-source=\"S01-006\" aria-label=\"Source 16\">[16]<\/button> Publication examples show that methods vary within departments as well as between them. Marketing researchers use both synthetic data and focus groups,<button class=\"citation\" data-source=\"S11-003\" aria-label=\"Source 17\">[17]<\/button><button class=\"citation\" data-source=\"S11-004\" aria-label=\"Source 18\">[18]<\/button> and operations researchers develop formal optimisation models and qualitative studies of logistics.<button class=\"citation\" data-source=\"S11-007\" aria-label=\"Source 19\">[19]<\/button><button class=\"citation\" data-source=\"S11-008\" aria-label=\"Source 20\">[20]<\/button> The examples come from a dashboard of the faculty’s publications, but most papers in it have not been classified by method, and the examples are a small purposive sample.<button class=\"citation\" data-source=\"S02-001\" aria-label=\"Source 21\">[21]<\/button><button class=\"citation\" data-source=\"S02-002\" aria-label=\"Source 22\">[22]<\/button> They support involving all departments but cannot support a departmental ranking of AI opportunities or risks. The report therefore compares research activities, forms, and positions across the faculty.<\/p>\n<h3 id=\"sec-from-statistical-software-to-research-assistants\">From statistical software to research assistants<\/h3>\n<p>Across these research activities, AI may change both the time a task requires and the questions researchers can investigate, much as earlier research software did. Statistical packages broadened access to estimation and simulation, and computers allowed economists to examine questions that would have been prohibitively expensive to calculate by hand.<button class=\"citation\" data-source=\"S04-003\" aria-label=\"Source 23\">[23]<\/button><button class=\"citation\" data-source=\"S04-004\" aria-label=\"Source 24\">[24]<\/button> Researchers still had to understand the computation, however, and concerns about the numerical reliability of econometric software were documented in the 1990s.<button class=\"citation\" data-source=\"S04-016\" aria-label=\"Source 25\">[25]<\/button> Generative AI extends this development to language and reasoning tasks, and AI agents can search files, run code, and revise their work in response to instructions.<\/p>\n<p>The growth of the literature makes such assistance attractive. In Thelwall and Sud’s historical Scopus data, the number of indexed journal articles rises from approximately 111,000 in 1950 to 2.57 million in 2020.<button class=\"citation\" data-source=\"S04-009\" aria-label=\"Source 26\">[26]<\/button> Changes in database coverage explain part of this increase, so the series cannot establish how much computing caused publication to grow. The figures nevertheless show the scale of the literature researchers now have to search and read. Assistance with finding and comparing papers could be valuable, particularly when a question spans economics and several business disciplines.<\/p>\n<img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAACZAAAAcgCAYAAABDZvHGAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAk6QAAJOkBUCTn+AABAABJREFUeJzs3Qd0FFUXwPELKZCE0HvvvfeOiIINRQXFhth7QT97xV6w946KBUFRQJCm0nuH0HuvIQkJIQT4zn24IWVrdrKZzf5/5+zJJjs7O3n75u3svDv3Fjp9+vRpAQAAAAAAAAAAAAAAAACEnML5vQEAAAAAAAAAAAAAAAAAgPxBABkAAAAAAAAAAAAAAAAAhCgCyAAAAAAAAAAAAAAAAAAgRBFABgAAAAAAAAAAAAAAAAAhigAyAAAAAAAAAAAAAAAA
