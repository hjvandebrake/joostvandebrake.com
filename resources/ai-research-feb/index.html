AAAAAAAAAAAAZFMEkAEAAAAAAAAAAAAAAABANkUAGQAAAAAAAAAAAAAAAABkUwSQAQAAAAAAAAAAAAAAAEA2RQAZAAAAAAAAAAAAAAAAAGRTBJABAAAAAAAAAAAAAAAAQDZFABkAAAAAAAAAAAAAAAAAZFMEkAEAAAAAAAAAAAAAAABANkUAGQAAAAAAAAAAAAAAAABkUwSQAQAAAAAAAAAAAAAAAEA2RQAZAAAAAAAAAAAAAAAAAGRTBJABAAAAAAAAAAAAAAAAQDZFABkAAAAAAAAAAAAAAAAAZFMEkAEAAAAAAAAAAAAAAABANkUAGQAAAAAAAAAAAAAAAABkUwSQAQAAAAAAAAAAAAAAAEA2RQAZAAAAAAAAAAAAAAAAAGRTBJABAAAAAAAAAAAAAAAAQDZFABkAAAAAAAAAAAAAAAAAZFMEkAEAAAAAAAAAAAAAAABANkUAGQAAAAAAAAAAAAAAAABkUwSQAQAAAAAAAAAAAAAAAEA2RQAZAAAAAAAAAAAAAAAAAGRTBJABAAAAAAAAAAAAAAAAQDZFABkAAAAAAAAAAAAAAAAAZFMEkAEAAAAAAAAAAAAAAABANkUAGQAAAAAAAAAAAAAAAABkUwSQAQAAAAAAAAAAAAAAAEA2RQAZAAAAAAAAAAAAAAAAAGRTBJABAAAAAAAAAAAAAAAAQDZFABkAAAAAAAAAAAAAAAAAZFMEkAEAAAAAAAAAAAAAAABANkUAGQAAAAAAAAAAAAAAAABkUwSQAQAAAAAAAAAAAAAAAEA2RQAZAAAAAAAAAAAAAAAAAGRTBJABAAAAAAAAAAAAAAAAQDZFABkAAAAAAAAAAAAAAAAAZFMEkAEAAAAAAAAAAAAAAABANkUAGQAAAAAAAAAAAAAAAACY7On//Go1G/rDgZgAAAAASUVORK5CYII=\" alt=\"Annual Scopus-indexed journal articles and changing abstract coverage, 1900–2020\">\n\n<p><em>Figure 1. Annual journal-article records in the historical Scopus data. The series reflects changes in database coverage as well as publication activity.<\/em><button class=\"citation\" data-source=\"S04-009\" aria-label=\"Source 26\">[26]<\/button><\/p>\n<p>Evidence from knowledge work shows, however, that the benefit depends on the task and the user’s ability to check the result. In Dell’Acqua and colleagues’ experiment, consultants using AI worked faster and produced higher-rated work on tasks within the tested system’s capability, but were less likely to reach the correct answer on a task outside it.<button class=\"citation\" data-source=\"S05-009\" aria-label=\"Source 27\">[27]<\/button> A coding study estimated, with substantial uncertainty, a time saving in one professional engineering setting,<button class=\"citation\" data-source=\"S05-010\" aria-label=\"Source 28\">[28]<\/button> whereas another found that experienced maintainers working on their own repositories completed tasks more slowly with AI.<button class=\"citation\" data-source=\"S05-011\" aria-label=\"Source 29\">[29]<\/button> Any comparison of research productivity therefore needs to include the time researchers spend inspecting and repairing generated work.<\/p>\n<p>Current AI systems can also perform demanding scientific tasks. In a specialist-refereed mathematics exercise, seven of ten previously undisclosed problems received at least one passing solution across the four tested systems, although the report on the exercise also describes unsupported steps and misleading references.<button class=\"citation\" data-source=\"S08-007\" aria-label=\"Source 30\">[30]<\/button> A system described in <em>Nature<\/em> helped write empirical scientific software for tasks whose results could be scored.<button class=\"citation\" data-source=\"S06-018\" aria-label=\"Source 31\">[31]<\/button> These results give researchers reason to reconsider which technical tasks they can delegate, but researchers still have to assess the quality of the complete research project. A model may be solved correctly, for example, even though its assumptions do not describe the problem, and a study’s table may be reproduced even though its design cannot support a causal claim.<\/p>\n<h2 id=\"sec-2-dimension-1-the-research-cycle\">2. Dimension 1: The research cycle<\/h2>\n<p>The first dimension concerns the stage of the research cycle, that is, the recurring work through which researchers develop a question into a claim that others can examine. Researchers read and frame a problem, design a way to investigate it, obtain or generate material, analyse that material, interpret the results, and communicate and revise the work. These activities are connected and frequently revisited, and the AMJ research canvas makes the relations among question, theory, design, and evidence visible without requiring every project to take the same route.<button class=\"citation\" data-source=\"S06-005\" aria-label=\"Source 32\">[32]<\/button> For a FEB researcher, the relevant issue is how assistance with one activity affects the reasoning and evidence used in the next, because a well-executed step may improve the project but may also carry forward a mistake introduced at an earlier step.<\/p>\n<p>The cycle changes with the type of work. An empirical economist may return to the research design after discovering that a proposed comparison does not identify the quantity of interest,<button class=\"citation\" data-source=\"S06-002\" aria-label=\"Source 14\">[14]<\/button> and a field researcher may adjust sampling and questions as observations reveal an unexpected process.<button class=\"citation\" data-source=\"S06-004\" aria-label=\"Source 11\">[11]<\/button> A conceptual scholar, by contrast, can revise premises after testing an implication without collecting new primary observations.<button class=\"citation\" data-source=\"S07-33\" aria-label=\"Source 33\">[33]<\/button> Authors of an integrative review obtain published studies as their evidence,<button class=\"citation\" data-source=\"S06-006\" aria-label=\"Source 34\">[34]<\/button> and authors of a statistical meta-analysis also extract and model the studies’ numerical results.<button class=\"citation\" data-source=\"S07-32\" aria-label=\"Source 35\">[35]<\/button> The six stages below therefore organise a comparison of research tasks without prescribing a sequence or assuming that every project acquires new data.<\/p>\n<table>\n<thead>\n<tr>\n<th>Research stage<\/th>\n<th>Work carried through the stage<\/th>\n<th>Where AI assistance can be examined<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Question and theory<\/td>\n<td>Specify the phenomenon, concepts, and intended contribution.<\/td>\n<td>Alternative explanations, construct distinctions, and counterexamples.<\/td>\n<\/tr>\n<tr>\n<td>Literature<\/td>\n<td>Find, select, read, and relate prior work.<\/td>\n<td>Discovery, screening, passage retrieval, and comparison.<\/td>\n<\/tr>\n<tr>\n<td>Design<\/td>\n<td>Choose the comparison, cases, model, or review procedure.<\/td>\n<td>Simulation, draft instruments, feasibility checks, and alternatives.<\/td>\n<\/tr>\n<tr>\n<td>Data and source material<\/td>\n<td>Obtain permitted material and prepare it for analysis.<\/td>\n<td>Retrieval, transcription, extraction, coding, and cleaning where applicable.<\/td>\n<\/tr>\n<tr>\n<td>Analysis and interpretation<\/td>\n<td>Produce results and decide what follows from them.<\/td>\n<td>Executable code, formal derivation, theme comparison, and error checks.<\/td>\n<\/tr>\n<tr>\n<td>Writing and review<\/td>\n<td>Explain, criticise, revise, and make the work reusable.<\/td>\n<td>Drafts, reviewer tracking, documentation, and source checks.<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><em>Table 2. Six recurring stages used to compare research tasks. A purely conceptual project has no empirical data-acquisition step. Reviews work with prior studies, and statistical meta-analyses also extract their results.<\/em><\/p>\n<h3 id=\"sec-questions-concepts-and-literature\">Questions, concepts, and literature<\/h3>\n<p>At the beginning of a project, AI can help a researcher explore unfamiliar terms, compare the language of neighbouring fields, or identify a paper that deserves reading. Help with terminology can be valuable when an economics concept and an organisation-studies concept describe related processes without using the same vocabulary. A researcher can also ask an assistant to compare explanations of a phenomenon and then inspect the cited work. Korinek illustrates these uses for economic research, and work on source-grounded literature systems shows that retrieval can improve answers that draw on several papers.<button class=\"citation\" data-source=\"S06-001\" aria-label=\"Source 36\">[36]<\/button><button class=\"citation\" data-source=\"S08-020\" aria-label=\"Source 37\">[37]<\/button> An exploratory conversation can be useful even if the researcher discards some of its suggestions, but a claim in a manuscript needs a stronger source trail.<\/p>\n<p>Researchers may, however, take a literature to be complete merely because it reads coherently. A study of GPT-4o citation recommendations found that the model favoured highly cited work.<button class=\"citation\" data-source=\"S08-017\" aria-label=\"Source 15\">[15]<\/button> A researcher who relies on model-suggested citations may therefore miss a smaller research stream that challenges the proposed explanation. When researchers conduct an integrative review, their search and inclusion choices are part of the method. Cronin and George explain that an integrative review makes its contribution by bringing studies into a new relation, which requires knowing which studies have been considered and what they actually establish.<button class=\"citation\" data-source=\"S06-006\" aria-label=\"Source 34\">[34]<\/button> An assistant may help screen a defined collection of studies or extract information from it, but the authors need to examine disputed inclusions and the material behind a proposed synthesis. Doctoral candidates who read the studies themselves may also develop the ability to recognise a weak inference or a missing research stream.<\/p>\n<p>Questions and concepts deserve particular attention, because an early error becomes harder to see when a tool completes the later steps efficiently. A tool may propose operational variables for “trust,” write the survey items, and then analyse the responses. If the items in fact measure satisfaction, the analysis cannot support the intended claim even when the code is impeccable. In quantitative research, this mismatch is a measurement problem, and in qualitative work an early error can become an interpretive problem if the tool’s summary starts to define what participants meant. In conceptual work, a term can quietly shift its meaning across paragraphs while the prose remains fluent. The research team needs to establish the construct and the evidence required to examine it before accepting a convenient implementation.<\/p>\n<h3 id=\"sec-design-and-access-to-evidence\">Design and access to evidence<\/h3>\n<p>During design, AI can generate possible experiments, prepare simulation code, suggest interview questions, or make the consequences of a statistical assumption easier to inspect. These proposals become useful when researchers can explain why one design addresses the question better than its alternatives. Empirical economists, for example, give causal identification a central place, and structural economists ask what economic assumptions permit an observed pattern to inform a counterfactual.<button class=\"citation\" data-source=\"S06-002\" aria-label=\"Source 14\">[14]<\/button><button class=\"citation\" data-source=\"S06-003\" aria-label=\"Source 38\">[38]<\/button> In management field research, whether a focused test or an exploratory inquiry is appropriate depends on the relation between existing theory and the phenomenon.<button class=\"citation\" data-source=\"S06-004\" aria-label=\"Source 11\">[11]<\/button> An AI-generated design may be clever and still lack the comparison, access, or contextual knowledge that the intended inference requires.<\/p>\n<p>The access that a design requires depends on more than the technical ability to retrieve evidence. CBS microdata require institutional and project authorisation, individual confidentiality commitments, and work inside an approved environment.<button class=\"citation\" data-source=\"S06-021\" aria-label=\"Source 39\">[39]<\/button> In organisational fieldwork, researchers’ relationships with a site and its participants influence what they can observe and ask.<button class=\"citation\" data-source=\"S06-024\" aria-label=\"Source 40\">[40]<\/button> An agent can write a query or a participant invitation, but it cannot grant rights to the records or permission to contact people. Nor does a tool’s ability to process files establish that the researcher may upload confidential data to it. At FEB, the rules governing a company collaboration, a licensed database, or a restricted administrative source thus remain part of the research design.<\/p>\n<p>Once researchers have established access, AI may also change how they collect evidence. Accounting and finance researchers, for example, can obtain public SEC filings through APIs and then process them with software.<button class=\"citation\" data-source=\"S06-023\" aria-label=\"Source 41\">[41]<\/button> Chatbot interviews go further, because they alter the interview encounter itself. In a study with 74 social scientists, a chatbot asked adaptive interview questions after researcher-led recruitment and consent, but the researchers also observed missed probes, leading questions, and interruptions.<button class=\"citation\" data-source=\"S06-025\" aria-label=\"Source 42\">[42]<\/button> A web-survey experiment with 1,800 participants found that AI follow-up questions could elicit more detailed responses, although the procedure involved trade-offs in coding and participant experience.<button class=\"citation\" data-source=\"S06-026\" aria-label=\"Source 43\">[43]<\/button> Whether chatbot interviews and AI follow-up questions produce suitable research material depends on the question and the participants, so the findings need to be tested in the settings where FEB researchers would use these procedures.<\/p>\n<h3 id=\"sec-preparation-analysis-and-interpretation\">Preparation, analysis, and interpretation<\/h3>\n<p>Preparing material can consume a large share of a project’s time, and AI can help researchers transcribe interviews, identify passages in documents, write code to merge datasets, extract a value from filings, or classify text. Each of these activities produces an output that researchers may later treat as evidence. Levich and Knust’s accounting application illustrates the reporting and language differences that arise when ownership information is extracted from corporate documents.<button class=\"citation\" data-source=\"S07-08\" aria-label=\"Source 44\">[44]<\/button> If an AI-generated label becomes a covariate or outcome, its classification errors can bias the estimate. Econometric research on model-generated measurements develops ways to validate and adjust the analyses that use them, including using human-labelled samples to estimate and correct for measurement error.<button class=\"citation\" data-source=\"S07-07\" aria-label=\"Source 45\">[45]<\/button><button class=\"citation\" data-source=\"S08-013\" aria-label=\"Source 46\">[46]<\/button> Researchers may be able to process more records at lower cost, but they still need to establish what the generated variables measure.<\/p>\n<p>Researchers can check some generated analysis code by running it and comparing its output with known results, but two reproducibility studies illustrate the distinction between execution and assessment. Brodeur and colleagues randomly assigned 288 researchers to human-only, AI-assisted, and AI-led teams for selected quantitative social-science reproduction tasks. Human-only and AI-assisted teams reproduced the assigned results at similar rates, whereas AI-led teams did much worse with the 2024 systems and workflow. Human-only teams, however, detected more major coding errors than AI-assisted teams.<button class=\"citation\" data-source=\"S08-009\" aria-label=\"Source 12\">[12]<\/button> A June 2026 preprint evaluated newer coding agents on 221 selected tasks from 54 papers, including ten tasks for which necessary material was missing. The strongest configuration that its authors tested reached 93.4% task accuracy and 78% whole-paper accuracy over three runs.<button class=\"citation\" data-source=\"S08-010\" aria-label=\"Source 47\">[47]<\/button> Because the two studies evaluate different tools, materials, and degrees of researcher involvement, their results cannot isolate the effect of improved models, but they do give FEB reason to test the precise workflow it intends to support.<\/p>\n<p>When generated code runs correctly, researchers still need to interpret its output. A reproduced table may contain a coefficient that is calculated exactly as the code instructs, although the variable was built from the wrong population or the causal comparison remains confounded. For the tasks with missing material, the later replication benchmark found that a prompt nudging an agent toward the published result reduced the agent’s ability to recognise that a task was impossible.<button class=\"citation\" data-source=\"S08-010\" aria-label=\"Source 47\">[47]<\/button> Researchers need to be able to conclude that a result cannot be reproduced, even when the published table provides an apparently clear target.<\/p>\n<h3 id=\"sec-writing-review-and-reuse\">Writing, review, and reuse<\/h3>\n<p>Researchers often discover what they can claim while explaining a result to coauthors, seminar participants, or reviewers. AI can help them clarify a passage or organise comments, as long as they preserve the reasoning that connects the evidence to the conclusion. In a short professional-writing experiment, AI assistance reduced completion time and improved assessed writing quality, although a journal article is longer and has different evidential demands.<button class=\"citation\" data-source=\"S05-007\" aria-label=\"Source 48\">[48]<\/button> In a manuscript, a polished explanation may help readers when it makes an assumption visible, but it is harmful when it masks an unresolved construct, repeats a source’s conclusion without its qualifications, or makes exploratory work look like a prediction made in advance.<\/p>\n<p>AI feedback can also make an author too comfortable with a weak argument. Experiments found that biased writing suggestions shifted users’ expressed positions on societal issues,<button class=\"citation\" data-source=\"S13-001\" aria-label=\"Source 49\">[49]<\/button> and that sycophantic responses increased participants’ conviction of being right and reduced their willingness to repair interpersonal conflicts.<button class=\"citation\" data-source=\"S13-002\" aria-label=\"Source 50\">[50]<\/button> Although these experiments concern other settings, they suggest a risk when researchers ask an assistant to judge an argument they already favour. Feedback is more useful when it identifies an unsupported inference or a contradictory source that the author can examine. Authors preparing a revise-and-resubmit should keep the original reviewer comments available so that a reassuring summary does not replace a difficult criticism.<\/p>\n<p>When drafting becomes easier, work can shift to the people who read the drafts. An <em>Organization Science<\/em> editorial reports a steep rise in submissions and raises concerns about the quality of AI-supported manuscripts and reviews.<button class=\"citation\" data-source=\"S06-020\" aria-label=\"Source 51\">[51]<\/button> Although the editorial’s observation cannot establish that AI caused a change in publication quality, it points to a practical concern for FEB, namely that coauthors, supervisors, and reviewers may have less time to examine each claim if papers, revisions, and grant applications arrive more rapidly. A productive AI workflow should therefore deliver more than a clean final document and make it easier for the next reader to recover how a claim was made.<\/p>\n<p>At the end of a project, researchers should leave material that another researcher can inspect or reuse where rights permit. AEA data and code rules and AMJ transparency guidance already express this expectation in different research traditions.<button class=\"citation\" data-source=\"S06-009\" aria-label=\"Source 52\">[52]<\/button><button class=\"citation\" data-source=\"S06-010\" aria-label=\"Source 13\">[13]<\/button> For AI-assisted work, relevant records may include the model and tool version, source set, instructions that affected coding or classification, validation sample, failed checks, and human decisions. Which records a project needs depends on the task and on the journal or data agreement. A record that researchers keep during the project is more reliable than one they try to reconstruct after a reviewer asks how the result was produced.<\/p>\n<h2 id=\"sec-3-dimension-2-research-form\">3. Dimension 2: Research form<\/h2>\n<p>The second dimension concerns the form of research, because the errors a researcher needs to look for in AI-assisted work depend on the methods a study uses. Quantitative, Qualitative, and Theory/Review provide practical groups for comparing the activities and methods used at FEB. The three groups are not mutually exclusive identities for departments, and they do not imply that all work within a group follows one method. Mixed studies can cross the Quantitative and Qualitative groups,<button class=\"citation\" data-source=\"S07-36\" aria-label=\"Source 53\">[53]<\/button> and theory is built and tested in empirical work as well as in papers whose principal contribution is conceptual.<button class=\"citation\" data-source=\"S07-31\" aria-label=\"Source 54\">[54]<\/button> Statistical meta-analysis belongs in Quantitative because it extracts and combines numerical results from earlier studies, and an integrative review belongs in Theory/Review because its central work is interpreting and connecting a field of scholarship.<button class=\"citation\" data-source=\"S07-32\" aria-label=\"Source 35\">[35]<\/button><\/p>\n<table>\n<thead>\n<tr>\n<th>Research group<\/th>\n<th>Work an assistant may help with<\/th>\n<th>Claim that still has to be justified<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Quantitative<\/td>\n<td>Code, extraction, statistical analysis, simulation, measurement from documents, and numerical synthesis of prior studies<\/td>\n<td>Whether observations and measures represent the phenomenon, the design supports inference, and results survive relevant checks<\/td>\n<\/tr>\n<tr>\n<td>Qualitative<\/td>\n<td>Transcription, retrieval, organisation, structured coding, and comparison of passages<\/td>\n<td>Whether interpretations preserve context and can be followed from the material, including discrepant cases<\/td>\n<\/tr>\n<tr>\n<td>Theory/Review<\/td>\n<td>Literature search and synthesis, counterexamples, conceptual comparisons, formal derivation, and model solving<\/td>\n<td>Whether premises, source selection, and reasoning support an original and useful conclusion<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><em>Table 3. The groups distinguish research activities and the claims those activities support. A single project may use more than one row, and a successful AI output in the middle column does not by itself establish the claim in the last column.<\/em><\/p>\n<h3 id=\"sec-quantitative-research\">Quantitative research<\/h3>\n<p>In many quantitative tasks, researchers can test directly whether an assistant has carried out the work correctly. A generated script can be run on a fixed dataset and its output compared with a known table, and simulation code can be inspected against a specified model. AI may allow researchers to examine alternative estimators or run robustness checks they could not otherwise afford. The added analyses can improve the research when they address a real weakness in the inference, because a regression executed correctly on an unsuitable measure or an unidentified comparison remains a weak basis for a claim. If running many specifications becomes cheap, researchers may also find a persuasive result without being clear about which analyses were planned and which were tried after seeing the data. Researchers who report transparently and provide reusable code help readers distinguish planned tests from subsequent exploration.<button class=\"citation\" data-source=\"S06-002\" aria-label=\"Source 14\">[14]<\/button><button class=\"citation\" data-source=\"S06-009\" aria-label=\"Source 52\">[52]<\/button><button class=\"citation\" data-source=\"S06-010\" aria-label=\"Source 13\">[13]<\/button><\/p>\n<p>AI can also become part of the study itself, as a conversational agent or as a source of simulated responses. In three studies with 789 human participants in total, Becker and colleagues used customised conversational agents that acted as a leader, a resistant subordinate, and a teacher in a confidentiality scenario.<button class=\"citation\" data-source=\"S07-09\" aria-label=\"Source 55\">[55]<\/button> Conversational agents may let researchers create interactive treatments that a fixed vignette cannot provide. The researcher then needs to document and evaluate the agent’s behaviour, because the agent is part of what participants experience. Synthetic participants raise the different question of whether model-generated responses can stand in for observations of people. Early work showed that language models could approximate selected survey patterns, but subsequent comparisons found plausible averages alongside insufficient variation, altered regression relations, and sensitivity to prompts or timing.<button class=\"citation\" data-source=\"S07-11\" aria-label=\"Source 56\">[56]<\/button><button class=\"citation\" data-source=\"S07-12\" aria-label=\"Source 57\">[57]<\/button> Researchers can use simulated responses to pilot a questionnaire or explore a mechanism, but treating them as observations of consumers, employees, or investors requires validation against the particular behaviour a paper wants to explain.<\/p>\n<p>Statistical meta-analysis illustrates how repetitive work and scholarly judgement are combined within Quantitative research. AI may help a research team identify candidate studies, screen abstracts, extract effects, and generate analysis code. Before a pooled estimate has meaning, however, the team must decide which studies address the same question, how each effect size was defined, whether estimates are dependent, and what should be done with conflicting operationalisations. Researchers studying AI screening have used known inclusion decisions to test prompts, and a review of generative AI in evidence synthesis finds that performance varies across tasks and systems.<button class=\"citation\" data-source=\"S07-21\" aria-label=\"Source 58\">[58]<\/button><button class=\"citation\" data-source=\"S07-20\" aria-label=\"Source 59\">[59]<\/button> The team could likewise validate screening against a checked set of decisions and then examine ambiguous exclusions and extraction disagreements. In this way, the team may finish faster, although better coverage and more careful attention to incompatible studies may be the more important benefit.<\/p>\n<h3 id=\"sec-qualitative-research\">Qualitative research<\/h3>\n<p>Qualitative projects also include tasks that vary in how readily researchers can check an AI output. A transcript can be compared with the audio, and passages retrieved about a specified event can be checked against the source documents. When an assistant applies a well-defined codebook, researchers can evaluate its codes against human coding decisions. Xiao and colleagues, for example, tested GPT-3 on deductive coding of 668 children’s questions using an expert codebook. The model’s agreement with expert labels was higher for question complexity (κ = .61) than for syntactic structure (κ = .38), and below agreement between experts on both tasks.<button class=\"citation\" data-source=\"S07-02\" aria-label=\"Source 60\">[60]<\/button> The results suggest a possible role for AI in preliminary coding that researchers subsequently check. Interpreting an organisation’s practices, however, requires further knowledge of its members and circumstances.<\/p>\n<p>Interpretation asks a different question from classification, because the meaning of an interview statement may depend on when it was made, what a participant could safely say, and what happened elsewhere in the organisation. Braun and Clarke describe thematic analysis as a recursive process in which familiarisation with the material and the researcher’s interpretive work are part of the method.<button class=\"citation\" data-source=\"S06-008\" aria-label=\"Source 61\">[61]<\/button> If a researcher first encounters the field through a model’s summary, that summary may direct the researcher’s attention away from a contradiction or an unusual participant. That risk does not rule out every qualitative use of AI, however, and methodologists disagree about whether and how AI can fit approaches such as reflexive thematic analysis. Some see delegation as incompatible with the researcher’s situated interpretation, but others outline conditions under which AI might support inquiry without taking over its central work.<button class=\"citation\" data-source=\"S07-17\" aria-label=\"Source 62\">[62]<\/button><button class=\"citation\" data-source=\"S07-18\" aria-label=\"Source 63\">[63]<\/button> FEB should therefore base its support on each project’s stated approach and avoid promising that AI can “do qualitative coding” in general.<\/p>\n<p>In mixed research, relating the quantitative and qualitative components to each other is itself a research task. Imagine an HRM study that estimates how responses to a policy differ across teams and then interviews employees to understand why. An assistant might implement the statistical model and retrieve interview passages that mention the policy. The team still has to decide whether those passages support the proposed mechanism, suggest a different explanation, or show that the survey failed to measure an important part of the employees’ experience. Methodological fit in such a study concerns whether the question, evidence, and inference are consistent across its components.<button class=\"citation\" data-source=\"S06-004\" aria-label=\"Source 11\">[11]<\/button> The assistant may help with each component without settling how the components should be combined.<\/p>\n<h3 id=\"sec-theory-and-review-research\">Theory and review research<\/h3>\n<p>Theory/Review includes several forms of work that should not be collapsed into “writing.” An economist may develop a formal model, an operations researcher may formulate and solve an optimisation problem, a management scholar may develop a conceptual explanation, and a review author may reinterpret a body of published studies. All four rely on prior knowledge, assumptions, and reasoning, but each reaches a contribution by a different route. Jaakkola distinguishes designs for conceptual papers, and Cronin and George show why an integrative review requires more than summarising the articles it includes.<button class=\"citation\" data-source=\"S07-33\" aria-label=\"Source 33\">[33]<\/button><button class=\"citation\" data-source=\"S06-006\" aria-label=\"Source 34\">[34]<\/button> Purely conceptual and formal components can proceed without new primary data collection, whereas integrative reviews assemble published studies as their evidence. If a paper also tests its argument empirically, that empirical component requires the checks appropriate to its method.<\/p>\n<p>In formal work, current AI systems can do more than produce plausible prose. The mathematics results described earlier and research on language-model systems that formulate optimisation problems show that current systems can produce derivations, code, and solutions for specified problems.<button class=\"citation\" data-source=\"S08-007\" aria-label=\"Source 30\">[30]<\/button><button class=\"citation\" data-source=\"S07-05\" aria-label=\"Source 64\">[64]<\/button> A correct solution, however, can be uninformative if its assumptions omit a constraint that defines the real problem. Makadok’s guidance for formal theory asks authors to justify the model’s assumptions, show how its results follow, and explain what they mean.<button class=\"citation\" data-source=\"S13-306\" aria-label=\"Source 65\">[65]<\/button> In economics, a model’s implications depend on its behavioural premises and the connection between those premises and data.<button class=\"citation\" data-source=\"S06-003\" aria-label=\"Source 38\">[38]<\/button> In operations, a mathematically valid scheduling solution may fail because the organisation cannot implement a necessary decision rule. Researchers can use AI to compare formulations and look for counterexamples, but they decide which assumptions are informative and what can be learned from a result.<\/p>\n<p>Authors of conceptual papers face a related risk, namely that an explanation can be well formed and still weak. An assistant can assemble familiar constructs into smooth prose, name a boundary condition, and announce a contribution. Cornelissen argues, in a critique of AI-assisted theory, that such prose can easily acquire the appearance of theory without a precise mechanism or a real change in understanding.<button class=\"citation\" data-source=\"S13-301\" aria-label=\"Source 66\">[66]<\/button> Authors may then mistake a well-written explanation for a theoretical advance. For a FEB conceptual paper, the author needs to state what happens, under which conditions, why the proposed relation follows, and what the reader would understand differently from prior work, because theoretical vocabulary alone cannot make an argument original. An assistant can be useful in this work when it challenges an implication or locates a counterexample.<\/p>\n<p>An integrative review has its own evidence problem, because the published studies it assembles are its evidence. Review authors decide which conversations belong together, assess differences in concepts and methods, and explain what becomes visible when the conversations are integrated. Cronin and George, as well as Elsbach and van Knippenberg, describe reviews whose new perspective remains grounded in a representative and fair treatment of the field.<button class=\"citation\" data-source=\"S06-006\" aria-label=\"Source 34\">[34]<\/button><button class=\"citation\" data-source=\"S13-305\" aria-label=\"Source 67\">[67]<\/button> Source-grounded AI can help authors map a large corpus and compare passages, provided that their searches, exclusions, and claim-to-source links remain available. AI may also favour prominent or easily retrievable work and give the authors a falsely complete view of a field.<button class=\"citation\" data-source=\"S08-017\" aria-label=\"Source 15\">[15]<\/button><button class=\"citation\" data-source=\"S06-014\" aria-label=\"Source 68\">[68]<\/button> Review authors need to examine what each paper contributes, where the literature conflicts, and whether the proposed synthesis follows from those contributions and conflicts. For reviews across economics and business, the benefit of faster synthesis depends on whether the authors can defend their treatment of the literature.<\/p>\n<h2 id=\"sec-4-dimension-3-researcher-position\">4. Dimension 3: Researcher position<\/h2>\n<p>The third dimension concerns the researcher’s position, because the same activity can serve different purposes at different points in a career. Research produces a paper, dataset, model, or explanation, and it also develops the people who will conduct later projects. For a doctoral candidate, writing and debugging code may be part of learning to identify a flawed design. When a full professor reviews a similar analysis, that review may be part of supervising a candidate and safeguarding a wider programme. Responsibilities of this kind are described in the profiles of UFO, the university job-classification system that RUG uses,<button class=\"citation\" data-source=\"S09-020\" aria-label=\"Source 69\">[69]<\/button> and FEB’s Career Tracks criteria add specific advancement conditions for the new-hire tracks. The profiles describe generic responsibilities, but actual duties, time allocation, and AI expertise vary between colleagues.<button class=\"citation\" data-source=\"S09-017\" aria-label=\"Source 70\">[70]<\/button><button class=\"citation\" data-source=\"S01-002\" aria-label=\"Source 3\">[3]<\/button><\/p>\n<table>\n<thead>\n<tr>\n<th>Position<\/th>\n<th>Research responsibility in the relevant UFO profile<\/th>\n<th>Consequence to examine when AI assists<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>PhD candidate<\/td>\n<td>Plans and conducts research under supervision, publishes, and prepares a dissertation.<button class=\"citation\" data-source=\"S09-012\" aria-label=\"Source 71\">[71]<\/button><\/td>\n<td>The project must progress while the candidate develops the ability to choose, explain, and defend research decisions.<\/td>\n<\/tr>\n<tr>\n<td>Postdoc<\/td>\n<td>The <em>Onderzoeker<\/em> profile covers planning, conducting, and publishing research; independence, acquisition, coordination, and guidance vary by level and appointment.<button class=\"citation\" data-source=\"S09-013\" aria-label=\"Source 72\">[72]<\/button><\/td>\n<td>AI may add capacity within a fixed project or contract, but validation and an identifiable contribution still require time.<\/td>\n<\/tr>\n<tr>\n<td>Assistant professor<\/td>\n<td>The <em>Universitair docent<\/em> profile combines research and teaching, with greater independence, acquisition, and guidance at UD1.<button class=\"citation\" data-source=\"S09-014\" aria-label=\"Source 73\">[73]<\/button><\/td>\n<td>Assisted output interacts with the development of a research line, teaching commitments, and relevant promotion criteria.<\/td>\n<\/tr>\n<tr>\n<td>Associate professor<\/td>\n<td>The <em>Universitair hoofddocent<\/em> profile includes project development, acquisition, research, coordination, and guidance.<button class=\"citation\" data-source=\"S09-015\" aria-label=\"Source 74\">[74]<\/button><\/td>\n<td>AI may assist their own work and also change the checking and coordination needed across projects.<\/td>\n<\/tr>\n<tr>\n<td>Full professor<\/td>\n<td>The <em>Hoogleraar<\/em> profile includes leadership of a chair’s programme, resources, research quality, staff development, and doctoral supervision.<button class=\"citation\" data-source=\"S09-016\" aria-label=\"Source 75\">[75]<\/button><\/td>\n<td>An increase in assisted work can change the demands of programme leadership and mentoring.<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><em>Table 4. Generic UFO responsibilities and report-level implications. “Postdoc” is an appointment label rather than one UFO grade, and the duties actually assigned to a person may differ from the full profile.<\/em><button class=\"citation\" data-source=\"S09-013\" aria-label=\"Source 72\">[72]<\/button><button class=\"citation\" data-source=\"S09-017\" aria-label=\"Source 70\">[70]<\/button><\/p>\n<h3 id=\"sec-doctoral-researchers\">Doctoral researchers<\/h3>\n<p>A doctoral project is both a research contribution and a period of apprenticeship. A candidate who uses AI to obtain a correct script, a literature summary, or a clean revision may advance the project. The effect on learning, however, depends on whether the candidate also comes to understand why the script is correct, which studies were excluded, and how the revised argument answers a criticism. Experiments in other learning settings have measured assisted performance and independent performance separately. In Shen and Tamkin’s randomized study, participants who learned an unfamiliar programming library with AI assistance performed worse on a later test of concepts and debugging than participants who learned without it.<button class=\"citation\" data-source=\"S09-003\" aria-label=\"Source 76\">[76]<\/button> In a school mathematics experiment, unrestricted GPT assistance improved students’ performance during practice but reduced their later unaided performance, and a more carefully designed tutor largely avoided that reduction.<button class=\"citation\" data-source=\"S09-004\" aria-label=\"Source 77\">[77]<\/button> Both experiments thus show that a good assisted product is insufficient evidence of acquired competence, although neither follows FEB doctoral candidates through a dissertation or implies that every use of AI is educationally harmful.<\/p>\n<p>A three-month randomized study of patent lawyers, reported in a September 2026 NBER working paper, offers a closer professional comparison. Autor and colleagues randomly assigned 133 lawyers in eleven firms to a group with access to a custom drafting tool or to a control group. In blind ratings, the AI-assisted drafts were judged better, and the improvement was larger among junior lawyers. At an unassisted endline task completed by 91 participants, senior lawyers who had used AI edited a flawed patent more effectively than senior controls, but junior lawyers showed no average improvement, and their outcomes spread in both directions.<button class=\"citation\" data-source=\"S13-101\" aria-label=\"Source 78\">[78]<\/button> In this study, senior meant at least seven years in patent law, not an academic rank. Because the study had no unaided baseline test and lost participants before the endline, it cannot establish that a particular junior lawyer lost skill or that an experienced professor will gain it. Its results nevertheless suggest that assistance can raise the quality of the immediate output and that later independent judgement can change differently from one person to the next.<\/p>\n<p>Supervisors can make the difference between assisted output and independent judgement visible in a project’s ordinary work. A candidate who uses an agent to build an estimator might explain the target quantity and diagnose an intentionally altered variable before including the result in a paper. A candidate using AI for a review might read the studies defining the review’s boundaries and explain why two apparently similar effects should not be pooled. Some practice without assistance may be necessary to develop that judgement, but other repetitive work may turn out to add little to learning. In their discussion of AI and scientific training, Messeri and Crockett explicitly leave open which routine tasks trainees need to perform themselves.<button class=\"citation\" data-source=\"S13-303\" aria-label=\"Source 79\">[79]<\/button> The division between assisted and unassisted work should therefore follow the candidate’s current knowledge and the project’s learning objective, and the supervisor can observe whether the candidate is able to defend consequential decisions after using the tool.<\/p>\n<h3 id=\"sec-postdocs-and-assistant-professors\">Postdocs and assistant professors<\/h3>\n<p>Postdocs and assistant professors often have to establish a recognisable contribution within a limited period, although their appointments, teaching loads, and promotion arrangements differ. This time pressure is part of the broader insecurity and progression difficulties in research careers that the OECD documents.<button class=\"citation\" data-source=\"S09-008\" aria-label=\"Source 80\">[80]<\/button> With AI, a postdoc may be able to analyse a larger document corpus or test an additional mechanism, but only if the contract leaves room to validate the measures that the AI generates. Methods research explains why this validation is substantive research work and not an administrative delay.<button class=\"citation\" data-source=\"S08-013\" aria-label=\"Source 46\">[46]<\/button> A project’s deadline and budget therefore need to allow time to validate any AI-generated measures.<\/p>\n<p>Assistant professors may use AI to attempt a wider set of projects and to spend less time preparing proposals or revisions. The same assistance can, however, obscure whether a scholar has built an independent research line when many outputs look polished but the scholar did not make the central choices in them. For promotion, FEB’s new-hire Research Profile evaluates originality, significance, and rigour alongside its publication route and other criteria. The standard allocation in the Research Profile combines research and teaching, and the Education Profile has a different balance and research standard.<button class=\"citation\" data-source=\"S01-002\" aria-label=\"Source 3\">[3]<\/button> Whether faster work leaves time for a new study therefore depends on the researcher’s workload and the expectations attached to their appointment.<\/p>\n<p>AI may also help an early-career scholar work across disciplinary boundaries or develop more candidate designs, and an experiment in product-innovation work gives a reason to explore that possibility. In that experiment, an individual with AI could reach quality comparable to a pair working without it, and AI helped more clearly with generating ideas than with choosing the best idea.<button class=\"citation\" data-source=\"S13-103\" aria-label=\"Source 81\">[81]<\/button> The result does not show that colleagues, mentors, or reviewers can be replaced, and it does not establish how a tenure committee would judge assisted work. A faculty programme would need to keep the scholar’s intellectual decisions visible and to make any time saved available for those decisions.<\/p>\n<h3 id=\"sec-associate-and-full-professors\">Associate and full professors<\/h3>\n<p>Associate and full professors still develop their own research, but their UFO profiles also place acquisition, coordination, quality, and guidance within their roles, and the full professor carries responsibility for a chair’s programme and staff development.<button class=\"citation\" data-source=\"S09-015\" aria-label=\"Source 74\">[74]<\/button><button class=\"citation\" data-source=\"S09-016\" aria-label=\"Source 75\">[75]<\/button> AI can help a senior researcher prepare feedback, compare a grant draft with a call, or explore alternative analyses in an established programme. With domain experience, a senior researcher may find it easier to notice when an apparently plausible output conflicts with a dataset’s history, a field relationship, or a theoretical debate. The patent-law experiment shows one setting in which experienced professionals who had used AI performed better on a later unaided assessment than experienced controls.<button class=\"citation\" data-source=\"S13-101\" aria-label=\"Source 78\">[78]<\/button> The study did not show, however, that senior lawyers completed assisted tasks faster, and it does not establish a general senior advantage in academia.<\/p>\n<p>As the amount of assisted work grows, senior researchers may also need to exercise more judgement. A supervisor who receives several new analysis variants between meetings may have to reconstruct which specification answers the question, whether the candidate understands the choices, and why a result was set aside. AI can help the supervisor organise that review, but the conversation in which a researcher explains a difficult decision remains a source of learning for both people. Reif and Cummings theorise that workers who turn to AI instead of colleagues for feedback may weaken the exchange through which a team learns who knows what.<button class=\"citation\" data-source=\"S07-27\" aria-label=\"Source 82\">[82]<\/button> Baygi and Huysman make a related argument about the small consultations that keep expertise circulating in organisations.<button class=\"citation\" data-source=\"S13-302\" aria-label=\"Source 83\">[83]<\/button> Both arguments suggest that FEB should examine whether AI changes how often colleagues discuss research problems and learn from one another.<\/p>\n<p>Through practice, researchers also learn things that are difficult to convey in a finished paper or a list of instructions. In Collins’s study of laboratories building a new laser, usable know-how often travelled through personal contact, and previous practical experience helped researchers recognise consequential details that written descriptions had not conveyed.<button class=\"citation\" data-source=\"S09-033\" aria-label=\"Source 84\">[84]<\/button> Although the study concerns one physics technique, it suggests why a written description may be insufficient for someone who has never performed the task. At FEB, practical knowledge of this kind might involve knowing why an archival measure changed, which organisational events shaped an interview, or where a formal assumption ceases to be plausible. This knowledge could help researchers identify an AI error that would be difficult to recognise from the output alone. Experience gained before widespread AI use may provide that knowledge, but being senior does not establish that a researcher has it for the task in question.<\/p>\n<p>Prior experience cannot be inferred from title alone, because a doctoral candidate may be the person most familiar with a new method or dataset and a professor may be new to coding agents. In radiology studies, years of practice and prior AI familiarity did not reliably identify who benefited from AI advice, and incorrect advice could worsen performance.<button class=\"citation\" data-source=\"S09-030\" aria-label=\"Source 85\">[85]<\/button> In a separate prediction experiment, better calibrated beliefs about one’s own ability were associated with greater gains from AI beyond baseline ability.<button class=\"citation\" data-source=\"S09-031\" aria-label=\"Source 86\">[86]<\/button> Although neither setting involves academic research, this evidence cautions against assuming that the benefit of AI varies simply with rank. For FEB, it is more useful to ask whether researchers know the specific task, are aware of the limits of that knowledge, and can obtain a second view than whether they are senior.<\/p>\n<p>For a comparison of AI use at FEB, the five positions can nevertheless be grouped by their main research responsibilities. PhD candidates have an explicit training purpose, postdocs and assistant professors face distinct but often time-bound expectations for independent work, and associate and full professors have wider coordination and supervisory duties. These groups guide the comparison but leave room for differences in duties, knowledge, and pressures within each group. For any one group, the likely balance between benefit and harm depends on the task, research method, researcher’s prior knowledge, available support, and who must check the result.<\/p>\n<h2 id=\"sec-5-combined-effects-and-possible-developments-at-feb\">5. Combined effects and possible developments at FEB<\/h2>\n<p>The three dimensions need to be considered together because a gain at one stage can change what a researcher does, learns, or must check elsewhere in the project. At the analysis stage, for example, an agent might generate estimation code for a quantitative study or compare interpretations across papers for a review. A doctoral candidate needs to develop the ability to assess that work, but an experienced supervisor may use the same assistance to examine several projects more closely. Table 5 illustrates how the likely benefit and risk of the same activity change with the form of research and the researcher’s responsibilities.<\/p>\n<table>\n<thead>\n<tr>\n<th>AI-assisted activity, held constant across positions<\/th>\n<th>PhD candidates<\/th>\n<th>Postdocs and assistant professors<\/th>\n<th>Associate and full professors<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Quantitative analysis.<\/strong> AI generates estimation or synthesis code, robustness analyses, and an interpretation; the researcher checks them.<\/td>\n<td>Generated code can advance a chapter, but checking it also requires skills the candidate is still developing. The candidate needs opportunities to learn how to diagnose errors independently.<button class=\"citation\" data-source=\"S09-003\" aria-label=\"Source 76\">[76]<\/button><button class=\"citation\" data-source=\"S09-004\" aria-label=\"Source 77\">[77]<\/button><\/td>\n<td>More analyses may become feasible if the project allows time to validate generated measures and the researcher can defend the method and interpretation.<button class=\"citation\" data-source=\"S08-013\" aria-label=\"Source 46\">[46]<\/button><button class=\"citation\" data-source=\"S01-002\" aria-label=\"Source 3\">[3]<\/button><\/td>\n<td>Relevant methods experience may help researchers identify errors across projects, but a larger set of generated results also takes time to review. A successful reproduction alone does not show that the analysis is free of errors.<button class=\"citation\" data-source=\"S08-009\" aria-label=\"Source 12\">[12]<\/button><button class=\"citation\" data-source=\"S09-016\" aria-label=\"Source 75\">[75]<\/button><\/td>\n<\/tr>\n<tr>\n<td><strong>Qualitative analysis.<\/strong> AI compares passages, applies codes where appropriate, and proposes interpretations; the researcher checks these against the original material.<\/td>\n<td>A candidate can compare the suggestions with their own reading. Relying mainly on the suggestions may leave the candidate unfamiliar with the context and contradictory material.<button class=\"citation\" data-source=\"S06-008\" aria-label=\"Source 61\">[61]<\/button><\/td>\n<td>Assistance may let a project cover more material, but the author’s interpretation still depends on close knowledge of the case and its context.<button class=\"citation\" data-source=\"S07-02\" aria-label=\"Source 60\">[60]<\/button><button class=\"citation\" data-source=\"S06-008\" aria-label=\"Source 61\">[61]<\/button><\/td>\n<td>Suggested interpretations can help a supervisor prepare a discussion, but checking them requires knowledge of the original material, which the candidate may know more closely.<button class=\"citation\" data-source=\"S06-008\" aria-label=\"Source 61\">[61]<\/button><button class=\"citation\" data-source=\"S09-015\" aria-label=\"Source 74\">[74]<\/button><\/td>\n<\/tr>\n<tr>\n<td><strong>Theory/Review analysis.<\/strong> AI proposes derivations, mechanisms, or a synthesis of studies; the researcher tests these against premises and sources.<\/td>\n<td>A candidate may receive a plausible argument before learning how to assess its premises or use of sources. The risk to the candidate’s training can then affect much of the project.<button class=\"citation\" data-source=\"S13-301\" aria-label=\"Source 66\">[66]<\/button><button class=\"citation\" data-source=\"S13-303\" aria-label=\"Source 79\">[79]<\/button><\/td>\n<td>More proposed arguments can widen a research agenda, provided the author can explain what follows from the sources and what the new argument adds.<button class=\"citation\" data-source=\"S06-006\" aria-label=\"Source 34\">[34]<\/button><button class=\"citation\" data-source=\"S13-305\" aria-label=\"Source 67\">[67]<\/button><\/td>\n<td>Knowledge of the theory may help an author identify a weak premise or a familiar claim, but valid derivation and original insight still need to be established.<button class=\"citation\" data-source=\"S13-306\" aria-label=\"Source 65\">[65]<\/button><button class=\"citation\" data-source=\"S06-001\" aria-label=\"Source 36\">[36]<\/button><\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><em>Table 5. Conditional implications of the task, research form, and researcher position. The cited studies and profiles support the mechanisms, but the cells are reasoned applications to FEB and do not report measured effects by academic rank. A specific researcher’s knowledge and duties can change the comparison.<\/em><\/p>\n<h3 id=\"sec-without-a-faculty-ai-programme\">Without a faculty AI programme<\/h3>\n<p>Without a faculty programme, researchers would continue to develop their own ways of using AI through university services, grants, collaborators, or personal budgets. Some teams may save time and improve their studies because they have the expertise and resources to check generated work, but others may struggle to judge a new method or find a permitted environment for confidential material. Although the strategic plan recognises the initial costs of training and tools, it has not been established how unevenly access to them is currently distributed at FEB.<button class=\"citation\" data-source=\"S01-001\" aria-label=\"Source 1\">[1]<\/button><\/p>\n<p>Even within a team, the consequences of AI use could differ between researchers. An experienced researcher might use generated code to compare assumptions more thoroughly, but a doctoral candidate could use generated code to complete a chapter without learning to diagnose its errors. A postdoc may be expected to process a larger corpus without additional time for validation. Supervisors may in turn receive more drafts and analyses, so that the time an author appears to save becomes additional checking work for the supervisor. This shift of checking work would be particularly clear in Theory/Review, where AI can help produce much of the apparent argument and errors in that argument may be difficult to identify from the finished text.<\/p>\n<p>Teams would also find it harder to share useful practices if they did not document the conditions under which those practices worked. A team might know that an agent worked with one public dataset but not whether the approach is suitable for restricted microdata. Another team might find an effective way to combine AI use with doctoral training, but colleagues outside that team might never learn of it. FEB would thus have little basis for distinguishing research improvements from a shift in who does the checking or who loses an opportunity to learn.<\/p>\n<h3 id=\"sec-with-a-faculty-ai-support-programme\">With a faculty AI support programme<\/h3>\n<p>A faculty programme could connect researchers working on a specific task to methodological advice and a suitable tool environment. Teams would compare the completed work with the total effort needed to produce and check it, and supervisors would examine what candidates could explain afterwards. Cornell proposes a shared support function that connects AI specialists with disciplinary researchers, and MIT likewise recommends sustained local expertise and attention to training opportunities.<button class=\"citation\" data-source=\"S03-015\" aria-label=\"Source 87\">[87]<\/button><button class=\"citation\" data-source=\"S03-014\" aria-label=\"Source 88\">[88]<\/button> With such a programme, FEB would find it easier to share useful procedures across projects and to identify uses that require more support than their benefits justify.<\/p>\n<p>The most valuable gains may lie in research that becomes feasible with AI assistance. A team could examine an additional explanation because sensitivity analyses take less time, or compare formal assumptions that were previously too difficult to explore. A doctoral candidate could use faster literature search to spend more time reading the studies that define a field. To obtain these gains, researchers need time and support for the research that follows the automated task, and the gains are therefore less likely if any time saved is immediately converted into higher expectations for manuscript production.<\/p>\n<p>The two scenarios describe possible developments during the strategic-plan period and do not predict publication counts or staffing. Even a supported use of AI can prove ineffective, and FEB would need to revise its recommendations as models, available tools, and researchers’ skills change. The question for the working group is which arrangements help researchers produce sounder work and develop the ability to judge that work.<\/p>\n<h2 id=\"sec-6-recommendations-for-feb\">6. Recommendations for FEB<\/h2>\n<p>The working group should use the 2026–2027 planning period to evaluate a small number of existing research activities with willing teams.<button class=\"citation\" data-source=\"S01-001\" aria-label=\"Source 1\">[1]<\/button> The selected projects should together cover different research forms and career positions across the departments. Suitable starting activities include literature synthesis, reproducible analysis, manuscript feedback and revision, and grant preparation. Teams that take on more specialised uses (e.g., AI-generated measures or participant-facing agents) need to be able to specify how they will assess the resulting evidence. The aim is to learn what a useful service requires before FEB commits to broad provision or to higher output expectations.<\/p>\n<h3 id=\"sec-provide-support-within-research-projects\">Provide support within research projects<\/h3>\n<p>Researchers need help while a project is under way, when a question about a measure, data agreement, or tool can still be resolved. FEB can connect existing services to those projects through a clear contact route. Methods advisers can help a team define a validation sample or an independent check, and supervisors can identify which activities candidates need to practise themselves. The Library and university AI, data, and privacy specialists can help with source access and suitable tool environments. Table 6 sets out this support as four forms of provision, which the working group could discuss with the relevant services.<\/p>\n<table>\n<thead>\n<tr>\n<th>Support<\/th>\n<th>What FEB could organise<\/th>\n<th>What to learn from its use<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Advice<\/td>\n<td>A contact route connecting research methods, the Research Office, the Library, and university AI, data, and privacy expertise.<\/td>\n<td>Which questions teams cannot resolve themselves, and who can help.<\/td>\n<\/tr>\n<tr>\n<td>Documentation<\/td>\n<td>A short research guide with economics and business examples, source-checking procedures, and records of unsuccessful uses.<\/td>\n<td>Which procedures colleagues can reuse and when a tool change requires another evaluation.<\/td>\n<\/tr>\n<tr>\n<td>Technical support<\/td>\n<td>Help configuring suitable tools for source-based work, reproducible code, and permitted data.<\/td>\n<td>Whether colleagues can repeat the work and inspect its sources and decisions.<\/td>\n<\/tr>\n<tr>\n<td>Funding and time<\/td>\n<td>Shared access where justified, small supported trials, and time for validation and supervision.<\/td>\n<td>Whether the research gains justify the full cost and which groups otherwise lack access.<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><em>Table 6. Proposed faculty support, subject to agreement on responsibilities and resources.<\/em><\/p>\n<p>Whatever support FEB provides, researchers can use a tool only in ways that the conditions attached to their research material permit. Public RUG guidance and service rules, together with European research guidelines, provide relevant starting points.<button class=\"citation\" data-source=\"S03-004\" aria-label=\"Source 89\">[89]<\/button><button class=\"citation\" data-source=\"S03-006\" aria-label=\"Source 90\">[90]<\/button> The September RUG research-guideline document is an internally circulated version whose formal adoption has not been verified.<button class=\"citation\" data-source=\"S03-002\" aria-label=\"Source 91\">[91]<\/button> An individual project may also be constrained by an ethics approval, a licensed-data agreement, or obligations to a company partner. FEB can make the route to advice clear and record answers for recurring situations, but the relevant university services resolve questions about permitted tools, storage, and data use.<\/p>\n<h3 id=\"sec-evaluate-research-quality-effort-and-learning\">Evaluate research quality, effort, and learning<\/h3>\n<p>In each project, the team should specify what improvement it seeks and how it will assess that improvement. For generated code, the team needs to consider whether the researcher detects its errors and can explain the model, as well as whether the code runs correctly. For AI-generated variables, a checked sample can reveal errors that change the inference. In literature work, researchers need to be able to trace claims to supporting passages and to check for omitted studies, and qualitative researchers need to explain how their interpretation follows from the material, including contradictory cases. These checks follow from the methods discussed under the three dimensions, and the team should choose them before it judges the tool’s performance.<\/p>\n<p>Teams also need records of their AI-assisted work that another researcher can use, without making record-keeping a separate administrative project. A reporting checklist for the use of large language models in behavioural science recommends documenting the task, model and settings, prompts that influenced the research, data handling, human validation, and scripts.<button class=\"citation\" data-source=\"S13-201\" aria-label=\"Source 92\">[92]<\/button> Teams in the FEB pilots can adapt that checklist to the role AI plays in their study. Where a project aims to inform an organisation or policy decision, the evaluation should also cover whether the findings address the partner’s problem and can be used within the data agreement, because a polished report alone would not establish societal impact.<button class=\"citation\" data-source=\"S01-001\" aria-label=\"Source 1\">[1]<\/button><\/p>\n<p>The evaluation also needs to include the time spent on checking and supervision and to distinguish assisted performance from independent understanding. The learning and professional experiments discussed above give reason to examine these two outcomes separately.<button class=\"citation\" data-source=\"S09-003\" aria-label=\"Source 76\">[76]<\/button><button class=\"citation\" data-source=\"S09-004\" aria-label=\"Source 77\">[77]<\/button><button class=\"citation\" data-source=\"S13-101\" aria-label=\"Source 78\">[78]<\/button> Candidates may, for example, need to explain or repeat an essential part of the work without AI. Postdocs and assistant professors need time for validation as part of the project, and supervisors need to know whether assistance reduces their workload or mainly increases the material they must review.<\/p>\n<p>By the end of the initial projects, the working group should be able to recommend which uses deserve continued support, what expertise they require, and what they cost in total. In making that recommendation, the working group should also consider who has access, because a useful procedure that depends on a private subscription or an unusually well-funded project may warrant shared provision. A procedure that saves drafting time but requires extensive additional checking may need revision. With these recommendations, FEB could invest in research benefits that the projects have demonstrated, without assuming that every task completed faster increases research capacity.<\/p>\n<h2 id=\"sec-conclusion\">Conclusion<\/h2>\n<p>This report aimed to assess how AI could improve research at FEB and where researchers would need support. AI can change a substantial part of that research, but its effects depend on the stage of the project, the form of research, and the person doing the work. Quantitative researchers may gain from faster coding but still need to check measurement and identification, and qualitative researchers may save time organising material as long as they retain the close engagement needed to interpret it. Theory and review authors may explore more arguments and sources, although they may also find it harder to distinguish an original explanation from plausible text.<\/p>\n<p>Researcher position adds a further consideration, because work that an experienced colleague can delegate may be precisely what a doctoral candidate needs to learn, and assistance can also increase the volume of material that supervisors must assess. In its AI plan, FEB should therefore connect practical support to research and training goals and evaluate completed work together with the effort and understanding required to produce it. The three dimensions provide a basis for deciding where AI helps the faculty’s research and where its use needs to change.<\/p>\n<h2 id=\"sec-basis-of-the-report\">Basis of the report<\/h2>\n<p>This report draws on FEB documents, university and European guidance, the local academic literature collection, and checked public sources available on 4 October 2026. It is a targeted synthesis, and it is neither a systematic review nor an evaluation at FEB. The May 2026 memo to the research directors informed the practical examples and support proposals. Numbered references support specific claims, and the research dossier retains source locators and verification records. The scenarios and recommendations are proposals for discussion and have not been adopted as policy.<\/p>\n", "report_toc": [{"level": 1, "id": "sec-ai-and-the-future-of-research-at-feb", "text": "AI and the future of research at FEB"}, {"level": 2, "id": "sec-summary", "text": "Summary"}, {"level": 2, "id": "sec-introduction", "text": "Introduction"}, {"level": 2, "id": "sec-1-research-at-feb-and-the-development-of-ai", "text": "1. Research at FEB and the development of AI"}, {"level": 3, "id": "sec-research-quality-and-impact", "text": "Research quality and impact"}, {"level": 3, "id": "sec-ai-in-feb-s-strategic-plan", "text": "AI in FEB’s strategic plan"}, {"level": 3, "id": "sec-scope-across-departments", "text": "Scope across departments"}, {"level": 3, "id": "sec-from-statistical-software-to-research-assistants", "text": "From statistical software to research assistants"}, {"level": 2, "id": "sec-2-dimension-1-the-research-cycle", "text": "2. Dimension 1: The research cycle"}, {"level": 3, "id": "sec-questions-concepts-and-literature", "text": "Questions, concepts, and literature"}, {"level": 3, "id": "sec-design-and-access-to-evidence", "text": "Design and access to evidence"}, {"level": 3, "id": "sec-preparation-analysis-and-interpretation", "text": "Preparation, analysis, and interpretation"}, {"level": 3, "id": "sec-writing-review-and-reuse", "text": "Writing, review, and reuse"}, {"level": 2, "id": "sec-3-dimension-2-research-form", "text": "3. Dimension 2: Research form"}, {"level": 3, "id": "sec-quantitative-research", "text": "Quant
