/* AI and research at FEB: presentation application, v6 (4 October 2026).
   Thirteen slides; interactive tabs for criteria, departments and the three dimensions; one overview and one detailed heatmap. */
const DATA=JSON.parse(document.getElementById('presentation-data').textContent);
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const STAGES=[['question','Question & theory'],['literature','Literature'],['design','Design'],['data','Data / sources'],['analysis','Analysis & interpretation'],['writing','Writing & review']];
const TYPES=[['quantitative','Quantitative','Numerical evidence and statistical methods'],['qualitative','Qualitative','Interviews, observation and documents in context'],['theory_review','Theory/Review','Formal or conceptual arguments and literature synthesis']];
const COHORTS={phd:'PhD candidates',postdoc_ap:'Postdocs & assistant professors',senior:'Associate & full professors'};
const RATINGS={opportunity:'More opportunity',mixed:'Mixed balance',risk:'More risk'};
const SCEN={ordinary:'Without a faculty AI programme',supported:'With a faculty AI support programme'};
const N=DATA.slides.length;
let current=0,scrollMode=false,fluid=false,supported=false,lastCell=null,chromeTimer=null,detailCohort='phd';

/* ---------- helpers ---------- */
function src(id){return DATA.sources[id];}
function cite(text){return esc(text).replace(/\{\{([^}]+)\}\}/g,(_,id)=>{const s=src(id);return s?`<button class="citation" data-source="${esc(id)}" aria-label="Source ${s.number}: ${esc(s.title)}">[${s.number}]</button>`:`<span class="missing-source">[${esc(id)}]</span>`;});}
function paras(arr){return (Array.isArray(arr)?arr:[arr]).filter(Boolean).map(p=>`<p>${cite(p)}</p>`).join('');}
function cellAt(cohort,type,stage){return DATA.cells.find(c=>c.cohort===cohort&&c.research_type===type&&c.stage===stage);}
function rating(c){return supported?c.supported_rating:c.rating;}
function headline(c){return supported?(c.supported_headline||c.headline):c.headline;}
function typeName(t){return TYPES.find(x=>x[0]===t)[1];}
function stageName(t){return STAGES.find(x=>x[0]===t)[1];}
function cellLabel(c){return `${COHORTS[c.cohort]} · ${typeName(c.research_type)} · ${stageName(c.stage)}: ${RATINGS[rating(c)]}. ${headline(c)}`;}
function counts(list,key){const o={opportunity:0,mixed:0,risk:0};list.forEach(c=>o[key?c[key]:rating(c)]++);return o;}
function bar(o){return `<div class="bar" role="img" aria-label="${o.opportunity} more opportunity, ${o.mixed} mixed balance, ${o.risk} more risk">${['opportunity','mixed','risk'].map(k=>o[k]?`<span class="${k}" style="flex:${o[k]} 1 0" title="${RATINGS[k]}: ${o[k]}">${o[k]}</span>`:'').join('')}</div>`;}
function legend(){return `<div class="legend" aria-label="Colour key">${Object.entries(RATINGS).map(([k,l])=>`<span><i class="dot ${k}" aria-hidden="true"></i>${l}</span>`).join('')}</div>`;}
function list(items){return `<ul class="plain">${items.map(t=>`<li>${cite(t)}</li>`).join('')}</ul>`;}
/* tabs: buttons and panels share a key; the first is shown */
function tabs(id,items,btn,panel,cls=''){return `<div class="tabs-wrap ${cls}" data-tabs="${esc(id)}"><div class="tablist" role="tablist">${items.map((it,k)=>`<button class="tab" role="tab" data-tab="${esc(it.key)}" aria-selected="${k===0}">${btn(it,k)}</button>`).join('')}</div><div class="panels">${items.map((it,k)=>`<div class="tabpanel" role="tabpanel" data-panel="${esc(it.key)}" ${k?'hidden':''}>${panel(it,k)}</div>`).join('')}</div></div>`;}

/* ---------- slide shell ---------- */
function head(s){return `<div class="s-head"><img src="${DATA.logo}" alt="University of Groningen, Faculty of Economics and Business"><span class="s-chapter">${esc(s.chapter)}</span></div>`;}
function foot(s,i){const sec=s.section_id?`<button class="to-report" data-report="${esc(s.section_id)}" title="Open the background report at this topic">Background: ${esc(s.section.replace(/^\d\.\s*(Dimension \d:\s*)?/,''))} →</button>`:'';return `<div class="s-foot"><span>AI and research at FEB · October 2026</span>${sec}<span class="s-num">${pad(i+1)} / ${N}</span></div>`;}
function opener(s){return s.opener?`<div class="opener"><span class="num">${esc(s.opener.number)}</span><span class="okick">${esc(s.opener.kicker)}</span></div>`:'';}
function shell(s,i,inner,cls=''){return `<div class="frame" data-index="${i}"><section class="slide ${cls} ${s.opener?'has-opener':''}" id="slide-${esc(s.id)}" aria-roledescription="slide" aria-label="${i+1} of ${N}: ${esc(s.title)}">${head(s)}<div class="s-body">${opener(s)}<h2 class="s-title">${esc(s.title)}</h2>${s.lead?`<p class="s-lead">${cite(s.lead)}</p>`:''}<div class="s-content">${inner}</div></div>${foot(s,i)}</section></div>`;}
function titleSlide(s,i){return `<div class="frame" data-index="${i}"><section class="slide title-slide v6" id="slide-${esc(s.id)}" aria-roledescription="slide" aria-label="1 of ${N}: ${esc(s.title)}">${head({chapter:'October 2026'})}<div class="s-body"><div class="t-center"><h1>${esc(s.title)}</h1><p class="t-sub">${esc(s.lead)}</p><p class="t-meta">${esc(s.visual.meta)}</p><div class="t-actions"><button class="btn primary" data-next>Start →</button><button class="btn" data-report="">Background report</button></div></div></div>${foot({},i)}</section></div>`;}
function dividerSlide(s,i){return `<div class="frame" data-index="${i}"><section class="slide divider-slide" id="slide-${esc(s.id)}" aria-roledescription="slide" aria-label="${i+1} of ${N}: ${esc(s.title)}">${head(s)}<div class="s-body"><h2 class="s-title">${esc(s.title)}</h2><p class="s-lead">${cite(s.lead)}</p><div class="dv">${s.visual.items.map((it,k)=>`<button data-jump="${['stages','forms','positions'][k]}"><span class="dvn">${k+1}</span><strong>${esc(it.title)}</strong><span>${cite(it.text)}</span></button>`).join('')}</div></div>${foot(s,i)}</section></div>`;}

/* ---------- visuals ---------- */
const R={};
R.goal=v=>`<div class="goal"><div class="gtime">${v.timeline.map((t,k)=>`<div class="gstep ${k===0?'past':''}"><b>${esc(t.when)}</b><span>${cite(t.text)}</span></div>`).join('')}</div><div class="gareas"><div class="kicker">${esc(v.areas_label)}</div><ol class="numbered">${v.areas.map(a=>`<li>${cite(a)}</li>`).join('')}</ol><p class="caption">${cite(v.note)}</p></div></div>`;
R.strategy=v=>`<div class="strat"><div><div class="kicker">${esc(v.left_label)}</div>${list(v.left)}</div><div class="ai-in-plan"><div class="kicker">${esc(v.right_label)}</div>${v.right.map(r=>`<div class="aip-item"><strong>${esc(r.title)}</strong><span>${cite(r.text)}</span></div>`).join('')}</div></div>`;
R.criteria=v=>`<div class="crit-grid">${tabs('criteria',v.items,it=>`<span class="tfig">${esc(it.figure)}</span><span class="tlab">${esc(it.label)}</span>`,it=>`<p class="cdef">${cite(it.def)}</p><div class="aiw"><div class="aiw-a"><div class="lab ai">How AI can contribute</div>${list(it.ai)}</div><div class="aiw-w"><div class="lab you">What to check</div>${list(it.watch)}</div></div>`,'vertical')}<aside class="side-box"><div class="kicker">${esc(v.side_label)}</div>${v.side.map(x=>`<div class="cap"><strong>${esc(x.value)}</strong><span>${cite(x.text)}</span></div>`).join('')}</aside></div>`;
const METHOD={evidence_synthesis:['Meta-analysis','quant'],quant_econometric_stat:['Statistical','quant'],experimental:['Experiment','quant'],computational_simulation_optimization:['Computational','other'],qualitative_interpretive:['Interpretive','qual'],formal_mathematical:['Formal model','theory'],method_not_applicable_conceptual:['Conceptual','theory']};
R.depts=v=>{const deps=DATA.department_profiles.departments.map(d=>({...d,key:d.department}));return tabs('depts',deps,d=>esc(d.department),d=>`<div class="dp"><div><h3>${esc(d.name)}</h3><p class="dtyp">${esc(d.typical)}</p><div class="kicker">Journals with the most papers, 2016–2025</div><ol class="jl">${d.journals.map(j=>`<li><span>${esc(j.journal)}</span><small>${j.papers} papers${j.aip!==null&&j.aip!==undefined?` · AIP ${j.aip}`:''}</small></li>`).join('')}</ol></div><div><div class="kicker">Two contrasting articles, checked by hand</div>${DATA.department_examples.filter(x=>x.department===d.department).map(x=>{const ms=x.method_checked.split(';').map(m=>METHOD[m]).filter(Boolean);return `<div class="ex"><span class="ms">${ms.map(([l,c])=>`<span class="m ${c}">${esc(l)}</span>`).join('')}</span><span>${esc(x.observed_work.charAt(0).toUpperCase()+x.observed_work.slice(1))}. ${cite('{{'+x.source_id+'}}')}</span><span class="meta">${esc(x.journal)}, ${esc(x.year)}</span></div>`;}).join('')}<p class="caption" style="margin-top:14px">${cite(v.caption)}</p></div></div>`,'top');};
R.stages=v=>tabs('stages',v.items,(it,k)=>`<span class="snum">${k+1}</span><span>${esc(it.name)}</span>`,it=>`<p class="sdesc">${esc(it.desc)}</p><div class="aiw"><div class="aiw-a"><div class="lab ai">What AI can do</div><p>${cite(it.ai)}</p></div><div class="aiw-w"><div class="lab you">What researchers still need to check</div><p>${cite(it.check)}</p></div></div>`,'top stages')+`<p class="caption" style="margin-top:14px">${cite(v.note)}</p>`;
function kappa(k){return `<div class="kappa"><div class="kicker">${cite(k.label)}</div>${k.bars.map(b=>`<div class="kb"><span>${esc(b.label)}</span><div class="kt"><i style="width:${b.value*100}%"></i></div><b>κ = ${String(b.value).replace('0.','.')}</b></div>`).join('')}<p class="caption">${esc(k.note)}</p></div>`;}
R.forms2=v=>tabs('forms',v.items,it=>esc(it.name),it=>`<div class="aiw"><div class="aiw-a"><div class="lab ai">What AI can help with</div><p>${cite(it.help)}</p></div><div class="aiw-w"><div class="lab you">What still has to be justified</div><p>${cite(it.justify)}</p></div></div>${it.kappa?kappa(it.kappa):`<div class="evid"><div class="kicker">From the evidence</div><p>${cite(it.evidence)}</p></div>`}`,'top')+`<p class="caption" style="margin-top:14px">${cite(v.note)}</p>`;
R.positions=v=>tabs('positions',v.items,it=>esc(it.name),it=>`<div class="pos"><div class="pd"><div class="lab">Research duties</div><p>${cite(it.duties)}</p></div><div class="aiw"><div class="aiw-a"><div class="lab ai">What AI changes</div><p>${cite(it.changes)}</p></div><div class="aiw-w"><div class="lab you">From the evidence</div><p>${cite(it.evidence)}</p></div></div></div>`,'top')+`<p class="caption" style="margin-top:14px">${cite(v.note)}</p>`;
R.scenarios=v=>{const w=counts(DATA.cells,'rating'),p=counts(DATA.cells,'supported_rating');return `<div class="scen"><div class="scen-table"><div></div><div class="h without">${esc(v.columns[1])}</div><div class="h with">${esc(v.columns[2])}</div>${v.rows.map(r=>`<div class="issue">${esc(r[0])}</div><div class="w">${cite(r[1])}</div><div class="p">${cite(r[2])}</div>`).join('')}</div><div class="scen-chart"><h3>The 54 assessments</h3><div class="count-row">${esc(SCEN.ordinary)}${bar(w)}</div><div class="count-row">${esc(SCEN.supported)}${bar(p)}</div>${legend()}<p class="caption">${cite(v.caption)}</p><button class="linkish" data-map-overview style="align-self:flex-start">Compare the heatmaps</button></div></div>`;};
R.nextsteps=v=>`<div class="nsteps">${v.cols.map(c=>`<div class="card top"><span class="nsn">${esc(c.n)}</span><h3>${esc(c.title)}</h3><p>${cite(c.text)}</p><ul class="chips small">${c.chips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;

/* ---------- heatmaps ---------- */
function scenarioSeg(){return `<div class="seg scenario" role="group" aria-label="Scenario">${Object.entries(SCEN).map(([k,l])=>`<button data-assessment="${k}" aria-pressed="${(k==='supported')===supported}">${l}</button>`).join('')}</div>`;}
function cohortSeg(cohort){return `<div class="seg" role="group" aria-label="Career group"><button data-map-overview aria-pressed="${!cohort}">All groups</button>${Object.entries(COHORTS).map(([c,l])=>`<button data-cohort="${c}" aria-pressed="${c===cohort}">${l}</button>`).join('')}</div>`;}
function cellButton(c,compact){return `<button class="heat-cell ${compact?'compact-cell':'full-cell'} ${rating(c)}" data-cell="${esc(c.id)}" aria-label="${esc(cellLabel(c))}" ${compact?`title="${esc(cellLabel(c))}"`:''}>${compact?'':`<span>${esc(headline(c))}</span>`}</button>`;}
function stageHead(){return STAGES.map(([,n])=>`<th scope="col">${esc(n)}</th>`).join('');}
function overview(){
 return `<div class="map-bar">${cohortSeg(null)}${scenarioSeg()}</div><div class="overview-grid"><div class="matrix-scroll"><table class="matrix overview-matrix"><colgroup><col style="width:150px"><col style="width:120px">${STAGES.map(()=>'<col>').join('')}</colgroup><caption class="sr-only">Net balance of opportunities and risks for all career groups. Select a cell for its explanation and sources.</caption><thead><tr><th scope="col">Career group</th><th scope="col">Research form</th>${stageHead()}</tr></thead>${Object.entries(COHORTS).map(([cohort,label])=>`<tbody class="cohort-group">${TYPES.map(([type,name],k)=>`<tr>${k===0?`<th class="cohort-label" scope="rowgroup" rowspan="3">${esc(label)}</th>`:''}<th class="type-label" scope="row">${esc(name)}</th>${STAGES.map(([st])=>`<td>${cellButton(cellAt(cohort,type,st),true)}</td>`).join('')}</tr>`).join('')}</tbody><tbody aria-hidden="true"><tr class="gap-row"><td colspan="8"></td></tr></tbody>`).join('')}</table><p class="map-note">Theory/Review × Data / sources concerns the literature used in reviews, because a purely theoretical paper has no empirical data-collection task. Statistical meta-analysis is part of Quantitative. <button class="linkish" data-rubric>What the colours mean</button></p></div><aside class="peek" aria-live="polite">${peekDefault()}</aside></div>`;
}
function peekDefault(){return `<div class="kicker">${esc(supported?SCEN.supported:SCEN.ordinary)}</div><div class="legend vertical">${Object.entries(RATINGS).map(([k,l])=>`<span><i class="dot ${k}" aria-hidden="true"></i>${l}</span>`).join('')}</div><div class="counts">${Object.entries(COHORTS).map(([c,l])=>`<div class="count-row">${esc(l)}${bar(counts(DATA.cells.filter(x=>x.cohort===c)))}</div>`).join('')}<div class="count-row" style="margin-top:6px;font-weight:700">All 54 assessments${bar(counts(DATA.cells))}</div></div><p class="hint">Point at a cell to preview it, or select it for the full explanation and sources.</p>`;}
function peekCell(c){return `<div class="kicker">${esc(COHORTS[c.cohort])} · ${esc(typeName(c.research_type))} · ${esc(stageName(c.stage))}</div><span class="pill ${rating(c)}">${RATINGS[rating(c)]}</span><h3>${esc(headline(c))}</h3><p><b>Potential benefit</b>${esc(plain(c.opportunity))}</p><p><b>Risk</b>${esc(plain(c.risk))}</p><p class="hint">Select the cell for the reason behind its colour.</p>`;}
function plain(t){return String(t||'').replace(/\{\{[^}]+\}\}/g,'').replace(/\s+([.,])/g,'$1').trim();}
function heatmap(cohort,s){
 const note=s&&s.cohort_notes?`<p class="cohort-note">${cite(s.cohort_notes[cohort]||'')}</p>`:'';
 return `<div class="map-bar">${cohortSeg(cohort)}${scenarioSeg()}</div>${note}<div class="matrix-scroll"><table class="matrix"><colgroup><col style="width:210px">${STAGES.map(()=>'<col>').join('')}</colgroup><caption class="sr-only">Net balance of opportunities and risks for ${esc(COHORTS[cohort])}. Select a cell for its explanation.</caption><thead><tr><th scope="col">Research form</th>${stageHead()}</tr></thead><tbody>${TYPES.map(([type,label,sub])=>`<tr><th class="row-label" scope="row">${esc(label)}<small>${esc(sub)}</small></th>${STAGES.map(([st])=>`<td>${cellButton(cellAt(cohort,type,st),false)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="map-bar" style="margin:12px 0 0">${legend()}<p class="map-note" style="margin:0">Colours are reasoned assessments for FEB, not measured effects. <button class="linkish" data-rubric>What the colours mean</button></p></div>`;
}
function refreshCells(){
 $$('.heat-cell[data-cell]').forEach(b=>{const c=DATA.cells.find(x=>x.id===b.dataset.cell);if(!c)return;b.classList.remove('opportunity','mixed','risk');b.classList.add(rating(c));b.setAttribute('aria-label',cellLabel(c));if(b.hasAttribute('title'))b.title=cellLabel(c);const sp=b.querySelector('span');if(sp)sp.textContent=headline(c);});
 $$('[data-assessment]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.assessment==='supported')===supported)));
 $$('.peek').forEach(p=>p.innerHTML=peekDefault());
}

/* ---------- render ---------- */
function bodyFor(s){
 if(s.layout==='overview')return overview();
 if(s.layout==='heatmap')return heatmap(detailCohort,s);
 const v=s.visual;if(v&&R[v.type])return R[v.type](v,s);
 return '';
}
function render(){
 $('#stage').innerHTML=DATA.slides.map((s,i)=>s.layout==='title'?titleSlide(s,i):s.layout==='divider'?dividerSlide(s,i):shell(s,i,bodyFor(s),['overview','heatmap'].includes(s.layout)?'compact':'')).join('');
 buildSegments();fit();update();
}
const CHAPTERS=[];DATA.slides.forEach((s,i)=>{const c=CHAPTERS.at(-1);if(c&&c.name===s.chapter)c.end=i;else CHAPTERS.push({name:s.chapter,start:i,end:i});});
function buildSegments(){$('#segments').innerHTML=CHAPTERS.map(c=>`<button style="--n:${c.end-c.start+1}" data-slide="${c.start}" title="${esc(c.name)}" aria-label="Go to: ${esc(c.name)}"><span></span></button>`).join('');}
function update(){
 $$('.frame').forEach((f,i)=>f.classList.toggle('active',i===current));
 $('#prev').disabled=current===0;$('#next').disabled=current===N-1;
 const s=DATA.slides[current];$('#chapter-name').textContent=s.chapter;$('#position').textContent=`${pad(current+1)} / ${N}`;
 $$('#segments button').forEach((b,k)=>{const c=CHAPTERS[k];const f=current>c.end?100:current<c.start?0:(current-c.start+1)/(c.end-c.start+1)*100;b.firstElementChild.style.width=f+'%';});
}
function go(i,opts={}){
 current=Math.max(0,Math.min(N-1,i));update();
 history.replaceState(null,'','#'+DATA.slides[current].id);
 if((scrollMode||fluid)&&!opts.fromScroll)$(`.frame[data-index="${current}"]`).scrollIntoView({block:'start',behavior:opts.smooth?'smooth':'auto'});
 $('#announcement').textContent=`Slide ${current+1}: ${DATA.slides[current].title}`;
}
function jumpTo(id){const i=DATA.slides.findIndex(s=>s.id===id||s.layout===id);if(i>=0){closeAll();go(i);}}
function showCohort(c){detailCohort=c;const i=DATA.slides.findIndex(s=>s.layout==='heatmap');if(i<0)return;const el=$(`.frame[data-index="${i}"] .s-content`);if(el)el.innerHTML=heatmap(c,DATA.slides[i]);closeAll();if(current!==i)go(i);$('#announcement').textContent=`Detailed heatmap: ${COHORTS[c]}`;}
function fit(){
 fluid=innerWidth<760;document.body.classList.toggle('fluid',fluid);
 const fs=document.body.classList.contains('fs');let sc;
 if(scrollMode)sc=Math.min((innerWidth-80)/1600,1.1);
 else{const aw=innerWidth-(fs?0:56),ah=innerHeight-(fs?0:52+58+36);sc=Math.min(aw/1600,ah/900);}
 document.documentElement.style.setProperty('--scale',Math.max(.2,sc).toFixed(4));
}

/* ---------- panels ---------- */
function openPanel(kicker,html,wide=false){$('#panel-kicker').textContent=kicker;$('#panel-body').innerHTML=html;const p=$('#panel');p.classList.toggle('wide',wide);if(!p.open)p.showModal();p.scrollTop=0;}
function closeAll(){$$('dialog[open]').forEach(d=>d.close());}
function openCell(id){
 const c=DATA.cells.find(x=>x.id===id);if(!c)return;lastCell=id;
 const cohortCells=DATA.cells.filter(x=>x.cohort===c.cohort);
 const loc=TYPES.map(([t])=>STAGES.map(([st])=>{const x=cohortCells.find(y=>y.research_type===t&&y.stage===st);return `<i class="${rating(x)} ${x.id===c.id?'here':''}"></i>`;}).join('')).join('');
 const sources=c.source_ids.map(sid=>{const s=src(sid);return s?`<button class="evidence-source" data-source="${esc(sid)}" data-cell-source="${esc(c.id)}" title="${esc(s.title)}">[${s.number}]</button>`:'';}).join(' ');
 const idx=DATA.cells.findIndex(x=>x.id===id);
 openPanel(COHORTS[c.cohort],`<div class="cell-top"><div><div class="crumbs">${esc(typeName(c.research_type))} · ${esc(stageName(c.stage))}</div><h2 id="panel-title">${esc(headline(c))}</h2></div><div><div class="locator" aria-hidden="true">${loc}</div><div class="locator-cap">Position in the ${esc(COHORTS[c.cohort]).toLowerCase()} map</div></div></div>
 <div class="scen-compare">${['ordinary','supported'].map((k,n)=>{const rr=k==='supported'?c.supported_rating:c.rating;return (n?'<span aria-hidden="true">→</span>':'')+`<div class="${(k==='supported')===supported?'on':''}"><span>${esc(SCEN[k])}</span><span class="pill ${rr}">${RATINGS[rr]}</span></div>`;}).join('')}</div>
 ${c.research_type==='theory_review'&&c.stage==='data'?'<p class="cell-scope-note">This cell concerns the sources used in reviews. A purely theoretical paper has no empirical data-collection stage.</p>':''}
 <div class="br"><section class="b"><h3>Potential benefit</h3><p>${cite(c.opportunity)}</p></section><section class="r"><h3>Risk</h3><p>${cite(c.risk)}</p></section></div>
 <div class="why"><h3>Why this colour</h3><p>${cite(supported?c.supported_reason:c.rating_reason)}</p></div>
 <details><summary>${supported?'Support in this scenario':'What support could change'}</summary><p>${cite(c.support)}</p></details>
 <details><summary>Evidence and sources</summary><p class="access-note"><strong>AI use assessed:</strong> ${cite(c.task_scope||'')}</p>${paras(c.paragraphs)}<p class="access-note">${cite(c.applicability)}</p><p class="access-note">${cite(c.limits)}</p><p>Sources ${sources}</p></details>
 <div class="pager"><button data-other-cell="-1">← Previous cell</button><small>${idx+1} of ${DATA.cells.length} · use ← →</small><button data-other-cell="1">Next cell →</button></div>`);
 $$('.heat-cell.peeked').forEach(b=>b.classList.remove('peeked'));$$(`.heat-cell[data-cell="${id}"]`).forEach(b=>b.classList.add('peeked'));
}
function showSource(id,cellId){
 const s=src(id);if(!s)return;
 const cell=DATA.cells.find(c=>c.id===cellId),locator=cell?.source_locators[id]||s.locator||'';
 const policy=s.policy_status&&!['not_applicable','not applicable','n/a'].includes(s.policy_status.toLowerCase())?`<p><strong>Document status:</strong> ${esc(s.policy_status)}</p>`:'';
 $('#source-body').innerHTML=`<h2 id="source-title" class="source-title">[${s.number}] ${esc(s.title)}</h2><p class="source-meta">${esc(s.authors_or_body)}<br>${esc(s.publication_date)} · ${esc((s.source_type||'Source').replaceAll('_',' '))}</p>${s.url?`<p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Read the original source ↗</a></p>`:'<p class="access-note">Held in the research dossier for this analysis.</p>'}<details><summary>Source notes</summary>${locator?`<p><strong>Relevant passage:</strong> ${esc(locator)}</p>`:''}<p><strong>Verification:</strong> ${esc((s.verification_level||'').replaceAll('_',' '))}. ${esc(s.scope_or_access_limits||s.access_limits||'')}</p>${policy}<p>Checked ${esc(s.checked_date||'4 October 2026')}. Register ID: ${esc(id)}.</p></details>`;
 if(!$('#source-panel').open)$('#source-panel').showModal();
}
function sourceList(f=''){f=f.toLowerCase();const list=Object.values(DATA.sources).filter((s,i,a)=>a.findIndex(x=>x.number===s.number)===i).sort((a,b)=>a.number-b.number).filter(s=>(s.title+' '+s.authors_or_body+' '+s.publication_date).toLowerCase().includes(f));$('#source-results').innerHTML=list.map(s=>`<li><button data-source="${esc(s.source_id)}">[${s.number}] ${esc(s.authors_or_body)} (${esc(s.publication_date)}). ${esc(s.title)}</button></li>`).join('');$('#source-found').textContent=`${list.length} sources shown`;}
function showSources(){lastCell=null;openPanel('References',`<h2 id="panel-title">Sources</h2><p>The slides, assessments and background report cite ${DATA.stats.cited_sources} sources from a research dossier of ${DATA.stats.unique_sources}. Select a reference to read the original publication.</p><label class="sr-only" for="source-search">Search sources</label><input id="source-search" class="search" placeholder="Search by author, title or year"><p id="source-found" class="access-note" aria-live="polite"></p><ul class="source-list" id="source-results"></ul>`);sourceList();$('#source-search').addEventListener('input',e=>sourceList(e.target.value));}
function showContents(){
 lastCell=null;
 openPanel('Contents',`<h2 id="panel-title">AI and research at FEB</h2><p>Select a slide, or press <kbd>G</kbd> at any time to return here. The <button class="linkish" data-report="">background report</button> contains the underlying detail.</p>${CHAPTERS.map(c=>`<div class="toc-chapter"><h3>${esc(c.name)}</h3><div class="toc-grid">${DATA.slides.slice(c.start,c.end+1).map((s,k)=>{const i=c.start+k;return `<button class="toc-item ${i===current?'current':''}" data-slide="${i}"><div class="thumb" data-thumb="${i}"></div><span><small>${pad(i+1)}</small>${esc(s.title)}</span></button>`;}).join('')}</div></div>`).join('')}`,true);
 requestAnimationFrame(()=>{$$('.thumb[data-thumb]').forEach(t=>{const orig=$(`.frame[data-index="${t.dataset.thumb}"] .slide`);if(!orig)return;const cl=orig.cloneNode(true);cl.removeAttribute('id');cl.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));cl.setAttribute('inert','');cl.setAttribute('aria-hidden','true');t.style.setProperty('--t',(t.clientWidth/1600).toFixed(4));t.appendChild(cl);});const cur=$('.toc-item.current');if(cur)cur.scrollIntoView({block:'center'});});
}
function showRubric(){lastCell=null;openPanel('Reading the heatmaps',`<h2 id="panel-title">What the colours mean</h2><p>Each colour shows whether the expected benefits of one concrete AI task outweigh its risks for one research form, stage, and career group.</p><div class="br" style="grid-template-columns:1fr"><section class="b"><h3><span class="pill opportunity">More opportunity</span></h3><p>The expected benefits outweigh the risks, provided the checks described in the cell are made.</p></section><section style="background:#fbf5e0"><h3><span class="pill mixed">Mixed balance</span></h3><p>Benefits and substantial risks both remain, and the explanation names what could change the balance.</p></section><section class="r"><h3><span class="pill risk">More risk</span></h3><p>The likely harm to the research, to learning, or to workload outweighs the immediate benefit.</p></section></div><h3>The two scenarios</h3><p><strong>${SCEN.ordinary}</strong> assumes permitted tools and data, ordinary supervision, and uneven access to specialist training and methods support.</p><p><strong>${SCEN.supported}</strong> assumes that the support described in each cell is available and used. That support may improve the balance without removing every risk.</p><h3>How to read the differences</h3><p>All career groups are assessed for the same AI task, and the differences reflect learning and research responsibilities, informed by the cited studies. The colours are judgements for FEB rather than measured effects on its staff, and a researcher’s knowledge and duties can change the assessment.</p>`);}
function showReport(sectionId){
 lastCell=null;
 const toc=DATA.report_toc.filter(t=>t.level===2);
 openPanel('Background report',`<nav class="report-toc" aria-label="Report chapters"><div class="kicker">Chapters</div>${toc.map(t=>`<button data-report-jump="${esc(t.id)}">${esc(t.text)}</button>`).join('')}</nav><article class="reading"><h2 id="panel-title" class="sr-only">Background report</h2>${DATA.report_html}</article>`,true);
 if(sectionId){requestAnimationFrame(()=>{const el=$('#panel').querySelector('#'+CSS.escape(sectionId));if(el){el.scrollIntoView({block:'start'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600);}});}
}
function showHelp(){lastCell=null;openPanel('Using this presentation',`<h2 id="panel-title">Keyboard shortcuts</h2><div class="keys"><span><kbd>→</kbd> <kbd>Space</kbd></span><span>Next slide</span><span><kbd>←</kbd></span><span>Previous slide</span><span><kbd>Home</kbd> <kbd>End</kbd></span><span>First or last slide</span><span><kbd>R</kbd></span><span>Background report at this slide’s topic</span><span><kbd>G</kbd></span><span>Contents with slide previews</span><span><kbd>H</kbd></span><span>Heatmap overview</span><span><kbd>S</kbd></span><span>Switch between the two scenarios</span><span><kbd>F</kbd></span><span>Present in full screen</span><span><kbd>V</kbd></span><span>Scroll view of all slides</span><span><kbd>Esc</kbd></span><span>Close a panel</span></div><h3>Interactive slides</h3><p>Several slides have tabs: select a criterion, department, stage, form, or career group to see its details. Every heatmap cell opens its own explanation, and numbers in square brackets open the original sources.</p>`);}

/* ---------- modes and events ---------- */
function setSupport(v){supported=v;refreshCells();if($('#panel').open&&lastCell)openCell(lastCell);$('#announcement').textContent=v?'Heatmaps show the balance with a faculty AI support programme.':'Heatmaps show the balance without a faculty AI programme.';}
function setScroll(v){scrollMode=v;document.body.classList.toggle('scroll-mode',v);$('#mode').setAttribute('aria-pressed',String(v));fit();go(current);}
async function toggleFs(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{openPanel('Presenting','<h2 id="panel-title">Use the browser’s full-screen command</h2><p>This browser does not allow the page to enter full screen by itself. Its View menu offers the full-screen option.</p>');}}
document.addEventListener('fullscreenchange',()=>{const on=!!document.fullscreenElement;document.body.classList.toggle('fs',on);if(on&&scrollMode)setScroll(false);fit();});
document.addEventListener('mousemove',()=>{if(!document.body.classList.contains('fs'))return;document.body.classList.add('chrome');clearTimeout(chromeTimer);chromeTimer=setTimeout(()=>document.body.classList.remove('chrome'),2200);});
addEventListener('resize',fit);
const io=new IntersectionObserver(es=>{if(!(scrollMode||fluid))return;const vis=es.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];if(vis){const i=Number(vis.target.dataset.index);if(i!==current){current=i;update();history.replaceState(null,'','#'+DATA.slides[i].id);}}},{rootMargin:'-40% 0px -55% 0px'});
$('#contents').onclick=showContents;$('#maps').onclick=()=>jumpTo('overview');$('#report').onclick=()=>showReport(DATA.slides[current].section_id);$('#sources').onclick=showSources;$('#help').onclick=showHelp;
$('#mode').onclick=()=>setScroll(!scrollMode);$('#fullscreen').onclick=toggleFs;$('#prev').onclick=()=>go(current-1,{smooth:true});$('#next').onclick=()=>go(current+1,{smooth:true});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.tab!==undefined){const w=b.closest('.tabs-wrap');w.querySelectorAll(':scope>.tablist>.tab').forEach(t=>t.setAttribute('aria-selected',String(t===b)));w.querySelectorAll(':scope>.panels>.tabpanel').forEach(p=>p.hidden=p.dataset.panel!==d.tab);return;}
 if(d.close)return $('#'+d.close).close();
 if(d.reportJump!==undefined){const el=$('#panel').querySelector('#'+CSS.escape(d.reportJump));if(el)el.scrollIntoView({block:'start',behavior:'smooth'});return;}
 if(d.report!==undefined)return showReport(d.report);
 if(d.source)return showSource(d.source,d.cellSource||($('#panel').open?lastCell:null));
 if(d.cell)return openCell(d.cell);
 if(d.otherCell){const i=DATA.cells.findIndex(c=>c.id===lastCell);return openCell(DATA.cells[(i+Number(d.otherCell)+DATA.cells.length)%DATA.cells.length].id);}
 if(d.cohort)return showCohort(d.cohort);
 if(d.assessment)return setSupport(d.assessment==='supported');
 if(b.hasAttribute('data-rubric'))return showRubric();
 if(d.slide!==undefined){closeAll();return go(Number(d.slide));}
 if(b.hasAttribute('data-next'))return go(current+1);
 if(b.hasAttribute('data-map-overview'))return jumpTo('overview');
 if(d.jump)return jumpTo(d.jump);
});
function peekHandler(e){const b=e.target.closest('.overview-matrix .heat-cell');const peek=e.target.closest('.slide')?.querySelector('.peek');if(!peek)return;if(b){const c=DATA.cells.find(x=>x.id===b.dataset.cell);if(c)peek.innerHTML=peekCell(c);}}
document.addEventListener('mouseover',peekHandler);document.addEventListener('focusin',peekHandler);
document.addEventListener('mouseout',e=>{const m=e.target.closest('.overview-matrix');if(m&&!m.contains(e.relatedTarget)){const p=m.closest('.slide').querySelector('.peek');if(p)p.innerHTML=peekDefault();}});
document.addEventListener('keydown',e=>{
 if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
 const panelOpen=$('#panel').open,srcOpen=$('#source-panel').open;
 if(panelOpen&&lastCell&&!srcOpen&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();const i=DATA.cells.findIndex(c=>c.id===lastCell);openCell(DATA.cells[(i+(e.key==='ArrowRight'?1:-1)+DATA.cells.length)%DATA.cells.length].id);return;}
 if(e.key==='?'){e.preventDefault();return showHelp();}
 if(panelOpen||srcOpen)return;
 const k=e.key.toLowerCase();
 if(k==='g'){e.preventDefault();return showContents();}
 if(k==='r'){e.preventDefault();return showReport(DATA.slides[current].section_id);}
 if(k==='h'){e.preventDefault();return jumpTo('overview');}
 if(k==='s'){e.preventDefault();return setSupport(!supported);}
 if(k==='f'){e.preventDefault();return toggleFs();}
 if(k==='v'){e.preventDefault();return setScroll(!scrollMode);}
 if(scrollMode||fluid)return;
 if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&!e.target.closest('button,summary'))){e.preventDefault();go(current+1);}
 if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1);}
 if(e.key==='Home'){e.preventDefault();go(0);}if(e.key==='End'){e.preventDefault();go(N-1);}
});
for(const d of $$('dialog'))d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}});
$('#panel').addEventListener('close',()=>{$$('.heat-cell.peeked').forEach(b=>b.classList.remove('peeked'));});
const initial=DATA.slides.findIndex(s=>s.id===decodeURIComponent(location.hash.slice(1)));if(initial>=0)current=initial;
render();$$('.frame').forEach(f=>io.observe(f));if(fluid&&current)go(current);
if(location.hash==='#report')showReport('');
addEventListener('hashchange',()=>{const i=DATA.slides.findIndex(s=>s.id===decodeURIComponent(location.hash.slice(1)));if(i>=0&&i!==current)go(i);});
</script>
</body></html>
