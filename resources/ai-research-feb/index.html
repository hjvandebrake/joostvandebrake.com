", "rating_reason": "A researcher can compare a prepared transcript with the recording, whereas an encounter that AI leads cannot be checked in the same way afterwards. Studies of chatbot interviews and surveys found useful responses, but also missed probes and costs to participants’ experience. {{S06-025}}{{S06-026}}", "conditions": ["Recruitment and consent are researcher-led and documented.", "The study can check the quality of AI-mediated responses against its purpose."], "applicability": "Applies to real participant and document collection; simulated people are not presumed empirical substitutes.", "evidence_strength": "direct_task", "source_ids": ["S06-025", "S06-026", "S09-013", "S09-014"], "source_locators": {"S06-025": "Automating the qualitative interview?, Abstract, Recruitment and application, Sample, Consent and Discussion", "S06-026": "AI-Assisted Conversational Interviewing, journal abstract, PDF pp. 161–164, Results and Discussion", "S09-013": "Onderzoeker v11.0, result areas pp. 2–4 and level criteria pp. 7–8; postdoc is not a fixed UFO level", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8"}, "role_source_ids": ["S09-013", "S09-014"], "limits": "Chatbot interview results come from selected participants and survey settings, not every FEB field context.", "supported_rating": "mixed", "supported_reason": "With FEB’s help, teams could compare transcripts with recordings and test AI-mediated interviews against collection led by a researcher. They would then see where the tool helps, although consent and the relationship between researcher and participants would still shape what participants say. {{S06-025}}{{S06-026}}", "task_scope": "With access and consent addressed, AI transcribes and organises supplied interviews, observations or documents and can assist a specified collection procedure; the researcher checks the record and its context."}, {"id": "postdoc_ap-qualitative-analysis", "cohort": "postdoc_ap", "research_type": "qualitative", "stage": "analysis", "rating": "mixed", "headline": "Suggested codes and rival readings", "summary": "The researcher can use AI-suggested codes and themes after testing each interpretation against the original material.", "paragraphs": ["A researcher who uses AI to code passages needs different checks from one who uses it to interpret an organisational process. In the test by Xiao and colleagues, GPT-3 agreed with expert labels less often than the experts agreed with one another, and the test did not extend to the interpretation of a whole case. {{S07-02}} Braun and Clarke describe analysis as repeated engagement with the material, and qualitative scholars disagree about the role AI should play in reflexive work. {{S07-15}}{{S07-17}}{{S07-18}} A postdoc or assistant professor who knows the setting can test suggested themes against the original passages, although holding the appointment does not by itself give a researcher that familiarity. {{S09-013}}{{S09-014}}"], "opportunity": "By proposing codes and rival readings, AI may help the researcher find passages that challenge an early interpretation of the case.", "risk": "A researcher who accepts a plausible AI theme may overlook what a participant could safely say in that setting or what happened elsewhere in the organisation.", "support": "FEB could combine a checked coding sample with a discussion of disputed passages and contrary cases, in which a colleague familiar with the method takes the lead.", "rating_reason": "Xiao and colleagues tested labels from a fixed codebook, and their study says little about AI interpretations of an entire case. {{S07-02}} When AI also proposes themes, the author has to return to the original passages and to the stated qualitative approach, an engagement that Braun and Clarke treat as part of the analysis itself. {{S07-15}}", "conditions": ["The team distinguishes deductive coding from reflexive or inductive interpretation.", "Researchers retain the originals and can explain why a passage supports a theme."], "applicability": "Applies to coding and interpretation, with a narrower mixed or opportunity assessment possible for validated fixed-codebook tasks.", "evidence_strength": "direct_task", "source_ids": ["S07-02", "S07-15", "S07-17", "S07-18", "S09-013", "S09-014"], "source_locators": {"S07-02": "GPT-3 with an expert codebook in deductive qualitative coding, abstract and case evaluation", "S07-15": "Braun and Clarke, Using thematic analysis in psychology, original PDF pp. 2–4 and 14–17; methodological account, not AI evaluation", "S07-17": "Jowsey, Braun and Clarke et al., position article abstract and methodological argument", "S07-18": "Wise et al., AI-in-the-loop qualitative analysis, abstract and sections on key commitments", "S09-013": "Onderzoeker v11.0, result areas pp. 2–4 and level criteria pp. 7–8; postdoc is not a fixed UFO level", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8"}, "role_source_ids": ["S09-013", "S09-014"], "limits": "One coding case and one interview case do not establish a universal qualitative AI effect.", "supported_rating": "mixed", "supported_reason": "FEB could help the author compare AI codes with a checked sample and then discuss disputed themes next to the original and contrary passages. Some reflexive approaches, however, require the researcher to do the interpretive work directly. {{S07-17}}{{S07-18}}", "task_scope": "AI applies a codebook where appropriate, compares passages and proposes themes or interpretations; the researcher judges these against the original material, context and stated qualitative approach."}, {"id": "postdoc_ap-qualitative-writing", "cohort": "postdoc_ap", "research_type": "qualitative", "stage": "writing", "rating": "mixed", "headline": "Case narratives that drop contrary evidence", "summary": "When AI drafts a qualitative case narrative, the author has to keep each claim and quotation tied to the setting it came from.", "paragraphs": ["An AI draft can make a case narrative easier to read and still misstate what a participant meant, for example by dropping a contradiction or placing a quotation in the wrong context. In thematic analysis, researchers develop their interpretation by returning repeatedly to the material, and accepting a finished summary would skip that step. {{S07-15}} Whether the writing is part of a postdoc’s project duties or of an assistant professor’s independent work, the author needs to explain why the original passages support the final claim. {{S09-013}}{{S09-014}} The European Commission’s living guidelines on generative AI in research also ask researchers to be transparent about consequential AI use. {{S03-006}}"], "opportunity": "An AI draft may help the authors explain a long case and respond to reviewers without writing each section again from the beginning.", "risk": "If the authors accept a smooth AI narrative, the paper may leave out a contrary interview or place a participant’s quotation where it appears to mean something else.", "support": "FEB could provide a claim-to-excerpt check and reserve time for the authors to look at contrary cases and to match each reply to reviewers with the revision it describes.", "rating_reason": "When researchers write up a qualitative finding, they are also deciding how to interpret the material. {{S07-15}} A generated section may help organise the case, but the postdoc or assistant professor has to reopen the quotations and contrary episodes before relying on its claims.", "conditions": ["Original excerpts and context can be revisited.", "The author can explain analytic choices without the generated narrative."], "applicability": "Applies to qualitative articles, peer review, and revision; disclosure follows current venue rules.", "evidence_strength": "methodological", "source_ids": ["S07-15", "S03-006", "S09-013", "S09-014"], "source_locators": {"S07-15": "Braun and Clarke, Using thematic analysis in psychology, pp. 79–91", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9 researcher duties and disclosure, p. 11 organisation", "S09-013": "Onderzoeker v11.0, result areas pp. 2–4 and level criteria pp. 7–8; postdoc is not a fixed UFO level", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8"}, "role_source_ids": ["S09-013", "S09-014"], "limits": "The cited methods and guidance identify duties and failure mechanisms rather than FEB writing outcomes.", "supported_rating": "opportunity", "supported_reason": "FEB could give authors time and a simple way to link each central claim to the underlying passage and its field context. Each reply to a reviewer should also point to the revision that answers the criticism. {{S07-15}}", "supported_headline": "Case findings tied to interview excerpts", "task_scope": "AI drafts substantial accounts or reviewer responses from the project's material and interpretive outline; the researcher checks whether claims and quotations preserve context and contrary evidence."}, {"id": "postdoc_ap-theory_review-question", "cohort": "postdoc_ap", "research_type": "theory_review", "stage": "question", "rating": "mixed", "headline": "Research gaps that restate known ideas", "summary": "The researcher decides which of the theoretical questions that AI proposes deserves a paper.", "paragraphs": ["A theory paper needs a problem that existing arguments have not resolved, so the author has to show what earlier work explains and what the new paper would change. Jaakkola describes several legitimate designs for conceptual papers, and Cornelissen warns that convincing prose can disguise a weak theoretical move. {{S07-33}}{{S13-301}} A postdoc may be working within a defined project, whereas an assistant professor may need the question to anchor a research line, although neither position indicates who has the stronger idea. {{S09-013}}{{S09-014}}"], "opportunity": "The author can use counterexamples and rival mechanisms suggested by AI to test a possible theoretical question before settling on it.", "risk": "An author who builds on a research gap that AI has generated may end up restating a familiar idea, so that the paper offers no new explanation.", "support": "FEB could arrange a discussion with colleagues from the field in which the author states the problem in his or her own words and tests rival mechanisms against pivotal studies.", "rating_reason": "AI may suggest more possible research gaps, but the author has to establish what earlier work leaves unresolved. {{S07-33}} Cornelissen argues that generated theory can look new while adding little explanation, so the author can choose a question only after comparing it closely with the existing literature. {{S13-301}}", "conditions": ["The author has read the pivotal works behind the claimed tension.", "The actual ownership of the project and the expected contribution are clear."], "applicability": "Applies to pure theory, conceptual, and review questions; formal models need explicit premises.", "evidence_strength": "methodological", "source_ids": ["S07-33", "S13-301", "S07-25", "S09-013", "S09-014"], "source_locators": {"S07-33": "Jaakkola, Designing conceptual articles, Table 1, methodological requirements and Conclusions", "S13-301": "Cornelissen, The Artificial Intelligence Con, original author manuscript PDF pp. 3–8; conceptual critique, not outcome data", "S07-25": "Cronin and George, The Why and How of the Integrative Review, local original PDF pp. 1–2 (purpose), 8–10 (collection, balance and integration)", "S09-013": "Onderzoeker v11.0, result areas pp. 2–4 and level criteria pp. 7–8; postdoc is not a fixed UFO level", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8"}, "role_source_ids": ["S09-013", "S09-014"], "limits": "No source estimates AI effects on theory-question quality for this FEB cohort.", "supported_rating": "mixed", "supported_reason": "In a discussion arranged by FEB, a colleague from the field could test the proposed problem against pivotal papers and counterexamples. The author would still have to decide which question advances understanding and suits the intended review or theory paper. {{S07-25}}", "task_scope": "AI proposes theoretical questions, concepts, mechanisms and review boundaries; the researcher selects and justifies the intellectual problem and intended contribution."}, {"id": "postdoc_ap-theory_review-literature", "cohort": "postdoc_ap", "research_type": "theory_review", "stage": "literature", "rating": "mixed", "headline": "Distinct concepts merged across literatures", "summary": "For a theory or review project, AI can widen the set of papers the author compares, as long as the author keeps competing concepts distinct.", "paragraphs": ["A wider collection of papers helps an integrative review only if the author can explain why its studies belong together. Cronin and George describe how integrative reviews build new insight by treating different research streams fairly. {{S07-25}} Studies of AI screening found gains for specific tasks but also missed items, so authors need to inspect what the tool excluded. {{S06-011}}{{S06-012}} A postdoc may be fulfilling a project brief and an assistant professor may be defining a new line of research, and each of them has to judge the original texts. {{S09-013}}{{S09-014}}"], "opportunity": "Searching across fields with AI, the author may find studies that give reason to reconsider how two literatures relate to each other.", "risk": "A generated synthesis may group papers that use the same word for different concepts or leave out a study that does not fit, and an author who accepts that grouping may build the review on it.", "support": "FEB could provide a search log and give the author time to read the disputed exclusions and compare the original papers behind each central connection.", "rating_reason": "Screening studies show that AI can help authors work through a review corpus, although it can also miss relevant work. {{S06-011}}{{S06-012}} For an integrative review, the author must then decide whether the papers can support the proposed connection between literatures. {{S07-25}}", "conditions": ["Search and eligibility rules are written before bulk screening.", "A checked reference set includes difficult borderline studies."], "applicability": "Applies to reviews and to literature grounding for pure theory; screening workflow is specific to structured reviews.", "evidence_strength": "direct_task", "source_ids": ["S07-25", "S06-011", "S06-012", "S07-32", "S09-013", "S09-014"], "source_locators": {"S07-25": "Cronin and George, The Why and How of the Integrative Review, local original PDF pp. 1–2 (purpose), 8–10 (collection, balance and integration)", "S06-011": "GPT-4 review screening evaluation, PubMed abstract Results; task and imbalance limits", "S06-012": "Prompt-tuned GPT-4o living review screening evaluation, PubMed abstract Methods and Results", "S07-32": "Snyder, Literature review as a research methodology, §§2.1–2.2 and Table 2", "S09-013": "Onderzoeker v11.0, result areas pp. 2–4 and level criteria pp. 7–8; postdoc is not a fixed UFO level", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8"}, "role_source_ids": ["S09-013", "S09-014"], "limits": "The direct screening studies are from health reviews using particular systems, not a FEB corpus.", "supported_rating": "opportunity", "supported_reason": "FEB could help authors document exclusions and read the studies behind each cross-field comparison. The wider map becomes useful when the author can ground the new relation in those original papers instead of the model’s theme labels. {{S07-25}}", "task_scope": "AI searches, screens, summarises and compares the relevant literature; the researcher judges coverage, competing traditions and the pivotal original studies.", "supported_headline": "Wider map of related literatures"}, {"id": "postdoc_ap-theory_review-design", "cohort": "postdoc_ap", "research_type": "theory_review", "stage": "design", "rating": "mixed", "headline": "Alternative premises and review boundaries", "summary": "An AI-drafted model or review procedure helps the author once he or she has tested whether its assumptions suit the intended argument.", "paragraphs": ["Authors must choose assumptions that let a model explain the problem at hand. When AI drafts those assumptions or a review procedure, the postdoc or assistant professor needs to ask what the model leaves out and whether the procedure will capture the studies that the review has to explain. Jaakkola sets out different designs for conceptual papers, and Snyder distinguishes types of literature review. {{S07-33}}{{S07-32}} A postdoc may extend a team’s programme, while an assistant professor may be establishing an independent line, and each researcher’s actual assignment shapes the design decision more than any presumed difference in theoretical skill. {{S09-013}}{{S09-014}}"], "opportunity": "The postdoc or assistant professor can ask AI for alternative model assumptions or review boundaries and compare these concrete options before committing the paper to one of them.", "risk": "An AI-drafted assumption may narrow the model until it no longer explains the behaviour of interest, and a drafted review rule may exclude studies that would have changed the conclusion.", "support": "Before the author drafts the full paper, FEB could ask a colleague with expertise in theory or review methods to examine the proposed premises, the excluded studies, and the intended contribution.", "rating_reason": "Jaakkola shows that conceptual papers can follow different designs, and Snyder distinguishes several review procedures. {{S07-33}}{{S07-32}} A structure that AI proposes may help the author choose among them, but a plausible plan can also commit the paper to the wrong intellectual boundary.", "conditions": ["A domain or methods colleague can challenge the premises and eligibility rules.", "The review or theory contribution is specified before any part of the workflow is automated."], "applicability": "Applies to pure theory premises and conceptual or integrative review protocols; their procedures differ.", "evidence_strength": "methodological", "source_ids": ["S07-33", "S07-32", "S09-013", "S09-014"], "source_locators": {"S07-33": "Jaakkola, Designing conceptual articles, Table 1, methodological requirements and Conclusions", "S07-32": "Snyder, Literature review as a research methodology, §§2.1–2.2 and Table 2", "S09-013": "Onderzoeker v11.0, result areas pp. 2–4 and level criteria pp. 7–8; postdoc is not a fixed UFO level", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8"}, "role_source_ids": ["S09-013", "S09-014"], "limits": "The colour reflects methodological reasoning, not observed AI-designed theory or review failure at FEB.", "supported_rating": "mixed", "supported_reason": "FEB could ask a colleague to challenge the proposed assumptions or inclusion rules before the author develops the full paper. The colleague may make weak choices visible, although he or she cannot decide on the author’s behalf what the paper contributes. {{S07-33}}{{S07-32}}", "task_scope": "AI drafts a model's assumptions, a conceptual structure or an integrative-review procedure; the researcher tests whether the design can support a worthwhile contribution."}, {"id": "postdoc_ap-theory_review-data", "cohort": "postdoc_ap", "research_type": "theory_review", "stage": "data", "rating": "opportunity", "headline": "Review sources assembled more quickly", "summary": "When the author checks omissions and extracted details, AI can gather and organise more studies for an integrative review.", "paragraphs": ["An author has to gather prior studies before an integrative review can compare their arguments. AI can assemble the records and remove duplicates, but the researcher needs to inspect exclusions and extracted claims because screening systems vary in accuracy. {{S07-32}}{{S07-20}} A postdoc and an assistant professor may have different project duties, which does not mean that one of them is better at spotting an omitted paper. {{S09-013}}{{S09-014}} The assessment concerns the corpus for a review, and a pure theory paper has no new empirical data to acquire at this stage. {{S07-33}}"], "opportunity": "With AI, the author can assemble and deduplicate more candidate studies for a review while keeping a link from every record back to the original paper.", "risk": "If the AI tool misses studies or extracts their arguments incorrectly and the author does not notice, the review may start from a skewed collection of papers.", "support": "FEB could provide a checked set of known studies and a shared record of exclusions, decisions about duplicates, and extracted passages.", "rating_reason": "The author can inspect excluded items and check a sample of the corpus against the original studies. Research on evidence synthesis found that screening and extraction performance varied, so the larger corpus is useful only when authors carry out those checks. {{S07-20}} The assessment applies to integrative reviews and does not cover new empirical data for pure theory. {{S07-33}}", "conditions": ["Apply this colour to an integrative review corpus, not a pure-theory empirical-data task.", "Original studies and an independently checked sample are available."], "applicability": "Not applicable to the acquisition or preparation of primary empirical data for pure theory. Applicable, and rated opportunity, to the acquisition, deduplication, and extraction of studies for an integrative review.", "evidence_strength": "direct_task", "source_ids": ["S07-32", "S07-20", "S07-33", "S09-013", "S09-014"], "source_locators": {"S07-32": "Snyder, Literature review as a research methodology, §§2.1–2.2 and Table 2", "S07-20": "Clark et al. evidence-synthesis systematic review, PubMed abstract Methods and Results", "S07-33": "Jaakkola, Designing conceptual articles, Table 1, methodological requirements and Conclusions", "S09-013": "Onderzoeker v11.0, result areas pp. 2–4 and level criteria pp. 7–8; postdoc is not a fixed UFO level", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8"}, "role_source_ids": ["S09-013", "S09-014"], "limits": "The synthesis evidence combines heterogeneous, mostly non-FEB settings and older systems; it gives no cohort-specific error rate.", "supported_rating": "opportunity", "supported_reason": "With a shared inclusion log and a checking sample from FEB, authors could see omissions and wrong entries before they start interpreting the corpus. Their later interpretation of the studies would still need separate scrutiny. {{S07-20}}", "task_scope": "For integrative reviews, AI assembles, deduplicates and extracts information from a source corpus; the researcher checks omissions, inclusion decisions and extraction. Pure theory has no empirical data-acquisition task."}, {"id": "postdoc_ap-theory_review-analysis", "cohort": "postdoc_ap", "research_type": "theory_review", "stage": "analysis", "rating": "risk", "headline": "Weakly supported derivations and syntheses", "summary": "When AI derives results or combines studies, the author has to test the premises and whether the evidence leads to the conclusion.", "paragraphs": ["When AI develops a model’s derivation or a review’s synthesis, the author must ask whether the formal result follows from its assumptions and whether the studies really support the proposed connection. Makadok sets out this duty for formal theory, and Cronin and George set it out for integrative reviews. {{S13-306}}{{S07-25}} Messeri and Crockett describe how scientists may come to feel that they understand more than they have established. {{S06-014}} Whatever their experience with the particular task, a postdoc or assistant professor has to be able to defend the resulting argument. {{S09-013}}{{S09-014}}"], "opportunity": "When AI proposes candidate derivations and interpretations across studies, the author has more explanations and counterexamples to examine before choosing an argument.", "risk": "The author may adopt a convincing derivation that starts from the wrong premise, or a review synthesis that combines studies that do not belong together.", "support": "FEB could arrange separate checks of the formal steps and of the claims across studies, in which a colleague challenges the assumptions and raises counterexamples before submission.", "rating_reason": "In formal theory, authors have to explain their assumptions and how a result follows from them. {{S13-306}} In integrative reviews, they have to read the studies fairly before drawing a new relation among them. {{S07-25}} The author therefore has to check each proposed derivation against its assumptions and each synthesis against the original papers.", "conditions": ["Formal steps or quoted source claims can be inspected.", "The team tests premises, conceptual fit, and contrary evidence."], "applicability": "Applies to formal derivation and conceptual or integrative synthesis with distinct tests.", "evidence_strength": "methodological", "source_ids": ["S13-306", "S07-25", "S07-32", "S06-014", "S09-013", "S09-014"], "source_locators": {"S13-306": "Makadok, Guidance for AMR Authors about Making Formal Theory Accessible, original PDF pp. 193–204; formal-theory author guidance", "S07-25": "Cronin and George, The Why and How of the Integrative Review, local original PDF pp. 1–2 (purpose), 8–10 (collection, balance and integration)", "S07-32": "Snyder, Literature review as a research methodology, §§2.1–2.2 and Table 2", "S06-014": "Artificial intelligence and illusions of understanding, Nature abstract and Discussion; perspective, not outcome evaluation", "S09-013": "Onderzoeker v11.0, result areas pp. 2–4 and level criteria pp. 7–8; postdoc is not a fixed UFO level", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8"}, "role_source_ids": ["S09-013", "S09-014"], "limits": "There is no direct FEB experiment measuring AI effects on whole theory or integrative-review arguments.", "supported_rating": "mixed", "supported_reason": "FEB could help authors check the formal steps and read the pivotal studies next to the AI synthesis. A colleague may then spot a weak premise or a missing counterexample, but the author still has to decide whether the argument adds something. {{S13-306}}{{S07-25}}", "supported_headline": "Formal steps and syntheses checked separately", "task_scope": "AI develops candidate derivations, mechanisms or a synthesis of studies; the researcher tests their validity, counterexamples and contribution against premises and sources."}, {"id": "postdoc_ap-theory_review-writing", "cohort": "postdoc_ap", "research_type": "theory_review", "stage": "writing", "rating": "mixed", "headline": "Fluent drafts with unclear contribution", "summary": "Authors who let AI draft theory or review sections need to check what the paper adds and whether its sources support the claims.", "paragraphs": ["A theory paper may read smoothly without giving readers a new explanation. With AI, a postdoc or assistant professor may draft the paper faster, but the author has to identify the new reasoning and show where the original studies support it. Jaakkola distinguishes the kinds of contribution a conceptual paper can make, and Cornelissen warns that generated theory can imitate such a contribution. {{S07-33}}{{S13-301}} A retrieval system can make a citation traceable without showing that the cited study warrants the claim. {{S08-020}} What the postdoc and the assistant professor are each responsible for in the paper follows from their appointments. {{S09-013}}{{S09-014}}"], "opportunity": "Long theory sections and replies to reviewers can take a postdoc or assistant professor less time when AI drafts them from the author’s own premises, sources, and outline.", "risk": "A draft that sounds clear may repeat an old argument, and the authors may send a reply that seems to answer a reviewer while the underlying problem remains.", "support": "FEB could provide a claim-to-source check and a discussion in which the author explains the contribution and shows how each concern raised by reviewers has been resolved.", "rating_reason": "Cornelissen argues that generated theory can resemble a contribution without explaining a new mechanism. {{S13-301}} A postdoc or assistant professor therefore gains from faster drafting only by checking whether the argument follows from its premises and adds something to the cited studies.", "conditions": ["The author can defend the contribution without the generated draft.", "Pivotal citations and venue disclosure requirements are verified."], "applicability": "Applies to conceptual, formal, and review writing and revision; each has a different contribution test.", "evidence_strength": "methodological", "source_ids": ["S07-33", "S13-301", "S08-020", "S09-013", "S09-014"], "source_locators": {"S07-33": "Jaakkola, Designing conceptual articles, Table 1, methodological requirements and Conclusions", "S13-301": "Cornelissen, The Artificial Intelligence Con, original author manuscript PDF pp. 3–8; conceptual critique, not an estimated AI effect", "S08-020": "OpenScholar literature synthesis evaluation, Nature opening, Table 1 and Methods baseline-model section", "S09-013": "Onderzoeker v11.0, result areas pp. 2–4 and level criteria pp. 7–8; postdoc is not a fixed UFO level", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8"}, "role_source_ids": ["S09-013", "S09-014"], "limits": "The sources give methodological standards and task evidence, not a measured writing effect for the cohort.", "supported_rating": "opportunity", "supported_reason": "If FEB gave authors time to link the central claims to their sources and each reply to reviewers to an actual revision, the authors could use the clearer draft to communicate the paper. Readers would then also be able to see whether it makes the intended contribution. {{S07-33}}{{S08-020}}", "supported_headline": "Clearer theory drafts with traceable sources", "task_scope": "AI drafts substantial manuscript sections or reviewer responses from the researchers' premises, sources and outline; the researchers assess whether the resulting argument and contribution are defensible."}, {"id": "senior-quantitative-question", "cohort": "senior", "research_type": "quantitative", "stage": "question", "rating": "opportunity", "headline": "Wider choice of testable questions", "summary": "When AI suggests research questions and hypotheses, the professor chooses those that the available evidence could actually answer. {{S13-103}}", "paragraphs": ["An associate or full professor may build several projects around one question, so an early choice can affect the work of colleagues and PhD candidates. The UFO profiles for both positions include acquiring research funding and coordinating research. {{S09-015}}{{S09-016}} That wider reach makes a careful choice of question more valuable, although a question that a professor has chosen can still be unsound."], "opportunity": "A professor who knows the subject and the available data can ask AI for rival explanations of a familiar problem and so weigh more options before a grant proposal or study takes shape.", "risk": "A research team may spend months pursuing a plausible question when the proposed data cannot separate its explanation from other possible explanations.", "support": "A FEB question clinic could bring a subject specialist and a methods specialist together to discuss a proposed question with the professor before it is committed to a grant proposal or a wider research programme.", "rating_reason": "A product-innovation experiment found larger gains from AI in generating ideas than in selecting among them. {{S13-103}} Because selection improved less, the benefit of more candidate questions depends on a professor who knows the subject and the data, and the professorial rank alone does not guarantee that knowledge.", "conditions": ["The professor or a collaborator has relevant experience with this subject, method, and data route.", "The proposed data can distinguish at least some of the alternative explanations."], "applicability": "Applicable to quantitative research, including experiments, archival studies, and statistical meta-analysis; questions may be revised after analysis.", "evidence_strength": "adjacent", "source_ids": ["S13-103", "S09-015", "S09-016"], "source_locators": {"S13-103": "Original Organization Science PDF pp. 12–18, idea generation versus selection", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}, "role_source_ids": ["S09-015", "S09-016"], "limits": "No source estimates how much associate and full professors at FEB benefit from AI-generated research questions.", "supported_rating": "opportunity", "supported_reason": "In a FEB question clinic, colleagues could ask what each proposed explanation predicts and whether the intended data can separate those predictions. The professor would then choose the question that merits a study or grant with a clearer view of what the data can distinguish.", "supported_headline": "Questions matched to the available data", "task_scope": "AI proposes research questions, mechanisms and hypotheses for the project's subject and plausible evidence; the researcher selects and justifies the question."}, {"id": "senior-quantitative-literature", "cohort": "senior", "research_type": "quantitative", "stage": "literature", "rating": "opportunity", "headline": "Measures and findings from neighbouring fields", "summary": "AI searches for studies and compares their measures, designs, and findings, and the professor reads the papers behind the central claims. {{S08-020}}", "paragraphs": ["A professor may use the same literature map in a manuscript, a grant proposal, and the work of the PhD candidates whom the professor supervises. Because AI citation recommendations can favour prominent papers, the professor should reopen the central studies and look for contrary evidence before reusing the map across projects. {{S08-017}}{{S09-015}}"], "opportunity": "AI can show how researchers in neighbouring fields have measured the same problem, and the professor may find in those studies a comparison that a grant proposal or paper still lacks.", "risk": "An AI summary may miss an important study or lean too heavily on highly cited work, and the professor may then reuse that summary in several projects.", "support": "A librarian could keep a record of the search terms and source passages, and a colleague in the same subject could look for contrary or less-cited studies before the professor reuses the map.", "rating_reason": "In its tests, OpenScholar improved answers that synthesise several papers as well as the citations supporting them, which gives reason to expect a wider initial map of the literature, though not a time saving. {{S08-020}} The professor needs to read the papers behind the map’s consequential claims before using it in several projects.", "conditions": ["A traceable corpus and search trail are available.", "A knowledgeable reviewer checks the central claims against the original studies."], "applicability": "Applicable whenever prior quantitative evidence informs a question, design, or grant case, including statistical meta-analysis.", "evidence_strength": "adjacent", "source_ids": ["S08-020", "S08-017", "S09-015", "S09-016"], "source_locators": {"S08-020": "OpenScholar Nature main text Table 1 and Methods, retrieval-based synthesis", "S08-017": "Algaba et al. arXiv abstract, experiment and results, citation recommendation bias", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}, "role_source_ids": ["S09-015", "S09-016"], "limits": "The synthesis studies do not measure completeness or workload in FEB grant and programme reviews.", "supported_rating": "opportunity", "supported_reason": "FEB could provide search records that link each statement to its source passage, together with a check for contrary studies. With those records, the professor can see more easily what the literature map covers and judge whether the studies use comparable measures and designs. {{S08-020}}", "supported_headline": "Traceable map including contrary studies", "task_scope": "AI searches, screens, summarises and compares relevant studies; the researcher assesses coverage and reads the pivotal originals."}, {"id": "senior-quantitative-design", "cohort": "senior", "research_type": "quantitative", "stage": "design", "rating": "mixed", "headline": "Several study designs to compare", "summary": "The professor judges whether the comparison and measures in an AI-drafted design, and in its alternative checks, can answer the research question. {{S06-002}}{{S07-07}}", "paragraphs": ["The PhD candidates in a professor’s group may later carry out a design that the professor approved, and the UFO profiles for associate and full professors include both research and supervision duties. {{S09-015}}{{S09-016}} An early discussion with a methods specialist is therefore useful when the planned comparison or measurement lies outside the professor’s own expertise."], "opportunity": "Because AI can set out alternative study designs early, the professor can compare what each design would actually estimate before the team commits to one of them.", "risk": "The AI-drafted design may use the wrong comparison or a weak measure, and colleagues and PhD candidates working on linked projects may then build on that choice.", "support": "A FEB methods adviser could go through the proposed comparison and measures with the research team before the team submits a grant proposal or fixes the study plan.", "rating_reason": "The professor has to establish which comparison supports the proposed estimate and whether the measures capture the intended variables. {{S06-002}}{{S07-07}} Holding a professorship does not guarantee knowledge of every method used in a research group, so the gain from AI-supplied alternatives depends on whether someone in the team knows the method well.", "conditions": ["A qualified methods reviewer is available.", "Data access and measures are checked before the team commits to the design."], "applicability": "Applicable to quantitative design, including experiments, surveys, archival identification, and statistical meta-analysis.", "evidence_strength": "methodological", "source_ids": ["S06-002", "S07-07", "S09-015", "S09-016"], "source_locators": {"S06-002": "JEP abstract and introduction, credibility and identification in empirical economics", "S07-07": "Christensen and Hansen, AEA Papers and Proceedings, pp. 92–97: generated covariates, bias and valid inference.", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}, "role_source_ids": ["S09-015", "S09-016"], "limits": "The cited method sources establish design requirements; they do not report observed failure rates for AI-assisted designs by FEB professors.", "supported_rating": "mixed", "supported_reason": "A FEB methods adviser who reviews the comparison and measures before the grant proposal or study plan is fixed may expose weak assumptions early. The researchers, however, have to decide for themselves whether their setting permits the intended inference. {{S06-002}}", "supported_headline": "Methods review before commitment", "task_scope": "AI drafts a substantive design or model specification and alternative checks; the researcher assesses the estimand, assumptions and feasibility."}, {"id": "senior-quantitative-data", "cohort": "senior", "research_type": "quantitative", "stage": "data", "rating": "opportunity", "headline": "Faster preparation of research data", "summary": "AI can retrieve, extract, clean, and link records that the project is permitted to use, and the researchers check the resulting measures against the original records. {{S06-023}}{{S07-32}}", "paragraphs": ["The gain depends on whether the researchers can trace each variable back to its source record. A professor may review datasets that several colleagues assembled, and for that review a documented check of a sample of records is more useful than a general assurance that the extraction ran successfully. {{S09-015}}{{S09-016}}"], "opportunity": "AI can assemble records or results from prior studies and flag anomalies, so the researchers have more material that they can inspect directly.", "risk": "If the professor accepts a prepared dataset too quickly, incorrect record links or extracted values can carry over into several analyses.", "support": "A research-data adviser could help the team check a sample of record links and extracted values and document the corrections before the analysis starts.", "rating_reason": "The team can check the prepared records, links, and measures against the source material, which makes AI assistance with this task a plausible gain even without a faculty programme. Statistical meta-analysis also requires careful extraction of study results from the original studies. {{S07-32}} When the professor oversees data that several colleagues use, those checks need to be repeatable.", "conditions": ["The project has permission to use the material and the tool.", "Measures, record links, and transformations are checked against the source records."], "applicability": "Applicable to numeric data acquisition and preparation, including prior-study effect sizes in statistical meta-analysis; access depends on the source.", "evidence_strength": "direct_task", "source_ids": ["S06-023", "S06-021", "S07-32", "S09-015", "S09-016"], "source_locators": {"S06-023": "SEC EDGAR API overview, submissions, XBRL and programmatic access sections", "S06-021": "CBS Microdata “How does it work?”, steps 1–4, project authorisation and controlled environment", "S07-32": "Snyder §§2.1–2.2 and Table 2, systematic, semi-systematic and integrative reviews", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}, "role_source_ids": ["S09-015", "S09-016"], "limits": "No cited source establishes permissions or extraction accuracy for a particular FEB dataset.", "supported_rating": "opportunity", "supported_reason": "With a short FEB audit protocol for sampling source records and checking transformations, colleagues can examine the same prepared data in the same way. The protocol is particularly useful when a professor oversees records that are used in more than one study.", "supported_headline": "Shared audit of prepared records", "task_scope": "For material the project is permitted to use, AI retrieves, extracts, cleans and links records or study results; the researcher validates measures and transformations. Data-access rights remain a separate constraint."}, {"id": "senior-quantitative-analysis", "cohort": "senior", "research_type": "quantitative", "stage": "analysis", "rating": "mixed", "headline": "Alternative specifications and a larger review load", "summary": "When AI writes the estimation code, robustness checks, and a proposed interpretation, the professor examines both the output and the claim that the team makes from it. {{S07-01}}", "paragraphs": ["A professor may sign off on analyses that colleagues conducted, as part of the research and supervisory responsibilities described in the UFO profiles. {{S09-015}}{{S09-016}} When AI produces many plausible robustness checks, the professor should decide which of them test the study’s main claim and not take the sheer number of results as reassurance."], "opportunity": "When AI runs alternative specifications, the team can see more easily whether a finding holds up under the robustness checks it has chosen.", "risk": "Code that runs successfully may still contain coding errors or lead to an overdrawn interpretation, and each additional result adds to the professor’s review load.", "support": "A methods adviser could reproduce the central results independently and discuss with the authors whether the comparison and measures support their interpretation.", "rating_reason": "In a randomised reproduction task, AI-assisted teams reproduced many results, whereas teams working without AI found more major coding errors. {{S07-01}} A professor who receives more AI output therefore has more to inspect, and whether the gain outweighs that extra work depends on the model, the data, and the time that independent checks require.", "conditions": ["The main outputs can be reproduced independently.", "A reviewer can test the identification strategy and the measures."], "applicability": "Applicable to statistical estimation, statistical meta-analysis, robustness checks, and substantive interpretation.", "evidence_strength": "direct_task", "source_ids": ["S07-01", "S09-015", "S09-016"], "source_locators": {"S07-01": "Brodeur et al. pp. 2–7, Table 1; limitations pp. 9–10", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}, "role_source_ids": ["S09-015", "S09-016"], "limits": "Replication studies do not estimate the performance of FEB professors or validate a full new research programme.", "supported_rating": "mixed", "supported_reason": "If teams reproduce the central results in a separate workflow with FEB support and explain the comparison behind each estimate, they can find coding errors more easily. The reproduction leaves open how the result should be interpreted. {{S07-01}}", "supported_headline": "Main results reproduced independently", "task_scope": "AI produces the main estimation or synthesis code, robustness analyses and proposed interpretation; the researcher checks execution, errors and what the result can establish."}, {"id": "senior-quantitative-writing", "cohort": "senior", "research_type": "quantitative", "stage": "writing", "rating": "mixed", "headline": "Faster drafts with more claims to verify", "summary": "AI drafts manuscript sections and reviewer replies from the results and an outline, and the authors check whether each claim follows from the evidence. {{S06-020}}", "paragraphs": ["Professors write their own papers and often review their collaborators’ drafts. {{S09-015}}{{S09-016}} When AI produces a full section, checking the citations is not enough, and the professor also needs to see whether each reported result supports the sentence written around it."], "opportunity": "If AI drafts substantial sections and helps organise a revision, the professor can give more attention to the argument of the paper.", "risk": "AI-generated versions of a text can increase the number of claims that the professor has to verify, in the professor’s own papers as well as in collaborators’ manuscripts.", "support": "A FEB writing clinic could give teams a template that links each claim to a result and test whether drafting with AI, including the verification, saves authors time across supervised manuscripts.", "rating_reason": "Professors may need less time to draft a section but more time to check their own manuscripts and the manuscripts they supervise. An audit of manuscripts at one journal linked high AI-detector scores with weaker writing measures, although it could not identify a causal effect of AI use. {{S06-020}}", "conditions": ["The reviewer has access to the results and the source passages.", "The authors follow the venue’s rules on disclosure and reproducibility."], "applicability": "Applicable to manuscripts, revisions, and grant text derived from quantitative work, including statistical meta-analysis.", "evidence_strength": "adjacent", "source_ids": ["S06-020", "S09-015", "S09-016"], "source_locators": {"S06-020": "Original Organization Science PDF pp. 5–10 and p. 19 endnote 8", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}, "role_source_ids": ["S09-015", "S09-016"], "limits": "The references establish quality obligations and task risks; they do not observe a drafting effect at FEB.", "supported_rating": "opportunity", "supported_reason": "A record that links each claim to its result would let the professor find the evidence behind each important sentence more easily, and FEB could help teams keep that record during revision. The authors can then check the final argument and the response to the journal, for which they remain responsible.", "supported_headline": "Each claim traced to a result", "task_scope": "AI drafts substantial manuscript sections or reviewer responses from the project's evidence and outline; the researchers assess the argument and final claims."}, {"id": "senior-qualitative-question", "cohort": "senior", "research_type": "qualitative", "stage": "question", "rating": "opportunity", "headline": "Rival explanations for field observations", "summary": "Researchers use their knowledge of the field to choose among the questions and possible explanations that AI proposes for a setting. {{S07-15}}{{S09-033}}", "paragraphs": ["A professor can set a question for junior colleagues and in that way shape their subsequent fieldwork. {{S09-015}}{{S09-016}} AI is useful at this stage because it widens the choice of questions, and the researchers then have to establish whether a suggested puzzle reflects what actually happens in this setting."], "opportunity": "AI can suggest another explanation for an event that the team has observed, which a researcher with contacts in the field can then test with participants.", "risk": "If nobody compares a plausible question with the field observations, the professor may steer a whole team away from what participants actually do.", "support": "In a discussion of the proposed questions, the team could use its field notes to ask which observations would distinguish the rival explanations in this setting.", "rating_reason": "Candidate questions help when the professor knows the setting through relevant field contact and has experience with the method, because qualitative inquiry ties a question to the evidence that a setting can yield. {{S07-15}}{{S09-033}} A professorship alone provides neither that contact nor that experience.", "conditions": ["The professor or a collaborator has relevant experience and contacts in this field setting.", "The participants and the chosen methods can address the rival questions."], "applicability": "Applicable to interviews, observations, case studies, and qualitative text research.", "evidence_strength": "methodological", "source_ids": ["S07-15", "S09-033", "S09-015", "S09-016"], "source_locators": {"S07-15": "Braun and Clarke pp. 79–91, thematic analysis choices and iteration", "S09-033": "Collins 1974 pp. 177–178, 182–184, transfer of tacit scientific know-how", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}, "role_source_ids": ["S09-015", "S09-016"], "limits": "The method and tacit-knowledge sources do not compare AI question quality by academic rank.", "supported_rating": "opportunity", "supported_reason": "FEB could ask a colleague with field experience to challenge each proposed question against the team’s notes, its access to participants, and the observations it can feasibly make. The professor can then choose a question for the team without treating the AI suggestion as evidence from the field.", "supported_headline": "Questions weighed against field notes", "task_scope": "AI proposes questions, concepts and possible explanations for the project's setting; the researcher judges their relevance and fit with inquiry in that setting."}, {"id": "senior-qualitative-literature", "cohort": "senior", "research_type": "qualitative", "stage": "literature", "rating": "opportunity", "headline": "Unfamiliar research traditions brought into view", "summary": "AI searches for and compares studies from different research traditions, and the professor reads the original studies wherever conceptual differences affect a claim. {{S08-020}}", "paragraphs": ["Supervising PhD candidates is one of the duties in the UFO profiles, and a professor may use an AI literature map to guide what those candidates read. {{S09-015}}{{S09-016}} If the map treats two different constructs as equivalent, that mistake could persist across several papers unless the professor checks the studies on which the comparison rests."], "opportunity": "A professor can use AI to bring an unfamiliar research tradition into view and to see how its studies describe a setting similar to the one in the project.", "risk": "Studies that use similar labels may differ in method or meaning, and AI citation recommendations may leave out work published outside the most visible journals.", "support": "A colleague from the neighbouring tradition could read the source passages and question the proposed comparison before the professor uses the map to guide further reading.", "rating_reason": "A broader search can help the professor find relevant studies, and retrieval tests support that benefit, whereas the bias found in AI citation recommendations is a reason to inspect less-cited work as well. {{S08-020}}{{S08-017}} Before relying on the map, the professor has to decide whether the concepts and settings in those studies can be compared.", "conditions": ["Full passages of the studies are accessible.", "A reader who knows the field reviews the synthesis."], "applicability": "Applicable when qualitative research engages prior field, interpretive, or methodological studies.", "evidence_strength": "adjacent", "source_ids": ["S08-020", "S08-017", "S09-015", "S09-016"], "source_locators": {"S08-020": "OpenScholar Nature main text Table 1 and Methods, retrieval-based synthesis", "S08-017": "Algaba et al. arXiv abstract, experiment and results, citation recommendation bias", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}, "role_source_ids": ["S09-015", "S09-016"], "limits": "No source measures the completeness of AI literature maps for FEB qualitative fields.", "supported_rating": "opportunity", "supported_reason": "With FEB support, the original passages can stay beside each proposed comparison, and a knowledgeable colleague can examine less-cited counterarguments. The map can then guide the professor’s reading, while the original passages show what the unfamiliar tradition means.", "supported_headline": "Comparisons kept beside original passages", "task_scope": "AI searches, screens, summarises and compares relevant studies; the researcher assesses coverage, theoretical differences and pivotal originals."}, {"id": "senior-qualitative-design", "cohort": "senior", "research_type": "qualitative", "stage": "design", "rating": "mixed", "headline": "Complete protocols that need local adaptation", "summary": "Researchers judge how well an AI-drafted sampling plan, interview guide, or observation plan fits the setting they will study. {{S06-024}}", "paragraphs": ["Junior researchers may take a protocol set by a professor into their own interviews. {{S09-015}}{{S09-016}} The team should therefore try out an AI-written interview guide with people who know the setting, especially when access, trust, or local language could change what a question elicits."], "opportunity": "An AI draft of a complete interview guide or sampling plan gives the team something concrete to discuss before it approaches gatekeepers or participants.", "risk": "An AI-drafted protocol may target the wrong people or contain questions that participants in this setting cannot answer openly.", "support": "The team could review the proposed participants and interview questions with a colleague who knows the setting and its practical constraints.", "rating_reason": "To judge whom the team can approach and what participants are likely to say, the professor needs knowledge of the field, even when an AI draft offers useful options. Because the professor’s role can include guiding the fieldwork of others, an error in the early design may carry over into the interviews of several researchers. {{S06-024}}{{S09-015}}", "conditions": ["The team knows the route to gatekeepers and participants.", "The selected method allows the proposed role for AI."], "applicability": "Applicable to qualitative designs with human participants and to text or case studies with their own access terms.", "evidence_strength": "methodological", "source_ids": ["S06-024", "S09-015", "S09-016"], "source_locators": {"S06-024": "Riese publisher abstract, sentences 1–3, qualitative access relationship", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}, "role_source_ids": ["S09-015", "S09-016"], "limits": "The cited examples do not establish AI equivalence for every field setting or reflexive method.", "supported_rating": "mixed", "supported_reason": "FEB could involve a colleague with field experience in reviewing the protocol before recruitment, and that discussion may improve the plan. Once in the field, however, the researchers have to build trust and adapt their questions to what they encounter. {{S06-024}}", "supported_headline": "Protocol reviewed by a field colleague", "task_scope": "AI drafts a sampling approach, interview guide or observational plan; the researcher assesses fit with the setting, ethics and emerging question."}, {"id": "senior-qualitative-data", "cohort": "senior", "research_type": "qualitative", "stage": "data", "rating": "mixed", "headline": "Faster field records of uneven quality", "summary": "AI can transcribe and organise interviews or assist with a specified collection procedure, and the researchers examine the resulting record in its context. {{S06-025}}{{S06-026}}", "paragraphs": ["When several interviewers collect the data, a professor may oversee their work. {{S09-015}}{{S09-016}} By comparing transcripts with recordings and field notes, the team can see whether the same prompt produced different answers because of the person, the setting, or the tool."], "opportunity": "With AI preparing transcripts and organising field records, the researchers can review more of their material while the conversations are still recent.", "risk": "When an AI tool conducts or assists the interview, participants may disclose different things, and an AI transcript may miss a pause or remark that changes the meaning.", "support": "Alongside spot checks of transcripts, the team could keep a record of how the AI tool changed the interview procedure and the participants’ responses.", "rating_reason": "Studies of AI-assisted interviews found useful responses but also missed probes and costs to the participants’ experience. {{S06-025}}{{S06-026}} A team can check a transcript against the audio, although such a check cannot show what the participant would have said in an interview led by a researcher.", "conditions": ["Participants are informed as required.", "The tool and the storage route fit the project’s permissions."], "applicability": "Applicable to interviews, observations, cases, and qualitative corpora; the exact data route differs.", "evidence_strength": "direct_task", "source_ids": ["S06-024", "S06-025", "S06-026", "S09-015", "S09-016"], "source_locators": {"S06-024": "Riese publisher abstract, sentences 1–3, qualitative access relationship", "S06-025": "Jack et al., abstract; Recruitment and application; Sample; Discussion; Consent", "S06-026": "Barari et al., journal abstract; PDF pp. 161–164; Results and Discussion", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}, "role_source_ids": ["S09-015", "S09-016"], "limits": "The interviewing studies use selected settings and do not establish equivalence in FEB fieldwork.", "supported_rating": "mixed", "supported_reason": "When FEB supports transcript sampling and a review of the interview procedure, a professor can see where a tool changed or omitted information. Even a checked transcript needs the field context that the research team supplies.", "supported_headline": "Transcripts sampled against recordings", "task_scope": "With access and consent addressed, AI transcribes and organises supplied interviews, observations or documents and can assist a specified collection procedure; the researcher checks the record and its context."}, {"id": "senior-qualitative-analysis", "cohort": "senior", "research_type": "qualitative", "stage": "analysis", "rating": "mixed", "headline": "Candidate themes for the team to examine", "summary": "Before making interpretive claims from AI-coded passages and proposed themes, the researchers return to the interviews, the sequence of events, and contrary material. {{S07-02}}{{S07-15}}", "paragraphs": ["PhD candidates may build their case narratives on themes that a professor has approved. {{S09-015}}{{S09-016}} In reviewing those themes, the professor should above all check whether the interpretation still fits when a reader goes back to the whole interview and its context, and not only to isolated coded excerpts. {{S07-16}}"], "opportunity": "AI can collect the passages that belong under a code and propose a theme, which gives the team a concrete interpretation to examine.", "risk": "An AI-proposed theme may sound convincing yet overlook a participant’s hesitation, a change over time, or an interview that contradicts it.", "support": "A second reader could examine the disputed passages and keep a simple record that links each proposed theme to its interviews and to contrary cases.", "rating_reason": "Tests of AI assistance with a predefined codebook show that it can help with some coding tasks, although they do not validate a complete AI interpretation. {{S07-02}} The professor therefore has to compare the suggested themes with the original passages and with rival readings, especially when colleagues will build their own work on those themes. {{S07-15}}", "conditions": ["The analytic tradition permits the proposed use of AI.", "The team can inspect source excerpts and disagreements."], "applicability": "Applicable to qualitative coding, thematic interpretation, and case comparison, with method-specific variation.", "evidence_strength": "direct_task", "source_ids": ["S07-02", "S07-15", "S07-16", "S09-015", "S09-016"], "source_locators": {"S07-02": "author repository abstract and deductive-codebook case evaluation", "S07-15": "Braun and Clarke pp. 79–91, thematic analysis choices and iteration", "S07-16": "Matta et al. Methods, Case and Discussion, missed context in interview analysis", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}, "role_source_ids": ["S09-015", "S09-016"], "limits": "The cited cases do not quantify qualitative analysis quality across FEB fields or senior ranks.", "supported_rating": "mixed", "supported_reason": "FEB could help teams keep an excerpt trail and arrange a second reading of the interviews that challenge a proposed theme. The second reading improves scrutiny of the theme, but it leaves the author to decide what the interpretation means. {{S07-15}}", "supported_headline": "Excerpt trail and second reading", "task_scope": "AI applies a codebook where appropriate, compares passages and proposes themes or interpretations; the researcher judges these against the original material, context and stated qualitative approach."}, {"id": "senior-qualitative-writing", "cohort": "senior", "research_type": "qualitative", "stage": "writing", "rating": "mixed", "headline": "Fuller case drafts that may omit disagreement", "summary": "AI drafts case sections and replies to reviewers, and the authors check whether the quotations and process claims in them preserve context and contrary evidence. {{S07-15}}{{S07-16}}", "paragraphs": ["Professors may guide PhD candidates in writing case studies as well as write their own. {{S09-015}}{{S09-016}} When AI drafts a substantial narrative, the professor needs to read the full passages behind its central claims and the participants’ versions of events that disagree with them."], "opportunity": "A fuller AI draft of the case narrative gives the professor and co-authors a text that they can compare with the interview record.", "risk": "An AI-drafted narrative may leave out disagreements between participants or present a sequence of events as a stronger causal claim than the material supports.", "support": "A template that links each claim to its excerpts could help the team find passages that do not fit the draft’s interpretation before the professor submits the manuscript.", "rating_reason": "A complete AI draft can help organise a case, and the professor then has to connect each process claim to events and to what participants said, because qualitative analysis requires attention to context and contrary cases. {{S07-15}}{{S07-16}} When the professor checks several supervised drafts in this way, the checking can take up the time that AI saved in drafting.", "conditions": ["Researchers retain access to the original material.", "The venue permits AI use and receives any required disclosure."], "applicability": "Applicable to qualitative manuscripts, reviews, revisions, and research communication.", "evidence_strength": "adjacent", "source_ids": ["S07-15", "S07-16", "S09-015", "S09-016"], "source_locators": {"S07-15": "Braun and Clarke pp. 79–91, thematic analysis choices and iteration", "S07-16": "Matta et al. Methods, Case and Discussion, missed context in interview analysis", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}, "role_source_ids": ["S09-015", "S09-016"], "limits": "The source evidence supports methodological safeguards; it does not measure AI writing gains in FEB case studies.", "supported_rating": "opportunity", "supported_reason": "If FEB helps authors keep a trail that links each claim to its excerpts, they can check quotations and disagreements before submission and so make better use of the AI draft. The authors then judge which interpretation the case evidence warrants with the relevant passages in front of them. {{S07-15}}", "supported_headline": "Case claims linked to interview excerpts", "task_scope": "AI drafts substantial accounts or reviewer responses from the project's material and interpretive outline; the researcher checks whether claims and quotations preserve context and contrary evidence."}, {"id": "senior-theory_review-question", "cohort": "senior", "research_type": "theory_review", "stage": "question", "rating": "mixed", "headline": "More framings of theoretical questions", "summary": "From the concepts, mechanisms, and review boundaries that AI proposes, the professor selects a problem that prior theory has not already resolved. {{S13-301}}{{S13-306}}", "paragraphs": ["A demonstration in finance shows that AI can fit many alternative explanations to selected signals, although it does not estimate the quality of theoretical questions at FEB. {{S13-307}} A professor may also set a question that collaborators then pursue, so an attractive label can shape more than one paper. {{S09-015}}{{S09-016}}"], "opportunity": "AI can generate rival explanations and possible review boundaries, so the professor has more ways to frame a theoretical question before settling on one.", "risk": "A new label may restate an idea that prior theory already covers, and a neat mechanism may fit only the examples that were used to prompt it.", "support": "In a FEB theory clinic, colleagues could compare each proposed concept with prior work, with counterexamples, and with the phenomenon that the professor wants to explain.", "rating_reason": "Cornelissen warns that AI makes it easy to generate plausible labels and stories constructed after the fact. {{S13-301}} A larger set of alternatives can help, as long as the professor knows the phenomenon and prior theory well enough to judge whether a question would add an explanation.", "conditions": ["The professor or a collaborator knows the relevant phenomenon and theoretical traditions.", "The pivotal literatures, premises, and counterexamples can be checked."], "applicability": "Applicable to conceptual theory and the framing of non-statistical literature reviews.", "evidence_strength": "methodological", "source_ids": ["S13-301", "S13-306", "S13-307", "S09-015", "S09-016"], "source_locators": {"S13-301": "Organization Studies local accepted manuscript PDF pp. 5–8 (manuscript pp. 4–7)", "S13-307": "AEA Journal of Economic Literature publisher abstract, DOI 10.1257/jel.20251821; full text unavailable", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S13-306": "Makadok original AMR PDF pp. 193–198, formal assumptions and derivations"}, "role_source_ids": ["S09-015", "S09-016"], "limits": "The biomedical ideation evidence cannot establish the quality of FEB conceptual contributions.", "supported_rating": "opportunity", "supported_reason": "A colleague from a neighbouring tradition, brought into the discussion by FEB, could compare each proposed mechanism with a real phenomenon together with the professor. The colleague’s scrutiny can help the professor select a better question, although it cannot certify that the eventual contribution is original. {{S13-301}}{{S13-306}}", "supported_headline": "Framings challenged by a second tradition", "task_scope": "AI proposes theoretical questions, concepts, mechanisms and review boundaries; the researcher selects and justifies the intellectual problem and intended contribution."}, {"id": "senior-theory_review-literature", "cohort": "senior", "research_type": "theory_review", "stage": "literature", "rating": "mixed", "headline": "Broader search that may conflate concepts", "summary": "When AI searches for and compares conceptual studies or candidate studies for a review, the author reads the papers on which the synthesis turns. {{S06-006}}{{S08-020}}", "paragraphs": ["Professors may direct review work that several collaborators carry out. {{S09-015}}{{S09-016}} When an AI map places neighbouring literatures together, the author has to explain what makes the studies belong in one synthesis beyond a shared keyword. {{S13-305}}"], "opportunity": "By bringing together studies from several traditions, AI can help the author see where researchers explain the same phenomenon in different ways.", "risk": "Working from an AI summary, the author may treat different concepts as equivalent or miss studies that would change the explanation the review proposes.", "support": "A colleague from another tradition could use a shared and documented search record to examine the proposed source boundaries and the central comparisons.", "rating_reason": "An integrative review needs a balanced choice of studies from the relevant research communities. {{S06-006}} A wider AI search can help, but the gain depends on whether the professor reads the central papers and decides what their different claims can support together. {{S13-305}}", "conditions": ["The review form and inclusion rules are explicit.", "A checked set of studies is used to estimate missed inclusions in this corpus."], "applicability": "Applicable to conceptual literature engagement and non-statistical reviews; screening intensity varies by form.", "evidence_strength": "direct_task", "source_ids": ["S06-006", "S13-305", "S08-020", "S09-015", "S09-016"], "source_locators": {"S06-006": "Cronin and George original PDF pp. 176–180 (PDF pp. 9–13), selection and balance", "S13-305": "Elsbach and van Knippenberg original PDF pp. 1277–1279, 1287–1288", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S08-020": "OpenScholar Nature original article, Table 1 and Methods, retrieval-based synthesis"}, "role_source_ids": ["S09-015", "S09-016"], "limits": "Screening studies do not determine the error rate of a specific FEB review or prove all models perform alike.", "supported_rating": "opportunity", "supported_reason": "FEB could help authors record their search decisions and keep the original passages beside each comparison. Colleagues can then discuss omissions and conceptual disagreements with the professor before the review’s argument and source boundaries are fixed. {{S06-006}}", "supported_headline": "Documented search and source boundaries", "task_scope": "AI searches, screens, summarises and compares the relevant literature; the researcher judges coverage, competing traditions and the pivotal original studies."}, {"id": "senior-theory_review-design", "cohort": "senior", "research_type": "theory_review", "stage": "design", "rating": "mixed", "headline": "Early alternatives for models and reviews", "summary": "The authors test whether the model assumptions, conceptual structure, or review procedure that AI drafts can support the proposed contribution. {{S13-306}}{{S06-006}}", "paragraphs": ["A professor can commit PhD candidates to a conceptual structure that later proves difficult to defend, and both UFO profiles for this group include supervision and research coordination. {{S09-015}}{{S09-016}} That responsibility makes an early critique useful, although it does not mean that every AI-generated framework is harmful."], "opportunity": "The team can ask AI for several model structures or review procedures and weigh those alternatives before it commits to one argument.", "risk": "An attractive framework may rest on a weak assumption or an unjustified review boundary, which collaborators then carry into their own work.", "support": "A theorist or a colleague who specialises in review methods could challenge the proposed assumptions or inclusion rules before junior collaborators start writing around them.", "rating_reason": "A formal model needs justified assumptions and a valid derivation, whereas a review needs a defensible choice of studies and a reason to bring them together. {{S13-306}}{{S06-006}} Whichever form the paper takes, AI can propose a design, but the professor has to assess its choices before colleagues build on them.", "conditions": ["The team names the form of the paper.", "A knowledgeable reviewer checks whether the design can deliver the promised synthesis."], "applicability": "Applicable with different design tasks for conceptual papers and non-statistical literature reviews.", "evidence_strength": "methodological", "source_ids": ["S13-306", "S06-006", "S13-301", "S09-015", "S09-016"], "source_locators": {"S13-306": "Makadok original PDF pp. 193–198, assumptions, derivations and Table 1", "S06-006": "Cronin and George original PDF pp. 170–180 (PDF pp. 3–13)", "S13-301": "Cornelissen local accepted manuscript PDF pp. 5–8 (manuscript pp. 4–7)", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}, "role_source_ids": ["S09-015", "S09-016"], "limits": "The methodological sources establish design distinctions, not AI performance on FEB theory projects.", "supported_rating": "mixed", "supported_reason": "FEB could arrange a discussion of the model’s premises or the review’s inclusion rules with a specialist in that form of paper, so the team sees weaknesses early. The professor, as senior author, still decides what the paper can claim. {{S13-306}}{{S06-006}}", "supported_headline": "Specialist review of premises and inclusion rules", "task_scope": "AI drafts a model's assumptions, a conceptual structure or an integrative-review procedure; the researcher tests whether the design can support a worthwhile contribution."}, {"id": "senior-theory_review-data", "cohort": "senior", "research_type": "theory_review", "stage": "data", "rating": "opportunity", "headline": "Quicker assembly of the review corpus", "summary": "For an integrative review, AI can assemble the studies and extract their details, whereas pure conceptual theory has no empirical data-acquisition step. {{S06-006}}", "paragraphs": ["An integrative review treats prior studies as evidence, so the set of sources must reflect the research communities that the paper claims to connect. {{S06-006}}{{S13-305}} A professor can assign the checks to members of the team, but a large number of records does not by itself show that the corpus is complete. {{S09-015}}"], "opportunity": "AI can assemble a review corpus and extract the details of each study, so the review team has a larger set of sources to inspect.", "risk": "Missed studies or incorrectly extracted details can change the patterns that an integrative review reports, especially when the authors take a large corpus to be a complete one.", "support": "A screening audit could check a sample of the excluded studies and extracted passages before the review team draws conclusions from its corpus.", "rating_reason": "Assembling a review corpus leaves records that the team can inspect, such as the included studies, the exclusions, and the extracted passages. Screening research identifies errors that checks of those records can catch. {{S07-20}} AI assistance with the corpus is therefore useful, as long as the professor oversees how studies are selected.", "conditions": ["The review corpus and the selection rules are documented.", "The original studies and relevant passages are accessible."], "applicability": "Applicable to literature reviews acquiring prior studies; empirical acquisition and preparation are not applicable to pure theory.", "evidence_strength": "direct_task", "source_ids": ["S06-006", "S13-305", "S07-20", "S09-015", "S09-016"], "source_locators": {"S06-006": "Cronin and George original PDF pp. 176–180 (PDF pp. 9–13)", "S13-305": "Elsbach and van Knippenberg original PDF pp. 1277–1279, 1287–1288", "S07-20": "Clark et al. PubMed abstract Methods and Results, 19-study synthesis of GenAI errors", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level c
