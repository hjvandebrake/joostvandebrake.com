<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9e1630"><meta name="description" content="A first analysis of AI and research at the Faculty of Economics and Business, University of Groningen: strategy, three dimensions, and a source-grounded assessment of opportunities and risks."><title>AI and research at FEB</title><style>/* AI and the future of research at FEB: presentation styles, v4 (4 October 2026).
   Slides are fixed 1600 × 900 canvases scaled to the window; narrow screens reflow. */
:root{
 --red:#cc0000;--wine:#9e1630;--wine-dark:#7a0f24;--wine-pale:#f8ecee;--wine-soft:#efd6db;
 --navy:#17365d;--navy-pale:#e9eef4;--ink:#1f2a33;--body:#36424c;--muted:#66727c;--faint:#98a2aa;
 --line:#e2e6ea;--line-strong:#c9d0d6;--paper:#fff;--tint:#f6f7f8;--letterbox:#eceef1;
 --opp:#cfe6d6;--opp-ink:#1d5a3d;--opp-mid:#9fcfb0;--mix:#f6e5ad;--mix-ink:#6a4d0c;--mix-mid:#ecd27c;
 --risk:#f2cdc5;--risk-ink:#8a2b1d;--risk-mid:#e4a294;
 --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
 --appbar:52px;--controls:58px;--scale:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--letterbox);color:var(--ink);font-family:var(--font);line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
body.scroll-mode,body.fluid{overflow:auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid #3f6f98;outline-offset:2px;border-radius:4px}
a{color:var(--wine);text-underline-offset:3px}
h1,h2,h3,h4,p{margin:0}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:50;background:#fff;padding:8px 12px}.skip:focus{left:8px}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.14em}

/* ---------- Application chrome ---------- */
.appbar{position:fixed;inset:0 0 auto 0;height:var(--appbar);z-index:20;display:flex;align-items:center;gap:6px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}
.appbar .brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.appbar .brand b{color:var(--wine);font-size:15px;letter-spacing:.01em;white-space:nowrap}
.appbar .brand span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .brand i{width:3px;height:22px;background:var(--red);transform:skewX(-20deg);display:block}
.tool{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--body);white-space:nowrap}
.tool:hover{background:var(--tint);color:var(--ink)}
.tool[aria-pressed=true]{background:var(--wine-pale);color:var(--wine)}
.tool svg.i{font-size:17px}
.tool.sep{margin-left:8px;border-left:1px solid var(--line);border-radius:0;padding-left:16px}
.controlbar{position:fixed;inset:auto 0 0 0;height:var(--controls);z-index:20;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:22px;padding:0 18px;background:#fff;border-top:1px solid var(--line)}
.nav-btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:19px;font-size:15px;color:var(--ink)}
.nav-btn:hover{background:var(--tint)}
.nav-btn:disabled{opacity:.3;cursor:default;background:none}
.nav-btn.next{background:var(--wine);color:#fff;padding:0 18px}
.nav-btn.next:hover{background:var(--wine-dark)}
.nav-btn.next:disabled{background:var(--faint)}
.progress{display:flex;flex-direction:column;gap:7px;min-width:0}
.progress .where{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:12px}
.progress .where b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segments{display:flex;gap:4px;height:6px}
.segments button{flex:var(--n) 1 0;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.segments button span{position:absolute;inset:0 auto 0 0;width:var(--fill,0%);background:var(--wine);border-radius:3px;transition:width .3s}
.segments button:hover{background:var(--line-strong)}

/* ---------- Stage, frames and slide canvas ---------- */
#stage{position:fixed;inset:var(--appbar) 0 var(--controls) 0;display:grid;place-items:center;overflow:hidden}
.frame{width:calc(1600px * var(--scale));height:calc(900px * var(--scale));position:relative;display:none}
.frame.active{display:block}
.slide{position:absolute;left:0;top:0;width:1600px;height:900px;transform:scale(var(--scale));transform-origin:0 0;background:var(--paper);overflow:hidden;box-shadow:0 1px 2px rgba(20,30,40,.06),0 8px 30px rgba(20,30,40,.08);display:flex;flex-direction:column;font-size:21px;color:var(--body)}
.frame.active .slide>.s-body{animation:enter .45s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.frame.active .slide>.s-body{animation:none}*{transition:none!important}}
body.scroll-mode #stage{position:static;display:flex;flex-direction:column;align-items:center;gap:28px;padding:calc(var(--appbar) + 28px) 0 calc(var(--controls) + 40px);overflow:visible}
body.scroll-mode .frame{display:block}
body.fs .appbar,body.fs .controlbar{transform:translateY(-100%);transition:transform .25s}
body.fs .controlbar{transform:translateY(100%)}
body.fs.chrome .appbar,body.fs.chrome .controlbar{transform:none}
body.fs #stage{inset:0}
body.fs .slide{box-shadow:none}

.s-head{height:92px;flex:none;display:flex;align-items:center;justify-content:space-between;margin:0 88px;border-bottom:1px solid var(--line)}
.s-head img{height:40px;width:auto;display:block}
.s-chapter{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--wine)}
.s-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:34px 88px 0}
.s-title{font-size:52px;line-height:1.08;font-weight:700;letter-spacing:-.015em;color:var(--wine);max-width:1300px}
.s-lead{margin-top:16px;font-size:24px;line-height:1.45;color:var(--muted);max-width:1220px}
.s-content{flex:1;min-height:0;margin-top:30px;display:flex;flex-direction:column}
.s-foot{height:58px;flex:none;margin:0 88px;border-top:1px solid var(--line);display:flex;align-items:center;gap:18px;font-size:14px;color:var(--faint)}
.s-foot .s-num{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--wine);font-weight:700}
.explain{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 13px;border:1px solid var(--line-strong);border-radius:15px;font-size:14px;color:var(--body)}
.explain:hover{border-color:var(--wine);color:var(--wine)}
.explain svg.i{font-size:15px}
.compact .s-body{padding-top:22px}.compact .s-title{font-size:40px}.compact .s-lead{font-size:20px;margin-top:8px}.compact .s-content{margin-top:16px}

button.citation{display:inline;vertical-align:super;font-size:.6em;line-height:1;font-weight:700;color:var(--wine);padding:0 1px;border-radius:2px}
button.citation:hover{background:var(--wine-pale)}

/* shared visual pieces */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px}
.card.tint{background:var(--tint);border-color:transparent}
.icon-badge{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--wine-pale);color:var(--wine);font-size:26px;flex:none}
.icon-badge.navy{background:var(--navy-pale);color:var(--navy)}
.icon-badge.small{width:40px;height:40px;border-radius:11px;font-size:20px}
.kicker{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.label-ai{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--navy);background:var(--navy-pale);border-radius:13px;padding:4px 11px}
.label-you{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--wine);background:var(--wine-pale);border-radius:13px;padding:4px 11px}
.caption{font-size:15px;color:var(--muted);line-height:1.45}
.case{display:flex;gap:18px;align-items:flex-start;background:var(--navy-pale);border-radius:14px;padding:22px 26px;color:var(--ink);font-size:19px;line-height:1.5}
.case .icon-badge{background:#fff;color:var(--navy)}
.case .kicker{color:var(--navy);margin-bottom:6px;font-size:13px}
.illustration{margin:0;border-radius:16px;overflow:hidden;position:relative;background:#f4f1ea}
.illustration img{display:block;width:100%;height:100%;object-fit:cover}
.illustration figcaption{position:absolute;right:10px;bottom:8px;font-size:11px;color:#fff;background:rgba(0,0,0,.35);padding:2px 7px;border-radius:9px}

/* title slide */
.title-slide .s-body{padding-top:44px}
.t-grid{display:grid;grid-template-columns:1fr 600px;gap:64px;align-items:start}
.t-grid h1{font-size:74px;line-height:1.02;font-weight:700;letter-spacing:-.025em;color:var(--wine);margin-top:14px}
.t-grid .s-lead{font-size:24px;margin-top:22px}
.t-actions{display:flex;gap:14px;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 26px;border-radius:27px;font-size:19px;font-weight:600;border:1.5px solid var(--line-strong);color:var(--ink)}
.btn:hover{border-color:var(--wine);color:var(--wine)}
.btn.primary{background:var(--wine);border-color:var(--wine);color:#fff}.btn.primary:hover{background:var(--wine-dark);color:#fff}
.t-art{height:400px}
.t-dims{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:34px}
.t-dims button{display:flex;gap:18px;align-items:flex-start;text-align:left;padding:22px 24px;border:1px solid var(--line);border-radius:14px;background:#fff;transition:border-color .2s,box-shadow .2s}
.t-dims button:hover{border-color:var(--wine);box-shadow:0 6px 20px rgba(158,22,48,.08)}
.t-dims small{display:block;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--wine);text-transform:uppercase}
.t-dims strong{display:block;font-size:22px;color:var(--ink);margin-top:3px}
.t-dims span{display:block;font-size:16px;color:var(--muted);margin-top:6px;line-height:1.4}

/* aims */
.aims{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.aims .card{display:flex;flex-direction:column;gap:16px;min-height:236px}
.aims h3{font-size:24px;color:var(--ink)}
.aims p{font-size:19px;line-height:1.45}
.aims .ai-row{margin-top:auto}
.timeline{display:grid;grid-template-columns:repeat(3,1fr);margin-top:34px;position:relative}
.timeline::before{content:"";position:absolute;left:12px;right:12px;top:11px;height:2px;background:var(--line-strong)}
.timeline div{position:relative;padding:0 30px 0 0}
.timeline div::before{content:"";display:block;width:24px;height:24px;border-radius:50%;background:#fff;border:6px solid var(--wine);margin-bottom:14px;position:relative}
.timeline div:last-child::before{border-color:var(--faint)}
.timeline b{display:block;font-size:17px;color:var(--wine);margin-bottom:4px}
.timeline span{font-size:18px;color:var(--body);line-height:1.4;display:block}

/* chain */
.chain-wrap{position:relative;margin-top:62px}
.fit{position:absolute;left:0;right:0;top:-44px;height:28px;border:2px solid var(--line-strong);border-bottom:0;border-radius:12px 12px 0 0}
.fit span{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:#fff;padding:0 14px;font-size:16px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.chain{display:grid;grid-template-columns:1fr 44px 1fr 44px 1fr 44px 1fr;align-items:stretch}
.chain .link{display:grid;place-items:center;color:var(--line-strong);font-size:30px}
.chain .card{display:flex;flex-direction:column;gap:14px;position:relative}
.chain h3{font-size:26px;color:var(--ink)}
.chain p{font-size:19px;line-height:1.45}
.chain .card.ai{border:2px solid var(--navy)}
.chain .ai-flag{position:absolute;top:-17px;right:18px}
.chain-note{display:flex;gap:16px;align-items:center;margin-top:30px;font-size:19px;color:var(--body)}
.chain-note .label-ai{flex:none}

/* journal vs paper */
.jp{display:grid;grid-template-columns:470px 1fr;gap:40px}
.jp-diagram{background:var(--tint);border-radius:16px;padding:26px 28px;display:flex;flex-direction:column;gap:18px}
.jp-forms{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.jp-forms .card{display:flex;flex-direction:column;gap:10px;padding:22px}
.jp-forms h3{font-size:22px;color:var(--ink);display:flex;gap:10px;align-items:center}
.jp-forms h3 svg{color:var(--wine)}
.jp-forms p{font-size:18px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;font-size:15px;color:var(--muted)}
.tag{display:inline-block;font-size:14px;font-weight:600;padding:3px 10px;border-radius:11px;background:var(--tint);color:var(--body)}

/* departments */
.depts{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;flex:1;min-height:0}
.dept{display:flex;flex-direction:column;gap:10px;min-width:0}
.dept h3{font-size:19px;color:var(--wine);line-height:1.15;min-height:46px}
.dept h3 small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:3px}
.ex{background:var(--tint);border-radius:10px;padding:12px 12px 11px;font-size:14.5px;line-height:1.38;color:var(--ink);display:flex;flex-direction:column;gap:7px;flex:1}
.ex .meta{font-size:12.5px;color:var(--muted);margin-top:auto}
.m{align-self:flex-start;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:9px}
.m.quant{background:#dfe8f2;color:var(--navy)}.m.qual{background:#f6dfd8;color:#8a3a26}.m.theory{background:#e3ecdf;color:#3f5a35}.m.other{background:#ececec;color:#4c4c4c}
.dept-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:20px}

/* history chart */
.hist{display:grid;grid-template-columns:1fr 390px;gap:44px;flex:1;min-height:0}
.hist svg{width:100%;height:auto;display:block}
.hist .axis text{font-size:13px;fill:var(--muted)}
.hist .grid line{stroke:var(--line);stroke-width:1}
.stat{border-top:3px solid var(--wine);padding-top:12px}
.stat strong{display:block;font-size:56px;line-height:1;color:var(--wine);font-weight:700;letter-spacing:-.02em}
.stat span{display:block;font-size:17px;color:var(--muted);margin-top:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.hist-side p{font-size:20px;line-height:1.5;margin-top:28px;color:var(--body)}

/* three study cards */
.studies{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.studies .card{display:flex;flex-direction:column;gap:14px}
.studies h3{font-size:24px;color:var(--ink)}
.result{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;border-radius:13px;padding:5px 12px;align-self:flex-start}
.result.up{background:var(--opp);color:var(--opp-ink)}.result.mixed{background:var(--mix);color:var(--mix-ink)}.result.down{background:var(--risk);color:var(--risk-ink)}
.studies p{font-size:19px;line-height:1.45}
.learn{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;gap:12px;align-items:flex-start;font-size:18px;color:var(--ink)}
.learn svg{color:var(--wine);font-size:22px;margin-top:2px}
.bignum{font-size:50px;line-height:1;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.bignum-sub{font-size:15px;color:var(--muted);margin-top:-6px}
.contrast{margin-top:26px}

/* workflows swimlane */
.lanes{display:grid;grid-template-columns:1fr 400px;gap:36px;flex:1;min-height:0}
.lane-table{display:grid;grid-template-columns:200px 1fr 34px 1fr;row-gap:10px;align-content:start}
.lane-table .lh{font-size:14px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 16px 4px}
.lane-table .act{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;color:var(--ink)}
.lane-table .act svg{color:var(--wine);font-size:22px}
.lane-table .ai,.lane-table .you{font-size:17.5px;line-height:1.38;padding:14px 16px;border-radius:10px;display:flex;align-items:center}
.lane-table .ai{background:var(--navy-pale);color:var(--ink)}
.lane-table .you{background:#fff;border:1px solid var(--line);border-left:4px solid var(--wine);color:var(--ink)}
.lane-table .arrow{display:grid;place-items:center;color:var(--faint);font-size:22px}
.lanes .illustration{height:100%;max-height:470px}

/* reliability grid */
.checks{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.checks .card{display:flex;gap:20px;align-items:flex-start}
.checks h3{font-size:23px;color:var(--ink);margin-bottom:10px}
.checks p{font-size:19px;display:flex;gap:10px;align-items:flex-start}
.checks p svg{color:var(--navy);font-size:20px;margin-top:3px}

/* cycle */
.cyc{display:grid;grid-template-columns:720px 1fr;gap:36px;flex:1;min-height:0;align-items:center}
.cyc svg{width:100%;height:auto;display:block;max-height:500px}
.cyc .node circle{fill:#fff;stroke:var(--wine);stroke-width:3}
.cyc .node text.n{font-size:20px;font-weight:700;fill:var(--wine)}
.cyc .lbl b{font-size:19px;fill:var(--ink);font-weight:700}
.cyc .lbl tspan.q{font-size:15px;fill:var(--muted)}
.kinds{display:flex;flex-direction:column;gap:16px}
.kinds .card{padding:18px 22px}
.kinds h3{font-size:21px;color:var(--ink);margin-bottom:8px}
.kinds p{font-size:17px;line-height:1.42}
.dots{display:flex;gap:6px;margin:4px 0 10px}
.dots i{width:30px;height:8px;border-radius:4px;background:var(--wine);display:block}
.dots i.off{background:none;border:2px dashed var(--faint)}
.dots i.alt{background:var(--navy)}

/* access spectrum */
.spectrum{position:relative;margin-top:6px}
.spec-bar{height:12px;border-radius:6px;background:linear-gradient(90deg,#dfe8f2,#c7d3e2 35%,#e8c3ca 70%,var(--wine));margin:0 6px 10px}
.spec-ends{display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:22px}
.spec-ends span{display:flex;gap:8px;align-items:center}
.access{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.access .card{display:flex;flex-direction:column;gap:12px;padding:20px}
.access h3{font-size:22px;color:var(--ink);display:flex;align-items:center;gap:10px}
.access h3 svg{color:var(--wine)}
.access .step{font-size:17.5px;line-height:1.4}
.access .step small{display:block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.access .step.ai{background:var(--navy-pale);border-radius:10px;padding:10px 12px;margin-top:auto}
.access .step.ai small{color:var(--navy)}
.locks{display:flex;gap:3px;color:var(--wine);font-size:16px}.locks .off{color:var(--line-strong)}

/* research forms */
.form-grid{display:grid;grid-template-columns:1fr 520px;gap:40px;flex:1;min-height:0}
.form-blocks{display:flex;flex-direction:column;gap:18px}
.form-blocks .card{display:flex;gap:20px;align-items:flex-start;padding:22px 24px}
.form-blocks h3{font-size:24px;color:var(--ink);margin-bottom:6px}
.form-blocks p{font-size:20px;line-height:1.45}
.mini{background:var(--tint);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.mini .kicker{font-size:13px}
.mini table{border-collapse:separate;border-spacing:4px;width:100%}
.mini th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:0 2px;line-height:1.15}
.mini th.r{width:118px;font-size:13.5px;color:var(--ink)}
.mini td button{width:100%;height:34px;border-radius:6px;display:block}
.mini-foot{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--muted)}

/* positions staircase */
.stairs{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:end;margin-top:8px}
.stair{display:flex;flex-direction:column;gap:12px}
.stair .block{border-radius:12px 12px 0 0;background:var(--wine);color:#fff;padding:16px 18px;display:flex;flex-direction:column;justify-content:flex-start}
.stair .block strong{font-size:21px;line-height:1.15}
.stair .block svg{font-size:24px;margin-bottom:auto;opacity:.85}
.stair p{font-size:17.5px;line-height:1.42;color:var(--ink);min-height:100px}
.stair:nth-child(1) .block{height:120px;background:#d9a4ae}.stair:nth-child(2) .block{height:150px;background:#c47585}
.stair:nth-child(3) .block{height:180px;background:#b04e63}.stair:nth-child(4) .block{height:210px;background:#a22b43}.stair:nth-child(5) .block{height:240px;background:var(--wine)}
.stairs-axis{display:flex;align-items:center;gap:12px;font-size:16px;color:var(--muted);margin-bottom:14px}
.stairs-axis i{flex:1;height:2px;background:linear-gradient(90deg,var(--line-strong),var(--wine));position:relative}
.stairs-axis i::after{content:"";position:absolute;right:-2px;top:-5px;border:6px solid transparent;border-left:10px solid var(--wine)}
.groups{display:grid;grid-template-columns:1fr 2fr 2fr;gap:14px;margin-top:4px}
.groups div{border-top:3px solid var(--navy);padding-top:8px;font-size:15px;font-weight:700;color:var(--navy);text-align:center}

/* career evidence */
.cohorts3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.cohorts3 .card{display:flex;flex-direction:column;gap:14px;padding:22px}
.cohorts3 h3{font-size:22px;color:var(--ink);display:flex;gap:12px;align-items:center}
.gain,.keep{border-radius:10px;padding:12px 14px;font-size:18px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.gain{background:var(--opp);color:#173f2c}.keep{background:var(--wine-pale);color:#4f1220}
.gain svg,.keep svg{font-size:20px;margin-top:2px}
.gain small,.keep small{display:block;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-bottom:2px}

/* heatmaps */
.map-bar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:14px}
.seg{display:inline-flex;background:var(--tint);border-radius:22px;padding:4px;gap:2px}
.seg button{height:36px;padding:0 16px;border-radius:18px;font-size:15.5px;color:var(--body);white-space:nowrap}
.seg button[aria-pressed=true]{background:#fff;color:var(--wine);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.scenario button[aria-pressed=true]{background:var(--navy);color:#fff}
.legend{display:flex;gap:16px;font-size:15px;color:var(--body);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{display:inline-block;width:16px;height:16px;border-radius:4px;flex:none}
.dot.opportunity{background:var(--opp-mid)}.dot.mixed{background:var(--mix-mid)}.dot.risk{background:var(--risk-mid)}
.linkish{font-size:15px;color:var(--wine);text-decoration:underline;text-underline-offset:3px}
.overview-grid{display:grid;grid-template-columns:1fr 330px;gap:26px;flex:1;min-height:0}
table.matrix{border-collapse:separate;border-spacing:4px;width:100%;table-layout:fixed}
.matrix thead th{font-size:14.5px;font-weight:700;color:var(--ink);text-align:left;padding:0 4px 4px;line-height:1.2;vertical-align:bottom}
.matrix thead th small{display:block;font-weight:400;color:var(--faint);font-size:12px}
.matrix .cohort-label{font-size:15.5px;font-weight:700;color:var(--navy);text-align:left;vertical-align:middle;padding:0 10px;background:var(--navy-pale);border-radius:8px;line-height:1.2}
.matrix .type-label{font-size:14.5px;font-weight:500;color:var(--body);text-align:left;padding:0 6px;white-space:nowrap}
.matrix tbody.cohort-group tr:first-child>*{border-top:0}
.matrix tbody.cohort-group+tbody.cohort-group tr:first-child td,.matrix tbody.cohort-group+tbody.cohort-group tr:first-child th{padding-top:0}
.gap-row td{height:2px;padding:0}
.heat-cell{width:100%;display:block;border-radius:7px;transition:background-color .45s,color .45s,box-shadow .2s,transform .15s;text-align:left}
.heat-cell.opportunity{background:var(--opp);color:var(--opp-ink)}.heat-cell.mixed{background:var(--mix);color:var(--mix-ink)}.heat-cell.risk{background:var(--risk);color:var(--risk-ink)}
.compact-cell{height:33px}
.compact-cell.opportunity{background:var(--opp-mid)}.compact-cell.mixed{background:var(--mix-mid)}.compact-cell.risk{background:var(--risk-mid)}
.heat-cell:hover,.heat-cell.peeked{box-shadow:0 0 0 3px var(--ink);transform:translateY(-1px)}
.full-cell{min-height:132px;padding:16px 16px;font-size:18px;line-height:1.3;font-weight:600;display:flex;align-items:flex-start}
.row-label{font-size:20px;font-weight:700;color:var(--ink);text-align:left;padding-right:12px;line-height:1.2;vertical-align:middle}
.row-label small{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:4px;line-height:1.3}
.peek{background:var(--tint);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;min-height:0;overflow:hidden}
.peek .kicker{font-size:12.5px}
.peek h3{font-size:22px;color:var(--ink);line-height:1.2}
.peek p{font-size:16px;line-height:1.45}
.peek p b{display:block;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.peek .hint{font-size:14px;color:var(--muted);margin-top:auto}
.counts{display:flex;flex-direction:column;gap:12px}
.count-row{display:grid;grid-template-columns:1fr;gap:5px;font-size:14px;color:var(--body)}
.bar{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--line)}
.bar span{display:grid;place-items:center;font-size:12.5px;font-weight:700;transition:flex-grow .45s}
.bar .opportunity{background:var(--opp-mid);color:var(--opp-ink)}.bar .mixed{background:var(--mix-mid);color:var(--mix-ink)}.bar .risk{background:var(--risk-mid);color:var(--risk-ink)}
.map-note{font-size:14.5px;color:var(--muted);margin-top:10px;line-height:1.45}

/* scenarios */
.scen{display:grid;grid-template-columns:1fr 470px;gap:40px;flex:1;min-height:0}
.scen-table{display:grid;grid-template-columns:150px 1fr 1fr;gap:10px;align-content:start}
.scen-table .h{display:flex;gap:10px;align-items:center;font-size:17px;font-weight:700;padding:10px 14px;border-radius:10px}
.scen-table .h.without{background:var(--tint);color:var(--body)}.scen-table .h.with{background:var(--navy);color:#fff}
.scen-table .issue{font-size:19px;font-weight:700;color:var(--ink);display:flex;align-items:center}
.scen-table .w{font-size:18px;line-height:1.38;padding:14px 16px;border-radius:10px;background:var(--tint);color:var(--body)}
.scen-table .p{font-size:18px;line-height:1.38;padding:14px 16px;border-radius:10px;background:var(--navy-pale);color:var(--ink)}
.scen-chart{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:18px}
.scen-chart h3{font-size:20px;color:var(--ink)}
.scen-chart .bar{height:44px;border-radius:8px}
.scen-chart .bar span{font-size:16px}
.scen-chart .count-row{font-size:16px;font-weight:600;gap:8px}

/* support house */
.house{display:flex;flex-direction:column;gap:14px}
.roof{background:var(--wine);color:#fff;border-radius:16px 16px 6px 6px;padding:16px 26px;font-size:21px;font-weight:700;display:flex;gap:12px;align-items:center}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pillars .card{display:flex;flex-direction:column;gap:12px;padding:22px}
.pillars h3{font-size:23px;color:var(--ink)}
.pillars p{font-size:18.5px;line-height:1.42}
.foundation{background:var(--tint);border-radius:6px 6px 16px 16px;padding:16px 26px;font-size:18px;color:var(--body);display:flex;gap:12px;align-items:center}
.foundation svg{color:var(--navy);font-size:22px}

/* evaluation */
.evalg{display:grid;grid-template-columns:1fr 440px;gap:40px;flex:1;min-height:0}
.score{display:flex;flex-direction:column;gap:10px}
.score .row{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:center;padding:14px 18px;border:1px solid var(--line);border-radius:12px}
.score .row b{display:flex;align-items:center;gap:12px;font-size:19px;color:var(--ink)}
.score .row b svg{color:var(--wine);font-size:22px}
.score .row span{font-size:18px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.score .row span svg{color:var(--opp-ink);font-size:20px;margin-top:2px}
.evalg .illustration{height:100%;max-height:440px}

/* closing */
.roadmap{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.roadmap .st{position:relative;padding:22px 34px 22px 26px;background:var(--tint);clip-path:polygon(0 0,calc(100% - 24px) 0,100% 50%,calc(100% - 24px) 100%,0 100%,24px 50%);display:flex;flex-direction:column;gap:8px;min-height:176px}
.roadmap .st:first-child{clip-path:polygon(0 0,calc(100% - 24px) 0,100% 50%,calc(100% - 24px) 100%,0 100%);border-radius:14px 0 0 14px}
.roadmap .st:last-child{background:var(--wine);color:#fff}
.roadmap .st:nth-child(n+2){padding-left:46px}
.roadmap small{font-size:14px;font-weight:700;letter-spacing:.07em;color:var(--wine)}
.roadmap .st:last-child small{color:#f3c9d1}
.roadmap h3{font-size:24px;color:var(--ink)}.roadmap .st:last-child h3{color:#fff}
.roadmap p{font-size:17.5px;line-height:1.4}
.close-low{display:grid;grid-template-columns:1fr 470px;gap:40px;margin-top:28px;flex:1;min-height:0}
.starters{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.starters span{display:inline-flex;align-items:center;gap:8px;font-size:18px;padding:9px 16px;border-radius:22px;background:var(--navy-pale);color:var(--navy);font-weight:600}
.close-low .illustration{height:100%;max-height:300px}

/* generic slide table fallback */
.slide-table{width:100%;border-collapse:collapse;font-size:19px}
.slide-table th,.slide-table td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top}
.slide-table thead th{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* ---------- Dialogs: side sheets ---------- */
dialog{border:0;padding:0;color:var(--ink);background:#fff}
dialog::backdrop{background:rgba(18,26,34,.38);backdrop-filter:blur(1.5px)}
dialog.sheet{position:fixed;inset:0 0 0 auto;margin:0;height:100vh;max-height:100vh;width:min(720px,100vw);box-shadow:-10px 0 40px rgba(0,0,0,.18);overflow:auto}
dialog.sheet.wide{width:min(1000px,100vw)}
dialog.sheet[open]{animation:slidein .28s cubic-bezier(.2,.7,.2,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
dialog.modal{width:min(620px,94vw);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dialog-head{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.96);backdrop-filter:blur(4px);display:flex;justify-content:space-between;align-items:center;padding:16px 32px;border-bottom:1px solid var(--line)}
.dialog-kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--wine)}
.close{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;font-size:14px;color:var(--body)}
.close:hover{background:var(--tint)}
.dialog-body{padding:26px 32px 40px;font-size:17px;line-height:1.6;color:var(--body)}
.dialog-body h2{font-size:30px;line-height:1.15;color:var(--ink);margin-bottom:14px;letter-spacing:-.01em}
.dialog-body h3{font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.dialog-body p{margin-bottom:12px}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:6px}
.cell-top{display:grid;grid-template-columns:1fr 150px;gap:20px;align-items:start;margin-bottom:6px}
.locator{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.locator i{height:15px;border-radius:3px;display:block;opacity:.55}
.locator i.opportunity{background:var(--opp-mid)}.locator i.mixed{background:var(--mix-mid)}.locator i.risk{background:var(--risk-mid)}
.locator i.here{opacity:1;box-shadow:0 0 0 2px var(--ink)}
.locator-cap{font-size:11.5px;color:var(--faint);margin-top:5px;text-align:right}
.scen-compare{display:grid;grid-template-columns:1fr 22px 1fr;gap:8px;align-items:stretch;margin:14px 0 20px}
.scen-compare>div{border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.scen-compare>div.on{border-color:var(--ink);color:var(--ink)}
.scen-compare>span{display:grid;place-items:center;color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;border-radius:11px;padding:3px 10px;align-self:flex-start}
.pill.opportunity{background:var(--opp);color:var(--opp-ink)}.pill.mixed{background:var(--mix);color:var(--mix-ink)}.pill.risk{background:var(--risk);color:var(--risk-ink)}
.br{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.br section{border-radius:12px;padding:16px 18px;font-size:16.5px;line-height:1.5}
.br section.b{background:#eef6f0}.br section.r{background:#fbefec}
.br h3{margin:0 0 6px;display:flex;gap:8px;align-items:center}
.why{margin-top:14px;border-left:4px solid var(--navy);padding:4px 0 4px 18px}
.why h3{margin-top:0}
details{border-top:1px solid var(--line);margin-top:18px;padding-top:4px}
summary{cursor:pointer;font-weight:700;color:var(--ink);padding:10px 0;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--wine);border-bottom:2px solid var(--wine);transform:rotate(-45deg);transition:transform .2s;margin-right:4px}
details[open]>summary::before{transform:rotate(45deg)}
.access-note{font-size:15px;color:var(--muted)}
.cell-scope-note{background:var(--mix);color:var(--mix-ink);border-radius:10px;padding:10px 14px;font-size:15px}
.pager{display:flex;justify-content:space-between;margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
.pager button{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--wine);padding:6px 10px;border-radius:8px}
.pager button:hover{background:var(--wine-pale)}
.pager small{color:var(--faint);font-size:13px;align-self:center}
.evidence-source{font-weight:700;color:var(--wine);padding:0 3px}
.source-list{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:2px}
.source-list li button{text-align:left;width:100%;padding:10px 12px;border-radius:8px;font-size:15.5px;line-height:1.45}
.source-list li button:hover{background:var(--tint)}
.source-list li small{display:block;color:var(--muted);font-size:13px;padding:0 12px 8px}
.search{width:100%;height:46px;border:1px solid var(--line-strong);border-radius:23px;padding:0 20px;font-size:16px;margin-top:6px}
.source-title{font-size:22px!important}
.source-meta{color:var(--muted)}
.notes-body p{font-size:18px;line-height:1.65;color:var(--ink)}
.dept-list h3{color:var(--wine);text-transform:none;letter-spacing:0;font-size:18px}

/* contents grid */
.toc-chapter{margin-top:22px}
.toc-chapter h3{margin:0 0 10px}
.toc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.toc-item{text-align:left;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink);border-radius:10px;padding:6px}
.toc-item:hover{background:var(--tint)}
.toc-item.current .thumb{box-shadow:0 0 0 3px var(--wine)}
.thumb{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:6px;border:1px solid var(--line);background:#fff}
.thumb>.slide{transform:scale(var(--t));box-shadow:none;pointer-events:none}
.toc-item span{display:flex;gap:8px}.toc-item small{color:var(--wine);font-weight:700}

/* report reading view */
.reading{font-size:17px;line-height:1.68;color:var(--ink);max-width:800px}
.reading h1{font-size:34px;color:var(--wine);line-height:1.15;margin:4px 0 18px}
.reading h2{font-size:25px;color:var(--wine);margin:38px 0 12px;line-height:1.2}
.reading h3{font-size:19px;color:var(--ink);text-transform:none;letter-spacing:0;margin:26px 0 8px}
.reading p{margin-bottom:14px}
.reading table{border-collapse:collapse;width:100%;font-size:15px;margin:14px 0}
.reading th,.reading td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.reading thead th{background:var(--tint)}
.reading img{max-width:100%;height:auto}
.reading em{color:var(--muted)}

/* help overlay */
.keys{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:16px}
kbd{font-family:var(--font);font-size:13px;font-weight:700;background:var(--tint);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:2px 7px}

/* ---------- Narrow screens: reflow instead of scaling ---------- */
body.fluid .appbar .brand span,body.fluid .tool span{display:none}
body.fluid .tool{padding:0 9px}
body.fluid #stage{position:static;display:block;padding:calc(var(--appbar) + 12px) 12px calc(var(--controls) + 20px)}
body.fluid .frame{display:block;width:auto!important;height:auto!important;margin-bottom:16px}
body.fluid .slide{position:relative;width:auto;height:auto;transform:none;border-radius:12px;font-size:16px}
body.fluid .s-head{height:56px;margin:0 16px}body.fluid .s-head img{height:26px}
body.fluid .s-chapter{font-size:11px}
body.fluid .s-body{padding:18px 16px 0}
body.fluid .s-title{font-size:27px}
body.fluid .s-lead{font-size:17px}
body.fluid .s-content{margin-top:18px}
body.fluid .s-foot{margin:16px 16px 0;height:48px}
body.fluid .s-foot>span:first-child{display:none}
body.fluid .t-grid,body.fluid .jp,body.fluid .hist,body.fluid .lanes,body.fluid .cyc,body.fluid .form-grid,body.fluid .overview-grid,body.fluid .scen,body.fluid .evalg,body.fluid .close-low{grid-template-columns:1fr;gap:18px}
body.fluid .t-grid h1{font-size:34px}body.fluid .t-art{height:220px}
body.fluid .t-dims,body.fluid .aims,body.fluid .studies,body.fluid .checks,body.fluid .access,body.fluid .cohorts3,body.fluid .pillars,body.fluid .jp-forms,body.fluid .timeline,body.fluid .roadmap{grid-template-columns:1fr}
body.fluid .chain{grid-template-columns:1fr}
body.fluid .chain .link{transform:rotate(90deg);height:30px}
body.fluid .fit{display:none}body.fluid .chain-wrap{margin-top:10px}
body.fluid .depts{grid-template-columns:1fr 1fr}
body.fluid .stairs{grid-template-columns:1fr 1fr}
body.fluid .stair .block{height:auto!important;min-height:70px}
body.fluid .groups{display:none}
body.fluid .lane-table{grid-template-columns:1fr}
body.fluid .lane-table .arrow,body.fluid .lane-table .lh{display:none}
body.fluid .scen-table{grid-template-columns:1fr}
body.fluid .score .row{grid-template-columns:1fr}
body.fluid .roadmap .st{clip-path:none;border-radius:12px;padding:16px;margin-bottom:8px}
body.fluid .matrix-scroll{overflow-x:auto}
body.fluid table.matrix{min-width:760px}
body.fluid .full-cell{min-height:96px;font-size:14px}
body.fluid .illustration{height:220px!important}
body.fluid .map-bar{flex-wrap:wrap}
body.fluid .bignum{font-size:40px}
body.fluid .cyc svg{max-height:none}
body.fluid .controlbar{gap:10px;padding:0 10px}
body.fluid .nav-btn span{display:none}

/* ---------- Print: one slide per page ---------- */
@media print{
 @page{size:1600px 900px;margin:0}
 body{background:#fff;overflow:visible}
 .appbar,.controlbar,dialog{display:none!important}
 #stage{position:static;display:block}
 .frame{display:block!important;width:1600px!important;height:900px!important;page-break-after:always;break-after:page}
 .slide{transform:none!important;box-shadow:none}
 .frame.active .slide>.s-body{animation:none}
}
/* journal versus paper diagram */
.jp-diagram .kicker{display:flex;gap:8px;align-items:center;color:var(--ink)}
.jp-diagram p{font-size:18px;line-height:1.45;color:var(--body)}
.aip{background:#fff;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.aip-scale{position:relative;height:12px;border-radius:6px;background:var(--line)}
.aip-scale span{position:absolute;inset:0 auto 0 0;border-radius:6px;background:linear-gradient(90deg,var(--wine-soft),var(--wine))}
.aip-scale i{position:absolute;top:-6px;width:4px;height:24px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
.aip-ticks{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600}
.aip p{font-size:16px}
.papers{display:flex;gap:10px;justify-content:space-between;padding:4px 6px}
.papers span{width:52px;height:64px;border-radius:6px;background:#fff;border:1px solid var(--line-strong);display:grid;place-items:center;color:var(--faint);font-size:26px}
.papers span.focus{border:2px solid var(--wine);color:var(--wine);transform:translateY(-6px);box-shadow:0 6px 16px rgba(158,22,48,.15)}

.legend.vertical{flex-direction:column;align-items:flex-start;gap:6px}
.scen-chart{align-self:start}
.mini .legend{font-size:13px;gap:12px}
.mini .dot{width:12px;height:12px}
.studies .card{gap:10px}
.contrast{margin-top:22px}
/* narrow-screen repairs */
.appbar .brand{overflow:hidden}
body.fluid .appbar{gap:2px;padding:0 8px}
body.fluid .appbar .brand b{font-size:14px;overflow:hidden;text-overflow:ellipsis}
body.fluid #mode,body.fluid #fullscreen,body.fluid #help{display:none}
body.fluid .s-body,body.fluid .s-content,body.fluid .overview-grid>*,body.fluid .matrix-scroll{min-width:0;max-width:100%}
body.fluid .map-bar{flex-direction:column;align-items:stretch;gap:8px}
body.fluid .seg{flex-wrap:wrap;border-radius:14px}
body.fluid .seg button{height:auto;min-height:32px;padding:6px 12px;white-space:normal;font-size:13.5px}
body.fluid table.matrix:not(.overview-matrix){min-width:880px}
body.fluid .peek{display:none}
body.fluid .frame,body.fluid .slide{max-width:100%;min-width:0}
body.fluid .btn{height:auto;min-height:44px;padding:8px 16px;font-size:15px}
body.fluid .t-actions{flex-wrap:wrap;gap:10px}
body.fluid .s-chapter{display:none}
body.fluid .matrix col:first-child{width:118px!important}
body.fluid .row-label{font-size:15px}
body.fluid .row-label small{display:none}

/* ===================== v5: report storyline, no icons or illustrations ===================== */
.tool.strong{color:var(--wine);font-weight:700}
.opener{display:flex;align-items:baseline;gap:16px;margin:-6px 0 6px}
.opener .num{font-size:64px;line-height:.9;font-weight:300;color:var(--wine);letter-spacing:-.03em}
.opener .okick{font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-left:2px solid var(--wine-soft);padding-left:14px}
.has-opener .s-body{padding-top:26px}
.to-report{display:inline-flex;align-items:center;height:30px;padding:0 14px;border:1px solid var(--line-strong);border-radius:15px;font-size:14px;color:var(--body);max-width:640px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.to-report:hover{border-color:var(--wine);color:var(--wine)}
.card.top{border-top:3px solid var(--wine);border-radius:4px 4px 14px 14px}
.strip{display:flex;gap:18px;align-items:baseline;margin-top:22px;padding:16px 22px;background:var(--navy-pale);border-radius:12px;font-size:18.5px;line-height:1.5;color:var(--ink)}
.strip b{flex:none;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--navy);min-width:150px}
.side-box{background:var(--tint);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.side-box p{font-size:18.5px;line-height:1.5;color:var(--ink)}

/* title */
.t-grid{grid-template-columns:1fr 560px;gap:56px}
.mosaic{display:flex;flex-direction:column;gap:12px;padding:22px 24px;background:var(--tint);border-radius:16px;text-align:left;transition:box-shadow .2s}
.mosaic:hover{box-shadow:0 0 0 2px var(--wine)}
.mg{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center}
.mg-label{font-size:14px;font-weight:700;color:var(--navy);line-height:1.2}
.mg-cells{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.mg-cells i{display:block;height:24px;border-radius:4px}
.mg-cells i.opportunity{background:var(--opp-mid)}.mg-cells i.mixed{background:var(--mix-mid)}.mg-cells i.risk{background:var(--risk-mid)}
.mosaic-cap{font-size:14px;color:var(--muted);margin-top:4px}
.t-dims button{align-items:flex-start}
.dnum{font-size:46px;line-height:.9;font-weight:300;color:var(--wine);min-width:34px}

/* question */
.q-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:56px;align-items:start}
.tasks{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.tasks li{font-size:28px;color:var(--ink);padding:12px 0 12px 20px;border-left:4px solid var(--wine-soft)}
.q-box{background:var(--wine);color:#fff;border-radius:16px;padding:30px 34px}
.q-box .kicker{color:#f2c6cf;margin-bottom:12px}
.q-box p{font-size:30px;line-height:1.35;font-weight:600}
.q-box .citation{color:#fff}
.q-plan{margin-top:22px;font-size:19px;color:var(--body);line-height:1.5}

/* roadmap */
.roadmap-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.roadmap-list button{width:100%;display:grid;grid-template-columns:70px 1fr 40px;align-items:center;gap:18px;text-align:left;padding:12px 18px;border-radius:12px;border:1px solid var(--line)}
.roadmap-list button:hover{border-color:var(--wine)}
.roadmap-list li.dim button{background:var(--wine-pale);border-color:transparent}
.rnum{font-size:44px;line-height:1;font-weight:300;color:var(--wine)}
.rt strong{display:block;font-size:23px;color:var(--ink)}
.rt span{display:block;font-size:17px;color:var(--muted);margin-top:3px}
.go{font-size:22px;color:var(--faint)}

/* aims */
.aims-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:start}
.targets{margin:14px 0 0;padding:0;list-style:none;counter-reset:t;display:flex;flex-direction:column;gap:14px}
.targets li{counter-increment:t;display:grid;grid-template-columns:40px 1fr;font-size:21px;line-height:1.4;color:var(--ink)}
.targets li::before{content:counter(t);font-size:28px;font-weight:300;color:var(--wine);line-height:1}
.fork{display:grid;grid-template-columns:190px 60px 1fr;align-items:center}
.fork-from{background:var(--ink);color:#fff;border-radius:12px;padding:18px;font-size:19px;font-weight:600;line-height:1.3}
.fork-lines{position:relative;height:200px}
.fork-lines i{position:absolute;left:0;right:0;height:50%;border:2px solid var(--line-strong);border-left:0}
.fork-lines i:first-child{top:0;border-bottom:0;border-radius:0 14px 0 0;transform:translateY(25%)}
.fork-lines i:last-child{bottom:0;border-top:0;border-radius:0 0 14px 0;transform:translateY(-25%)}
.fork-to{display:flex;flex-direction:column;gap:24px}
.fork-to div{border-radius:12px;padding:18px 20px;font-size:19px;line-height:1.4;color:var(--ink)}
.fork-to .good{background:var(--opp)}
.fork-to .bad{background:var(--mix)}

/* journals */
.jp{grid-template-columns:480px 1fr;gap:44px}
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.jcard{border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.jcard strong{font-size:18px;color:var(--wine)}
.jcard span{font-size:17px;color:var(--ink);line-height:1.4}
.closing-line{margin-top:18px;font-size:19px;line-height:1.5;color:var(--ink);border-left:4px solid var(--wine);padding-left:16px}
.papers span{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 9px}
.papers span i{display:block;height:3px;border-radius:2px;background:var(--line-strong)}
.papers span i:last-child{width:60%}
.papers span.focus i{background:var(--wine)}

/* standards chain */
.chain{grid-template-columns:1fr 34px 1fr 34px 1fr 34px 1fr}
.chain .card{padding:20px}
.chain h3{font-size:23px;margin-bottom:6px}
.lab{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-top:8px}
.lab.ai{color:var(--navy)}.lab.you{color:var(--wine)}
.chain p{font-size:18px;line-height:1.42}
.chain p.est{color:var(--ink);font-weight:600}
.chain .link{font-size:26px;color:var(--faint)}

/* studies, points */
.studies{grid-template-columns:repeat(var(--n,3),1fr)}
.studies h3{font-size:24px}
.points{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:18px}
.points .card{display:flex;flex-direction:column;gap:10px;padding:22px}
.points h3{font-size:23px;color:var(--ink)}
.points p{font-size:19px;line-height:1.48}

/* cycle kinds */
.kinds{gap:12px}
.kind{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.kind .dots{margin:6px 0 0;gap:4px}
.kind .dots i{width:16px;height:8px}
.kind strong{display:block;font-size:19px;color:var(--ink)}
.kind span{display:block;font-size:16.5px;line-height:1.42;color:var(--body);margin-top:2px}

/* flow */
.flow-grid{display:grid;grid-template-columns:1fr 420px;gap:40px;align-items:start}
.flow{display:grid;grid-template-columns:1fr 30px 1fr 30px 1fr 30px 1.2fr;align-items:stretch;margin-top:14px}
.fstep{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;font-size:18px;line-height:1.38;color:var(--ink);display:flex;flex-direction:column;gap:8px}
.fnum{font-size:30px;font-weight:300;color:var(--navy);line-height:1}
.farrow{display:grid;place-items:center;color:var(--faint);font-size:22px}
.fout{background:var(--risk);color:#5e1a10;border-radius:12px;padding:16px;font-size:18px;line-height:1.38;font-weight:600;display:flex;align-items:center}

/* access */
.spec-ends{margin-bottom:8px}
.spec-bar{margin:0 0 18px}
.access{grid-template-columns:repeat(var(--n,3),1fr)}
.meter{display:flex;gap:4px}
.meter i{width:34px;height:8px;border-radius:4px;background:var(--line)}
.meter i.on{background:var(--wine)}

/* compare */
.cmp{display:grid;gap:6px}
.cmp .ch{font-size:15px;font-weight:700;color:var(--muted);padding:4px 14px;letter-spacing:.02em}
.cmp .rh{font-size:18px;font-weight:700;color:var(--ink);padding:14px 14px 14px 0;line-height:1.3}
.cmp .cc{border-radius:10px;padding:14px;font-size:18px;line-height:1.38;background:var(--tint);color:var(--ink)}
.cmp .cc.up{background:var(--opp);color:#173f2c}.cmp .cc.down{background:var(--risk);color:#5e1a10}.cmp .cc.mixed{background:var(--mix);color:#4f3a08}
.cmp .cc.empty{background:none;border:1px dashed var(--line)}
.figrow{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center;margin-top:18px}
.figs{display:flex;gap:30px}
.figs .stat strong{font-size:46px}

/* writing */
.two{display:grid;grid-template-columns:1fr 470px;gap:44px;align-items:start}
.numbered{margin:12px 0 0;padding:0;list-style:none;counter-reset:n;display:flex;flex-direction:column;gap:14px}
.numbered li{counter-increment:n;display:grid;grid-template-columns:44px 1fr;font-size:20px;line-height:1.45;color:var(--ink)}
.numbered li::before{content:counter(n);font-size:30px;font-weight:300;color:var(--wine);line-height:1}
.record{background:var(--tint);border-radius:14px;padding:22px 26px}
.record ul{margin:12px 0 14px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.record li{font-size:18.5px;color:var(--ink);padding-left:22px;position:relative}
.record li::before{content:"";position:absolute;left:0;top:7px;width:11px;height:11px;border:2px solid var(--navy);border-radius:3px}

/* forms */
.forms{display:grid;grid-template-columns:200px 1fr 34px 1fr;gap:10px 14px;align-items:stretch}
.forms .fh{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.forms .fname{font-size:24px;font-weight:700;color:var(--wine);display:flex;align-items:center}
.forms .fhelp{background:var(--navy-pale);border-radius:12px;padding:16px 18px;font-size:18px;line-height:1.42;color:var(--ink)}
.forms .farrow{display:grid;place-items:center}
.forms .fclaim{background:#fff;border:1px solid var(--line);border-left:4px solid var(--wine);border-radius:12px;padding:16px 18px;font-size:18px;line-height:1.42;color:var(--ink)}

/* form detail */
.form-grid{grid-template-columns:1fr 520px}
.fd-left{display:flex;flex-direction:column;gap:12px}
.fd-item{border-left:4px solid var(--wine);padding:6px 0 6px 18px}
.fd-item strong{display:block;font-size:21px;color:var(--ink)}
.fd-item span{display:block;font-size:18.5px;line-height:1.45;color:var(--body);margin-top:2px}
.kappa{background:var(--tint);border-radius:14px;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.kb{display:grid;grid-template-columns:180px 1fr 80px;gap:12px;align-items:center;font-size:16px;color:var(--ink)}
.kt{height:16px;border-radius:8px;background:#fff;border:1px solid var(--line);overflow:hidden}
.kt i{display:block;height:100%;background:var(--navy);border-radius:8px}
.kb b{font-size:16px;color:var(--navy)}

/* positions */
.stair .block{justify-content:flex-end}
.stair:nth-child(1) .block{height:70px}.stair:nth-child(2) .block{height:90px}.stair:nth-child(3) .block{height:110px}.stair:nth-child(4) .block{height:130px}.stair:nth-child(5) .block{height:150px}
.stair p{min-height:0;font-size:16.5px}
.stair p.cons{font-size:15.5px;color:var(--body);border-top:1px solid var(--line);padding-top:8px}
.stair p.cons small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--wine);margin-bottom:2px}

/* matrix 3 x 3 */
.m3{display:grid;grid-template-columns:190px repeat(3,1fr);gap:8px}
.m3c{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);align-self:end;padding-bottom:6px}
.m3h{font-size:18px;font-weight:700;color:var(--navy);background:var(--navy-pale);border-radius:10px;padding:10px 14px}
.m3r{font-size:20px;font-weight:700;color:var(--wine);display:flex;align-items:center}
.m3x{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px;line-height:1.42;color:var(--ink)}

/* pilots */
.pilots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:36px;align-items:start}
.chips{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.chips li{font-size:20px;font-weight:600;color:var(--navy);background:var(--navy-pale);border-radius:12px;padding:14px 18px}
.chips.grey li{color:var(--body);background:var(--tint)}
.aim{background:var(--wine);color:#fff;border-radius:16px;padding:26px;font-size:22px;line-height:1.45;font-weight:600}
.pilot-axes{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px;border-top:1px solid var(--line);padding-top:18px}
.pilot-axes b{display:block;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--wine)}
.pilot-axes span{display:block;font-size:18px;color:var(--ink);margin-top:4px}

/* support house */
.house .roof{font-size:15px;letter-spacing:.07em;text-transform:uppercase;padding:12px 24px}
.pillars p{font-size:17.5px}
.pillars p.learn{font-size:16px;color:var(--body);border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.pillars p.learn small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);margin-bottom:2px}
.foundation{font-size:17px;line-height:1.45}

/* scorecard */
.evalg{grid-template-columns:1fr 440px}
.score .row{grid-template-columns:230px 1fr}
.score .row b{font-size:19px}
.score .row span{display:block;font-size:18px}

/* conclusion */
.concl{display:flex;flex-direction:column;gap:10px}
.crow{display:grid;grid-template-columns:200px 1fr 1.4fr;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.crow strong{font-size:23px;color:var(--wine)}
.crow .g{font-size:21px;color:var(--ink)}
.crow .k{font-size:21px;color:var(--muted)}
.cpos{margin-top:22px;font-size:21px;line-height:1.5;color:var(--ink)}
.cfinal{margin-top:20px;background:var(--wine);color:#fff;border-radius:16px;padding:22px 28px;font-size:23px;line-height:1.45;font-weight:600}

/* report reading */
.report-toc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.report-toc .kicker{margin-right:8px}
.report-toc button{font-size:14px;padding:6px 12px;border-radius:14px;background:var(--tint);color:var(--ink)}
.report-toc button:hover{background:var(--wine-pale);color:var(--wine)}
.reading h2,.reading h3{scroll-margin-top:80px}
.reading .flash{background:var(--wine-pale);border-radius:6px;transition:background .6s}

/* narrow screens for v5 components */
body.fluid .q-grid,body.fluid .aims-grid,body.fluid .flow-grid,body.fluid .two,body.fluid .pilots,body.fluid .pilot-axes{grid-template-columns:1fr;gap:18px}
body.fluid .fork{grid-template-columns:1fr}
body.fluid .fork-lines{display:none}
body.fluid .flow{grid-template-columns:1fr}
body.fluid .flow .farrow{transform:rotate(90deg);height:24px}
body.fluid .jgrid,body.fluid .points,body.fluid .studies,body.fluid .access{grid-template-columns:1fr}
body.fluid .forms{grid-template-columns:1fr}
body.fluid .forms .fh,body.fluid .forms .farrow{display:none}
body.fluid .m3{grid-template-columns:1fr}
body.fluid .m3c{display:none}
body.fluid .cmp{grid-template-columns:1fr!important}
body.fluid .cmp .ch{display:none}
body.fluid .crow{grid-template-columns:1fr;gap:4px}
body.fluid .tasks li{font-size:20px}
body.fluid .q-box p{font-size:21px}
body.fluid .mg{grid-template-columns:90px 1fr}
body.fluid .kb{grid-template-columns:1fr}
body.fluid .strip{flex-direction:column;gap:6px}
body.fluid .to-report{max-width:100%;white-space:normal;height:auto;padding:6px 12px}
body.fluid .opener .num{font-size:40px}
/* v5 fixes */
.roadmap-list{gap:6px}
.roadmap-list button{padding:8px 18px;grid-template-columns:60px 1fr 40px}
.rnum{font-size:36px}
.rt strong{font-size:21px}
.rt span{font-size:16px;margin-top:1px}
.cyc{grid-template-columns:660px 1fr;gap:30px}
.cyc svg{max-height:470px}
.kind{padding:8px 0}
.kind span{font-size:16px}
.kinds .caption{font-size:14px}
.pillars p.learn{display:block;margin-top:auto;border-top:1px solid var(--line);padding-top:10px;gap:0}
.foundation{display:block}
.mini{align-self:start}
/* v5.1: one overview plus one detailed heatmap; no heatmap previews elsewhere */
.brief{background:var(--tint);border-radius:16px;padding:24px 28px}
.brief ol{margin:12px 0 0;padding:0;list-style:none;counter-reset:b;display:flex;flex-direction:column;gap:12px}
.brief li{counter-increment:b;display:grid;grid-template-columns:34px 1fr;font-size:18.5px;line-height:1.45;color:var(--ink)}
.brief li::before{content:counter(b);font-size:26px;font-weight:300;color:var(--wine);line-height:1}
.cohort-note{font-size:18px;color:var(--body);margin:-4px 0 10px;line-height:1.45}
.points.fd{margin-top:6px}
.kappa{margin-bottom:16px}
.points.fd .card{padding:26px 28px;gap:14px}
.points.fd h3{font-size:26px}
.points.fd p{font-size:21px;line-height:1.5}

/* ===================== v6: thirteen slides with tabs ===================== */
/* title */
.title-slide.v6 .s-body{justify-content:center;padding-bottom:40px}
.t-center{max-width:1150px}
.t-center h1{font-size:96px;line-height:1;font-weight:700;letter-spacing:-.03em;color:var(--wine)}
.t-sub{font-size:32px;color:var(--ink);margin-top:26px;line-height:1.3}
.t-meta{font-size:20px;color:var(--muted);margin-top:16px}
.t-center .t-actions{margin-top:44px}
/* divider */
.divider-slide .s-body{justify-content:center}
.divider-slide .s-title{font-size:72px}
.divider-slide .s-lead{font-size:28px;color:var(--ink);margin-top:18px;max-width:1150px}
.dv{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:48px}
.dv button{display:flex;flex-direction:column;gap:10px;text-align:left;padding:26px 28px;border:1px solid var(--line);border-top:4px solid var(--wine);border-radius:6px 6px 16px 16px;background:#fff}
.dv button:hover{box-shadow:0 8px 24px rgba(158,22,48,.1)}
.dvn{font-size:64px;line-height:.9;font-weight:300;color:var(--wine)}
.dv strong{font-size:28px;color:var(--ink)}
.dv span:last-child{font-size:20px;color:var(--body);line-height:1.45}
/* goal */
.goal{display:grid;grid-template-columns:1.1fr 1fr;gap:50px;align-items:start}
.gtime{display:flex;flex-direction:column;gap:0;position:relative;padding-left:34px}
.gtime::before{content:"";position:absolute;left:10px;top:12px;bottom:12px;width:3px;background:var(--wine-soft);border-radius:2px}
.gstep{position:relative;padding:0 0 22px}
.gstep::before{content:"";position:absolute;left:-34px;top:4px;width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid var(--wine)}
.gstep.past::before{background:var(--wine)}
.gstep b{display:block;font-size:20px;color:var(--wine)}
.gstep span{display:block;font-size:20px;line-height:1.45;color:var(--ink);margin-top:4px}
.gareas{background:var(--tint);border-radius:16px;padding:24px 28px;display:flex;flex-direction:column;gap:14px}
.gareas .numbered li{font-size:19.5px}
/* strategy */
.strat{display:grid;grid-template-columns:1fr 1.15fr;gap:44px;align-items:start}
ul.plain{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
ul.plain li{position:relative;padding-left:22px;font-size:19.5px;line-height:1.45;color:var(--ink)}
ul.plain li::before{content:"";position:absolute;left:0;top:10px;width:9px;height:9px;border-radius:50%;background:var(--wine)}
.ai-in-plan{background:var(--navy-pale);border-radius:16px;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.ai-in-plan .kicker{color:var(--navy)}
.aip-item strong{display:block;font-size:19px;color:var(--navy)}
.aip-item span{display:block;font-size:17.5px;line-height:1.45;color:var(--ink);margin-top:2px}
/* tabs */
.tabs-wrap{display:flex;flex-direction:column;gap:16px;min-height:0}
.tablist{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:600;color:var(--body);text-align:left}
.tab:hover{border-color:var(--wine-soft)}
.tab[aria-selected=true]{background:var(--wine);border-color:var(--wine);color:#fff}
.tabpanel{background:#fff}
.tabs-wrap.vertical{flex-direction:row;gap:22px}
.tabs-wrap.vertical .tablist{flex-direction:column;flex-wrap:nowrap;width:270px;flex:none}
.tabs-wrap.vertical .tab{flex-direction:column;align-items:flex-start;gap:2px;padding:14px 18px}
.tabs-wrap.vertical .panels{flex:1;min-width:0}
.tfig{font-size:26px;font-weight:700;line-height:1.1}
.tlab{font-size:15px;font-weight:600;opacity:.85}
.crit-grid{display:grid;grid-template-columns:1fr 330px;gap:24px;align-items:start}
.cdef{font-size:19px;line-height:1.5;color:var(--ink);margin-bottom:16px}
.aiw{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.aiw-a,.aiw-w{border-radius:14px;padding:16px 20px}
.aiw-a{background:var(--navy-pale)}.aiw-w{background:var(--wine-pale)}
.aiw .lab{margin:0 0 6px}
.aiw p{font-size:19px;line-height:1.48;color:var(--ink)}
.aiw ul.plain{margin-top:6px;gap:8px}.aiw ul.plain li{font-size:17.5px}
.aiw-a ul.plain li::before{background:var(--navy)}
.cap{border-top:1px solid var(--line);padding-top:10px}
.cap strong{display:block;font-size:30px;color:var(--navy);line-height:1.1}
.cap span{display:block;font-size:15.5px;color:var(--body);line-height:1.4;margin-top:2px}
/* departments */
.dp{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:start;padding-top:4px}
.dp h3{font-size:26px;color:var(--wine)}
.dtyp{font-size:21px;line-height:1.45;color:var(--ink);margin:8px 0 18px}
.jl{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:j}
.jl li{counter-increment:j;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:baseline;font-size:17.5px;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:6px}
.jl li::before{content:counter(j);color:var(--wine);font-weight:300;font-size:20px}
.jl small{font-size:14px;color:var(--muted);white-space:nowrap}
.dp .ex{margin-top:10px;background:var(--tint);border-radius:12px;padding:14px 16px;font-size:17px;line-height:1.42;display:flex;flex-direction:column;gap:8px}
.dp .ex .meta{font-size:14px}
.dp .ms{display:flex;gap:4px;flex-wrap:wrap}
/* stages, forms, positions */
.tabs-wrap.stages .tab{padding:10px 16px}
.snum{font-size:22px;font-weight:300;opacity:.8}
.sdesc{font-size:22px;color:var(--ink);margin:4px 0 14px;font-weight:600}
.evid{margin-top:16px;border-left:4px solid var(--navy);padding:6px 0 6px 18px}
.evid p{font-size:19px;line-height:1.48;color:var(--ink)}
.tabpanel .kappa{margin-top:16px}
.pos{display:flex;flex-direction:column;gap:16px}
.pd .lab{color:var(--muted);margin:0 0 4px}
.pd p{font-size:20px;line-height:1.45;color:var(--ink)}
/* next steps */
.nsteps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.nsteps .card{display:flex;flex-direction:column;gap:12px;padding:24px}
.nsn{font-size:48px;line-height:.9;font-weight:300;color:var(--wine)}
.nsteps h3{font-size:24px;color:var(--ink)}
.nsteps p{font-size:18.5px;line-height:1.45}
.chips.small{gap:6px;margin-top:auto}
.chips.small li{font-size:15.5px;padding:8px 12px;border-radius:9px}
/* narrow screens */
body.fluid .t-center h1{font-size:44px}
body.fluid .t-sub{font-size:21px}
body.fluid .dv,body.fluid .goal,body.fluid .strat,body.fluid .crit-grid,body.fluid .aiw,body.fluid .dp,body.fluid .nsteps{grid-template-columns:1fr}
body.fluid .divider-slide .s-title{font-size:36px}
body.fluid .tabs-wrap.vertical{flex-direction:column}
body.fluid .tabs-wrap.vertical .tablist{width:auto;flex-direction:row;flex-wrap:wrap}
body.fluid .tab{font-size:14px;padding:8px 12px}
/* v6 fixes */
.dp h3{font-size:22px}
.dtyp{font-size:19px;margin:6px 0 12px}
.jl{gap:2px}
.jl li{font-size:16.5px;padding-bottom:4px}
.gtime{padding-left:46px}
.gtime::before{left:12px}
.gstep::before{left:-46px}
.tabs-wrap.top .tab{font-size:19px;padding:12px 20px}
.tabs-wrap.top .aiw p{font-size:22px;line-height:1.5}
.tabs-wrap.top .aiw-a,.tabs-wrap.top .aiw-w{padding:22px 26px}
.sdesc{font-size:26px;margin:8px 0 18px}
.pd p{font-size:22px}
.evid p{font-size:21px}
.tabs-wrap.top .tabpanel .kappa .kb{font-size:18px}
.tabs-wrap.top+.caption,.s-content>.caption{font-size:16px}

and career group. The overview shows where the groups are affected differently.", "section_id": "sec-5-combined-effects-and-possible-developments-at-feb"}, {"id": "map-groups", "chapter": "Opportunities and risks", "layout": "heatmap", "cohorts": ["phd", "postdoc_ap", "senior"], "cohort": "phd", "title": "Opportunities and risks per career group", "section": "5. Combined effects and possible developments at FEB", "lead": "Select a career group to read the outcome of each assessment, and select a cell for its benefit, risk, reasoning, and sources.", "cohort_notes": {"phd": "A PhD candidate may finish a task faster with AI and still need to learn how to judge that task. {{S09-003}}{{S09-004}}", "postdoc_ap": "AI may help postdocs and assistant professors attempt more ambitious work, provided they have time to validate it and can show which contribution is their own. {{S08-013}}{{S01-002}}", "senior": "Associate and full professors may save effort in their own projects, while more AI-assisted drafts and analyses from others can increase the time they spend reviewing. {{S09-015}}{{S09-016}}"}, "section_id": "sec-5-combined-effects-and-possible-developments-at-feb"}, {"id": "scenarios", "chapter": "Opportunities and risks", "title": "With and without faculty support", "section": "Without a faculty AI programme", "lead": "Researchers will keep developing their own ways of using AI, and a faculty programme could help FEB tell research improvements apart from a shift in who does the checking or who loses an opportunity to learn. {{S01-001}}{{S03-015}}{{S03-014}}", "visual": {"type": "scenarios", "columns": ["", "Without a faculty AI programme", "With a faculty AI support programme"], "rows": [["Access", "Teams with the expertise and resources gain, while others struggle to judge a new method or find a permitted environment. {{S01-001}}", "Researchers working on a specific task are connected to methods advice and a suitable tool environment. {{S03-015}}{{S03-014}}"], ["Learning", "A candidate may complete a chapter without learning to diagnose errors in generated code.", "Supervisors examine what candidates can explain afterwards."], ["Checking", "An apparent time saving for the author becomes additional checking for someone else.", "Teams compare the completed work with the total effort needed to produce and check it."], ["Sharing", "Useful practices stay inside the group that developed them.", "Useful procedures are shared across projects."]], "caption": "The two scenarios describe possible developments and do not predict publication counts or staffing. The bars count the colours of the 54 heatmap assessments in each scenario."}, "section_id": "sec-without-a-faculty-ai-programme"}, {"id": "next", "chapter": "Next steps", "title": "Proposed next steps", "section": "6. Recommendations for FEB", "lead": "The working group could start with a small number of supported projects, learn what they require, and then propose which uses deserve continued support. {{S01-001}}", "visual": {"type": "nextsteps", "cols": [{"n": "1", "title": "Start with a few projects", "text": "Evaluate existing research activities with willing teams across research forms, career positions, and departments in 2026–2027. {{S01-001}}", "chips": ["Literature synthesis", "Reproducible analysis", "Manuscript feedback and revision", "Grant preparation"]}, {"n": "2", "title": "Support work in progress", "text": "Help researchers while a project is under way, when a question about a measure, a data agreement, or a tool can still be resolved.", "chips": ["A route to methods, library, data, privacy, and AI advice", "Examples and records of what did and did not work", "Help setting up suitable tools", "Time for validation and supervision"]}, {"n": "3", "title": "Evaluate quality, effort, and learning", "text": "Judge each project on the quality of the completed research, the total effort including checking and supervision, and what researchers can explain afterwards. {{S09-003}}{{S13-101}}", "chips": ["Errors found in generated code and measures", "Claims traced to sources", "Time spent checking", "What candidates can explain without AI"]}]}, "section_id": "sec-6-recommendations-for-feb"}], "cells": [{"id": "phd-quantitative-question", "cohort": "phd", "research_type": "quantitative", "stage": "question", "rating": "mixed", "headline": "Questions chosen before data are checked", "summary": "From the questions and mechanisms that AI proposes, the candidate chooses one and explains what the available evidence could show.", "paragraphs": ["Korinek offers examples from economics in which AI generates research questions and counterarguments, although these examples do not show that the resulting studies are stronger. {{S06-001}} A PhD candidate plans the dissertation and defends it with a supervisor. {{S09-012}} A candidate who has already drafted a question can compare it with the AI suggestions and may find a useful alternative without leaving the tool to decide what the project is about."], "opportunity": "When the candidate frames a new quantitative project, AI may suggest a mechanism or a comparison that the candidate had overlooked.", "risk": "The candidate may settle on an appealing question and only later discover that the available data cannot answer it.", "support": "In an FEB methods discussion, the candidate could present a draft question first and then compare it with the AI alternatives by explaining which evidence would decide between them.", "rating_reason": "When asked for hypotheses and comparisons, AI may suggest several that the candidate had not considered. {{S06-001}} To choose well among them, however, the candidate needs a command of the data and methods that may still be developing, so the wider choice can also make it harder to settle on a feasible question.", "conditions": ["The candidate states the estimand and rival explanations.", "The supervisor checks the fit with the available evidence."], "applicability": "Applies to quantitative projects including exploratory discovery, structural work, experiments, and statistical meta-analysis; it does not assume every study starts with a fixed hypothesis.", "evidence_strength": "adjacent", "source_ids": ["S06-001", "S09-012"], "source_locators": {"S06-001": "Korinek, Journal of Economic Literature, published PDF pp. 1281–84, use-case sections", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}, "role_source_ids": ["S09-012"], "limits": "No cited study estimates AI’s effect on the quality of FEB doctoral research questions.", "supported_rating": "opportunity", "supported_reason": "If a methods adviser asks what each proposed comparison would show and whether the necessary data exist, the candidate is more likely to use the extra ideas to improve the question. The final choice stays with the candidate, who is responsible for planning the dissertation. {{S09-012}}", "supported_headline": "Questions weighed against available data", "task_scope": "AI proposes research questions, mechanisms and hypotheses for the project's subject and plausible evidence; the researcher selects and justifies the question."}, {"id": "phd-quantitative-literature", "cohort": "phd", "research_type": "quantitative", "stage": "literature", "rating": "opportunity", "headline": "Relevant studies found sooner", "summary": "AI searches and compares studies for the candidate, who checks the coverage of the search and reads the papers on which the project depends.", "paragraphs": ["AI can search, screen and compare studies, including studies for a possible statistical meta-analysis. One screening evaluation found that the results depended on the task, so the candidate should not treat the AI shortlist as complete. {{S06-012}} A meta-analysis also requires decisions about which effects can be compared. {{S07-32}} A PhD candidate therefore reads the pivotal studies as part of the doctoral research itself, whatever the screening has produced. {{S09-012}}"], "opportunity": "AI can screen the large number of records that a search returns and bring relevant studies to the candidate’s attention sooner.", "risk": "If AI misses a paper or summarises it misleadingly, the candidate may form a false picture of an important debate in the literature.", "support": "FEB library staff could review the candidate’s search terms and a sample of excluded studies, and the supervisor could discuss the papers on which the proposed comparison rests.", "rating_reason": "In screening studies, AI reduced some of the work, although its performance varied with the task. {{S06-012}} Because the candidate can inspect the search record and read the pivotal papers, AI can plausibly help the candidate find useful studies sooner, even with ordinary supervision.", "conditions": ["Exclusions are audited with a defined sample.", "The candidate reads and compares the pivotal original studies."], "applicability": "Applies to empirical literature search and appraisal, including search for statistical meta-analysis; formal systematic reviews require their own protocol and error thresholds.", "evidence_strength": "direct_task", "source_ids": ["S06-012", "S07-32", "S09-012"], "source_locators": {"S06-012": "Homiar et al., PubMed abstract Methods/Results on calibrated screening and simulated workload", "S07-32": "Snyder, open publisher text sections 2.1–2.2 and Table 2 on review methods", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}, "role_source_ids": ["S09-012"], "limits": "The strongest screening evaluations concern health reviews and older model and workflow configurations, not FEB doctoral literatures.", "supported_rating": "opportunity", "supported_reason": "Library staff can help the candidate test the exclusions against a sample of papers and revise the search terms. Once the screening has been checked in this way, the candidate has more time to read the designs and findings that are most relevant to the research question. {{S06-012}}", "task_scope": "AI searches, screens, summarises and compares relevant studies; the researcher assesses coverage and reads the pivotal originals."}, {"id": "phd-quantitative-design", "cohort": "phd", "research_type": "quantitative", "stage": "design", "rating": "risk", "headline": "Untested assumptions in study designs", "summary": "With AI drafting the design and alternative checks, the candidate tests what the proposed data and model can actually establish.", "paragraphs": ["AI can draft a substantive design or model and propose checks on it. Whether the approach is empirical or structural, researchers have to defend the assumptions behind their estimates. {{S06-002}} {{S06-003}} A PhD candidate plans the study and defends it under supervision, so the candidate needs to understand those assumptions well enough to defend them. {{S09-012}} A coding experiment points to a learning risk, although it did not examine research design. People who completed a task with AI help in that experiment later showed weaker understanding of the unfamiliar library they had used. {{S09-003}}"], "opportunity": "If AI proposes a simulation or a rival specification, the candidate may recognise an assumption in the design before data collection or estimation begins.", "risk": "Even a plausible AI design may compare the wrong cases or measure something other than the construct the candidate intends to study.", "support": "In an FEB methods clinic, the candidate could explain the estimand and the assumptions of the AI proposal before the research team commits to the design.", "rating_reason": "Angrist and Pischke explain why the credibility of the comparison, rather than an estimator that runs, determines what an empirical result supports. {{S06-002}} A PhD candidate who inspects an AI design may lack the experience to spot the decisive assumption in that comparison, and ordinary supervision may not provide specialist review.", "conditions": ["The candidate defends the comparison and its assumptions.", "Data rights are checked for the actual workflow."], "applicability": "Applies to causal, predictive, descriptive, experimental, structural, and statistical meta-analytic designs, with different criteria for each.", "evidence_strength": "methodological", "source_ids": ["S06-002", "S06-003", "S09-003", "S09-012"], "source_locators": {"S06-002": "Angrist and Pischke, Journal of Economic Perspectives, abstract/introduction on credible empirical design", "S06-003": "Nevo and Whinston, Journal of Economic Perspectives publisher abstract on structural modelling and assumptions", "S09-003": "Shen and Tamkin, local original PDF pp. 1–2, 8–10, 17–19: randomized unfamiliar-library task, learning quiz and limitations", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}, "role_source_ids": ["S09-012"], "limits": "The design sources specify inferential requirements but do not directly measure how well AI designs perform for FEB PhD candidates.", "supported_rating": "mixed", "supported_reason": "Before estimation begins, a methods adviser can ask the candidate to defend the comparison, the measurement and the feasible alternatives. In that discussion the adviser may expose a weak assumption, but neither the adviser nor the candidate can prove that the proposed comparison answers the causal question. {{S06-002}}", "supported_headline": "Design assumptions defended before estimation", "task_scope": "AI drafts a substantive design or model specification and alternative checks; the researcher assesses the estimand, assumptions and feasibility."}, {"id": "phd-quantitative-data", "cohort": "phd", "research_type": "quantitative", "stage": "data", "rating": "mixed", "headline": "Errors in constructed measures", "summary": "The candidate lets AI retrieve, clean and link permitted data and then checks whether the resulting measures mean what the study needs.", "paragraphs":
