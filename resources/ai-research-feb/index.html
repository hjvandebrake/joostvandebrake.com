["AI can retrieve and prepare records that the project is allowed to use, including figures extracted from studies for a meta-analysis. Public filings, for example, are available through documented APIs, but those APIs do not give access to every dataset. {{S06-023}} Corporate reports also vary in wording and structure, and errors in generated variables can affect inference. {{S07-08}} {{S07-07}} The candidate therefore has to be able to explain how each final measure was constructed. {{S09-012}}"], "opportunity": "AI can prepare the records or extract the study results, which gives the candidate more time to examine the measures that look questionable.", "risk": "A wrong match or extraction may end up in a variable that looks plausible to the candidate but changes the reported result.", "support": "An FEB data specialist could help the candidate check a sample of source records and explain how doubtful matches affect the final measure.", "rating_reason": "Researchers have shown that errors in model-generated covariates can change an estimate. {{S07-07}} A candidate who checks the prepared data may still miss a wrong link among many records, so the time saved comes with a risk of measurement error.", "conditions": ["The source and the tool are authorised for this use.", "The candidate checks records and measures against the originals."], "applicability": "Applies to public or permitted quantitative data assembly and extraction of numerical results for statistical meta-analysis; restricted data need agreement-specific review.", "evidence_strength": "direct_task", "source_ids": ["S06-023", "S07-07", "S07-08", "S09-012"], "source_locators": {"S06-023": "SEC EDGAR API overview, submissions, XBRL, and Programmatic API Access", "S07-07": "Christensen et al., AEA pp. 92–97 abstract on generated covariate error", "S07-08": "Accounting annual-report ownership extraction, publisher abstract and methods summary", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}, "role_source_ids": ["S09-012"], "limits": "Permitted access is assumed for the rated task; no examined FEB dataset establishes a particular extraction or measurement error rate.", "supported_rating": "opportunity", "supported_reason": "With a data specialist, the candidate can sample the source records, inspect wrong matches and explain how each measure was constructed. After such checks the candidate can make good use of substantial AI preparation, although some measurement error may remain. {{S07-07}}", "task_scope": "For material the project is permitted to use, AI retrieves, extracts, cleans and links records or study results; the researcher validates measures and transformations. Data-access rights remain a separate constraint.", "supported_headline": "Constructed measures checked against sources"}, {"id": "phd-quantitative-analysis", "cohort": "phd", "research_type": "quantitative", "stage": "analysis", "rating": "risk", "headline": "Less practice diagnosing errors", "summary": "AI writes the analysis code and proposes an interpretation, and the candidate checks for errors and explains what the result supports.", "paragraphs": ["A PhD candidate has to be able to explain an estimate as well as run the program that produces it. {{S09-012}} In a randomised reproduction exercise in the social sciences, teams with AI assistance showed little overall advantage and detected fewer major errors. {{S08-009}} Newer agents have reproduced selected research packages more successfully, so performance depends on the system and the task. {{S08-010}} In another experiment, people who received AI help with unfamiliar code showed weaker debugging understanding immediately afterwards. {{S09-003}}"], "opportunity": "The candidate can ask AI to write robustness checks and then run, inspect and use them to challenge a result.", "risk": "The candidate may overlook a coding error behind a plausible table and may also get less practice in finding and repairing such errors.", "support": "An FEB code review could run known test cases and then ask the candidate to repair and explain one error that changes the result.", "rating_reason": "In a randomised reproduction exercise, social-science teams with AI assistance found fewer major coding errors than human-only teams. {{S08-009}} In a separate coding experiment, participants showed weaker debugging understanding immediately after AI help. {{S09-003}} A PhD candidate has to learn to find and understand such errors, so both results point to a risk for the candidate’s training as well as for the analysis.", "conditions": ["An independent check of the code or data is available.", "The candidate explains the assumptions and how the result was constructed."], "applicability": "Applies to estimation, prediction, experiments, statistical meta-analysis, and robustness work; exact checks depend on the quantitative design.", "evidence_strength": "direct_task", "source_ids": ["S08-009", "S08-010", "S09-003", "S09-012"], "source_locators": {"S08-009": "Brodeur et al., PNAS p. 5 Table 1 and Results section 2.2 on reproduction and errors", "S08-010": "Alizadeh et al., preprint HTML sections 2.1, 2.4, 5.1–5.3 and Figures 1 and 5", "S09-003": "Shen and Tamkin, local original PDF pp. 1–2, 8–10, 17–19: randomized unfamiliar-library task, learning quiz and limitations", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}, "role_source_ids": ["S09-012"], "limits": "Agent and reproduction studies used selected tasks and do not estimate quality or learning effects for FEB PhDs.", "supported_rating": "mixed", "supported_reason": "A reviewer can run tests independently and ask the candidate to repair an error and explain the estimate, which should improve both the code and the candidate’s understanding of it. A correct program, however, cannot establish that the design or the interpretation is sound.", "supported_headline": "Code reviewed and errors explained", "task_scope": "AI produces the main estimation or synthesis code, robustness analyses and proposed interpretation; the researcher checks execution, errors and what the result can establish."}, {"id": "phd-quantitative-writing", "cohort": "phd", "research_type": "quantitative", "stage": "writing", "rating": "mixed", "headline": "Findings overstated in drafts", "summary": "The candidate asks AI to draft substantial sections or reviewer replies and then checks each claim against the analysis and the sources.", "paragraphs": ["When AI drafts a methods section or a response to reviewers from an outline and the project’s evidence, the candidate has to defend the reported analysis and the revision. {{S09-012}} In one consulting task, work done with AI assistance became more persuasive even when the answer was wrong. {{S05-009}} Published citation audits have also found fabricated references, although these audits do not estimate how often fabricated references appear in FEB manuscripts. {{S06-019}}"], "opportunity": "From an outline of the response, AI can produce a draft that helps the candidate answer a specific criticism raised by a reviewer.", "risk": "In a fluent draft, the candidate may miss a causal claim that is stronger than the estimates support or a paper that is cited incorrectly.", "support": "For major revisions, FEB could give supervisors a short format for checking the central claims against the estimates and for discussing how the candidate responds to the criticism.", "rating_reason": "A PhD candidate may finish a draft sooner while still learning which claims the evidence supports. In a consulting experiment, AI assistance reduced accuracy on a task outside the tested system’s capability. {{S05-009}} Because a well-written draft can look convincing, the candidate may find it harder to notice when a claim goes beyond the estimates.", "conditions": ["The candidate verifies the central empirical claims.", "Substantial methodological use of AI is documented appropriately."], "applicability": "Applies to quantitative manuscripts, dissertation chapters, review replies, and reuse summaries; journal-specific rules still govern submission.", "evidence_strength": "adjacent", "source_ids": ["S05-009", "S06-019", "S09-012"], "source_locators": {"S05-009": "Dell’Acqua et al., published original PDF pp. 2, 7–9, 11–13 and Tables 4, 7, 9: inside/outside frontier and persuasive wrong answers", "S06-019": "Topaz et al., Lancet correspondence pp. 1779–81 methods and limitations; erratum exists", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}, "role_source_ids": ["S09-012"], "limits": "Writing and citation evidence is not a direct trial of FEB doctoral publication quality.", "supported_rating": "opportunity", "supported_reason": "With a short checking format, the supervisor and the candidate can trace each central claim to an estimate and a source. The check takes time, but the candidate can then use a substantial draft for the revision without reporting a result that the evidence does not support. {{S09-012}}", "supported_headline": "Central claims traced to estimates", "task_scope": "AI drafts substantial manuscript sections or reviewer responses from the project's evidence and outline; the researchers assess the argument and final claims."}, {"id": "phd-qualitative-question", "cohort": "phd", "research_type": "qualitative", "stage": "question", "rating": "mixed", "headline": "Uncertain fit between question and setting", "summary": "The candidate weighs AI suggestions for questions and explanations against what can be learned in the setting.", "paragraphs": ["A qualitative question can change as the researcher learns what happens in the field, so the researcher has to keep attending to methodological fit. {{S06-004}} Researchers also have to negotiate access to the field and cannot assume that every interesting question can be investigated there. {{S06-024}} In a PhD project, the candidate and the supervisor can use AI suggestions to widen their discussion of possible questions, and the candidate then chooses the question and defends it. {{S09-012}}"], "opportunity": "An alternative explanation from AI may prompt the candidate to ask participants about a practice that the early interviews had missed.", "risk": "The candidate may pursue an attractive theme that participants are unable to discuss or that does not fit the site.", "support": "In a dedicated FEB discussion of the emerging question, a supervisor could compare the AI suggestions with the candidate’s field notes and access plans.", "rating_reason": "Qualitative researchers have to fit their question to the phenomenon and to the evidence they can gather. {{S06-004}} AI may help a candidate see another possibility, but the candidate can judge whether it fits only through contact with the setting, and ordinary supervision cannot replace that contact.", "conditions": ["The candidate explains how the question fits the setting.", "Field access is credible and appropriate."], "applicability": "Applies to qualitative discovery and qualitative theory testing, including field and documentary studies.", "evidence_strength": "methodological", "source_ids": ["S06-004", "S06-024", "S09-012"], "source_locators": {"S06-004": "Edmondson and McManus, original PDF pp. 1155–56 and Table 1 on methodological fit", "S06-024": "Riese, publisher abstract sentences 1–3 on evolving qualitative field access", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}, "role_source_ids": ["S09-012"], "limits": "No cited study measures AI-generated question quality in FEB qualitative doctoral research.", "supported_rating": "mixed", "supported_reason": "A supervisor can ask the candidate to compare each proposed question with the field notes and with what participants are able to discuss, and the candidate is then likely to choose a better question. The candidate needs fieldwork, however, before deciding whether the question holds. {{S06-024}}", "task_scope": "AI proposes questions, concepts and possible explanations for the project's setting; the researcher judges their relevance and fit with inquiry in that setting."}, {"id": "phd-qualitative-literature", "cohort": "phd", "research_type": "qualitative", "stage": "literature", "rating": "mixed", "headline": "Less reading of original studies", "summary": "AI searches and compares qualitative studies, and the candidate checks the coverage and reads the papers that define the relevant debates.", "paragraphs": ["AI can search and compare qualitative studies, although evaluations of AI screening do not show complete or uniform coverage. {{S06-011}} Researchers doing thematic analysis read the original material closely and develop their interpretations through that engagement. {{S07-15}} A PhD candidate who compares published studies faces a similar learning task, since AI may point to a paper but the candidate has to read it and explain why it is relevant. {{S09-012}}"], "opportunity": "AI may find studies that use different terms for a similar process, especially when the candidate searches across neighbouring fields.", "risk": "A candidate who relies on a short AI summary may not see that two authors use the same term for different processes.", "support": "After FEB library staff have reviewed the search terms and exclusions, the supervisor could set aside time for the candidate to explain the papers most relevant to the question.", "rating_reason": "Evaluations of AI screening show that performance varies across tasks. {{S06-011}} A wider list of studies may help, but the candidate has to work out how each study uses its concepts by reading it, and ordinary supervision cannot do that reading for the candidate. {{S07-15}}", "conditions": ["Original studies are read for pivotal claims.", "Search and exclusion choices are logged."], "applicability": "Applies to qualitative empirical literatures, including deductive case designs and interpretive traditions.", "evidence_strength": "direct_task", "source_ids": ["S06-011", "S07-15", "S09-012"], "source_locators": {"S06-011": "Khraisha et al., PubMed abstract Results on screening agreement and task variation", "S07-15": "Braun and Clarke, original methods article pp. 79–91 on iterative thematic analysis", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}, "role_source_ids": ["S09-012"], "limits": "Screening trials are mostly health-review tasks; the interpretive concern is a reasoned transfer from methodology.", "supported_rating": "opportunity", "supported_reason": "Library staff can find studies that the search missed, and a supervisor can discuss the papers that the candidate identifies as central. The candidate can then benefit from the wider search while basing the conceptual comparison on the papers themselves. {{S09-012}}", "supported_headline": "More studies read closely", "task_scope": "AI searches, screens, summarises and compares relevant studies; the researcher assesses coverage, theoretical differences and pivotal originals."}, {"id": "phd-qualitative-design", "cohort": "phd", "research_type": "qualitative", "stage": "design", "rating": "risk", "headline": "Interview questions that lead participants", "summary": "AI drafts a sampling or interview plan, and the candidate checks how well it fits the site, the participants and the research question.", "paragraphs": ["An AI-drafted guide can offer useful alternatives, but researchers have to negotiate access and decide which participants can speak to the question. {{S06-024}} Methodological fit also determines what the study can infer. {{S06-004}} In one study of chatbot interviews, social scientists reported missed probes and leading questions. {{S06-025}} A PhD candidate should therefore assess the plan with a supervisor and revise it after a pilot, because the written guide is only a first version of the design. {{S09-012}}"], "opportunity": "With an AI draft in hand, the candidate can compare several probes or sampling choices before trying any of them with people in the field.", "risk": "An interview question that sounds sensible on paper may lead a participant towards an answer or miss how the work in the setting actually happens.", "support": "Before fieldwork, an FEB methods adviser could discuss sampling with the candidate and review a pilot interview for leading or confusing questions.", "rating_reason": "Researchers obtain access through relationships and have to match the method to the phenomenon. {{S06-024}} {{S06-004}} Even a PhD candidate who reads an AI-drafted guide carefully may not recognise a leading probe until it has shaped an interview.", "conditions": ["The candidate explains the sampling and interaction choices.", "Any participant-facing use of AI is explicitly reviewed."], "applicability": "Applies to interview, case, ethnographic, and documentary designs; obligations vary with material and participants.", "evidence_strength": "methodological", "source_ids": ["S06-004", "S06-024", "S06-025", "S09-012"], "source_locators": {"S06-004": "Edmondson and McManus, original PDF pp. 1155–56 and Table 1 on methodological fit", "S06-024": "Riese, publisher abstract sentences 1–3 on evolving qualitative field access", "S06-025": "Jack et al., Abstract, Recruitment and Application, Sample, Discussion, and Consent", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}, "role_source_ids": ["S09-012"], "limits": "Existing sources support design principles and bounded AI use, not an estimate of AI design quality in FEB fieldwork.", "supported_rating": "mixed", "supported_reason": "In this scenario, a methods adviser reviews the sampling plan, and a pilot interview shows the candidate whether questions lead or confuse participants. The candidate is then less likely to carry a leading probe into the main interviews, although the guide may need further changes when fieldwork develops differently.", "supported_headline": "Interview guides piloted before fieldwork", "task_scope": "AI drafts a sampling approach, interview guide or observational plan; the researcher assesses fit with the setting, ethics and emerging question."}, {"id": "phd-qualitative-data", "cohort": "phd", "research_type": "qualitative", "stage": "data", "rating": "mixed", "headline": "Automated interviews may change responses", "summary": "The candidate supplies field material for AI to organise, may let AI help conduct a specified interview, and checks the record in context.", "paragraphs": ["When access and consent have been addressed, AI can transcribe the interviews that the candidate supplies and organise documents. If AI also helps ask the interview questions, the assessment concerns data collection as well as transcription. Social scientists who tested chatbot interviews reported missed probes and interruptions, and another experiment found richer responses that came with trade-offs for participants. {{S06-025}} {{S06-026}} Access still depends on relationships with the site, and the candidate has to know the material well enough to interpret it. {{S06-024}} {{S09-012}}"], "opportunity": "If AI transcribes the interviews, the candidate can spend more time reviewing field notes and speaking with participants.", "risk": "If the candidate lets an automated interviewer ask the questions, the tool may miss a cue or change how a participant explains a sensitive event.", "support": "FEB could provide approved transcription tools and transcript checks and could help the research team compare an AI-assisted interview procedure with one led by a researcher.", "rating_reason": "The candidate can check a transcript against the audio but cannot assume that an automated interview produces the same conversation. In one study, social scientists reported missed probes, and in another, participants gave richer answers that came with costs to their experience. {{S06-025}} {{S06-026}}", "conditions": ["Access and participant disclosures cover the tool.", "The candidate checks omissions and missed cues."], "applicability": "Applies to interviews, surveys, observations, documents, and transcription as distinct components; a bot is optional.", "evidence_strength": "direct_task", "source_ids": ["S06-024", "S06-025", "S06-026", "S09-012"], "source_locators": {"S06-024": "Riese, publisher abstract sentences 1–3 on evolving qualitative field access", "S06-025": "Jack et al., Abstract, Recruitment and Application, Sample, Discussion, and Consent", "S06-026": "Barari et al., journal abstract, PDF pp. 161–64, Results/Discussion", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}, "role_source_ids": ["S09-012"], "limits": "Existing chatbot studies use selected participants and do not establish equivalence for confidential FEB field sites.", "supported_rating": "mixed", "supported_reason": "With checked transcripts and a reviewed interview procedure, the candidate can correct some errors in the record. The researchers still have to judge what a participant meant in context and whether the tool changed the conversation, and a checked transcript cannot settle either question.", "task_scope": "With access and consent addressed, AI transcribes and organises supplied interviews, observations or documents and can assist a specified collection procedure; the researcher checks the record and its context."}, {"id": "phd-qualitative-analysis", "cohort": "phd", "research_type": "qualitative", "stage": "analysis", "rating": "risk", "headline": "Interpretation framed by AI themes", "summary": "The candidate uses AI to code passages and propose themes and then checks those themes against the material and the chosen qualitative approach.", "paragraphs": ["AI can apply a codebook and suggest themes, but the PhD candidate has to check the original passages and their context and defend the resulting interpretation. {{S09-012}} In a study of deductive coding, AI agreed with expert labels less often than human experts did. {{S07-02}} Braun and Clarke describe familiarisation and interpretation as work that the researcher has to do, especially in reflexive thematic analysis. {{S07-15}} In a patent-law trial, junior lawyers produced better drafts with AI assistance but showed no average gain on unassisted redlining, which is an adjacent warning about learning and not evidence about qualitative research. {{S13-101}}"], "opportunity": "The candidate may notice a recurring passage or an exception once AI has compared many interviews or documents.", "risk": "Once the candidate starts explaining the case in the model’s terms, he or she may give too little weight to passages that contradict those terms.", "support": "In an FEB methods session, a supervisor could code a sample with the candidate and ask how difficult passages change the proposed themes.", "rating_reason": "In one codebook study, AI agreed with expert labels less often than human experts did, and the results varied by category. {{S07-02}} The candidate also has to learn to interpret the case, and a theme that AI proposes early may narrow what the candidate looks for, even when the original passages are checked. {{S07-15}}", "conditions": ["The methodological stance permits the proposed use.", "The candidate can trace each theme to difficult passages."], "applicability": "Applies to qualitative coding and interpretation; deductive codebook work and reflexive analysis need different assessments.", "evidence_strength": "direct_task", "source_ids": ["S07-02", "S07-15", "S09-012", "S13-101"], "source_locators": {"S07-02": "Xiao et al., abstract and single case evaluation of expert-codebook coding", "S07-15": "Braun and Clarke, original methods article pp. 79–91 on iterative thematic analysis", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S13-101": "Autor et al., NBER original PDF pp. 2–5, 14, 17–19, 23–24, 38–40; Tables 2 and 6: assisted drafting versus unassisted redlining, seniority interaction and limits"}, "role_source_ids": ["S09-012"], "limits": "AI coding and case studies are bounded; methodological positions are arguments, not measured FEB effects.", "supported_rating": "mixed", "supported_reason": "A supervisor who compares codes with the candidate can ask how awkward passages affect each proposed theme, so the candidate can make some use of the AI comparisons. Agreement on labels alone, however, cannot establish that the interpretation fits the case.", "supported_headline": "Themes compared with difficult passages", "task_scope": "AI applies a codebook where appropriate, compares passages and proposes themes or interpretations; the researcher judges these against the original material, context and stated qualitative approach."}, {"id": "phd-qualitative-writing", "cohort": "phd", "research_type": "qualitative", "stage": "writing", "rating": "mixed", "headline": "Drafts may misstate participants’ meaning", "summary": "When AI drafts case text or reviewer replies, the candidate checks the quotations, their context and the evidence that challenges the interpretation.", "paragraphs": ["AI can draft substantial case text from the candidate’s material and outline. In reflexive thematic analysis, however, the researcher develops an interpretation by working with the material, which involves more than checking a final quotation. {{S07-15}} A smooth draft may leave out hesitation or disagreement that readers need in order to understand the case, and the candidate remains responsible for what the dissertation and any publication say. {{S09-012}}"], "opportunity": "AI may help the candidate arrange a case narrative so that readers can follow how the evidence supports each claim.", "risk": "A smooth draft may leave out a participant’s hesitation or disagreement and in doing so change what the participant’s words mean.", "support": "FEB could reserve supervisor time to compare central quotations with their original passages and discuss cases that do not fit the draft’s interpretation.", "rating_reason": "A substantial draft can help the candidate write, but qualitative analysis depends on careful engagement with the material. {{S07-15}} The candidate can check the quotations against the originals, although only the candidate’s own reading of the material can show whether a passage represents the setting.", "conditions": ["Pivotal quotations are checked against originals.", "Corpus use follows the approved data environment."], "applicability": "Applies to qualitative articles, dissertation chapters, revision letters, and public summaries with different disclosure needs.", "evidence_strength": "adjacent", "source_ids": ["S07-15", "S09-012"], "source_locators": {"S07-15": "Braun and Clarke, original methods article pp. 79–91 on iterative thematic analysis", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}, "role_source_ids": ["S09-012"], "limits": "No reviewed study estimates the net effect of AI drafting on FEB qualitative doctoral publications.", "supported_rating": "mixed", "supported_reason": "When the supervisor asks to see the original passage behind each central quotation and discusses contrary cases with the candidate, misquotation is less likely. A clear draft may nevertheless give a misleading picture of the people studied.", "task_scope": "AI drafts substantial accounts or reviewer responses from the project's material and interpretive outline; the researcher checks whether claims and quotations preserve context and contrary evidence."}, {"id": "phd-theory_review-question", "cohort": "phd", "research_type": "theory_review", "stage": "question", "rating": "mixed", "headline": "Familiar ideas mistaken for new ones", "summary": "The candidate considers AI suggestions for questions and mechanisms, then chooses a problem and explains what new understanding it could bring.", "paragraphs": ["A PhD candidate chooses the dissertation problem and defends it with a supervisor. {{S09-012}} AI can suggest concepts, mechanisms and boundaries for that problem, whether the candidate is writing a theory paper or an integrative review. Jaakkola explains that conceptual work needs a reasoned route from a problem to an insight. {{S07-33}} Messeri and Crockett warn that confident AI synthesis can give researchers an impression of understanding, although their warning is conceptual and does not come from a trial of PhD research. {{S06-014}}"], "opportunity": "When AI places two debates side by side, the candidate may see a question that is worth pursuing in the dissertation.", "risk": "The candidate may choose a puzzle because it sounds new, without yet understanding the earlier arguments that come closest to it.", "support": "Before comparing the AI alternatives with the closest papers in the field, the candidate could present a proposed puzzle in an FEB theory discussion.", "rating_reason": "To select a worthwhile problem, the candidate needs knowledge of earlier theory and a clear route to an insight. {{S07-33}} AI can widen the options, but the candidate is still developing the judgement needed to choose among them.", "conditions": ["The candidate checks the closest prior explanations.", "The proposed puzzle has a clear intellectual consequence."], "applicability": "Applies to conceptual theory and nonstatistical integrative reviews, with different contribution standards.", "evidence_strength": "adjacent", "source_ids": ["S06-014", "S07-33", "S09-012"], "source_locators": {"S06-014": "Messeri and Crockett, Nature abstract/discussion on illusion of understanding", "S07-33": "Jaakkola, open publisher text methodological requirements, Table 1, Conclusions", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}, "role_source_ids": ["S09-012"], "limits": "Biomedical hypothesis demonstrations and conceptual warnings do not establish FEB doctoral contribution quality.", "supported_rating": "mixed", "supported_reason": "A supervisor can ask the candidate what the closest papers already explain and how each proposed question would change that explanation. In that conversation the supervisor may catch an easy mistake, although the conversation alone cannot establish that the problem is new.", "task_scope": "AI proposes theoretical questions, concepts, mechanisms and review boundaries; the researcher selects and justifies the intellectual problem and intended contribution."}, {"id": "phd-theory_review-literature", "cohort": "phd", "research_type": "theory_review", "stage": "literature", "rating": "mixed", "headline": "Research traditions overlooked", "summary": "After AI has searched and compared the studies, the candidate decides which debates belong in the argument and reads the pivotal papers.", "paragraphs": ["AI can retrieve and compare papers, including work from a neighbouring field. In its tested setting, OpenScholar improved answers to questions that required several papers, although that result does not show that every paper it selected was appropriate. {{S08-020}} An integrative review contributes by bringing bodies of work into a reasoned relation with one another. {{S07-25}} The PhD candidate learns how to establish that relation by reading and explaining the pivotal studies, so an AI map of the literature can only be a starting point. {{S09-012}}"], "opportunity": "A wider AI search may bring up a theory or an earlier study that the candidate had not thought to include.", "risk": "AI may group unlike concepts together or omit work that changes how the candidate should frame the proposed contribution.", "support": "The supervisor could ask the candidate why the selected papers belong in the same argument, and FEB library staff could inspect the search record that produced them.", "rating_reason": "In its tested setting, OpenScholar improved answers to questions that draw on several papers, but that result does not settle which traditions a review should bring together. {{S08-020}} {{S07-25}} The candidate therefore gains useful leads and has to read and compare the central papers to judge how the traditions relate.", "conditions": ["The review type and inclusion rules are explicit.", "Pivotal claims are checked in the originals."], "applicability": "Applies to nonstatistical integrative-review corpus assembly and conceptual literature appraisal; search obligations vary by review form.", "evidence_strength": "direct_task", "source_ids": ["S07-25", "S08-020", "S09-012"], "source_locators": {"S07-25": "Cronin and George, original PDF pp. 168–92 on integrative review", "S08-020": "OpenScholar, Nature main opening, Table 1, Methods baseline models and limitations", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}, "role_source_ids": ["S09-012"], "limits": "Screening evidence mainly comes from health reviews and specific older configurations, not all FEB literatures.", "supported_rating": "mixed", "supported_reason": "A librarian can inspect the search and a supervisor can challenge the candidate’s choice of central papers, so omissions are more likely to be found. The candidate, however, still has to explain why the literatures belong in one argument.", "task_scope": "AI searches, screens, summarises and compares the relevant literature; the researcher judges coverage, competing traditions and the pivotal original studies."}, {"id": "phd-theory_review-design", "cohort": "phd", "research_type": "theory_review", "stage": "design", "rating": "risk", "headline": "Premises the candidate cannot defend", "summary": "AI drafts the assumptions, a conceptual structure or a review procedure, and the candidate tests whether the draft can support the intended contribution.", "paragraphs": ["The candidate can ask AI to draft model assumptions, an outline or a review procedure, and then test that proposal. Jaakkola describes several forms of conceptual article, and Cronin and George explain why an integrative review needs a reasoned synthesis of its sources. {{S07-33}} {{S07-25}} An AI outline can look coherent even when the candidate has not examined a rival premise. Because a PhD candidate plans the dissertation and defends it under supervision, the candidate has to be able to justify each premise of the outline. {{S09-012}}"], "opportunity": "An alternative structure proposed by AI may reveal where the candidate’s argument lacks an assumption or a comparison that it needs.", "risk": "The candidate may adopt a structure that leaves out a rival theory without saying so or that relies on a premise he or she cannot defend.", "support": "In an early FEB meeting on theory or review design, the candidate could defend the main premises and source boundaries before drafting the full paper.", "rating_reason": "Conceptual papers and integrative reviews build and support a contribution in different ways. {{S07-33}} {{S07-25}} A PhD candidate may see that an AI structure is tidy without noticing the premise on which it depends or the tradition it leaves out.", "conditions": ["The candidate justifies the review or conceptual form.", "Selection decisions and changes are documented."], "applicability": "Applies to conceptual theory articles and nonstatistical integrative reviews; design criteria differ by form.", "evidence_strength": "methodological", "source_ids": ["S07-25", "S07-33", "S09-012"], "source_locators": {"S07-25": "Cronin and George, original PDF pp. 168–92 on integrative review", "S07-33": "Jaakkola, open publisher text methodological requirements, Table 1, Conclusions", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}, "role_source_ids": ["S09-012"], "limits": "The cited review evidence assesses heterogeneous AI tasks and does not measure an FEB theory-design outcome.", "supported_rating": "mixed", "supported_reason": "By asking the candidate to state each premise and explain why particular studies are included in the review, a supervisor may expose a weak structure early. Reasonable scholars can still disagree about the scope and the contribution of the paper, however.", "supported_headline": "Premises challenged before drafting", "task_scope": "AI drafts a model's assumptions, a conceptual structure or an integrative-review procedure; the researcher tests whether the design can support a worthwhile contribution."}, {"id": "phd-theory_review-data", "cohort": "phd", "research_type": "theory_review", "stage": "data", "rating": "mixed", "headline": "Studies missing from the review corpus", "summary": "For an integrative review, AI gathers papers and extracts their content, and the candidate checks what is missing and what each paper actually says.", "paragraphs": ["This stage applies when a candidate prepares an integrative review, because such a review uses earlier studies as its material. {{S07-25}} AI can gather the papers, remove duplicates and extract information, and the candidate checks for omissions and compares the extracted information with the originals. Evaluations of AI evidence synthesis find uneven performance across search, screening and extraction. {{S07-20}} The candidate can use the time saved on preparation to read the papers that shape the argument. {{S09-012}} Pure conceptual theory has no empirical data-acquisition task, and statistical meta-analysis is assessed under Quantitative."], "opportunity": "If AI removes duplicates and extracts basic information from each paper, the candidate has more time to read the studies that are important for the review.", "risk": "If AI misses a school of thought or extracts information wrongly, the candidate may begin the synthesis from a corpus that is already too narrow.", "support": "FEB library staff could help set inclusion rules and check a sample of excluded papers and extracted claims against the original studies.", "rating_reason": "Studies of AI evidence synthesis report uneven performance across search, screening and extraction. {{S07-20}} The candidate may build the argument on an incomplete corpus even while checking sources, so the time saved on preparation has to be weighed against that risk to coverage.", "conditions": ["The rules for the review corpus are specified.", "The candidate checks the provenance of each source and any omissions."], "applicability": "Empirical data acquisition and preparation do not apply to pure conceptual theory. For integrative reviews, retrieval and corpus assembly of prior studies apply. Statistical meta-analysis is assessed under Quantitative.", "evidence_strength": "direct_task", "source_ids": ["S07-20", "S07-25", "S09-012"], "source_locators": {"S07-20": "Clark et al., PubMed abstract Methods/Results for evidence-synthesis systematic review", "S07-25": "Cronin and George, original PDF pp. 168–92 on integrative review", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}, "role_source_ids": ["S09-012"], "limits": "Both scenario judgements apply only to integrative-review corpus tasks; pure conceptual theory has no empirical data-acquisition stage.", "supported_rating": "opportunity", "supported_reason": "A librarian and the supervisor can check excluded papers and source passages with the candidate, who then gains more from AI preparation of the corpus and has time left for reading. The checks cannot guarantee, however, that every relevant tradition has been found. {{S07-20}}", "supported_headline": "Checked corpus assembly frees reading time", "task_scope": "For integrative reviews, AI assembles, deduplicates and extracts information from a source corpus; the researcher checks omissions, inclusion decisions and extraction. Pure theory has no empirical data-acquisition task."}, {"id": "phd-theory_review-analysis", "cohort": "phd", "research_type": "theory_review", "stage": "analysis", "rating": "risk", "headline": "Concepts joined despite different meanings", "summary": "AI proposes a derivation or a synthesis, which the candidate checks against the premises, contrary studies and the claimed contribution.", "paragraphs": ["A PhD candidate has to be able to explain the central inference of a theory paper or review independently, so when AI proposes derivations or a synthesis, the candidate tests them against the premises and the sources. {{S09-012}} Conceptual papers and integrative reviews need a reasoned contribution, which takes more than a tidy list of studies. {{S07-33}} {{S07-25}} Messeri and Crockett argue that AI can give researchers an unwarranted sense of understanding, which is a warning about scientific judgement and not a measured effect at FEB. {{S06-014}}"], "opportunity": "A counterexample from AI may help the candidate find the place where an emerging argument needs more work.", "risk": "The candidate may accept a neat connection between two concepts even though the cited studies give those concepts different meanings.", "support": "In an FEB theory workshop, the candidate could explain each major premise and respond to a serious objection drawn from the literature.", "rating_reason": "A conceptual contribution depends on the reasoning that links its premises to a new conclusion. {{S07-33}} A PhD candidate who tests AI suggestions may nevertheless let an attractive synthesis steer the argument before having learned the competing theories.", "conditions": ["The candidate traces pivotal inferences to sources.", "Contrary studies and concepts are examined."], "applicability": "Applies to conceptual argument analysis and nonstatistical integrative synthesis; statistical meta-analysis belongs to Quantitative.", "evidence_strength": "methodological", "source_ids": ["S06-014", "S07-25", "S07-33", "S09-012"], "source_locators": {"S06-014": "Messeri and Crockett, Nature abstract/discussion on illusion of understanding", "S07-25": "Cronin and George, original PDF pp. 168–92 on integrative review", "S07-33": "Jaakkola, open publisher text methodological requirements, Table 1, Conclusions", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}, "role_source_ids": ["S09-012"], "limits": "Current evidence does not show how AI-assisted synthesis affects FEB doctoral contribution or long-term understanding.", "supported_rating": "mixed", "supported_reason": "In a workshop, a supervisor and peers can ask the candidate to defend each premise against a contrary source, and the candidate can improve the argument in response. Disagreements over concepts or originality may nevertheless remain after the workshop.", "supported_headline": "Arguments tested against objections", "task_scope": "AI develops candidate derivations, mechanisms or a synthesis of studies; the researcher tests their validity, counterexamples and contribution against premises and sources."}, {"id": "phd-theory_review-writing", "cohort": "phd", "research_type": "theory_review", "stage": "writing", "rating": "mixed", "headline": "Unexplained conceptual steps in drafts", "summary": "AI drafts sections from the researchers’ outline and sources, and the candidate checks whether the argument in those sections follows.", "paragraphs": ["Whenever AI drafts sections from the researchers’ outline, the PhD candidate has to assess the argument, because the candidate defends the insight of the dissertation. {{S09-012}} Guidance on conceptual papers and integrative reviews asks authors to show how ideas relate to one another. {{S07-33}} {{S07-25}} In a citation-selection study, a model preferred prominent papers. {{S08-017}} In a patent-law trial, AI assistance improved junior lawyers’ drafts but brought no average gain in their unassisted redlining, which is adjacent evidence about learning. {{S13-101}}"], "opportunity": "AI may help the candidate organise a long review or draft a clear response when a reviewer criticises the argument.", "risk": "A draft paragraph may read smoothly and claim that two concepts belong together, and the candidate may not notice that it does not show how the cited studies connect them.", "support": "For a substantial draft, an FEB supervisor could inspect the sources behind the decisive claim and ask the candidate to explain the paper’s central conceptual step.", "rating_reason": "Because the candidate supplies the premises and the outline, a substantial draft can help with the writing. Conceptual guidance, however, locates the contribution in defended relations among concepts. {{S07-33}} The candidate therefore has to be able to explain those relations without relying on the draft. {{S09-012}}", "conditions": ["Decisive claims have verified source passages.", "The candidate can state and defend the new insight."], "applicability": "Applies to conceptual papers, nonstatistical integrative reviews, dissertation chapters, and revision letters; statistical meta-analysis belongs to Quantitative.", "evidence_strength": "adjacent", "source_ids": ["S07-25", "S07-33", "S08-017", "S09-012", "S13-101"], "source_locators": {"S07-25": "Cronin and George, original PDF pp. 168–92 on integrative review", "S07-33": "Jaakkola, open publisher text methodological requirements, Table 1, Conclusions", "S08-017": "Algaba et al., arXiv abstract, experiment sample and results on citation selection", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S13-101": "Autor et al., NBER original PDF pp. 2–5, 14, 17–19, 23–24, 38–40; Tables 2 and 6: assisted drafting versus unassisted redlining, seniority interaction and limits"}, "role_source_ids": ["S09-012"], "limits": "Citation-selection and identity audits do not estimate how AI drafting changes FEB theory-paper quality.", "supported_rating": "mixed", "supported_reason": "A supervisor can inspect the sources behind the decisive claim and ask the candidate to explain the conceptual move, and the draft may improve as a result. Neither clear prose nor a check of the citations shows that the argument is original.", "task_scope": "AI drafts substantial manuscript sections or reviewer responses from the researchers' premises, sources and outline; the researchers assess whether the resulting argument and contribution are defensible."}, {"id": "postdoc_ap-quantitative-question", "cohort": "postdoc_ap", "research_type": "quantitative", "stage": "question", "rating": "mixed", "headline": "More candidate questions and mechanisms", "summary": "Researchers can weigh more AI-suggested questions before they commit, provided they choose one that the available evidence can answer.", "paragraphs": ["A quantitative project often begins with more plausible questions than the team can pursue. Comparing AI suggestions can save a postdoc or assistant professor time when one of them points to an explanation the team had overlooked. A suggestion can, however, also make a weak connection sound convincing before anyone has checked the proposed measure. Messeri and Crockett warn that AI can give scientists the impression that they understand more than they do. {{S06-014}} The author therefore needs to state which observation would count against the preferred explanation, within boundaries that the postdoc’s project brief and the assistant professor’s research line may set differently. {{S09-013}}{{S09-014}}"], "opportunity": "Before committing to a quantitative question, a postdoc or assistant professor can compare several AI-proposed mechanisms and measures and may find an explanation that the team had not considered.", "risk": "An attractive AI-proposed mechanism may lead the author to build the paper around a construct that the available data do not measure.", "support": "FEB could arrange a meeting with a methods colleague in which the author tests each rival explanation against the available measures and possible counterexamples.", "rating_reason": "The additional questions help when the researcher has measures that can tell the proposed explanations apart. Without such measures, an attractive mechanism may steer the author toward a claim that the paper cannot test. The postdoc’s project brief and the assistant professor’s research line can also limit which questions the researcher is free to pursue. {{S09-013}}{{S09-014}}", "conditions": ["The researcher has relevant domain knowledge or a colleague who can challenge the mechanism.", "The researcher’s actual appointment and ownership of the question are known."], "applicability": "Applies to quantitative work, including experiments and formalised empirical models; iteration after analysis is expected.", "evidence_strength": "methodological", "source_ids": ["S06-014", "S09-013", "S09-014"], "source_locators": {"S06-014": "Artificial intelligence and illusions of understanding, Nature abstract and Discussion; perspective, not outcome evaluation", "S09-013": "Onderzoeker v11.0, result areas pp. 2–4 and level criteria pp. 7–8; postdoc is not a fixed UFO level", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8"}, "role_source_ids": ["S09-013", "S09-014"], "limits": "No cited study measures question quality or AI benefit separately for FEB postdocs and UDs.", "supported_rating": "mixed", "supported_reason": "A methods colleague could test the proposed mechanisms against the available measures before the author commits to one. The researcher would, however, still have to decide whether the question that remains is worth studying and can be answered, so the balance stays mixed. {{S06-014}}", "task_scope": "AI proposes research questions, mechanisms and hypotheses for the project's subject and plausible evidence; the researcher selects and justifies the question."}, {"id": "postdoc_ap-quantitative-literature", "cohort": "postdoc_ap", "research_type": "quantitative", "stage": "literature", "rating": "mixed", "headline": "Different estimates treated as comparable", "summary": "A wider AI-assisted comparison of quantitative papers is useful as long as researchers read the studies on which their argument depends.", "paragraphs": ["An AI-generated literature map can widen the evidence base of a quantitative study as long as it shows the different measures that the studies use. In the OpenScholar evaluation, source-grounded answers improved on selected questions that drew on several papers, although the test did not establish that a search would cover an entire FEB field. {{S08-020}} A postdoc finishing a project and an assistant professor developing a new one may use the map differently, but both need to read the papers that define the central comparison. Under the UFO profiles, the two positions differ in their assignments, which does not imply that one of them is better at appraising sources. {{S09-013}}{{S09-014}}"], "opportunity": "An AI-assisted search may turn up quantitative studies with different measures or designs that the researcher would have missed with a narrower search.", "risk": "A generated comparison may treat studies as equivalent when they estimate different relationships or use different samples, so a researcher who relies on it may cite them as evidence for the same effect.", "support": "FEB could provide a shared search log and a short template that links each claim to a paper, and give authors time to check pivotal and contrary studies before they start drafting.", "rating_reason": "Tests of OpenScholar showed better answers to questions that drew on several papers, but they did not examine whether the system covers FEB fields completely. {{S08-020}} A postdoc or assistant professor can therefore rely on the wider comparison only after checking the original methods and results of the studies it draws on.", "conditions": ["The original papers are accessible for checking.", "The search strategy is recorded and can be extended manually."], "applicability": "Applies to empirical literature work; a formal review needs its own explicit search and eligibility protocol.", "evidence_strength": "direct_task", "source_ids": ["S08-020", "S09-013", "S09-014"], "source_locators": {"S08-020": "OpenScholar literature synthesis evaluation, Nature opening, Table 1 and Methods baseline-model section", "S09-013": "Onderzoeker v11.0, result areas pp. 2–4 and level criteria pp. 7–8; postdoc is not a fixed UFO level", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8"}, "role_source_ids": ["S09-013", "S09-014"], "limits": "The literature system was evaluated on selected fields and models, not this cohort or a complete FEB review.", "supported_rating": "opportunity", "supported_reason": "With FEB support, the author would have a search record and a check that links claims to the pivotal and contrary studies. The wider comparison then becomes easier to use, and the author remains the one who decides whether the studies answer the same question. {{S08-020}}", "task_scope": "AI searches, screens, summarises and compares relevant studies; the researcher assesses coverage and reads the pivotal originals.", "supported_headline": "Broader comparison of quantitative studies"}, {"id": "postdoc_ap-quantitative-design", "cohort": "postdoc_ap", "research_type": "quantitative", "stage": "design", "rating": "mixed", "headline": "Wider range of possible designs", "summary": "An AI-drafted quantitative design is useful once the researcher has shown that its comparison and measures can answer the question.", "paragraphs": ["Before using an estimator that AI proposes, the researcher needs to know which comparison it makes. The postdoc or assistant professor then has to explain what each estimate means and why the available observations support it. When the design relies on variables that AI generates, errors in those variables can also change the later inference. {{S07-07}} For a statistical meta-analysis, the author must in addition decide which studies qualify and how their effect estimates relate to one another. {{S07-32}} The team decides separately whether the tool is approved and under which conditions it may use the data. {{S03-003}}"], "opportunity": "The team may spot a useful experiment, specification, or sensitivity check in an AI-drafted design before it commits to collecting data.", "risk": "The proposed design may estimate a different quantity than the research question requires, or the team may adopt a measure whose errors distort the result.", "support": "Through FEB, the team could ask a methods colleague to review the proposed estimand, sample, and measures, and could be referred to the relevant data and ethics adviser.", "rating_reason": "A generated plan gives the author more designs to consider, although a plausible specification does not by itself identify the intended effect. Research on AI-generated covariates also shows that their measurement error can alter inference. {{S07-07}} The balance therefore depends on whether the postdoc or assistant professor can explain and defend the design without the tool.", "conditions": ["The researcher who owns the design can explain the identification assumptions without AI.", "Approvals and tool conditions are settled before restricted data are used in a workflow."], "applicability": "Applies to causal, descriptive, and experimental quantitative work; exact design questions differ.", "evidence_strength": "methodological", "source_ids": ["S07-07", "S07-32", "S09-013", "S09-014", "S03-003", "S03-002"], "source_locators": {"S07-07": "Performing Valid Inference with AI/ML-Generated Covariates, AEA abstract and pp. 92–97", "S07-32": "Snyder, Literature review as a research methodology, §§2.1–2.2 and Table 2", "S09-013": "Onderzoeker v11.0, result areas pp. 2–4 and level criteria pp. 7–8; postdoc is not a fixed UFO level", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8", "S03-003": "RUG Safe and Responsible use of AI, “Guidelines Research” and “Using new AI tools” sections, checked 4 October 2026", "S03-002": "Internally shared RUG research guideline dated 28 September 2026, DOCX cover paragraphs 47–58; adoption not established"}, "role_source_ids": ["S09-013", "S09-014"], "limits": "The colour is a policy judgment about design accountability, not a measured failure rate for FEB staff.", "supported_rating": "mixed", "supported_reason": "If a methods colleague questioned the proposed comparison, sample, and measures before implementation, a weak premise would be less likely to survive in a polished plan. The colleague cannot, however, judge for the author whether the design fits the actual setting. {{S07-07}}", "task_scope": "AI drafts a substantive design or model specification and alternative checks; the researcher assesses the estimand, assumptions and feasibility."}, {"id": "postdoc_ap-quantitative-data", "cohort": "postdoc_ap", "research_type": "quantitative", "stage": "data", "rating": "opportunity", "headline": "More records prepared for analysis", "summary": "With AI, researchers can prepare more permitted records for analysis if they compare the generated fields and links with the source material.", "paragraphs": ["The SEC offers programmatic access to public filings, and researchers have used language models to extract ownership information from company documents. {{S06-023}}{{S07-08}} Before using such a dataset in an estimate, the researcher can compare a sample of the extracted fields and links with the original documents. The same check applies when a meta-analysis collects published effect sizes. {{S07-32}} The assessment assumes that the project is permitted to use the material, and CBS microdata, for example, require separate project authorisation. {{S06-021}} A postdoc and an assistant professor may carry different responsibilities for the dataset under their appointments, but those responsibilities say nothing about which of them checks records more carefully. {{S09-013}}{{S09-014}}"], "opportunity": "A postdoc or assistant professor can use AI to extract and link more permitted records or published effect sizes than the team could otherwise prepare for a quantitative dataset.", "risk": "If nobody checks a sample against the source documents, wrong links or repeated extraction errors may spread through the dataset and change the later estimate.", "support": "FEB could provide a permitted processing environment and help the team draw a varied sample for checking, record its corrections, and keep a log of every transformation.", "rating_reason": "Because researchers can compare a sample of the prepared records with the original documents, they can verify AI help with data preparation more easily than AI help with many later research judgements. Covariates that a model generates still need validation, however, because their errors can distort inference. {{S07-08}}{{S07-07}}", "conditions": ["The data controller permits the proposed tool and processing route.", "A reference sample covers sources where extraction is likely to vary."], "applicability": "Applies to permitted quantitative records and meta-analytic results; access rights are a separate condition, and downstream inference needs its own assessment.", "evidence_strength": "direct_task", "source_ids": ["S06-023", "S07-08", "S07-07", "S07-32", "S06-021", "S09-013", "S09-014"], "source_locators": {"S06-023": "SEC EDGAR APIs, overview, submissions and XBRL documentation, “Programmatic API Access”", "S07-08": "Corporate document ownership extraction, publisher abstract and methods summary", "S07-07": "Performing Valid Inference with AI/ML-Generated Covariates, AEA abstract and pp. 92–97", "S07-32": "Snyder, Literature review as a research methodology, §§2.1–2.2 and Table 2", "S06-021": "CBS Microdata “How does it work?”, steps 1–4 on authorisation and controlled output", "S09-013": "Onderzoeker v11.0, result areas pp. 2–4 and level criteria pp. 7–8; postdoc is not a fixed UFO level", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8"}, "role_source_ids": ["S09-013", "S09-014"], "limits": "The extraction study does not establish downstream FEB inference quality, and CBS conditions apply only to relevant microdata.", "supported_rating": "opportunity", "supported_reason": "FEB could help teams choose records from different firms, years, or document types for checking and keep a record of every transformation. The larger dataset would then be easier to audit, although the researcher must separately establish that each field measures the intended construct. {{S07-07}}", "task_scope": "For material the project is permitted to use, AI retrieves, extracts, cleans and links records or study results; the researcher validates measures and transformations. Data-access rights remain a separate constraint."}, {"id": "postdoc_ap-quantitative-analysis", "cohort": "postdoc_ap", "research_type": "quantitative", "stage": "analysis", "rating": "mixed", "headline": "Additional analyses that need checking", "summary": "Researchers who let AI write the main estimation code and robustness analyses still have to find its errors and explain what the estimates establish.", "paragraphs": ["Generated code may give a quantitative team more ways to test a result. In the randomised exercise by Brodeur and colleagues, human-only and AI-assisted teams reproduced results at similar rates, whereas the human-only teams found more major errors. {{S07-01}} Newer AI agents later performed well on selected reproduction tasks, but reproducing a result is a different task from judging the original research design. {{S08-010}} The postdoc or assistant professor therefore has to explain the exclusions, measures, and uncertainty behind each estimate. {{S09-013}}{{S09-014}} When the analysis uses AI-generated covariates, errors in those covariates create a separate inference problem. {{S07-07}}"], "opportunity": "With AI-written code, a postdoc or assistant professor can run additional estimators or robustness checks that would otherwise take longer to implement by hand.", "risk": "Code that runs without errors may still use the wrong sample or measure, and the researcher may report a reproduced table as support for a claim that the design cannot carry.", "support": "FEB could supply test datasets and methods help and record how much time authors spend checking code, repairing errors, and explaining results that change.", "rating_reason": "AI may make additional analyses feasible, although a reproduced table does not show that the code behind it or its interpretation is sound. In a 2024 experiment, for example, human-only teams found more major coding errors than AI-assisted teams did. {{S07-01}} Newer agents have since performed well on selected reproduction tasks, but those tasks did not involve judging the original research design. {{S08-010}}", "conditions": ["Code, data provenance, and target output are retained.", "A researcher competent in the method checks assumptions and surprising results."], "applicability": "Applies to quantitative estimation, validation, robustness, and interpretation.", "evidence_strength": "direct_task", "source_ids": ["S07-01", "S08-010", "S07-32", "S09-013", "S09-014", "S07-07"], "source_locators": {"S07-01": "Brodeur et al. reproducibility experiment, pp. 2–7, Table 1 and limitations pp. 9–10", "S08-010": "AI Coding Agents Can Reproduce Social Science Findings, HTML §§2.1 and 5.1–5.3, Figure 1 and §2.4 limits", "S07-32": "Snyder, Literature review as a research methodology, §§2.1–2.2 and Table 2", "S09-013": "Onderzoeker v11.0, result areas pp. 2–4 and level criteria pp. 7–8; postdoc is not a fixed UFO level", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8", "S07-07": "Performing Valid Inference with AI/ML-Generated Covariates, AEA abstract and pp. 92–97"}, "role_source_ids": ["S09-013", "S09-014"], "limits": "Reproducibility studies test selected packages and systems; they do not measure quality or time for this FEB cohort.", "supported_rating": "mixed", "supported_reason": "FEB could test generated code against known outputs and deliberately planted errors and record how long checking and repair take. Researchers who know the results of such tests can use the generated code without mistaking a reproduced table for evidence that the original design was valid. {{S07-01}}{{S08-010}}", "task_scope": "AI produces the main estimation or synthesis code, robustness analyses and proposed interpretation; the researcher checks execution, errors and what the result can establish."}, {"id": "postdoc_ap-quantitative-writing", "cohort": "postdoc_ap", "research_type": "quantitative", "stage": "writing", "rating": "mixed", "headline": "Faster drafts that may overstate results", "summary": "Before using AI-drafted sections or reviewer replies, authors need to check each statistical claim against the analysis.", "paragraphs": ["An AI draft can save time once the authors have specified their comparison and prepared the tables. In a short experiment with professional writing tasks, participants wrote faster and their work was rated higher, but the study did not assess whether a research claim remained accurate. {{S05-007}} A generated reply to reviewers may also sound responsive while it leaves the reviewer’s main objection unanswered. A postdoc may face a project deadline, and an assistant professor combines publication work with teaching, so both need time to check the draft, and their planning should not count only the writing time they save. {{S09-013}}{{S09-014}}"], "opportunity": "Working from their own outline and tables, the authors can have AI draft a substantial results section or a reply to reviewers and finish a first version sooner.", "risk": "The draft may turn a qualified estimate into a stronger claim, and a generated reply may appear to answer a reviewer even though the authors have not changed the evidence.", "support": "The authors could use a claim-to-table check from FEB and time set aside to compare every reply to reviewers with the original comment and the revised evidence.", "rating_reason": "In a short writing experiment, participants worked faster and produced better-rated texts, but the experiment did not involve research manuscripts. {{S05-007}} Substantial drafts may help a postdoc or assistant professor meet deadlines, although part of the time gained goes into checking each claim and reply before it can be used.", "conditions": ["The author checks each quantitative statement against the results and the design.", "The target journal’s disclosure policy and its data and code policies are known."], "applicability": "Applies to drafting, peer-review replies, and dissemination of quantitative results.", "evidence_strength": "adjacent", "source_ids": ["S05-007", "S06-020", "S09-013", "S09-014"], "source_locators": {"S05-007": "Noy and Zhang, Science 2023 published abstract; short professional-writing randomisation, not a research manuscript", "S06-020": "More Versus Better, Organization Science editorial analysis pp. 1–4 and Methods", "S09-013": "Onderzoeker v11.0, result areas pp. 2–4 and level criteria pp. 7–8; postdoc is not a fixed UFO level", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8"}, "role_source_ids": ["S09-013", "S09-014"], "limits": "The journal editorial is setting-specific and does not estimate writing effects for FEB postdocs or UDs.", "supported_rating": "opportunity", "supported_reason": "FEB could help authors compare each generated claim with its table and each reply with the reviewer’s criticism and the revised evidence. Drafting with AI then becomes useful, as long as the authors do not assume that faster prose makes the study better. {{S06-020}}", "task_scope": "AI drafts substantial manuscript sections or reviewer responses from the project's evidence and outline; the researchers assess the argument and final claims.", "supported_headline": "Drafts checked against the result tables"}, {"id": "postdoc_ap-qualitative-question", "cohort": "postdoc_ap", "research_type": "qualitative", "stage": "question", "rating": "mixed", "headline": "Questions fixed before fieldwork begins", "summary": "AI-suggested questions for a qualitative project are useful if researchers check whether those questions fit what people experience in the setting.", "paragraphs": ["A qualitative question may change once researchers have spoken with people in the organisation, so the researcher needs to ask whether a question that AI suggests follows from the setting and from the evidence available there. Edmondson and McManus describe such methodological fit in management field research, and Braun and Clarke show that qualitative analysis can lead researchers back to earlier choices. {{S06-004}}{{S07-15}} A postdoc may work within a team’s site agreement, whereas an assistant professor may be developing a separate line of inquiry. {{S09-013}}{{S09-014}}"], "opportunity": "Alternative questions from AI may help the researcher notice a process or a group of people that the first research plan overlooked.", "risk": "If the researcher settles on a convenient AI category before fieldwork begins, participants’ different experiences may look more uniform in the study than they are in the actual setting.", "support": "After the first field contact, FEB could arrange a meeting with a methods colleague in which the researcher checks which AI-suggested concepts still fit what participants have described.", "rating_reason": "In management field research, authors are expected to fit the question to existing knowledge and to the material they can gather. {{S06-004}} AI suggestions therefore help when the researcher can revise them after meeting participants, whereas categories fixed before the researcher understands the setting may lead the study away from what participants experience.", "conditions": ["Researchers can revisit the question after field contact.", "The analytic tradition and intended contribution are named."], "applicability": "Applies to qualitative question formation and later reframing as field evidence develops.", "evidence_strength": "methodological", "source_ids": ["S06-004", "S07-15", "S09-013", "S09-014"], "source_locators": {"S06-004": "Edmondson and McManus, Methodological Fit in Management Field Research, original PDF pp. 1155–1156 and Table 1", "S07-15": "Braun and Clarke, Using thematic analysis in psychology, pp. 79–91", "S09-013": "Onderzoeker v11.0, result areas pp. 2–4 and level criteria pp. 7–8; postdoc is not a fixed UFO level", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8"}, "role_source_ids": ["S09-013", "S09-014"], "limits": "The methodological sources do not estimate AI effects on qualitative question quality in FEB.", "supported_rating": "mixed", "supported_reason": "A field researcher brought in by FEB could discuss the AI suggestions and the early material with the author. That colleague could help the author set aside questions that do not fit the setting, while the inquiry itself remains open to revision. {{S07-15}}", "task_scope": "AI proposes questions, concepts and possible explanations for the project's setting; the researcher judges their relevance and fit with inquiry in that setting."}, {"id": "postdoc_ap-qualitative-literature", "cohort": "postdoc_ap", "research_type": "qualitative", "stage": "literature", "rating": "mixed", "headline": "Field studies compared out of context", "summary": "AI can help researchers compare more qualitative studies, provided they read how each study reached its interpretation.", "paragraphs": ["A wider literature search may bring together field studies that use similar terms for different experiences. OpenScholar improved answers to selected questions that required several papers, although that test did not assess whether a model preserved the context of qualitative studies. {{S08-020}} A postdoc on a defined project and an assistant professor building a research line may have different reasons to follow up the studies that such a search turns up. Both, however, need to read the pivotal originals and ask who the participants were, how the researchers gained access, and how they analysed the material. {{S09-013}}{{S09-014}}"], "opportunity": "Through a wider AI search, the researcher may come across field studies from another discipline that change how he or she frames the case.", "risk": "When AI compares field studies, an interview finding may appear without the site, participants, or research question that gave it meaning, and the researcher may equate it with findings from different settings.", "support": "FEB could provide a search log and a short comparison sheet on which the researcher records the setting, method, claim, and contrary cases of each pivotal study.", "rating_reason": "The retrieval system improved answers to selected questions about the scientific literature, but its evaluation did not cover qualitative interpretation across FEB fields. {{S08-020}} Whether the wider map helps depends on the author, who needs to read the pivotal studies and check why apparently similar findings arose in different settings.", "conditions": ["The researcher can read the full studies, not only the abstracts.", "The review records how the researcher searched for contrary or adjacent work."], "applicability": "Applies to literature work for qualitative empirical papers; formal reviews need explicit review methods.", "evidence_strength": "adjacent", "source_ids": ["S08-020", "S09-013", "S09-014"], "source_locators": {"S08-020": "OpenScholar literature synthesis evaluation, Nature opening, Table 1 and Methods baseline-model section", "S09-013": "Onderzoeker v11.0, result areas pp. 2–4 and level criteria pp. 7–8; postdoc is not a fixed UFO level", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8"}, "role_source_ids": ["S09-013", "S09-014"], "limits": "The tested retrieval pipeline is not an evaluation of qualitative synthesis by FEB researchers.", "supported_rating": "opportunity", "supported_reason": "FEB could give authors a search record and a comparison of sources and claims that keeps the setting of each study visible. The researcher can then use the wider map while treating the model’s thematic labels as a starting point for reading the studies themselves. {{S08-020}}", "task_scope": "AI searches, screens, summarises and compares relevant studies; the researcher assesses coverage, theoretical differences and pivotal originals.", "supported_headline": "Field studies read in their own setting"}, {"id": "postdoc_ap-qualitative-design", "cohort": "postdoc_ap", "research_type": "qualitative", "stage": "design", "rating": "mixed", "headline": "Fieldwork plans need revision", "summary": "An AI-drafted sampling or interview plan is a starting point that the researcher revises as access and the research question develop.", "paragraphs": ["A fieldwork plan remains provisional until researchers learn who will speak with them and under what conditions, and Riese describes such access as something researchers negotiate throughout fieldwork. {{S06-024}} The team may therefore revise an AI-generated interview guide after the first encounters, especially when its qualitative approach calls for close engagement with what participants say. {{S07-15}} The postdoc’s role in the project and the assistant professor’s responsibility for the design depend on their actual assignments. {{S09-013}}{{S09-014}}"], "opportunity": "An AI-drafted fieldwork plan may show the researcher a missing group of participants or a leading interview question while there is still time to change the design.", "risk": "Because the generated plan looks complete, the researcher may build on access or consent that he or she has not yet obtained.", "support": "Before the interviews start, FEB could bring the researcher together with a qualitative methods adviser and the relevant data or ethics adviser to review recruitment and consent.", "rating_reason": "Researchers negotiate access through contact with people at a site, so an AI-drafted plan may need substantial revision once fieldwork begins. {{S06-024}} The author can nevertheless use the draft to consider possible samples and questions, as long as the plan stays open to change.", "conditions": ["The actual project lead and data controller are identified.", "The team has a plan to revise the design after field contact."], "applicability": "Applies to interviews, case studies, ethnography, and other qualitative designs, with tradition-specific variation.", "evidence_strength": "methodological", "source_ids": ["S06-024", "S07-15", "S09-013", "S09-014", "S03-003"], "source_locators": {"S06-024": "Riese, qualitative research access, publisher abstract sentences 1–3", "S07-15": "Braun and Clarke, Using thematic analysis in psychology, pp. 79–91", "S09-013": "Onderzoeker v11.0, result areas pp. 2–4 and level criteria pp. 7–8; postdoc is not a fixed UFO level", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8", "S03-003": "RUG Safe and Responsible use of AI, “Guidelines Research” and “Using new AI tools” sections, checked 4 October 2026"}, "role_source_ids": ["S09-013", "S09-014"], "limits": "The access and methods sources are not outcome tests of AI-designed FEB studies.", "supported_rating": "mixed", "supported_reason": "FEB advisers could review the proposed sample, consent route, and interview guide with the project team before the team uses them. Such a review may catch unsuitable assumptions, but the researcher will still have to adjust the plan as relationships in the field develop. {{S06-024}}", "task_scope": "AI drafts a sampling approach, interview guide or observational plan; the researcher assesses fit with the setting, ethics and emerging question."}, {"id": "postdoc_ap-qualitative-data", "cohort": "postdoc_ap", "research_type": "qualitative", "stage": "data", "rating": "mixed", "headline": "Faster preparation of field material", "summary": "Researchers can let AI transcribe and organise supplied material or assist a specified collection procedure, but they need to check the records against the setting.", "paragraphs": ["A postdoc or assistant professor can compare AI transcripts with the recordings and correct missing words and speaker labels. When AI asks the questions itself, however, it changes the evidence more directly. In one study, a chatbot conducted 74 adaptive interviews with social scientists whom the researchers had recruited, and it missed some probes and interrupted participants. {{S06-025}} A web-survey experiment with 1,800 participants found more detailed answers to some AI follow-up questions, but it also found other costs. {{S06-026}} In both uses, the researcher needs a tool route to which participants have consented and knowledge of the setting, and holding a postdoc or assistant professor position provides neither. {{S09-013}}{{S09-014}}"], "opportunity": "A postdoc or assistant professor can have interviews and documents transcribed and organised sooner, and can add specified AI follow-up questions when the design calls for them.", "risk": "A transcript may leave out what happened around an exchange, and when a chatbot asks the questions, participants may give different answers than they would give to the researcher.", "support": "FEB could help the team check a small set of transcripts against the recordings and, where AI asks the questions, compare the responses with those from a researcher-led procedure.
